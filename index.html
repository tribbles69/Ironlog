<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d0f14'/><g fill='%23ff5c35'><rect x='5' y='27' width='6' height='10' rx='2'/><rect x='13' y='21' width='7' height='22' rx='2.5'/><rect x='20' y='29' width='24' height='6'/><rect x='44' y='21' width='7' height='22' rx='2.5'/><rect x='53' y='27' width='6' height='10' rx='2'/></g></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d0f14'/><g fill='%23ff5c35'><rect x='5' y='27' width='6' height='10' rx='2'/><rect x='13' y='21' width='7' height='22' rx='2.5'/><rect x='20' y='29' width='24' height='6'/><rect x='44' y='21' width='7' height='22' rx='2.5'/><rect x='53' y='27' width='6' height='10' rx='2'/></g></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<title>Ironlog — Powerlifting</title>
<style>
/* ---------- base ---------- */
:root{
  --bg:#0d0f14;
  --bg2:#141821;
  --card:#171c26;
  --card2:#1e2431;
  --line:#252c3a;
  --line2:#333c4d;
  --txt:#e8ecf3;
  --dim:#8a93a5;
  --dim2:#5f6879;
  --accent:#ff5c35;
  --accent2:#ff8a5c;
  --gold:#ffc542;
  --green:#3ddc84;
  --blue:#4aa8ff;
  --purple:#a78bfa;
  --red:#ff4d4d;
  --radius:14px;
  --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{
  background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:9px 11px;width:100%;outline:none;
}
input:focus,select,textarea:focus{border-color:var(--line2)}
input:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
a{color:var(--accent)}

/* ---------- layout ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px calc(12px) 16px;
  background:rgba(13,15,20,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:800;letter-spacing:2px;font-size:15px}
.brand .accent{color:var(--accent)}
.icon-btn{
  background:transparent;border:none;color:var(--dim);font-size:19px;
  cursor:pointer;padding:4px 6px;border-radius:8px;line-height:1;
}
.icon-btn:hover{color:var(--txt);background:var(--card)}
#view{max-width:760px;margin:0 auto;padding:14px 14px 30px}

#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(17,20,27,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
#nav button{
  background:none;border:none;cursor:pointer;color:var(--dim2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;letter-spacing:.4px;font-weight:600;
  transition:color .15s;
}
#nav button .ico{font-size:16px;line-height:1}
#nav button.active{color:var(--accent)}
#nav button:active{transform:scale(.94)}

/* ---------- generic ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px;margin-bottom:13px;
}
.card.tight{padding:12px}
.card.flush{padding:0;overflow:hidden}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 11px;letter-spacing:.2px}
h3{font-size:13.5px;margin:0 0 8px}
.sub{color:var(--dim);font-size:12.5px}
.muted{color:var(--dim)}
.dimmer{color:var(--dim2)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hr{height:1px;background:var(--line);margin:12px 0}
.sechead{
  display:flex;align-items:center;justify-content:space-between;
  margin:20px 2px 9px;
}
.sechead h2{margin:0}
.eyebrow{
  font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--dim2);font-weight:700;
}
.empty{
  text-align:center;color:var(--dim2);padding:26px 14px;font-size:13px;
}
.empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.5}

.btn{
  background:var(--card2);border:1px solid var(--line2);color:var(--txt);
  padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;
  transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:var(--dim2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:#5c2626;color:var(--red)}
.btn.danger:hover{background:#2a1414}
.btn.wide{width:100%}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:11.5px;border-radius:7px}
.btn.big{padding:15px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--card2);color:var(--dim);border:1px solid var(--line);
  letter-spacing:.3px;
}
.chip.gold{background:rgba(255,197,66,.13);color:var(--gold);border-color:rgba(255,197,66,.3)}
.chip.green{background:rgba(61,220,132,.12);color:var(--green);border-color:rgba(61,220,132,.28)}
.chip.blue{background:rgba(74,168,255,.12);color:var(--blue);border-color:rgba(74,168,255,.28)}
.chip.accent{background:rgba(255,92,53,.14);color:var(--accent2);border-color:rgba(255,92,53,.3)}
.chip.red{background:rgba(255,77,77,.12);color:var(--red);border-color:rgba(255,77,77,.28)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* stat tiles */
.stats{display:grid;gap:9px}
.stat{
  background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:10px 11px;
}
.stat .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.stat .v{font-size:19px;font-weight:750;margin-top:3px;letter-spacing:-.5px}
.stat .v small{font-size:11px;font-weight:600;color:var(--dim);margin-left:2px;letter-spacing:0}
.stat .d{font-size:11px;color:var(--dim);margin-top:1px}

/* progress bar */
.bar{height:7px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.green > i{background:linear-gradient(90deg,#26b56a,var(--green))}
.bar.blue > i{background:linear-gradient(90deg,#2b7fd4,var(--blue))}
.bar.gold > i{background:linear-gradient(90deg,#d99f1c,var(--gold))}
.bar.done > i{background:linear-gradient(90deg,#26b56a,var(--green))}

/* segmented control */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{
  flex:1;background:none;border:none;color:var(--dim);padding:7px 8px;border-radius:8px;
  cursor:pointer;font-size:12.5px;font-weight:650;
}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* rating pills */
.rate{display:flex;gap:6px}
.rate button{
  flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);
  padding:9px 0;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px;
}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- home ---------- */
.hero{
  background:linear-gradient(150deg,#1c2230,#141821 60%);
  border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;
}
.checkin-done{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ci-tile{background:rgba(255,255,255,.03);border-radius:10px;padding:8px;text-align:center}
.ci-tile .k{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.ci-tile .v{font-size:15px;font-weight:750;margin-top:2px}

.goal{padding:11px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none;padding-bottom:0}
.goal:first-child{padding-top:0}

.plan-ex{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.plan-ex:last-of-type{border-bottom:none}
.plan-ex .n{font-size:13.5px;font-weight:600}
.plan-ex .sets{font-size:12.5px;text-align:right;flex:none;max-width:58%}
.plan-ex .note{font-size:11px;color:var(--dim2);margin-top:3px;line-height:1.35}

.exline{
  display:flex;justify-content:space-between;gap:10px;
  padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.04);
}
.exline:last-child{border-bottom:none}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow span{text-align:center;font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:.8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  position:relative;aspect-ratio:1;border-radius:10px;
  background:var(--card2);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--txt);
  transition:.12s;padding:0;
}
.cal-day:hover{border-color:var(--line2)}
.cal-day.out{opacity:.28}
.cal-day.today{border-color:var(--accent);color:var(--accent)}
.cal-day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-day.sel .dot{background:#fff !important}
.cal-day .dots{position:absolute;bottom:6px;display:flex;gap:3px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.done{background:var(--green)}
.dot.plan{background:var(--blue)}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--dim2)}
.cal-legend span{display:flex;align-items:center;gap:5px}

/* ---------- workout ---------- */
.timerbar{
  position:sticky;top:56px;z-index:30;
  background:linear-gradient(150deg,#22160f,#171c26);
  border:1px solid rgba(255,92,53,.3);border-radius:14px;padding:12px 14px;margin-bottom:13px;
}
.timer{font-size:26px;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums}

.ex-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden}
.ex-head{padding:12px 13px 10px;border-bottom:1px solid var(--line)}
.ex-name{font-weight:700;font-size:15px}
.pr-banner{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:6px;font-size:11.5px;color:var(--dim);
}
.ex-note{
  margin-top:7px;padding:6px 9px;border-radius:8px;
  background:rgba(74,168,255,.07);border:1px solid rgba(74,168,255,.16);
  color:#9fc4e8;font-size:11.5px;line-height:1.35;
}
.settable{width:100%;border-collapse:collapse}
.settable th{
  font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);
  font-weight:700;padding:8px 4px;text-align:center;
}
.settable td{padding:4px;text-align:center;border-top:1px solid rgba(255,255,255,.04)}
.settable td input{padding:8px 4px;text-align:center;font-weight:650;font-size:14px;border-radius:8px}
.settable .c-set{width:38px}
.settable .c-prev{width:74px;font-size:11px;color:var(--dim2)}
.settable .c-chk{width:42px}
.settable .c-del{width:26px;padding:0}
.delset{width:24px;height:24px;border:0;background:transparent;color:var(--dim2,#5e6c7a);
  font-size:16px;line-height:1;padding:0;border-radius:5px}
.delset:active{color:var(--red,#e0483d);background:rgba(224,72,61,.12)}
.settable .c-wt{position:relative}
/* extra right padding shifts the centred value left so the plate button
   sits beside the number instead of on top of it */
.settable .c-wt input{padding-right:23px}
.plbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:4px;
  border:1px solid var(--line);background:transparent;color:var(--dim2,#5e6c7a);font-size:9.5px;line-height:1;
  display:grid;place-items:center;padding:0}
.plbtn:active{color:var(--chalk,#e8ecf3);border-color:var(--dim)}
.setno{
  width:26px;height:26px;line-height:24px;border-radius:8px;margin:0 auto;
  background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;
}
.setno.warm{background:rgba(255,197,66,.13);border-color:rgba(255,197,66,.3);color:var(--gold)}
tr.done td input{background:rgba(61,220,132,.07);border-color:rgba(61,220,132,.22)}
tr.pr td input{background:rgba(255,197,66,.1);border-color:rgba(255,197,66,.35)}
.chk{
  width:30px;height:30px;border-radius:9px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);color:var(--dim2);
  font-size:14px;line-height:1;
}
.chk.on{background:var(--green);border-color:var(--green);color:#07240f;font-weight:800}
.ex-foot{display:flex;gap:8px;padding:9px 11px 11px}

.summary-hero{
  text-align:center;padding:6px 0 14px;
}
.summary-hero .t{font-size:34px;font-weight:800;letter-spacing:-1.5px}

/* ---------- analytics ---------- */
.ex-row{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.ex-row:last-child{border-bottom:none}
.ex-row:hover{background:var(--card2)}
.ex-row .n{font-weight:650;font-size:14px}
.ex-row .m{font-size:11.5px;color:var(--dim2);margin-top:2px}
.ex-row .pr{font-weight:750;font-size:14.5px;text-align:right;white-space:nowrap}
.ex-row .pr small{display:block;font-size:10.5px;font-weight:600;color:var(--dim2);margin-top:2px}
.trend{font-size:11.5px;font-weight:700}
.trend.up{color:var(--green)}
.trend.down{color:var(--red)}
.trend.flat{color:var(--dim2)}

.chartbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 4px;margin:10px 0}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--dim2);font-size:9px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:url(#gfade)}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:1.5}
.chart .pt.best{fill:var(--gold);r:4.5}

.rep-tab{width:100%;border-collapse:collapse;font-size:13px}
.rep-tab th{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);font-weight:700;padding:6px 8px;text-align:left}
.rep-tab td{padding:7px 8px;border-top:1px solid var(--line)}
.rep-tab td:last-child,.rep-tab th:last-child{text-align:right}

/* ---------- meets ---------- */
.bigtotal{
  background:linear-gradient(150deg,#1e1622,#141821 65%);
  border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;
}
.lift3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0 12px}
.lift3 .l{
  background:rgba(255,255,255,.035);border-radius:11px;padding:10px 6px;text-align:center;
  border:1px solid rgba(255,255,255,.05);
}
.lift3 .l .k{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.lift3 .l .v{font-size:20px;font-weight:780;margin-top:3px;letter-spacing:-.6px}
.lift3 .l .v small{font-size:10px;color:var(--dim);font-weight:600}
.totrow{display:flex;gap:10px}
.totrow > div{flex:1;text-align:center;background:rgba(255,255,255,.035);border-radius:11px;padding:10px;border:1px solid rgba(255,255,255,.05)}
.totrow .v{font-size:23px;font-weight:800;letter-spacing:-.8px}

.countdown{
  display:flex;align-items:baseline;gap:6px;
}
.countdown .n{font-size:27px;font-weight:800;letter-spacing:-1px;color:var(--accent)}

.attempts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.att{
  background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:8px 5px;text-align:center;
}
.att .k{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim2);font-weight:700}
.att .v{font-size:16px;font-weight:750;margin-top:2px}
.att .p{font-size:9.5px;color:var(--dim2);margin-top:1px}
.att.o{border-color:rgba(61,220,132,.3)}
.att.o .v{color:var(--green)}
.att.t{border-color:rgba(255,197,66,.3)}
.att.t .v{color:var(--gold)}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
.modal{
  background:var(--bg2);border:1px solid var(--line);
  border-radius:18px 18px 0 0;width:100%;max-width:560px;
  max-height:92vh;display:flex;flex-direction:column;
  animation:slideup .2s cubic-bezier(.2,.8,.2,1);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--line);flex:none;
}
.modal-head h2{margin:0;font-size:16px}
.modal-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px;flex:none}
.modal-foot .btn{flex:1}
@media(min-width:620px){
  .modal-bg{align-items:center}
  .modal{border-radius:18px;max-height:86vh}
}

/* picker list */
.picklist{max-height:46vh;overflow-y:auto;margin:0 -16px}
.pickitem{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line);
}
.pickitem:hover{background:var(--card)}
.pickitem .n{font-weight:600;font-size:14px}
.pickitem .m{font-size:11px;color:var(--dim2);margin-top:1px}

/* toast */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{
  background:var(--card2);border:1px solid var(--line2);border-radius:11px;
  padding:10px 15px;font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.5);
  animation:slideup .2s ease;max-width:90vw;
}
.toast.gold{border-color:var(--gold);color:var(--gold);background:#241d0d}
.toast.green{border-color:rgba(61,220,132,.5);color:var(--green)}

.rank-row{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:0}
.rank-row .grow{min-width:0}
.rank-row .n{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .m{font-size:11.5px;color:var(--dim);margin-top:1px}
.bar{height:6px;border-radius:99px;background:#0d0f14;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.tierlab{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rank-sc{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13.5px;font-weight:700;width:32px;text-align:right}
</style>

<script>/* ============================================================
   IRONLOG — powerlifting logger
   All weights stored internally in KG. Display converts.
   ============================================================ */

/* ---------------- storage ---------------- */
const KEY = 'ironlog.v1';

const DEFAULT_STATE = {
  settings: {
    units: 'kg',            // kg | lb
    sex: 'male',            // for DOTS
    bodyweight: 0,          // kg (fallback if no check-ins)
    priority: ['Back Squat', 'Bench Press', 'Deadlift'],
    restDefault: 180,
    openerPct: 90,          // opener as a % of the latest tested single
    barKg: 20,              // empty bar, for warm-up ramps
    platformPct: 96,        // gym max -> platform estimate
    bars: [{ name: 'Barbell', kg: 20 }],
    plates: null,           // null = DEFAULT_PLATES
    // nutrition targets. kcal null = derive nothing, just log.
    kcalTarget: null, proteinTarget: null, carbTarget: null, fatTarget: null,
  },
  checkins: [],   // {date,'YYYY-MM-DD', weight(kg), sleepH, sleepQ, energy, soreness, stress, kcal, notes}
  workouts: [],   // {id,date,name,status,exercises:[{name,notes,sets:[{w,r,rpe,done,warm}]}],start,end,summary}
  goals: [],      // {id,name,type,exercise,startVal,target,deadline,current(for custom)}
  meets: [],      // {id,name,date,fed,loc,wclass,bwTarget,lifts:{squat,bench,deadlift},pct:{o,s}}
  customEx: [],   // extra exercise names
  active: null,   // active workout object
  programs: [],   // ids of installed training programs
  foods: [],      // {id,date,meal,name,serving,kcal,p,c,f,fib,src:'ai'|'manual'}
};

/* Persistence runs through IndexedDB — it's async (so the call sites below don't
   change), it survives reinstalling nothing, and Chrome gives it a far bigger
   quota than localStorage. localStorage is kept as a fallback for the rare build
   where IndexedDB is unavailable. The log lives on this device: use Export in ⚙
   to move it or back it up. */
let STORAGE_OK = true;
let warnedStorage = false;

const DB_NAME = 'ironlog', DB_STORE = 'kv';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
    req.onblocked = () => rej(new Error('blocked'));
  });
  return dbPromise;
}

function idb(mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode);
    const r = fn(tx.objectStore(DB_STORE));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    tx.onabort = () => rej(tx.error || new Error('aborted'));
  }));
}

async function storeGet(k) {
  try {
    const v = await idb('readonly', st => st.get(k));
    if (v != null) return v;          // undefined = fresh install, not an error
  } catch (e) { /* fall through */ }
  try { return localStorage.getItem(k); } catch (e) { return null; }
}

async function storePut(k, v) {
  let ok = false;
  try { await idb('readwrite', st => st.put(v, k)); ok = true; }
  catch (e) {
    try { localStorage.setItem(k, v); ok = true; }   // only mirror when IDB is down
    catch (e2) { ok = false; }
  }
  STORAGE_OK = ok;
  if (!ok && !warnedStorage) {
    warnedStorage = true;
    toast('⚠ Storage is not responding — your log may not survive a refresh. Export from ⚙ to keep it.');
  }
  return ok;
}

/* Ask Android not to evict the log when storage runs low. Granted automatically
   once the app is installed to the home screen. */
function requestPersistence() {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); }
  catch (e) {}
}

let S = structuredClone(DEFAULT_STATE);   // replaced by the real state in boot()

async function load() {
  const raw = await storeGet(KEY);
  if (!raw) return structuredClone(DEFAULT_STATE);
  try {
    return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw));
  } catch (e) {
    console.warn('load failed', e);
    return structuredClone(DEFAULT_STATE);
  }
}

/* save() stays synchronous to its 31 call sites and coalesces rapid edits —
   typing a set shouldn't fire a write per keystroke. Flush on hide as well, so
   locking the phone mid-workout doesn't drop the last few reps. */
let saveTimer = null, savePending = false;

function save() {
  savePending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}

async function flush() {
  if (!savePending) return;
  savePending = false;
  clearTimeout(saveTimer);
  await storePut(KEY, JSON.stringify(S));
}

document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function iso(d = new Date()) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today() { return iso(); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function fmtDate(s, opt) {
  return parseISO(s).toLocaleDateString(undefined, opt || { weekday: 'short', month: 'short', day: 'numeric' });
}
function relDay(s) {
  const d = daysBetween(today(), s);
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  if (d < 0) return `${-d}d ago`;
  return `in ${d}d`;
}

// unit conversion
const U = () => S.settings.units;
const toKg = v => U() === 'kg' ? +v : +v / 2.2046226218;
const fromKg = v => U() === 'kg' ? +v : +v * 2.2046226218;
const inc = () => U() === 'kg' ? 2.5 : 5;
function dw(kg, dec = 1) { // display weight (number)
  if (kg == null || isNaN(kg)) return 0;
  const v = fromKg(kg);
  return +(Math.round(v * 10 ** dec) / 10 ** dec);
}
function w(kg, dec = 1) { return `${nice(dw(kg, dec))}<small>${U()}</small>`; }
function wt(kg, dec = 1) { return `${nice(dw(kg, dec))}${U()}`; }
function nice(n) { return (Math.round(n * 10) / 10).toString(); }
function roundBar(kg) { // round to nearest loadable increment, in display units
  const step = inc();
  const disp = fromKg(kg);
  return toKg(Math.round(disp / step) * step);
}

// e1RM — Epley, capped at 12 reps for sanity
function e1rm(kg, reps) {
  if (!kg || !reps) return 0;
  if (reps === 1) return kg;
  const r = Math.min(reps, 12);
  return kg * (1 + r / 30);
}

// DOTS
function dots(totalKg, bwKg, sex) {
  if (!totalKg || !bwKg) return 0;
  const c = sex === 'female'
    ? [-57.96288, 13.6175032, -0.1126655495, 0.0005158568, -0.0000010706]
    : [-307.75076, 24.0900756, -0.1918759221, 0.0007391293, -0.000001093];
  const x = clamp(bwKg, 40, 210);
  const denom = c[0] + c[1] * x + c[2] * x ** 2 + c[3] * x ** 3 + c[4] * x ** 4;
  if (denom <= 0) return 0;
  return totalKg * (500 / denom);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function bodyweightKg() {
  const ci = [...S.checkins].filter(c => c.weight > 0).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  return ci ? ci.weight : (S.settings.bodyweight || 0);
}

/* One lookup for everything known about a movement. Hand-tuned muscle
   shares beat derived ones; equipment only ever comes from EX_DB. */
function exInfo(name) {
  const d = EX_DB[name];
  const hand = EX_MUSCLE[name];
  if (!d && !hand) return null;
  return {
    m: hand || (d && d.m) || null,
    eq: EX_EQ[name] || (d ? d.eq : null),
    cat: d ? d.cat : null,
    mech: d ? d.mech : null,
    tuned: !!hand,
  };
}
function exMuscles(name) { const i = exInfo(name); return i && i.m; }

function categoryOf(name) {
  for (const [c, list] of Object.entries(LIB)) if (list.includes(name)) return c;

}

function stdFor(name) {
  const s = STD[name];
  if (!s) return null;
  const f = S.settings.sex === 'female' ? s[5] : 1;
  return s.slice(0, 5).map(v => v * f);
}

/* Score is 0–100 with each tier worth 20 points, so the bar moves smoothly
   between tiers instead of jumping. Uses best real e1RM — backfilled sets are
   already excluded by statsFor, so an estimate can't inflate a rank. */
function rankFor(name) {
  const bw = bodyweightKg();
  const st = statsFor(name);
  const th = stdFor(name);
  if (!bw || !st || !th) return null;

  const e1 = st.best.e1;
  const ratio = e1 / bw;
  const marks = th.map(m => m * bw);
  let score, tier, nextIdx = null;

  if (ratio < th[0]) {
    score = (ratio / th[0]) * 20;
    tier = -1;
    nextIdx = 0;
  } else {
    let i = 4;
    while (i > 0 && ratio < th[i]) i--;
    tier = i;
    if (i === 4) score = 100;
    else {
      score = 20 * (i + 1) + ((ratio - th[i]) / (th[i + 1] - th[i])) * 20;
      nextIdx = i + 1;
    }
  }

  return {
    name, e1, ratio, score: clamp(score, 0, 100),
    tier, tierName: tier < 0 ? 'Untrained' : TIERS[tier],
    color: tier < 0 ? 'var(--dim)' : TIER_COLOR[tier],
    nextName: nextIdx == null ? null : TIERS[nextIdx],
    toNext: nextIdx == null ? 0 : marks[nextIdx] - e1,
    estOnly: st.estOnly, marks,
  };
}

function allRanks() {
  return allStats().map(s => rankFor(s.name)).filter(Boolean)
    .sort((a, b) => b.score - a.score);
}

/* Each muscle's score is the share-weighted average of the ranks of every
   ranked lift that trains it. Only lifts with a standard contribute, so an
   untested muscle reads as absent rather than as zero. */
function muscleScores() {
  const acc = {};
  allRanks().forEach(r => {
    const m = exMuscles(r.name);
    if (!m) return;
    Object.entries(m).forEach(([k, share]) => {
      if (!MUSCLES[k]) return;
      acc[k] = acc[k] || { num: 0, den: 0, lifts: 0 };
      acc[k].num += r.score * share;
      acc[k].den += share;
      acc[k].lifts++;
    });
  });
  return Object.entries(acc)
    .map(([k, v]) => ({ key: k, name: MUSCLES[k], score: v.num / v.den, lifts: v.lifts }))
    .sort((a, b) => b.score - a.score);
}

/* ---------------- PR engine ---------------- */
// Returns every logged (completed, non-warmup) set for an exercise, oldest first.
function historyFor(name) {
  const out = [];
  S.workouts.filter(wo => wo.status === 'completed').forEach(wo => {
    wo.exercises.filter(e => e.name === name).forEach(e => {
      e.sets.filter(s => s.done && !s.warm && s.w > 0 && s.r > 0).forEach(s => {
        out.push({ date: wo.date, w: s.w, r: s.r, rpe: s.rpe, e1: e1rm(s.w, s.r), workoutId: wo.id, est: !!wo.backfilled });
      });
    });
  });
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function statsFor(name) {
  const h = historyFor(name);
  if (!h.length) return null;
  const sessions = [...new Set(h.map(s => s.date))].sort();
  /* Backfilled sets are the plan's prescription, not what came off the bar.
     They count toward volume and consistency but must not set a PR. */
  const real = h.filter(s => !s.est);
  const prSrc = real.length ? real : h;      // nothing real logged yet: fall back so the UI still has numbers
  let best = prSrc[0], bestW = prSrc[0];
  const byRep = {};                    // reps -> heaviest weight
  let volume = 0;
  prSrc.forEach(s => {
    if (s.e1 > best.e1) best = s;
    if (s.w > bestW.w || (s.w === bestW.w && s.r > bestW.r)) bestW = s;
    if (!byRep[s.r] || s.w > byRep[s.r].w) byRep[s.r] = s;
  });
  h.forEach(s => { volume += s.w * s.r; });
  // per-session best e1RM series
  const series = sessions.map(d => {
    const ss = h.filter(s => s.date === d);
    return {
      date: d,
      e1: Math.max(...ss.map(s => s.e1)),
      top: Math.max(...ss.map(s => s.w)),
      vol: ss.reduce((a, s) => a + s.w * s.r, 0),
      sets: ss.length,
    };
  });
  const first = series[0], last = series[series.length - 1];
  const delta = last.e1 - first.e1;
  const pct = first.e1 ? (delta / first.e1) * 100 : 0;
  return {
    name, sessions: sessions.length, totalSets: h.length, volume,
    best, bestW, byRep, series, first, last, delta, pct,
    estOnly: !real.length,
    lastDate: sessions[sessions.length - 1], firstDate: sessions[0],
  };
}

// map of exercise -> stats, cached per render pass
let _statCache = null;
function allStats() {
  if (_statCache) return _statCache;
  const names = new Set();
  S.workouts.filter(w => w.status === 'completed').forEach(wo => wo.exercises.forEach(e => names.add(e.name)));
  _statCache = [...names].map(statsFor).filter(Boolean).sort((a, b) => b.sessions - a.sessions || a.name.localeCompare(b.name));
  return _statCache;
}
function bust() { _statCache = null; }

function prFor(name) { return statsFor(name); }

// Best single. An actual 1-rep set always wins — that's the real PR. If you've
// never pulled a true single we fall back to the best estimate and flag it.
// `e1` carries the best estimate alongside, so a big rep PR still shows up.
function bestSingleInfo(name) {
  const st = statsFor(name);
  if (!st) return { kg: 0, est: false, e1: 0 };
  const single = st.byRep[1];
  return single
    ? { kg: single.w, est: false, e1: st.best.e1 }
    : { kg: st.best.e1, est: true, e1: st.best.e1 };
}
function bestSingleKg(name) { return bestSingleInfo(name).kg; }

/* ---------------- testing log ----------------
   A test is a completed session flagged `tested`, holding one 1-rep set per
   lift attempted. Log one lift or three — whatever actually got tested that
   day. Because it lands as a normal 1-rep set, bestSingleInfo picks it up as
   a true single rather than an Epley estimate, and everything downstream —
   total, DOTS, rankings, opener suggestions — follows without a second path. */
function logTest(date, entries, notes) {
  const clean = entries.filter(e => e.name && e.kg > 0);
  if (!clean.length) return 0;
  S.workouts.push({
    id: uid(), date, name: clean.length === 1 ? `${shortLift(clean[0].name)} test` : 'Max test',
    status: 'completed', tested: true, notes: notes || '',
    exercises: clean.map(e => ({
      name: e.name, notes: '',
      sets: [{ w: e.kg, r: 1, rpe: null, done: true, warm: false }],
    })),
    start: null, end: parseISO(date).getTime(),
    summary: { mins: 0, prs: [], volume: clean.reduce((t, e) => t + e.kg, 0) },
  });
  save(); bust();
  return clean.length;
}

function testLog() {
  return S.workouts.filter(w => w.tested)
    .sort((a, b) => a.date < b.date ? 1 : -1);
}

/* Most recent tested single for a lift — recency beats magnitude here, because
   an opener should reflect where you are now, not the best day you ever had. */
function latestTest(name) {
  for (const w of testLog()) {
    const e = w.exercises.find(x => x.name === name);
    if (e && e.sets[0] && e.sets[0].w > 0) return { kg: e.sets[0].w, date: w.date };
  }
  return null;
}

function openerPct() { return S.settings.openerPct || 90; }

/* Suggested opener from the latest test, not from the goal third. Returns null
   when the lift hasn't been tested — better a blank than a number derived from
   a rep-max estimate, which is what the opener is meant to replace. */
function testedOpener(name) {
  const t = latestTest(name);
  if (!t) return null;
  return { kg: roundBar(t.kg * (openerPct() / 100)), from: t.kg, date: t.date };
}

/* line chart: data = [{date, v}] */
function chart(data, { color = 'var(--accent)', h = 150, fmt = v => nice(v) } = {}) {
  if (data.length === 0) return `<div class="empty">No data yet</div>`;
  const W = 320, H = h, padL = 34, padR = 8, padT = 12, padB = 20;
  const vals = data.map(d => d.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min = min * 0.95 || 0; max = max * 1.05 || 1; }
  const span = max - min || 1;
  min -= span * 0.08; max += span * 0.08;
  const x = i => padL + (data.length === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (data.length - 1));
  const y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

  const pts = data.map((d, i) => [x(i), y(d.v)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H - padB} L${pts[0][0].toFixed(1)},${H - padB} Z`;
  const bestIdx = vals.indexOf(Math.max(...vals));

  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * (i / ticks);
    const yy = y(v);
    grid += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" opacity=".5"/>
             <text class="axis" x="${padL - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  // x labels: first, middle, last
  const labIdx = data.length <= 2 ? data.map((_, i) => i) : [0, Math.floor((data.length - 1) / 2), data.length - 1];
  const xlabs = labIdx.map(i => {
    const d = parseISO(data[i].date);
    const anchor = i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
    return `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="${anchor}">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`;
  }).join('');

  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <defs><linearGradient id="gfade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path class="area" d="${area}"/>
    <path class="ln" d="${line}" stroke="${color}"/>
    ${pts.map((p, i) => `<circle class="pt${i === bestIdx ? ' best' : ''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === bestIdx ? 4 : 3}" fill="${i === bestIdx ? 'var(--gold)' : color}"/>`).join('')}
    ${xlabs}
  </svg></div>`;
}

  const todays = S.workouts.filter(w => w.date === today());
  const planned = todays.filter(w => w.status === 'planned');
  const done = todays.filter(w => w.status === 'completed');

  let scheduleHtml;
  if (S.active) {
    scheduleHtml = `<div class="row between">
        <div><div style="font-weight:700">${esc(S.active.name)}</div>
        <div class="sub">In progress · ${S.active.exercises.length} exercise${S.active.exercises.length === 1 ? '' : 's'}</div></div>
        <button class="btn primary sm" data-go="workout">Resume</button>
      </div>`;
  } else if (planned.length) {
    scheduleHtml = planned.map(p => `
      <div class="row between" style="margin-bottom:8px">
        <div class="grow"><div style="font-weight:700">${esc(p.name)}</div>
        <div class="sub">${p.exercises.length} exercise${p.exercises.length === 1 ? '' : 's'} planned</div></div>
        <button class="btn primary sm" data-start-planned="${p.id}">Start</button>
      </div>
      <div>${p.exercises.map(e => `<div class="exline"><span>${esc(e.name)}</span>
          <span class="muted mono" style="white-space:nowrap">${setSummary(e)}</span></div>`).join('')}</div>`)
      .join('<div class="hr"></div>');
  } else if (done.length) {
    scheduleHtml = done.map(d => `<div class="row between">
        <div><div style="font-weight:700">${esc(d.name)} <span class="chip green">DONE</span>${d.backfilled ? ' <span class="chip">EST</span>' : ''}</div>
        <div class="sub">${d.exercises.length} exercises · ${wt(totalVolume(d), 0)} volume</div></div>
        <button class="btn ghost sm" data-view-workout="${d.id}">View</button>
      </div>`).join('');
  } else {
    scheduleHtml = `<div class="row between">
        <div><div style="font-weight:700">Rest day</div><div class="sub">Nothing scheduled for today</div></div>
        <button class="btn sm" data-go="calendar">Plan one</button>
      </div>`;
  }

  // week stats
  const wk = last7();
  const avgSleep = avg(wk.map(c => c.sleepH).filter(Boolean));
  const bws = S.checkins.filter(c => c.weight > 0).sort((a, b) => a.date < b.date ? -1 : 1);
  const bwNow = bws.length ? bws[bws.length - 1].weight : 0;
  const bw7 = bws.filter(c => daysBetween(c.date, today()) <= 7);
  const bwDelta = bw7.length > 1 ? bwNow - bw7[0].weight : 0;
  const sessions7 = S.workouts.filter(w => w.status === 'completed' && daysBetween(w.date, today()) <= 7).length;

  return `
  <h1>${greet}</h1>
  <div class="sub" style="margin-bottom:14px">${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}${streak() > 1 ? ` · 🔥 ${streak()} day check-in streak` : ''}</div>

  <div class="hero">
    <div class="row between">
      <div>
        <div class="eyebrow">Daily check-in</div>
        <div style="font-weight:750;font-size:17px;margin-top:3px">${ci ? 'Logged for today' : 'Not logged yet'}</div>
      </div>
      <button class="btn ${ci ? '' : 'primary'}" id="checkinBtn">${ci ? 'Edit' : 'Check in'}</button>
    </div>
    ${ci ? `<div class="checkin-done">
        <div class="ci-tile"><div class="k">Weight</div><div class="v">${ci.weight ? wt(ci.weight) : '—'}</div></div>
        <div class="ci-tile"><div class="k">Sleep</div><div class="v">${ci.sleepH ? ci.sleepH + 'h' : '—'}</div></div>
        <div class="ci-tile"><div class="k">Energy</div><div class="v">${ci.energy || '—'}${ci.energy ? '/5' : ''}</div></div>
        <div class="ci-tile"><div class="k">Soreness</div><div class="v">${ci.soreness || '—'}${ci.soreness ? '/5' : ''}</div></div>
      </div>${ci.notes ? `<div class="sub" style="margin-top:9px">“${esc(ci.notes)}”</div>` : ''}` : ''}
  </div>

  <div class="stats grid3" style="margin-bottom:13px">
    <div class="stat"><div class="k">Bodyweight</div><div class="v">${bwNow ? w(bwNow) : '—'}</div>
      <div class="d">${bwDelta ? (bwDelta > 0 ? '▲ ' : '▼ ') + wt(Math.abs(bwDelta)) + ' / 7d' : 'no change'}</div></div>
    <div class="stat"><div class="k">Sleep avg</div><div class="v">${avgSleep ? nice(avgSleep) : '—'}<small>h</small></div><div class="d">last 7 days</div></div>
    <div class="stat"><div class="k">Sessions</div><div class="v">${sessions7}</div><div class="d">last 7 days</div></div>
  </div>

  <div class="sechead"><h2>Today's training</h2>
    ${!S.active && !planned.length ? `<button class="btn xs" id="quickStart">Start blank</button>` : ''}
  </div>
  <div class="card">${scheduleHtml}</div>

  <div class="sechead"><h2>Goals</h2><button class="btn xs" id="addGoal">+ Add</button></div>
  <div class="card">${S.goals.length ? S.goals.map(goalRow).join('') :
      `<div class="empty"><span class="big">◎</span>No goals yet.<br>Add one to track progress toward a number.</div>`}</div>
  `;
}

function last7() {
  return S.checkins.filter(c => daysBetween(c.date, today()) <= 7 && daysBetween(c.date, today()) >= 0);
}
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
function streak() {
  let n = 0, d = new Date();
  // allow today to be missing without breaking the streak
  if (!checkinFor(iso(d))) d.setDate(d.getDate() - 1);
  while (checkinFor(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// "1×5 @150, 3×5 @135" — groups consecutive identical sets
function setSummary(e) {
  const groups = [];
  e.sets.forEach(s => {
    const last = groups[groups.length - 1];
    if (last && last.w === s.w && last.r === s.r) last.n++;
    else groups.push({ n: 1, w: s.w, r: s.r });
  });
  return groups.map(g =>
    `${g.n}×${g.r || 'AMRAP'}${g.w ? ` @ ${wt(g.w)}` : ''}`).join(', ') || '—';
}

function totalVolume(wo) {
  return wo.exercises.reduce((a, e) => a + e.sets.filter(s => s.done && !s.warm).reduce((b, s) => b + (s.w || 0) * (s.r || 0), 0), 0);
}

function goalCurrent(g) {
  if (g.type === 'lift') return bestSingleKg(g.exercise);
  if (g.type === 'bodyweight') return bodyweightKg();
  if (g.type === 'total') return S.settings.priority.reduce((a, n) => a + bestSingleKg(n), 0);
  if (g.type === 'sessions') return S.workouts.filter(w => w.status === 'completed' && (!g.since || w.date >= g.since)).length;
  return g.current || 0;
}
function goalRow(g) {
  const cur = goalCurrent(g);
  const start = g.startVal ?? 0;
  const denom = (g.target - start) || 1;
  const pct = ((cur - start) / denom) * 100;
  const isCount = g.type === 'sessions';
  const f = v => isCount ? Math.round(v) : wt(v);
  const left = g.deadline ? daysBetween(today(), g.deadline) : null;
  return `<div class="goal" data-goal="${g.id}">
    <div class="row between" style="margin-bottom:6px">
      <div class="grow"><div style="font-weight:650;font-size:14px">${esc(g.name)}</div>
        <div class="sub">${f(cur)} of ${f(g.target)}${left !== null ? ` · ${left >= 0 ? left + ' days left' : 'past deadline'}` : ''}</div></div>
      <div class="right">
        <div style="font-weight:750;font-size:15px;${pct >= 100 ? 'color:var(--green)' : ''}">${Math.round(clamp(pct, 0, 999))}%</div>
      </div>
    </div>
    ${bar(pct, g.type === 'bodyweight' ? 'blue' : '')}
  </div>`;
}

      };
    },
  });
}

/* ============================================================
   CALENDAR
   ============================================================ */
function viewCalendar() {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;      // Monday-first
  const daysIn = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ d: new Date(y, m - 1, prevDays - i), out: true });
  for (let i = 1; i <= daysIn; i++) cells.push({ d: new Date(y, m, i), out: false });
  while (cells.length % 7) cells.push({ d: new Date(y, m + 1, cells.length - startDow - daysIn + 1), out: true });

  const grid = cells.map(c => {
    const ds = iso(c.d);
    const wos = S.workouts.filter(w => w.date === ds);
    const hasDone = wos.some(w => w.status === 'completed');
    const hasPlan = wos.some(w => w.status === 'planned');
    return `<button class="cal-day${c.out ? ' out' : ''}${ds === today() ? ' today' : ''}${ds === calSelected ? ' sel' : ''}" data-day="${ds}">
      ${c.d.getDate()}
      <span class="dots">${hasDone ? '<i class="dot done"></i>' : ''}${hasPlan ? '<i class="dot plan"></i>' : ''}</span>
    </button>`;
  }).join('');

  // month summary
  const monthWos = S.workouts.filter(w => w.status === 'completed' && w.date.startsWith(`${y}-${String(m + 1).padStart(2, '0')}`));
  const monthVol = monthWos.reduce((a, w) => a + totalVolume(w), 0);

  return `
  <div class="card">
    <div class="cal-head">
      <button class="btn sm ghost" id="calPrev">‹</button>
      <div class="center"><div style="font-weight:750;font-size:16px">${calCursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div>
        <div class="sub">${monthWos.length} sessions · ${wt(monthVol, 0)} volume</div></div>
      <button class="btn sm ghost" id="calNext">›</button>
    </div>
    <div class="cal-dow">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend"><span><i class="dot done"></i> Completed</span><span><i class="dot plan"></i> Planned</span></div>
  </div>
  ${dayPanel(calSelected)}
  `;
}

        bg.querySelectorAll('[data-pl]').forEach(inp => {
          const i = +inp.dataset.i, ex = p.exercises[i];
          if (!ex) return;
          if (inp.dataset.pl === 'sets') {
            const n = clamp(+inp.value || 1, 1, 20);
            const tmpl = ex.sets[0] || { w: 0, r: 0 };
            while (ex.sets.length < n) ex.sets.push({ w: tmpl.w, r: tmpl.r, rpe: null, done: false, warm: false });
            ex.sets.length = n;
          }
          if (inp.dataset.pl === 'reps') ex.sets.forEach(s => s.r = +inp.value || 0);
          if (inp.dataset.pl === 'wt') ex.sets.forEach(s => s.w = inp.value ? toKg(+inp.value) : 0);
        });
      };
      bg.querySelectorAll('[data-pl]').forEach(i => i.onchange = () => { grab(); renderPlanner(); });
      bg.querySelectorAll('[data-pl-rm]').forEach(b => b.onclick = () => { grab(); p.exercises.splice(+b.dataset.plRm, 1); renderPlanner(); });
      $('#plAdd', bg).onclick = () => {
        grab();
        pickExercise(name => {
          p.exercises.push({ name, notes: '', sets: Array.from({ length: 3 }, () => ({ w: 0, r: 5, rpe: null, done: false, warm: false })) });
          renderPlanner();
        });
      };
      $('#plSave', bg).onclick = () => {
        grab();
        if (!p.exercises.length) return toast('Add at least one exercise');
        S.workouts = S.workouts.filter(x => x.id !== p.id);
        S.workouts.push(structuredClone(p));
        calSelected = p.date;
        save(); closeAllModals(); render(); toast('Workout planned', 'green');
      };
    },
  });
}

/* ---------------- exercise picker ---------------- */
function pickExercise(cb) {
  const recent = [...new Set(S.workouts.filter(w => w.status === 'completed').slice(-12).reverse()
    .flatMap(w => w.exercises.map(e => e.name)))].slice(0, 8);
  const draw = (q) => {
    const all = allExercises();
    let list;
    if (q) {
      const ql = q.toLowerCase();
      const own = all.filter(n => n.toLowerCase().includes(ql));
      const extra = Object.keys(EX_DB)
        .filter(n => n.toLowerCase().includes(ql) && !all.includes(n))
        .sort((a, b) => a.localeCompare(b));
      list = [...own, ...extra];
    } else list = all;
    const groups = {};
    list.forEach(n => { const c = categoryOf(n); (groups[c] = groups[c] || []).push(n); });
    let html = '';
    if (!q && recent.length) {
      html += `<div style="padding:8px 16px 4px" class="eyebrow">Recent</div>`;
      html += recent.map(n => item(n)).join('');
    }
    Object.entries(groups).forEach(([c, names]) => {
      html += `<div style="padding:10px 16px 4px" class="eyebrow">${c}</div>`;
      html += names.map(n => item(n)).join('');
    });
    if (q && !list.length) html = `<div class="empty">No match. Create “${esc(q)}” below.</div>`;
    return html;
  };
  const item = n => {
    const st = statsFor(n);
    const inf = exInfo(n);
    const meta = st ? `PR ${wt(st.bestW.w)} × ${st.bestW.r} · ${st.sessions} sessions`
                    : (inf && inf.eq ? inf.eq : 'No history');
    return `<div class="pickitem" data-pick="${esc(n)}">
      <div><div class="n">${esc(n)}</div><div class="m">${esc(meta)}</div></div>
      <span class="dimmer">›</span></div>`;
  };
  modal({
    title: 'Add exercise',
    body: `<input id="pkQ" placeholder="Search or type a new exercise…" autocomplete="off">
           <div class="picklist" id="pkList" style="margin-top:12px">${draw('')}</div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn" id="pkNew">Create new</button>`,
    onOpen: bg => {
      const list = $('#pkList', bg), q = $('#pkQ', bg);
      const bind = () => list.querySelectorAll('[data-pick]').forEach(el =>
        el.onclick = () => {
          const n = el.dataset.pick;
          // an EX_DB pick isn't in LIB, so remember it as a custom name
          if (!allExercises().includes(n) && !S.customEx.includes(n)) {
            S.customEx.push(n); save();
          }
          closeModal(); cb(n);
        });
      bind();
      q.oninput = () => { list.innerHTML = draw(q.value.trim()); bind(); };
      $('#pkNew', bg).onclick = () => {
        const name = q.value.trim();
        if (!name) return toast('Type a name first');
        if (!S.customEx.includes(name)) S.customEx.push(name);
        save(); closeModal(); cb(name);
      };
      setTimeout(() => q.focus(), 60);
    },
  });
}

/* ---------------- warm-up ramp ----------------
   Builds a ladder to a target load. Fewer, bigger jumps for a heavy single;
   more reps and shallower steps for volume work. The point is to arrive at the
   top set primed but not spent — on a test day a bad warm-up costs you the
   number outright, in either direction. */
const RAMP = {
  single: { pcts: [0.40, 0.55, 0.70, 0.80, 0.88, 0.94], reps: [5, 3, 2, 1, 1, 1], rest: [60, 90, 120, 180, 210, 240] },
  low:    { pcts: [0.45, 0.60, 0.75, 0.86],             reps: [5, 4, 3, 2],       rest: [60, 90, 120, 180] },
  high:   { pcts: [0.50, 0.70, 0.85],                   reps: [8, 5, 3],          rest: [60, 75, 90] },
};

function warmupRamp(targetKg, reps = 1, barKg = 20) {
  if (!targetKg || targetKg <= 0) return [];
  const spec = reps <= 2 ? RAMP.single : reps <= 6 ? RAMP.low : RAMP.high;
  const out = [];

  if (barKg > 0 && targetKg > barKg * 1.5) {
    out.push({ kg: barKg, reps: reps <= 2 ? 8 : 10, rest: 45, bar: true });
  }

  spec.pcts.forEach((p, i) => {
    const kg = roundBar(targetKg * p);
    if (kg <= barKg) return;                       // below the empty bar: skip
    if (out.some(x => Math.abs(x.kg - kg) < 0.01)) return;   // duplicate after rounding
    if (kg >= targetKg) return;                    // never warm up at or above the target
    out.push({ kg, reps: spec.reps[i], rest: spec.rest[i], pct: Math.round(p * 100) });
  });

  out.push({ kg: roundBar(targetKg), reps, rest: 0, work: true });
  return out;
}

function fmtRest(s) {
  if (!s) return '';
  return s >= 60 ? `${Math.round(s / 60)}${s % 60 ? `:${String(s % 60).padStart(2, '0')}` : ' min'}` : `${s}s`;
}

/* Bar weight is asked for rather than assumed — a hex bar, a Smith carriage and
   a comp bar are three different starting points, and getting it wrong throws
   every percentage below about 60%. */
function openRamp(name, presetKg) {
  const st = statsFor(name);
  const suggestion = presetKg || (st ? roundBar(st.best.e1) : 0);

  const draw = (targetDisp, reps, barDisp) => {
    const ramp = warmupRamp(toKg(targetDisp), reps, toKg(barDisp));
    if (!ramp.length) return `<div class="sub">Enter a target weight.</div>`;
    return `<table class="settable"><thead><tr>
        <th class="c-set">#</th><th>${U()}</th><th>Reps</th><th>Rest</th></tr></thead><tbody>
      ${ramp.map((r, i) => `<tr class="${r.work ? 'pr' : ''}">
        <td class="c-set"><div class="setno ${r.work ? '' : 'warm'}">${r.work ? '★' : r.bar ? 'B' : i}</div></td>
        <td class="mono"><b>${nice(dw(r.kg))}</b>${r.bar ? ' <span class="dimmer">bar</span>' : r.pct ? ` <span class="dimmer">${r.pct}%</span>` : ''}</td>
        <td class="mono">${r.reps}</td>
        <td class="mono dimmer">${r.work ? '—' : fmtRest(r.rest)}</td>
      </tr>`).join('')}

  };

  modal({

    body: `
      <div class="row" style="gap:8px">
        <div class="field grow"><label>Target (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rTarget" value="${suggestion ? dw(suggestion) : ''}"></div>
        <div class="field" style="width:80px"><label>Reps</label>
          <input type="number" inputmode="numeric" id="rReps" value="1"></div>
        <div class="field" style="width:88px"><label>Bar (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rBar" value="${nice(dw(S.settings.barKg || 20))}"></div>
      </div>
      <div id="rOut">${draw(suggestion ? dw(suggestion) : 0, 1, dw(S.settings.barKg || 20))}</div>
      <div class="sub" style="margin-top:9px">Rest is a floor, not a target — on the last two steps take longer if you need it.</div>
    `,
    foot: `<button class="btn primary" data-close>Done</button>`,
    onOpen: bg => {
      const upd = () => {
        const bar = +$('#rBar', bg).value || 20;
        S.settings.barKg = toKg(bar);
        save();
        $('#rOut', bg).innerHTML = draw(+$('#rTarget', bg).value || 0, +$('#rReps', bg).value || 1, bar);
      };

/* ---------------- plate maths ----------------
   Works from a real inventory, in pairs, because a stack you can't build is
   worse than no answer. If the target isn't loadable it says so and gives the
   nearest weight you can actually make in both directions. */
const DEFAULT_PLATES = [
  { kg: 25, pairs: 4 }, { kg: 20, pairs: 4 }, { kg: 15, pairs: 2 },
  { kg: 10, pairs: 4 }, { kg: 5, pairs: 2 }, { kg: 2.5, pairs: 2 },
  { kg: 1.25, pairs: 2 }, { kg: 0.5, pairs: 2 },
];

function inventory() {
  const inv = S.settings.plates && S.settings.plates.length ? S.settings.plates : DEFAULT_PLATES;
  return inv.filter(p => p.kg > 0 && p.pairs > 0).sort((a, b) => b.kg - a.kg);
}
function bars() {
  return (S.settings.bars && S.settings.bars.length ? S.settings.bars : [{ name: 'Barbell', kg: 20 }])
    .filter(b => b.kg > 0);
}

/* Greedy is optimal here: every plate set in use is "canonical" (each size at
   least twice the next), so taking the heaviest that fits never strands you. */
function loadPlates(targetKg, barKg, inv) {
  const side = (targetKg - barKg) / 2;
  if (side < 0) return { impossible: 'under', bar: barKg };
  if (side === 0) return { perSide: [], achieved: barKg, exact: true, bar: barKg };

  let left = side;
  const perSide = [];
  inv.forEach(p => {
    const n = Math.min(p.pairs, Math.floor((left + 1e-9) / p.kg));
    if (n > 0) { perSide.push({ kg: p.kg, count: n }); left -= n * p.kg; }
  });

  const achieved = barKg + (side - left) * 2;
  return { perSide, achieved, exact: Math.abs(left) < 1e-9, short: left * 2, bar: barKg };
}

/* Every weight the inventory can build, for "nearest loadable" answers. */
function loadableWeights(barKg, inv) {
  let sums = [0];
  inv.forEach(p => {
    const next = new Set(sums);
    sums.forEach(s => { for (let n = 1; n <= p.pairs; n++) next.add(s + n * p.kg); });
    sums = [...next];
  });
  return sums.map(s => barKg + s * 2).sort((a, b) => a - b);
}

function nearestLoadable(targetKg, barKg, inv) {
  const all = loadableWeights(barKg, inv);
  let below = null, above = null;
  for (const w2 of all) {
    if (w2 <= targetKg + 1e-9) below = w2;
    if (w2 >= targetKg - 1e-9) { above = w2; break; }
  }
  return { below, above };
}

const PLATE_COLOR = {
  25: '#c8102e', 20: '#1f57c3', 15: '#e8b923', 10: '#4fb477',
  5: '#e8ecf3', 2.5: '#c8102e', 1.25: '#8a93a5', 0.5: '#8a93a5',
};

function openPlates(targetKg, presetBar) {
  const bl = bars();
  let barIdx = Math.max(0, bl.findIndex(b => b.kg === (presetBar || S.settings.barKg || 20)));

  const draw = () => {
    const bar = bl[barIdx];
    const inv = inventory();
    const r = loadPlates(targetKg, bar.kg, inv);

    if (r.impossible === 'under') {
      return `<div class="sub">${wt(targetKg)} is below the ${esc(bar.name)} at ${wt(bar.kg)}.</div>`;
    }

    const stack = r.perSide.length
      ? r.perSide.map(p => `<div class="row" style="gap:9px;align-items:center;padding:6px 0">
          <div style="width:34px;height:34px;border-radius:7px;background:${PLATE_COLOR[p.kg] || '#8a93a5'};
            display:grid;place-items:center;font-size:11.5px;font-weight:800;color:${p.kg === 5 ? '#14181d' : '#fff'}">${nice(p.kg)}</div>
          <div class="grow"><b>${nice(dw(p.kg))}${U()}</b> <span class="sub">× ${p.count} per side</span></div>
          <div class="mono sub">${nice(dw(p.kg * p.count * 2))}</div>
        </div>`).join('')
      : `<div class="sub">Empty bar.</div>`;

    let warn = '';
    if (!r.exact) {
      const n = nearestLoadable(targetKg, bar.kg, inv);
      warn = `<div style="border-left:3px solid var(--gold);background:rgba(255,197,66,.08);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:10px">
        <b>Not loadable.</b> <span class="sub">Your inventory reaches ${wt(r.achieved)} — ${wt(r.short)} short.
        Nearest you can build: ${n.below ? wt(n.below) : '—'}${n.above && n.above !== r.achieved ? ` or ${wt(n.above)}` : ''}.</span></div>`;
    }

    return `${warn}
      <div class="row between" style="margin-bottom:8px">
        <div><div class="eyebrow">Per side</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1">${nice(dw((r.achieved - bar.kg) / 2, 2))}</div></div>
        <div class="right"><div class="eyebrow">Total on bar</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1;color:${r.exact ? 'var(--green)' : 'var(--gold)'}">${nice(dw(r.achieved))}</div></div>
      </div>
      ${stack}`;
  };

  modal({
    title: `Plates · ${wt(targetKg)}`,
    body: `${bl.length > 1 ? `<div class="seg" id="pBars" style="margin-bottom:11px">
        ${bl.map((b, i) => `<button data-bar="${i}" class="${i === barIdx ? 'on' : ''}">${esc(b.name)} ${nice(dw(b.kg))}</button>`).join('')}
      </div>` : `<div class="sub" style="margin-bottom:9px">${esc(bl[0].name)} at ${wt(bl[0].kg)}</div>`}
      <div id="pOut">${draw()}</div>`,

function finishWorkout() {
  const a = S.active;
  const logged = a.exercises.map(e => ({ ...e, sets: e.sets.filter(s => s.done && s.w > 0 && s.r > 0) }))
    .filter(e => e.sets.length);
  if (!logged.length) return toast('Log at least one set first');

  // PRs — compare against history BEFORE this workout is saved
  const prs = [];
  logged.forEach(e => {
    const st = statsFor(e.name);
    const working = e.sets.filter(s => !s.warm);
    if (!working.length) return;
    const best = working.reduce((a, b) => e1rm(b.w, b.r) > e1rm(a.w, a.r) ? b : a);
    if (!st) prs.push({ name: e.name, w: best.w, r: best.r, e1: e1rm(best.w, best.r), first: true });
    else if (e1rm(best.w, best.r) > st.best.e1) prs.push({ name: e.name, w: best.w, r: best.r, e1: e1rm(best.w, best.r), prev: st.best.e1 });
  });

  const mins = a.start ? Math.max(1, Math.round((Date.now() - a.start) / 60000)) : 0;
  const done = {
    id: a.id, date: a.date, name: a.name, status: 'completed',
    exercises: logged, start: a.start, end: Date.now(),
    summary: { mins, prs, volume: logged.reduce((t, e) => t + e.sets.filter(s => !s.warm).reduce((x, s) => x + s.w * s.r, 0), 0) },
  };

  // if this came from a plan, replace the planned entry
  if (a.plannedFrom) S.workouts = S.workouts.filter(w => w.id !== a.plannedFrom);
  S.workouts = S.workouts.filter(w => w.id !== done.id);
  S.workouts.push(done);
  S.active = null;
  save(); bust();
  showSummary(done);
}

/* ---------------- shareable session card ----------------
   Draws the session to a canvas at 1080 wide so it lands as a real image
   rather than a screenshot of a phone screen. Height grows with content.
   Everything is drawn by hand — no external fonts or libraries, because the
   artifact sandbox blocks outside requests and a missing font would silently
   ruin the layout. */
function sessionCardCanvas(wo) {
  const W = 1080, P = 72;
  const ws = wo.exercises.map(e => ({ e, sets: e.sets.filter(s => !s.warm) })).filter(x => x.sets.length);
  const prs = (wo.summary && wo.summary.prs) || [];
  const rows = ws.slice(0, 9);
  const extra = ws.length - rows.length;

  const H = 470 + rows.length * 62 + (prs.length ? 86 + Math.min(prs.length, 3) * 58 : 0) + (extra ? 46 : 0) + 110;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = (sz, wt2 = 600) => `${wt2} ${sz}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;

  x.fillStyle = '#0d0f14'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#ff5c35'; x.fillRect(0, 0, W, 8);

  let y = 96;
  x.fillStyle = '#8a93a5'; x.font = F(26, 600);
  x.fillText(`${fmtDate(wo.date, { weekday: 'long', day: 'numeric', month: 'long' })}`.toUpperCase(), P, y);

  y += 62;
  x.fillStyle = '#e8ecf3'; x.font = F(54, 800);
  x.fillText(wo.name.length > 26 ? wo.name.slice(0, 25) + '…' : wo.name, P, y);

  // headline stats
  y += 64;
  const sets = ws.reduce((n, o) => n + o.sets.length, 0);
  const reps = ws.reduce((n, o) => n + o.sets.reduce((a, s) => a + s.r, 0), 0);
  const stats = [
    [wt(wo.summary.volume, 0), 'VOLUME'],
    [String(sets), 'SETS'],
    [String(reps), 'REPS'],
    ...(wo.summary.mins ? [[`${wo.summary.mins}m`, 'TIME']] : []),
  ];
  const cw = (W - P * 2) / stats.length;
  stats.forEach((s, i) => {
    x.fillStyle = '#e8ecf3'; x.font = F(40, 780);
    x.fillText(s[0], P + i * cw, y + 44);
    x.fillStyle = '#8a93a5'; x.font = F(21, 600);
    x.fillText(s[1], P + i * cw, y + 76);
  });
  y += 128;

  if (prs.length) {
    x.fillStyle = '#ffc542'; x.font = F(24, 700);
    x.fillText(`★ ${prs.length} PERSONAL RECORD${prs.length === 1 ? '' : 'S'}`, P, y);
    y += 24;
    prs.slice(0, 3).forEach(p => {
      x.fillStyle = 'rgba(255,197,66,.09)';
      x.fillRect(P, y, W - P * 2, 48);
      x.fillStyle = '#e8ecf3'; x.font = F(27, 650);
      x.fillText(p.name.length > 24 ? p.name.slice(0, 23) + '…' : p.name, P + 18, y + 32);
      x.fillStyle = '#ffc542'; x.font = F(27, 780); x.textAlign = 'right';
      x.fillText(`${wt(p.w)} × ${p.r}`, W - P - 18, y + 32);
      x.textAlign = 'left';
      y += 58;
    });
    y += 28;
  }

  x.fillStyle = '#8a93a5'; x.font = F(22, 600);
  x.fillText('BREAKDOWN', P, y); y += 18;
  x.strokeStyle = '#252c3a'; x.lineWidth = 2;

  rows.forEach(({ e, sets: ss }) => {
    const top = ss.reduce((a, b) => e1rm(b.w, b.r) > e1rm(a.w, a.r) ? b : a);
    x.beginPath(); x.moveTo(P, y + 8); x.lineTo(W - P, y + 8); x.stroke();
    x.fillStyle = '#e8ecf3'; x.font = F(28, 620);
    const nm = e.name.length > 26 ? e.name.slice(0, 25) + '…' : e.name;
    x.fillText(nm, P, y + 46);
    x.fillStyle = '#8a93a5'; x.font = F(25, 600); x.textAlign = 'right';
    x.fillText(`${ss.length} × ${wt(top.w)}`, W - P, y + 46);
    x.textAlign = 'left';
    y += 62;
  });

  if (extra) {
    x.fillStyle = '#8a93a5'; x.font = F(24, 600);
    x.fillText(`+ ${extra} more`, P, y + 34);
    y += 46;
  }

  const handle = (S.settings.handle || '').trim();
  x.fillStyle = '#8a93a5'; x.font = F(23, 600);
  x.fillText(handle || 'IRONLOG', P, H - 44);
  return c;
}

/* Share sheet where the platform allows it, download where it doesn't — the
   sandbox may block navigator.share, and a silent failure is worse than a file
   in the downloads folder. */
async function shareSession(wo) {
  let c;
  try { c = sessionCardCanvas(wo); }
  catch (e) { return toast('Could not build the image'); }

  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  if (!blob) return toast('Could not build the image');
  const file = new File([blob], `session-${wo.date}.png`, { type: 'image/png' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // user dismissed: not an error
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Image saved', 'green');
}

/* ---------------- placing predictor ----------------
   Field data: 2025 EPA West Midlands Spring Championship, Men's 93kg Classic
   Raw, via the OpenPowerlifting project (public domain, attribution kept).
   One year is a small sample — a single strong entry shifts everything under
   it — so this is a range, not a promise. */
const FIELDS = {
  'wm-93-classic': {
    label: 'EPA West Midlands Spring · 2025',
    div: "Men's 93kg · Classic Raw",
    bombRate: 1 / 18,
    lifters: [
      ['Jacob Rutherford', 86.5, 657.5], ['Benny Cave', 91.8, 642.5],
      ['Abdul Nasir', 92.4, 640.0], ['Jack A. Nightingale', 90.3, 630.0],
      ['Mohammed Khusal', 90.7, 622.5], ['Ryan Bristow', 83.6, 610.0],
      ['Wojciech Herezo', 91.3, 600.0], ['Yat Yin Dung', 88.6, 527.5],
      ['Usman Hussain', 87.2, 505.0], ['Waqar Ali', 83.3, 502.5],
      ['Reece Wootley', 86.6, 500.0], ['Harvir Singh Cheema', 92.5, 480.0],
      ['Rohan Warfield', 90.2, 477.5], ['Mitchell Jones', 90.7, 455.0],
      ['Glenn Cooper', 89.3, 430.0], ['Jarnail Singh Chahal', 85.1, 387.5],
      ['Stephen Porretta', 87.8, 360.0],
    ].map(([name, bw, total]) => ({ name, bw, total })),
  },
};

function fieldForMeet(m) {
  const hay = `${m.name} ${m.wclass || ''} ${m.fed || ''}`.toLowerCase();
  if (/west midlands|spring/.test(hay) && /93/.test(hay + (m.wclass || ''))) return FIELDS['wm-93-classic'];
  return null;
}

function platformPct() { return S.settings.platformPct || 96; }
const half = n => Math.round(n * 2) / 2;

/* Gym maxes aren't platform totals: openers are conservative, thirds get
   missed, and nerves cost kilos. The haircut is a blunt instrument but a
   truthful one — better than comparing a good gym day against competition
   results as though they were the same thing. */
function predictPlacing(field, gymTotal, applyHaircut = true) {
  if (!field || !gymTotal) return null;
  const total = applyHaircut ? half(gymTotal * (platformPct() / 100)) : half(gymTotal);
  const sorted = [...field.lifters].sort((a, b) => b.total - a.total);
  // ties go to the lighter lifter, and at 93kg he's at the top of the class
  const above = sorted.filter(l => l.total >= total);
  const place = above.length + 1;
  const rows = sorted.map((l, i) => ({ ...l, place: i < above.length ? i + 1 : i + 2 }));
  rows.splice(above.length, 0, { name: 'You', bw: null, total, place, me: true });
  const nxt = sorted[above.length - 1];
  return {
    total, place, fieldSize: sorted.length + 1, ladder: rows,
    costNext: nxt ? half(nxt.total + 0.5 - total) : null,
    nextName: nxt ? nxt.name : null,
  };
}

/* Total from the tested singles that existed on a given date, so the placing
   delta tracks real test results rather than needing its own log. */
function testedTotalAsOf(date) {
  const lifts = S.settings.priority;
  let t = 0, found = 0;
  lifts.forEach(n => {
    const hit = testLog().filter(w => w.date <= date)
      .map(w => w.exercises.find(e => e.name === n))
      .find(e => e && e.sets[0] && e.sets[0].w > 0);
    if (hit) { t += hit.sets[0].w; found++; }
  });
  return found === lifts.length ? t : null;
}

function ord(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function priorityStats() {
  const p = S.settings.priority;
  const lifts = p.map(n => ({ name: n, ...bestSingleInfo(n) }));
  const total = lifts.reduce((a, l) => a + l.kg, 0);
  const bw = bodyweightKg();
  return { lifts, total, bw, dots: dots(total, bw, S.settings.sex) };
}

  </div>

  <div class="sechead"><h2>Tests</h2><button class="btn xs" id="logTestBtn">+ Log a test</button></div>
  ${(() => {
      const tl = testLog();
      if (!tl.length) return `<div class="card"><div class="sub">No tested singles yet. Openers fall back to the planned numbers until you log one.</div></div>`;
      return `<div class="card flush">${tl.slice(0, 8).map(t => `
        <div class="ex-row">
          <div class="grow">
            <div class="n">${esc(t.name)}</div>
            <div class="m">${fmtDate(t.date, { month: 'short', day: 'numeric', year: '2-digit' })} · ${relDay(t.date)}${t.notes ? ' · ' + esc(t.notes) : ''}</div>

  ${past.length ? `<div class="sechead"><h2>Past</h2></div>
