  // unit: the header says it, or a unit column per row, or it's a guess
  const wh = (c.weight || '').toLowerCase();
  let unit = /kg/.test(wh) ? 'kg' : /lb/.test(wh) ? 'lb' : null;
  const unitFrom = unit ? 'header' : c.unit ? 'rows' : 'guess';
  let skipped = 0;
  const byKey = new Map();
  const timed = fmt === 'hevy' || fmt === 'strong';
  rows.forEach(r => {
    const raw = String(r[c.exercise] || '').trim();
    const order = c.setOrder ? r[c.setOrder] : '';
    if (/rest/i.test(String(order))) { skipped++; return; }        // Strong's rest-timer rows
    const day = importDay(r[c.date], dmy);
    let w = impNum(r[c.weight]);
    if (c.unit && !unit) { const u = String(r[c.unit] || '').toLowerCase(); if (/lb/.test(u)) w = w / LB_PER_KG; }
    const reps = impNum(r[c.reps]);
    const sec = c.seconds ? (/:/.test(String(r[c.seconds])) ? parseTime(String(r[c.seconds]).trim()) || 0 : impNum(r[c.seconds])) : 0;
    const m = c.distance ? importMetres(r[c.distance], c.distance, c.distUnit ? r[c.distUnit] : '') : 0;
    if (!raw || !day || !(w > 0 || reps > 0 || sec > 0 || m > 0)) { skipped++; return; }
    const name = c.session ? String(r[c.session] || '').trim() : '';
    const stamp = timed ? String(r[c.date]).trim() : day;
    const key = `${stamp}|${name}`;
    if (!byKey.has(key)) {
      const endD = c.end ? new Date(String(r[c.end]).replace(/,/g, '')) : null, startD = new Date(String(r[c.date]).replace(/,/g, ''));
      byKey.set(key, { date: day, key: timed ? `${day}T${stamp.replace(/^.*?(\d{1,2}:\d{2}).*$/, '$1')}${name ? ' ' + name : ''}` : day + (name ? ' ' + name : ''),
        name, mins: c.duration ? importMins(r[c.duration], c.duration)
          : endD && !isNaN(endD) && !isNaN(startD) ? Math.max(0, Math.round((endD - startD) / 60000)) : 0,
        ex: new Map() });
    }
    const s = byKey.get(key);
    if (!s.ex.has(raw)) s.ex.set(raw, { raw, sets: [], secs: 0, notes: [] });
    const e = s.ex.get(raw);
    if (sec > 0) e.secs = Math.max(e.secs, sec);
    const note = c.notes ? String(r[c.notes] || '').trim() : '';
    if (note && !e.notes.includes(note)) e.notes.push(note);
    let st = importSetType(c.setType ? r[c.setType] : '', order);
    let rpe = c.rpe && impNum(r[c.rpe]) > 0 ? impNum(r[c.rpe]) : c.rir && String(r[c.rir]).trim() !== '' ? 10 - impNum(r[c.rir]) : null;
    if (st === 'failure') { st = 'working'; if (rpe == null) rpe = 10; }   // failure is RPE 10, not a role
    e.sets.push({ lb: w, r: reps, sec: sec || null, rpe, st, m: m || null });
  });
  const sessions = [...byKey.values()]
    .map(s => ({ date: s.date, key: s.key, name: s.name, mins: s.mins, exercises: [...s.ex.values()].map(e => ({ ...e, notes: e.notes.join(' · ') })) }))
    .filter(s => s.exercises.length)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.key < b.key ? -1 : 1);
  const all = sessions.flatMap(s => s.exercises.flatMap(e => e.sets));
  if (!unit) unit = c.unit ? 'kg' : guessUnit(all.map(x => x.lb));   // a unit column was converted to kg above
  const names = [...new Set(sessions.flatMap(s => s.exercises.map(e => e.raw)))];
  return { sessions, skipped, unit, unitFrom, names, sets: all.length, src: fmt, label: IMPORT_SOURCES[fmt], dmy, dateAmbiguous };
}

/* Which existing sessions an import would land on. A backfill is the plan's
   prescription and real data supersedes it; a logged session is real too, so
   that one is left alone and the import sits alongside it. */
function importSrcId(src, s) { return `${src || 'liftoff'}:${s.key || s.date}`; }
function importCollisions(sessions, src) {
  const out = { replace: [], alongside: [], already: [] };
  sessions.forEach(s => {
    const srcId = importSrcId(src, s);
    if (S.workouts.some(w => w.srcId === srcId)) { out.already.push(s.date); return; }
    const same = S.workouts.filter(w => w.status === 'completed' && w.date === s.date);
    if (same.some(w => w.source === 'backfill')) out.replace.push(s.date);
    else if (same.length) out.alongside.push(s.date);
  });
  return out;
}

/* mapping: raw name -> Ironlog name. Every raw name must be present. */
/* mapping: raw name -> leafKey, or '' to bring the name in as its own
   exercise. Every session carries the batch's importId, and the batch is
   recorded in S.imports with any backfills it replaced, so it can be taken
   back out whole (removeImport). */
function importLiftoff(sessions, mapping, unit, src = 'liftoff') {
  let added = 0, replaced = 0, skipped = 0;
  const importId = 'imp-' + uid();
  const displaced = [];
  const leafOf = raw => (mapping[raw] && movementById(keyLeaf(mapping[raw]).movement))
    ? keyLeaf(mapping[raw]) : leafForName(raw);
  sessions.forEach(s => {
    const srcId = importSrcId(src, s);
    if (S.workouts.some(w => w.srcId === srcId)) { skipped++; return; }

    const built = s.exercises.map(e => {
      const leaf = leafOf(e.raw);
      const metric = metricFor(leaf);
      const asIso = e.secs > 0 && metric === 'reps_weight' && e.sets.every(x => x.sec > 0);
      return {
        leaf,
        legacyName: e.raw,
        mods: [],
        /* The duration used to survive only as the note "60 s hold" — prose,
           not data, so an imported plank could never be charted or beaten. It
           is now a field. Seconds on a rep-based movement are an isometric
           hold when every set carries them: that entry comes in as `iso`, with
           the time on each set and no reps. Mixed sets keep the note — there
           the seconds may be a rest or a tempo rather than the set itself. */
        ...(asIso ? { iso: true } : {}),
        notes: [e.notes, e.secs && metric === 'reps_weight' && !asIso ? `${e.secs} s hold` : ''].filter(Boolean).join(' · '),
        sets: e.sets.map(x => ({
          w: toKgFrom(x.lb, unit), r: asIso || (metric !== 'reps_weight' && !(x.r > 0)) || metric === 'carry' || metric === 'race' ? null : x.r, sec: x.sec, rpe: x.rpe, done: true,
          setType: x.st || 'working', ...(x.m ? { m: Math.round(importDist(x.m, metric) * 10) / 10 } : {}),
        })),
      };
    });
    /* Two raw names can map onto one Ironlog name, and an exercise done in two
       blocks arrives twice — fold both into one entry, keeping set order. */
    const merged = [];
    built.forEach(e => {
      const prev = merged.find(m => exKey(m) === exKey(e));   // a hold never folds into rep sets
      if (prev) { prev.sets.push(...e.sets); if (!prev.notes) prev.notes = e.notes; }
      else merged.push(e);
    });

    const before = S.workouts.length;
    S.workouts = S.workouts.filter(w => {
      const hit = w.status === 'completed' && w.date === s.date && w.source === 'backfill';
      if (hit) displaced.push(w);
      return !hit;
    });
    replaced += before - S.workouts.length;

    S.workouts.push({
      id: uid(), date: s.date, name: s.name || `${IMPORT_SOURCES[src] || 'CSV'} import`, status: 'completed',
      source: 'imported', srcId, importId,
      exercises: merged,
      start: null, end: parseISO(s.date).getTime(),
      summary: {
        mins: s.mins, prs: [],
        volume: merged.reduce((t, e) => t + e.sets.reduce((x, v) => x + v.w * v.r, 0), 0),
      },
    });
    added++;
  });

  // remember the mapping so a second import of the same file doesn't ask again
  Object.entries(mapping).forEach(([raw, key]) => {
    if (key) S.exAliases[raw] = 'leaf:' + key; else delete S.exAliases[raw];
  });
  if (added) {
    S.imports = S.imports || [];
    S.imports.push({ id: importId, source: src, at: Date.now(), sessions: added, replaced: displaced });
  }
  S.workouts.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  save(); bust();
  return { added, replaced, skipped, importId };
}


/* Take imported sessions back out. With an id, that batch; without, every
   Liftoff session (imports before 0.22.1 carry no batch id). Backfills the batch
   replaced are put back. Custom movements nothing uses any more go too, and so
   do aliases that would steer the next import wrong — including the
   "[object Object]" ones the 0.22 review screen saved. */
function liftoffImported(id) {   // every app's imports, not only Liftoff's (the name predates B8)
  return S.workouts.filter(w => w.source === 'imported' && Object.keys(IMPORT_SOURCES).some(k => String(w.srcId || '').startsWith(k + ':'))
    && (!id || w.importId === id));
}
function removeImports(id) {
  const gone = new Set(liftoffImported(id).map(w => w.id));
  S.workouts = S.workouts.filter(w => !gone.has(w.id));
  const batches = (S.imports || []).filter(b => !id || b.id === id);
  batches.forEach(b => (b.replaced || []).forEach(w => { if (!S.workouts.some(x => x.id === w.id)) S.workouts.push(w); }));
  S.imports = (S.imports || []).filter(b => !batches.includes(b));
  // name-valued aliases are pre-0.22.1 and lossy; the matcher does better now
  Object.keys(S.exAliases || {}).forEach(k => { if (!String(S.exAliases[k]).startsWith('leaf:')) delete S.exAliases[k]; });
  pruneCustomMovements();
  S.workouts.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  save(); bust();
  return gone.size;
}
function pruneCustomMovements() {
  const used = new Set();
  const mark = e => { if (e && e.leaf) used.add(e.leaf.movement); };
  S.workouts.forEach(w => (w.exercises || []).forEach(mark));
  if (S.active) (S.active.exercises || []).forEach(mark);
  (S.settings.priority || []).forEach(p => { if (p && p.leaf) used.add(p.leaf.movement); });
  (S.goals || []).forEach(g => { if (g.exercise) used.add(keyLeaf(g.exercise).movement); });
  const before = (S.customMovements || []).length;
  S.customMovements = (S.customMovements || []).filter(m => used.has(m.id));
  if (S.customMovements.length !== before) bustCatalogue();
  Object.keys(S.exAliases || {}).forEach(k => {
    const v = String(S.exAliases[k]);
    if (v.startsWith('leaf:') && !movementById(keyLeaf(v.slice(5)).movement)) delete S.exAliases[k];
  });
}
function openRemoveImport() {
  const all = liftoffImported();
  if (!all.length) return toast('No imported sessions to remove');
  const last = (S.imports || []).slice(-1)[0];
  const lastN = last ? liftoffImported(last.id).length : 0;
  const span = `${all[0].date} → ${all[all.length - 1].date}`;
  modal({
    title: 'Remove imported sessions',
    body: `<div class="sub" style="margin-bottom:10px">${all.length} imported session${all.length === 1 ? '' : 's'} (${esc(span)}).
      Sessions you logged in Ironlog are never touched. Backfills an import replaced come back.</div>
      ${last && lastN && lastN !== all.length ? `<button class="btn wide" id="riLast" style="margin-bottom:8px">Remove the last import (${lastN})</button>` : ''}
      <button class="btn wide danger" id="riAll">Remove all ${all.length} imported sessions</button>`,
    foot: `<button class="btn ghost" data-close>Cancel</button>`,
    onOpen: bg => {
      const go2 = id => { const n = removeImports(id); closeAllModals(); render(); toast(`${n} imported session${n === 1 ? '' : 's'} removed`, 'green'); };
      const l = $('#riLast', bg); if (l) l.onclick = () => go2(last.id);
      $('#riAll', bg).onclick = () => go2(null);
    },
  });
}

/* ---------------- CSV import UI ----------------
   Two steps, because an import that guesses silently is worse than one that
   asks. Preview confirms what was read (and the unit, which is inferred);
   review confirms every exercise name that didn't match exactly. Doing nothing
   on the review screen is the safe outcome — unmatched names come in under
   their own name rather than being folded into an existing lift. */

function openLiftoffImport(text, opt = {}) {   // any supported app's CSV (B8); the name predates it
  let p;
  try { p = parseImport(text, opt); }
  catch (e) { return toast('That CSV isn\'t one Ironlog can read — it needs date, exercise and weight or reps columns'); }
  if (!p.sessions.length) return toast('No sessions found in that file');

  let unit = p.unit;
  const col = importCollisions(p.sessions, p.src);
  const span = p.sessions.length === 1
    ? p.sessions[0].date
    : `${p.sessions[0].date} → ${p.sessions[p.sessions.length - 1].date}`;

  const notes = [];
  if (col.replace.length) notes.push(`${col.replace.length} date${col.replace.length === 1 ? '' : 's'} already hold a backfilled session — the imported data replaces it`);
  if (col.alongside.length) notes.push(`${col.alongside.length} date${col.alongside.length === 1 ? '' : 's'} already hold a logged session — the import lands alongside it`);
  if (col.already.length) notes.push(`${col.already.length} session${col.already.length === 1 ? '' : 's'} already imported from this file — skipped`);
  if (p.skipped) notes.push(`${p.skipped} empty or rest-timer row${p.skipped === 1 ? '' : 's'} ignored`);

  modal({
    title: `Import from ${p.label}`,
    body: `
      <div class="sub" style="margin-bottom:10px">
        <b>${p.sessions.length}</b> session${p.sessions.length === 1 ? '' : 's'} ·
        <b>${p.sets}</b> sets · ${esc(span)}
      </div>
      ${p.dateAmbiguous ? `<div class="field"><label>Dates in this file are</label>
        <div class="seg" id="liDmy">
          <button data-dmy="1" class="${p.dmy ? 'on' : ''}">Day / month</button>
          <button data-dmy="0" class="${p.dmy ? '' : 'on'}">Month / day</button>
        </div></div>` : ''}
      <div class="field"><label>Weights in this file are</label>
        <div class="seg" id="liUnit">
          <button data-lu="lb" class="${unit === 'lb' ? 'on' : ''}">Pounds</button>
          <button data-lu="kg" class="${unit === 'kg' ? 'on' : ''}">Kilograms</button>
        </div>
        <div class="sub" id="liUnitEg" style="margin-top:4px"></div>
      </div>
      ${notes.length ? `<div class="hr"></div><div class="sub">${notes.map(n => `• ${esc(n)}`).join('<br>')}</div>` : ''}
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="liNext">Next</button>`,
    onOpen: bg => {
      const eg = $('#liUnitEg', bg);
      const sample = (p.sessions.flatMap(s => s.exercises.flatMap(e => e.sets)).find(x => x.lb > 0) || { lb: 0 }).lb;
      const from = p.unitFrom === 'header' ? ' — the file says so' : p.unitFrom === 'rows' ? ' — converted row by row from the file\'s unit column' : '';
      const showEg = () => { eg.textContent = `e.g. ${nice(sample)} reads as ${nice(toKgFrom(sample, unit))} kg${unit === p.unit ? from : ''}`; };
      showEg();
      bg.querySelectorAll('#liUnit button').forEach(b => b.onclick = () => {
        unit = b.dataset.lu;
        bg.querySelectorAll('#liUnit button').forEach(x => x.classList.toggle('on', x === b));
        showEg();
      });
      bg.querySelectorAll('#liDmy button').forEach(b => b.onclick = () => { closeModal(); openLiftoffImport(text, { dmy: b.dataset.dmy === '1' }); });
      $('#liNext', bg).onclick = () => { closeModal(); reviewLiftoffNames(p, unit); };
    },
  });
}

/* Every name is listed with where it will land, so a wrong auto-match is as
   easy to fix as a miss. Misses and guesses first. mapping[raw] is a leafKey,
   or '' for "bring it in as its own exercise". */
function reviewLiftoffNames(p, unit) {
  const rows = p.names.map(raw => {
    const m = matchExercise(raw);
    return { raw, how: m.how, key: m.leaf ? leafKey(m.leaf) : '', suggest: m.suggest ? leafKey(m.suggest) : '' };
  });
  const need = r => r.how === 'new' || r.how === 'guess';
  rows.sort((a, b) => (need(b) ? 1 : 0) - (need(a) ? 1 : 0) || a.raw.localeCompare(b.raw));
  const HOW = { alias: 'as before', exact: 'matched', parsed: 'matched', guess: 'best guess — check', new: 'new exercise', picked: 'your pick' };
  const target = r => r.key ? fullName(keyLeaf(r.key)) : `New: ${r.raw}`;
  const draw = () => {
    const n = rows.filter(need).length;
    return `
      <div class="sub" style="margin-bottom:10px">
        ${rows.length - n} of ${rows.length} names matched. ${n ? `${n} need a look — a new exercise keeps its own records; picking one moves the sets onto that lift's PRs.` : 'Check the list, then import.'}
      </div>
      <div class="picklist">${rows.map((r, i) => `
        <div class="pickitem" style="display:block;padding:9px 14px">
          <div class="row between" style="gap:8px;align-items:center">
            <div class="grow" style="min-width:0">
              <div class="n">${esc(r.raw)}</div>
              <div class="m" style="${need(r) ? 'color:var(--gold)' : ''}">→ ${esc(target(r))} · ${HOW[r.how] || ''}</div>
            </div>
            <button class="btn xs ghost" data-lipick="${i}">Change</button>
          </div>
          ${!r.key && r.suggest ? `<button class="btn xs" data-lisug="${i}" style="margin-top:6px">Use ${esc(fullName(keyLeaf(r.suggest)))}</button>` : ''}
          ${r.key && r.how !== 'new' ? `<button class="btn xs ghost" data-linew="${i}" style="margin-top:6px">Keep as its own exercise</button>` : ''}
        </div>`).join('')}</div>`;
  };
  modal({
    wide: true,
    title: 'Match exercises',
    body: draw(),
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="liGo">Import</button>`,
    onOpen: bg => {
      const redraw = () => { const b = $('.modal-body', bg); if (b) { const y = b.scrollTop; b.innerHTML = draw(); bind(); b.scrollTop = y; } };
      const bind = () => {
        bg.querySelectorAll('[data-lipick]').forEach(b => b.onclick = () => {
          const r = rows[+b.dataset.lipick];
          // the picker hands back a leaf — keep its key, not a name
          pickExercise(leaf => { r.key = leafKey(leaf); r.how = 'picked'; redraw(); });
        });
        bg.querySelectorAll('[data-lisug]').forEach(b => b.onclick = () => {
          const r = rows[+b.dataset.lisug]; r.key = r.suggest; r.how = 'picked'; redraw();
        });
        bg.querySelectorAll('[data-linew]').forEach(b => b.onclick = () => {
          const r = rows[+b.dataset.linew]; r.key = ''; r.how = 'new'; redraw();
        });
      };
      bind();
      $('#liGo', bg).onclick = () => {
        const mapping = {};
        rows.forEach(r => { mapping[r.raw] = r.key; });
        const auto = rows.filter(r => r.key && r.how !== 'picked').length;
        const merged = rows.filter(r => r.how === 'picked').length;
        closeModal();
        confirmLiftoffImport(p, mapping, unit, auto, merged);
      };
    },
  });
}

/* The dry run: everything the import would do, counted, before anything is
   written. Nothing changes until Import is tapped, and the batch can be taken
   back out whole from Settings. */
function importPlan(p, mapping) {
  const col = importCollisions(p.sessions, p.src);
  const skip = new Set(col.already);
  const add = p.sessions.filter(s => !S.workouts.some(w => w.srcId === importSrcId(p.src, s)));
  const sets = add.flatMap(s => s.exercises.flatMap(e => e.sets));
  const names = p.names;
  return {
    col, add, sets: sets.length, skip: skip.size,
    warm: sets.filter(x => x.st === 'warmup').length, drop: sets.filter(x => x.st === 'drop').length,
    dist: sets.filter(x => x.m).length,
    matched: names.filter(n => mapping[n]).length, fresh: names.filter(n => !mapping[n]),
  };
}
function confirmLiftoffImport(p, mapping, unit, auto, merged) {
  const P = importPlan(p, mapping);
  if (!P.add.length) return toast('Everything in this file is already imported');
  const span = `${P.add[0].date} → ${P.add[P.add.length - 1].date}`;
  const li = (b, s) => `<div class="exline"><span>${b}</span><span class="mono">${s}</span></div>`;
  modal({
    title: 'Before importing',
    body: `<div class="sub" style="margin-bottom:10px">Nothing has been written yet. This is what the import will do:</div>
      <div class="card tight">
        ${li('Sessions added', `${P.add.length} · ${esc(span)}`)}
        ${li('Sets', P.sets)}
        ${P.warm ? li('Warm-ups (kept out of PRs)', P.warm) : ''}
        ${P.drop ? li('Drop sets', P.drop) : ''}
        ${P.dist ? li('Sets with a distance', P.dist) : ''}
        ${li('Weights read as', unit === 'lb' ? 'pounds → kg' : 'kilograms')}
        ${P.col.replace.length ? li('Backfilled sessions replaced', P.col.replace.length) : ''}
        ${P.col.alongside.length ? li('Days that already have a session', `${P.col.alongside.length} · added alongside`) : ''}
        ${P.skip ? li('Already imported, skipped', P.skip) : ''}
        ${li('Exercise names', `${P.matched} matched${merged ? ` (${merged} by you)` : ''} · ${P.fresh.length} new`)}
      </div>
      ${P.fresh.length ? `<div class="sub" style="margin-top:8px">New exercises: ${esc(P.fresh.slice(0, 8).join(', '))}${P.fresh.length > 8 ? ` and ${P.fresh.length - 8} more` : ''}.</div>` : ''}
      <div class="sub" style="margin-top:8px">Imported sessions are real training history and count toward your PRs. Settings → Remove imported sessions takes this batch back out.</div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="impGo">Import</button>`,
    onOpen: bg => {
      $('#impGo', bg).onclick = () => {
        const r = importLiftoff(p.sessions, mapping, unit, p.src);
        closeAllModals(); render();
        const bits = [`${r.added} session${r.added === 1 ? '' : 's'} imported`];
        if (r.replaced) bits.push(`${r.replaced} backfill replaced`);
        if (r.skipped) bits.push(`${r.skipped} already there`);
        toast(bits.join(' · '), 'green');
        autoSync();
      };
    },
  });
}

/* ---------------- profile ----------------
   Who is lifting, kept apart from how the gym is set up. Sex and bodyweight
   were already here doing real work, buried three screens into Settings between
   plate inventory and API keys; this gives them somewhere to live and adds the
   few fields that make the rest derivable.

   Bodyweight is shown, not owned. It comes from the latest check-in, and the
   box edits the fallback used until you check in — the same rule bodyweightKg()
   has always applied, said out loud. */
/* ---------------- velocity (Slew) ----------------
   Slew measures bar speed from the phone strapped to the bar: acceleration is
   double-integrated to displacement, reps are segmented from that signal, and
   effort is read from how much the bar SLOWS DOWN across the set rather than
   from absolute speed against a population table. Its engine ships here whole
   (slew-core.js) rather than reimplemented, so the numbers are the ones its
   65 tests cover.

   Ironlog's job is the join: which velocity profile a leaf uses, where the
   result is stored, and what is shown. */

/* Slew's nine profiles are VELOCITY-PROFILE BUCKETS, not exercises — "Row /
   pulldown" and "Machine (stack)" each cover a great many Ironlog leaves. So
   the mapping only ever runs leaf -> profile, never back, and anything with no
   sensible bucket gets measured without an effort estimate rather than being
   forced into the nearest profile. A wrong velocity profile produces a
   confident wrong RPE, which is worse than no RPE. */
const SLEW_LIFT = [
  [l => l.movement === 'goblet-squat', 'Goblet squat'],
  [l => /squat/.test(l.movement) && l.equipment === 'smith', 'Squat (Smith)'],
  [l => /^(back-squat|front-squat|box-squat|pause-squat|safety-bar-squat)$/.test(l.movement), 'Squat (free bar)'],
  [l => /bench-press|larsen-press/.test(l.movement), 'Bench press'],
  [l => /deadlift/.test(l.movement) && l.equipment === 'trap_bar', 'Deadlift (trap)'],
  [l => /deadlift|rack-pull/.test(l.movement), 'Deadlift (conv.)'],
  [l => /overhead-press|push-press|shoulder-press/.test(l.movement), 'Overhead press'],
  [l => /row|pulldown|pull-up|chin-up/.test(l.movement), 'Row / pulldown'],
  [l => l.equipment === 'machine' || l.equipment === 'plate_loaded_machine' || l.equipment === 'cable', 'Machine (stack)'],
];
function slewLiftFor(leaf) {
  if (!leaf || !window.Slew) return null;
  for (const [test, id] of SLEW_LIFT) { try { if (test(leaf)) return id; } catch (e) { /* keep looking */ } }
  return null;
}

/* Per-lift profiles live in settings so calibration survives. They start as
   Slew's population defaults and are replaced by measured ones: when a set is
   taken to failure the lifter's true 0-RIR velocity is observed, and from then
   on their RIR stops depending on any assumed constant. */
function slewProfile(liftId) {
  const all = S.settings.slewProfiles || {};
  const stored = all[liftId];
  const base = Slew.defaultProfile(liftId);
  const p = stored ? { ...base, ...stored } : base;
  /* Fatigue scalar only (D1): a lift with no personal vlF borrows the lifter's
     personal/population ratio from the lifts that have one. MVT and the
     load-velocity line never transfer — they're too lift-specific. */
  if (!(stored && stored.vlFCal)) {
    const ratios = Object.entries(all).filter(([id, s]) => id !== liftId && s.vlFCal && s.vlF > 0 && Slew.DEFAULT_PROFILES[id])
      .map(([id, s]) => s.vlF / Slew.DEFAULT_PROFILES[id].vlF);
    if (ratios.length) { p.vlF = +(base.vlF * ratios.reduce((a, b) => a + b, 0) / ratios.length).toFixed(3); p.vlFFrom = 'other lifts'; }
  }
  return p;
}
/* The minimum velocity threshold in use: the population prior shrunk toward
   what this lifter has actually failed at — (3·prior + Σobs) / (3 + n), so
   one odd set can't move it far. Written back as v0Observed so Slew's own
   estimator reads the same number. */
const MVT_PRIOR_WEIGHT = 3;
function mvtFor(liftId) {
  const s = (S.settings.slewProfiles || {})[liftId] || {};
  const prior = Slew.defaultProfile(liftId).v0;
  const obs = (s.v0Obs || []).map(o => o.v).filter(v => v > 0);
  if (!obs.length) return s.v0Observed > 0 ? s.v0Observed : prior;   // before D1: one stored observation
  return (MVT_PRIOR_WEIGHT * prior + obs.reduce((a, b) => a + b, 0)) / (MVT_PRIOR_WEIGHT + obs.length);
}
function addMvtObservation(liftId, v) {
  const s = (S.settings.slewProfiles || {})[liftId] || {};
  const obs = [...(s.v0Obs || []), ...(s.v0Observed > 0 && !(s.v0Obs || []).length ? [{ v: s.v0Observed, at: s.v0ObservedAt || 0 }] : []), { v, at: Date.now() }].slice(-10);
  saveSlewProfile(liftId, { v0Obs: obs });
  saveSlewProfile(liftId, { v0Observed: +mvtFor(liftId).toFixed(3), v0ObservedAt: Date.now() });
}
function saveSlewProfile(liftId, patch) {
  S.settings.slewProfiles = S.settings.slewProfiles || {};
  S.settings.slewProfiles[liftId] = { ...(S.settings.slewProfiles[liftId] || {}), ...patch };
  save();
}

function vbtAvailable() {
  return !!window.Slew && typeof DeviceMotionEvent !== 'undefined';
}

/* What gets stored on the set. Scalars only — never the samples. A three
   minute set at 60 Hz is ~10,800 of them, and the whole of Ironlog lives in one
   IndexedDB blob that is rewritten on every save. */
function packVbt(rec, est, liftId, place) {
  return {
    at: rec.timestamp,
    lift: liftId,
    mode: rec.provenance.mode,
    place: place || 'bar',
    rate: Math.round(rec.provenance.sourceRate || 0),
    best: +rec.summary.bestMeanVelocity.toFixed(3),
    loss: +rec.summary.velocityLoss.toFixed(1),
    conf: +(rec.summary.confidence * (place === 'pocket' ? 0.6 : 1)).toFixed(2),   // a phone in a pocket reads the body, not the bar
    reps: rec.reps.map(r => ({
      v: +r.concentric.meanVelocity.toFixed(3),
      peak: +r.concentric.peakVelocity.toFixed(3),
      rom: +r.rom.toFixed(3),
      rpe: r.rpe == null ? null : +r.rpe.toFixed(1),
      conf: +r.quality.confidence.toFixed(2),
      flags: r.quality.flags || [],
    })),
    est: est ? {
      rpe: +est.rpe.toFixed(1), rir: +est.rir.toFixed(1), method: est.method,
      spread: +est.spread.toFixed(1), because: est.because, romCut: !!est.romCut,
    } : null,
  };
}

/* Recording a set. Live readout while it runs, because the one thing that
   ruins a sensor set is finding out afterwards that the phone was not reporting
   — the sample counter and the still/moving light make that visible in the
   first second rather than at the end. */
let vbtCapture = null;

function openVbtRecord(ei, opts = {}) {
  const a = S.active;
  const ex = a && a.exercises[ei];
  if (!ex) return;
  if (!vbtAvailable()) return toast('This device exposes no motion sensor');
  /* Two modes per exercise (D1): this set's effort, or a warm-up profile point.
     A calibration step (opts.onRecorded) takes the recording straight back. */
  let mode = opts.onRecorded ? 'calib' : (ex.vbtMode || 'set');
  let place = ex.vbtPlace || (['machine', 'plate_loaded_machine', 'cable'].includes(ex.leaf && ex.leaf.equipment) ? 'pocket' : 'bar');

  const liftId = slewLiftFor(ex.leaf);
  /* No bucket: still measure, but say plainly that effort will not be
     estimated. Segmentation needs a minimum travel, so borrow the shallowest
     one rather than inventing a velocity model. */
  const profile = liftId ? slewProfile(liftId) : { ...Slew.defaultProfile('Machine (stack)'), v0: 0 };
  const load = ex.sets.filter(s => s.w > 0).slice(-1)[0];
  const loadKg = load ? load.w : 0;

  modal({
    title: opts.title || `Measure — ${esc(exName(ex))}`,
    body: `${mode === 'calib' ? '' : `<div class="seg" id="vbMode" style="margin-bottom:8px" role="group" aria-label="What to measure">
        <button data-vm="set" class="${mode === 'set' ? 'on' : ''}">This set (effort)</button>
        <button data-vm="profile" class="${mode === 'profile' ? 'on' : ''}">Warm-up profile</button></div>`}
      <div class="seg" id="vbPlace" style="margin-bottom:8px" role="group" aria-label="Where the phone is">
        <button data-vp="bar" class="${place === 'bar' ? 'on' : ''}">On the bar</button>
        <button data-vp="pocket" class="${place === 'pocket' ? 'on' : ''}">In a pocket</button></div>
      ${opts.note ? `<div class="sub" style="margin-bottom:6px">${opts.note}</div>` : ''}
      <div class="sub" style="margin-top:0" id="vbHow">${mode === 'profile' ? 'Warm-up profile: 1–2 fast reps at this warm-up weight. Each warm-up adds a point; three or more give today\'s e1RM.' : 'Strap the phone to the bar, or put it in a pocket for a machine. Start it, do the set, stop it.'}${place === 'pocket' ? ' <b>Pocket readings are rougher</b> — they never calibrate your profile.' : ''}</div>
      ${liftId
      ? `<div class="chip" style="margin:10px 0">${esc(liftId)}${(S.settings.slewProfiles || {})[liftId] && (S.settings.slewProfiles || {})[liftId].v0Observed ? ' · calibrated' : ' · population profile'}</div>`
      : `<div class="chip" style="margin:10px 0">No velocity profile for this movement — speed and reps only, no effort estimate</div>`}
      <div class="stats grid3" style="margin:10px 0">
        <div class="stat"><div class="k">Samples</div><div class="v" id="vbN">0</div></div>
        <div class="stat"><div class="k">Rate</div><div class="v" id="vbHz">—<small>Hz</small></div></div>
        <div class="stat"><div class="k">Bar</div><div class="v" id="vbStill" style="font-size:15px">—</div></div>
      </div>
      <div class="sub" id="vbMsg">Not started.</div>`,
    foot: `<button class="btn ghost" id="vbCancel">Cancel</button><button class="btn primary" id="vbGo">Start</button>`,
    onOpen(bg) {
      let running = false;
      const setMsg = t => { const el = $('#vbMsg', bg); if (el) el.textContent = t; };
      const segs = (sel, attr, set) => bg.querySelectorAll(`${sel} button`).forEach(b => b.onclick = () => {
        if (running) return;
        bg.querySelectorAll(`${sel} button`).forEach(x => x.classList.toggle('on', x === b)); set(b.dataset[attr]);
      });
      segs('#vbMode', 'vm', m => { mode = m; ex.vbtMode = m; save(); });
      segs('#vbPlace', 'vp', p => { place = p; ex.vbtPlace = p; save(); });
      const stopCapture = () => { if (vbtCapture) { try { vbtCapture.stop(); } catch (e) {} } running = false; };

      $('#vbCancel', bg).onclick = () => { stopCapture(); vbtCapture = null; closeModal(); };

      $('#vbGo', bg).onclick = async () => {
        const btn = $('#vbGo', bg);
        if (!running) {
          const perm = await Slew.MotionCapture.requestPermission();
          if (!perm.granted) { setMsg(perm.reason || 'Motion access denied.'); return; }
          vbtCapture = new Slew.MotionCapture(
            { ...Slew.DEFAULT_MOTION_CONFIG },
            st => {
              const n = $('#vbN', bg), h = $('#vbHz', bg), s = $('#vbStill', bg);
              if (!n) return;                       // modal closed mid-set
              n.textContent = st.samples;
              h.innerHTML = `${st.hz.toFixed(0)}<small>Hz</small>`;
              s.textContent = st.still ? 'still' : 'moving';
              s.style.color = st.still ? 'var(--dim2)' : 'var(--gold)';
            },
            msg => { setMsg(msg); running = false; btn.textContent = 'Start'; },
          );
          vbtCapture.start();
          running = true;
          btn.textContent = 'Stop';
          btn.classList.add('danger');
          setMsg('Recording. Do the set, then stop.');
          return;
        }

        stopCapture();
        btn.textContent = 'Start';
        btn.classList.remove('danger');
        const motion = vbtCapture ? vbtCapture.samples.slice() : [];
        if (motion.length < 40) { setMsg(`Only ${motion.length} samples — the sensor reported almost nothing.`); return; }

        /* Follows sensorPipeline exactly, but keeps the failure evidence so the
           set estimate can use an observed failure rather than extrapolating. */
        const samples = Slew.integrateMotion(motion);
        const scaled = samples.map(s => ({ ...s, x: s.x * (profile.scale || 1) }));
        const out = Slew.analyse(scaled, {
          targetHz: 60, minRom: profile.minRom,
          ...(loadKg > 0 ? { loadKg } : {}),
        });
        const reps = liftId ? Slew.withRpe(out.reps, profile) : out.reps;
        const est = liftId ? Slew.estimateSet(reps, profile, out.failure) : null;
        const rate = motion.length > 1
          ? (motion.length - 1) / ((motion[motion.length - 1].t - motion[0].t) / 1000 || 1) : 0;
        const rec = {
          timestamp: Date.now(), reps, summary: out.summary,
          provenance: { mode: 'sensor', sampleRate: 60, sourceRate: rate },
        };
        vbtCapture = null;
        closeModal();
        const packed = packVbt(rec, est, liftId, place);
        if (opts.onRecorded) return opts.onRecorded(packed, est, out.failure);
        if (mode === 'profile') return lvRecorded(ei, packed);
        vbtReviewDlg(ei, packed, est, out.failure);
      };
    },
  });
}

/* Review before it is attached to anything. The rep table is the whole point:
   a number you cannot see the reps behind is one you cannot sanity-check. */
function vbtReviewDlg(ei, v, est, failure) {
  const ex = S.active && S.active.exercises[ei];
  if (!ex) return;
  const rows = v.reps.map((r, i) => `<div class="row between" style="padding:3px 0;font-size:13px">
      <span class="sub" style="width:44px">Set rep ${i + 1}</span>
      <span class="mono grow">${r.v.toFixed(2)} m/s <span class="dimmer">peak ${r.peak.toFixed(2)} · ${(r.rom * 100).toFixed(0)} cm</span></span>
      <span class="mono sub">${r.rpe == null ? '' : 'RIR ' + rpeToRir(r.rpe)}</span>
    </div>`).join('');

  modal({
    title: v.reps.length ? `${v.reps.length} rep${v.reps.length === 1 ? '' : 's'} measured` : 'No reps found',
    body: v.reps.length ? `
      <div class="stats grid3" style="margin-bottom:10px">
        <div class="stat"><div class="k">Best</div><div class="v">${v.best.toFixed(2)}<small>m/s</small></div></div>
        <div class="stat"><div class="k">Velocity loss</div><div class="v" style="color:${v.loss >= 25 ? 'var(--gold)' : 'var(--text)'}">${v.loss.toFixed(0)}<small>%</small></div></div>
        <div class="stat"><div class="k">Effort</div><div class="v" style="color:var(--purple)">${v.est ? 'RIR ' + rpeToRir(v.est.rpe) : '—'}</div></div>
      </div>
      ${rows}
      ${v.est ? `<div class="sub" style="margin-top:9px">${esc(v.est.because)}${v.est.spread ? ` <span class="dimmer">±${v.est.spread} RIR</span>` : ''}</div>` : `<div class="sub" style="margin-top:9px">Speed and reps only — this movement has no velocity profile, so effort is not estimated.</div>`}
      ${failure && failure.failedAttempt ? `<div class="chip gold" style="margin-top:9px">A missed rep was detected and left out of the count</div>` : ''}
      <div class="sub" style="margin-top:9px">${v.rate} Hz · confidence ${(v.conf * 100).toFixed(0)}%${v.reps.some(r => r.flags.length) ? ' · ' + [...new Set(v.reps.flatMap(r => r.flags))].join(', ') : ''}</div>`
      : `<div class="empty">No reps came out of that recording. The bar has to travel at least ${Math.round((Slew.defaultProfile('Machine (stack)').minRom) * 100)} cm and come to rest between reps.</div>`,
    foot: `<button class="btn ghost" data-close>Discard</button>${v.reps.length ? `<button class="btn primary" id="vbAttach">Attach to this exercise</button>` : ''}`,
    onOpen(bg) {
      const at = $('#vbAttach', bg);
      if (!at) return;
      at.onclick = () => {
        attachVbt(ei, v, est);
        closeModal();
      };
    },
  });
}

/* Attach measured reps to the exercise. The sensor counted the reps, so it
   fills any set that has none rather than making the lifter retype what was
   just measured — but it never overwrites a rep count already entered. */
function attachVbt(ei, v, est) {
  const ex = S.active.exercises[ei];
  let target = ex.sets.findIndex(s => !s.done && !s.vbt);
  if (target < 0) {
    const last = ex.sets[ex.sets.length - 1] || { w: 0, r: 0 };
    ex.sets.push({ w: last.w, r: 0, sec: null, rpe: null, done: false, setType: 'working' });
    target = ex.sets.length - 1;
  }
  const s = ex.sets[target];
  s.vbt = v;
  if (!s.r) s.r = v.reps.length;
  if (s.rpe == null && v.est) s.rpe = Math.round(v.est.rpe * 2) / 2;

  /* Calibration by observation: a set taken to failure measures this lifter's
     own 0-RIR velocity, and every later estimate stops leaning on a population
     constant. This is the reason the profile is stored at all. */
  if (est && est.measuredV0 && v.lift && v.place !== 'pocket') {   // pocket sets never calibrate (D1)
    addMvtObservation(v.lift, est.measuredV0);
    toast(`Calibrated ${v.lift} — failure speed ${est.measuredV0.toFixed(2)} m/s, limit now ${mvtFor(v.lift).toFixed(2)} m/s`, 'gold');
  } else {
    toast(`Set ${target + 1} measured — ${v.best.toFixed(2)} m/s`, 'green');
  }
  save(); bust(); render();
}

/* ============================================================
   VBT PROFILE — roadmap D1, r&d/specs/vbt-overhaul-spec.md
   Profile mode: each measured warm-up is a (load, best-rep speed) point; a
   straight line through them meets the lift's minimum velocity threshold at
   the day's e1RM, shown as a range because a phone is not a transducer.
   Pocket readings are shown but never fitted.
   ============================================================ */
function lvFit(points) {
  const pts = (points || []).filter(p => p.place !== 'pocket' && p.kg > 0 && p.v > 0);
  if (pts.length < 3) return null;
  const kgs = pts.map(p => p.kg), maxKg = Math.max(...kgs), minKg = Math.min(...kgs);
  if ((maxKg - minKg) / maxKg < 0.15) return null;   // too narrow a ramp to draw a line through
  const n = pts.length, mx = kgs.reduce((a, b) => a + b, 0) / n, my = pts.reduce((a, p) => a + p.v, 0) / n;
  let sxy = 0, sxx = 0;
  pts.forEach(p => { sxy += (p.kg - mx) * (p.v - my); sxx += (p.kg - mx) ** 2; });
  const b = sxy / sxx, a = my - b * mx;
  if (!(b < 0)) return null;                          // faster as it gets heavier: a bad recording
  const rse = n > 2 ? Math.sqrt(pts.reduce((s, p) => s + (p.v - (a + b * p.kg)) ** 2, 0) / (n - 2)) : 0;
  return { a, b, n, rse, heavy: maxKg, light: minKg };
}
/* The day's e1RM for an entry: where today's line meets the MVT, as a range. */
function lvDay(e) {
  const f = lvFit(e && e.lvp && e.lvp.points);
  const liftId = e && e.leaf ? slewLiftFor(e.leaf) : null;
  if (!f || !liftId) return null;
  const mvt = mvtFor(liftId);
  const mid = (mvt - f.a) / f.b;
  if (!(mid > f.heavy)) return null;                  // the line says the heaviest warm-up was already a max: not believable
  const pctHeavy = f.heavy / mid * 100;
  const half = 4 + (f.rse / Math.abs(f.b)) / mid * 100 + Math.max(0, 80 - pctHeavy) * 0.5;
  return { mid, lo: mid * (1 - half / 100), hi: mid * (1 + half / 100), half, pctHeavy, mvt, fit: f, liftId };
}
/* Against the stored profile: speed at today's heaviest warm-up, today vs usual. */
function lvReadiness(e) {
  const d = lvDay(e);
  const stored = (S.settings.lvProfiles || {})[exKey(e)];
  if (!d || !stored) return null;
  const vs = stored.a + stored.b * d.fit.heavy, vt = d.fit.a + d.fit.b * d.fit.heavy;
  if (!(vs > 0)) return null;
  const diff = (vt - vs) / vs * 100;
  return { diff, word: diff > 5 ? 'faster than usual' : diff < -5 ? 'slower than usual' : 'normal', storedE1: stored.e1 || null };
}
/* Today's working weight from the middle of the range, at the first open working set's reps and target RIR. */
function lvSuggest(e) {
  const d = lvDay(e);
  if (!d) return null;
  const si = e.sets.findIndex(s => !s.done && isPRSet(s) && !isWarm(s) && s.r > 0);
  if (si < 0) return null;
  const s = e.sets[si];
  const ab = activeBlock();
  const t = e.auto ? e.auto.t : targetRirFor(e, ab ? ab.kind.rir : null);
  return { si, r: s.r, t, kg: roundLoadFor(loadFor(d.mid, s.r, t), e.leaf) };
}
function vbtDayE1(key) {
  const a = S.active;
  if (!a || a.date !== today()) return null;
  const e = a.exercises.find(x => x.leaf && x.lvp && exKey(x) === key);
  const d = e && lvDay(e);
  return d ? d.mid : null;
}
/* A measured warm-up becomes a point on the next open warm-up set (or next open set). */
function lvRecorded(ei, v) {
  const ex = S.active && S.active.exercises[ei];
  if (!ex) return;
  let si = ex.sets.findIndex(s => !s.done && isWarm(s));
  if (si < 0) si = ex.sets.findIndex(s => !s.done);
  if (si < 0) si = ex.sets.length - 1;
  const s = ex.sets[si];
  if (!(s.w > 0)) return toast('Put the weight on that warm-up first, then measure it');
  if (!v.reps.length) return toast('No reps came out of that recording');
  ex.lvp = ex.lvp || { points: [] };
  ex.lvp.points.push({ kg: s.w, v: v.best, place: v.place, si, at: v.at });
  s.vbt = v;
  if (!s.r) s.r = v.reps.length;
  if (isWarm(s)) s.done = true;                        // a measured warm-up is a done warm-up
  save(); bust(); render();
  const d = lvDay(ex);
  toast(d ? `e1RM today ${nice(dw(d.lo, 0))}–${nice(dw(d.hi, 0))} ${U()}` : `Point ${ex.lvp.points.length} · ${v.best.toFixed(2)} m/s at ${wt(s.w)}${v.place === 'pocket' ? ' (pocket — shown, not fitted)' : ''}`, d ? 'green' : '');
}
/* The load-velocity chart: today's points and line, the stored line dashed,
   the MVT across, and the e1RM range where they meet. */
function lvChart(e) {
  const pts = (e.lvp && e.lvp.points) || [];
  if (!pts.length) return '';
  const d = lvDay(e), stored = (S.settings.lvProfiles || {})[exKey(e)];
  const liftId = slewLiftFor(e.leaf), mvt = liftId ? mvtFor(liftId) : 0;
  const x1 = Math.max(...pts.map(p => p.kg), d ? d.hi : 0) * 1.04, x0 = Math.max(0, Math.min(...pts.map(p => p.kg)) * 0.85);
  const y1 = Math.max(...pts.map(p => p.v), 0.4) * 1.1;
  const W = 300, H = 150, L = 34, B = 20, T = 8, R = 8;
  const X = kg => L + (kg - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (1 - v / y1) * (H - T - B);
  const line = (a, b, cls, dash) => `<line x1="${X(x0).toFixed(1)}" y1="${Y(a + b * x0).toFixed(1)}" x2="${X(x1).toFixed(1)}" y2="${Y(Math.max(0, a + b * x1)).toFixed(1)}" class="${cls}"${dash ? ' stroke-dasharray="5 4"' : ''}/>`;
  return `<svg class="lvchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Load-velocity chart: ${pts.length} warm-up points${d ? `, e1RM ${Math.round(dw(d.lo))} to ${Math.round(dw(d.hi))} ${U()}` : ''}">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" class="lv-axis"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" class="lv-axis"/>
    <text x="${L - 4}" y="${T + 8}" text-anchor="end" class="lv-t">${y1.toFixed(1)}</text><text x="${L - 4}" y="${H - B}" text-anchor="end" class="lv-t">0</text>
    <text x="${L}" y="${H - 5}" class="lv-t">${nice(dw(x0, 0))}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" class="lv-t">${nice(dw(x1, 0))} ${U()}</text>
    ${mvt ? `<line x1="${L}" y1="${Y(mvt).toFixed(1)}" x2="${W - R}" y2="${Y(mvt).toFixed(1)}" class="lv-mvt"/><text x="${L + 4}" y="${(Y(mvt) - 3).toFixed(1)}" class="lv-t">limit ${mvt.toFixed(2)} m/s</text>` : ''}
    ${d ? `<rect x="${X(d.lo).toFixed(1)}" y="${(Y(mvt) - 5).toFixed(1)}" width="${Math.max(2, X(d.hi) - X(d.lo)).toFixed(1)}" height="10" class="lv-band"/>` : ''}
    ${stored ? line(stored.a, stored.b, 'lv-stored', true) : ''}
    ${d ? line(d.fit.a, d.fit.b, 'lv-today') : ''}
    ${pts.map(p => `<circle cx="${X(p.kg).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" class="${p.place === 'pocket' ? 'lv-pt hollow' : 'lv-pt'}"/>`).join('')}
  </svg>`;
}
function lvPanel(e, ei) {
  const pts = (e.lvp && e.lvp.points) || [];
  if (e.vbtMode !== 'profile' && !pts.length) return '';
  const liftId = e.leaf ? slewLiftFor(e.leaf) : null;
  if (!liftId) return `<div class="vbtstrip"><div class="sub">Warm-up profile needs a lift Ironlog has a velocity model for (squat, bench, deadlift, press, rows).</div></div>`;
  const d = lvDay(e), rd = lvReadiness(e), sg = lvSuggest(e);
  const personal = ((S.settings.slewProfiles || {})[liftId] || {}).v0Obs;
  const bar = pts.filter(p => p.place !== 'pocket').length;
  return `<div class="vbtstrip lvpanel">
    <div class="row between"><b>Warm-up profile</b><span class="sub" style="font-size:11px">${esc(liftId)} · limit ${mvtFor(liftId).toFixed(2)} m/s ${personal && personal.length ? '(yours)' : '(population)'}</span></div>
    ${pts.length ? `<div class="row wrap" style="gap:5px;margin:6px 0">${pts.map(p => `<span class="chip${p.place === 'pocket' ? '' : ' blue'}" title="${p.place === 'pocket' ? 'pocket — not fitted' : ''}">${nice(dw(p.kg))} · ${p.v.toFixed(2)}</span>`).join('')}</div>` : ''}
    ${d ? `<div style="font-size:15px;margin:4px 0">e1RM today <b>${nice(dw(d.lo, 0))}–${nice(dw(d.hi, 0))}</b> ${U()} <span class="sub">±${d.half.toFixed(0)}%${d.pctHeavy < 80 ? ` · heaviest warm-up ${d.pctHeavy.toFixed(0)}% — go a little heavier to tighten it` : ''}</span></div>`
      : `<div class="sub" style="margin:4px 0">${bar < 3 ? `Measure ${3 - bar} more warm-up${3 - bar === 1 ? '' : 's'} on the bar — 1–2 fast reps each, rising weight.` : 'The warm-ups are too close together or the line doesn\'t slope down — add a heavier one.'}</div>`}
    ${rd ? `<div class="sub">Bar speed ${rd.word} (${rd.diff > 0 ? '+' : ''}${rd.diff.toFixed(0)}% at ${wt(d.fit.heavy)})${rd.storedE1 ? ` · usual e1RM ${wt(rd.storedE1, 0)}` : ''}</div>` : d ? '<div class="sub">No stored profile yet — finishing today saves one.</div>' : ''}
    ${sg ? `<div class="row between" style="margin-top:6px;gap:8px"><span>Set ${sg.si + 1}: <b>${wt(sg.kg)} × ${sg.r}</b> <span class="sub">@ RIR ${sg.t}</span></span>
      <button class="btn xs primary" data-lvuse="${ei}">Use it</button></div>` : ''}
    ${lvChart(e)}
    <div class="row between" style="margin-top:4px"><span class="sub" style="font-size:11px">A guide from the phone's sensor, not a measurement.</span>
      ${pts.length ? `<button class="btn xs ghost" data-lvclear="${ei}">Clear points</button>` : ''}</div>
  </div>`;
}
function lvUse(ei) {
  const ex = S.active && S.active.exercises[ei];
  const sg = ex && lvSuggest(ex);
  if (!sg) return;
  const ref = ex.sets[sg.si], refW = ref.w;
  ex.sets.forEach((s, i) => {
    if (s.done || isWarm(s) || !isPRSet(s) || i < sg.si) return;
    s.w = i === sg.si || !(refW > 0) || !(s.w > 0) ? sg.kg : roundLoadFor(sg.kg * s.w / refW, ex.leaf);
    delete s.auto;
  });
  if (ex.auto) ex.auto.day = Math.round(lvDay(ex).mid * 10) / 10;
  save(); render(); toast(`Working sets set from today's e1RM`, 'green');
}
/* At finish, today's line joins the stored profile for the variant: a running
   mean with the count capped at 5, so it follows the lifter over time. */
function harvestLvp(entries) {
  entries.forEach(e => {
    const d = lvDay(e);
    if (!d) return;
    const key = exKey(e), all = S.settings.lvProfiles = S.settings.lvProfiles || {};
    const old = all[key], n = old ? Math.min(old.n || 1, 4) : 0;
    all[key] = {
      a: old ? (old.a * n + d.fit.a) / (n + 1) : d.fit.a,
      b: old ? (old.b * n + d.fit.b) / (n + 1) : d.fit.b,
      n: Math.min(n + 1, 5), e1: Math.round(d.mid * 10) / 10, at: Date.now(), lift: d.liftId,
    };
  });
}
/* Calibrate — about 8 minutes: a measured ramp for this variant, and an
   optional set to failure for the limit speed and fatigue rate. */
const CAL_PCTS = [40, 55, 70, 80, 88];
function openCalibrate(ei) {
  const ex = S.active && S.active.exercises[ei];
  if (!ex) return;
  const liftId = slewLiftFor(ex.leaf);
  if (!liftId) return toast('No velocity model for this movement yet');
  const key = exKey(ex);
  const est = autoE1(key) || (statsFor(key) ? statsFor(key).best.e1 : 0);
  ex.cal = ex.cal || { e1: est || 0, steps: [], fail: null };
  const c = ex.cal;
  const draw = () => {
    const loads = c.e1 ? CAL_PCTS.map(p => roundLoadFor(c.e1 * p / 100, ex.leaf)) : [];
    const pts = c.steps.filter(Boolean);
    const f = lvFit(pts);
    return `<div class="sub" style="margin-top:0">A measured ramp builds your own load-velocity profile for ${esc(exFull(ex))}. Phone on the bar, 2–3 fast reps per step, full rest. Skip anything that doesn't feel right.</div>
      <div class="field" style="margin-top:10px"><label for="calE1">Rough max today (${U()})</label>
        <input id="calE1" type="number" inputmode="decimal" step="2.5" value="${c.e1 ? nice(dw(c.e1)) : ''}" placeholder="e.g. 150"></div>
      ${loads.map((kg, i) => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${CAL_PCTS[i]}% · <b>${wt(kg)}</b></span>
        <span class="mono sub">${c.steps[i] ? `${c.steps[i].v.toFixed(2)} m/s${c.steps[i].place === 'pocket' ? ' · pocket' : ''}` : ''}</span>
        <button class="btn xs ${c.steps[i] ? 'ghost' : ''}" data-calstep="${i}">${c.steps[i] ? 'Redo' : 'Measure'}</button></div>`).join('')}
      ${loads.length ? `<div class="row between" style="padding:8px 0"><span>Optional: one set to failure at ~${wt(roundLoadFor(c.e1 * 0.75, ex.leaf))}<br><span class="sub">measures your limit speed and how fast you slow down</span></span>
        <button class="btn xs ${c.fail ? 'ghost' : ''}" data-calfail="1">${c.fail ? 'Redo' : 'Measure'}</button></div>` : ''}
      <div class="sub" style="margin-top:6px">${f ? `Line through ${f.n} points — ready to save.` : `${pts.length} of at least 3 steps measured.`}</div>`;
  };
  modal({
    title: `Calibrate · ${exName(ex)}`, body: draw(),
    foot: `<button class="btn ghost" data-close>Later</button><button class="btn primary" id="calSave">Save profile</button>`,
    onOpen: bg => {
      const reopen = () => { closeAllModals(); openCalibrate(ei); };
      const wire = () => {
        const inp = $('#calE1', bg);
        if (inp) inp.onchange = () => { c.e1 = +inp.value > 0 ? toKg(+inp.value) : 0; c.steps = []; save(); $('.modal-body', bg).innerHTML = draw(); wire(); };
        bg.querySelectorAll('[data-calstep]').forEach(b => b.onclick = () => {
          const i = +b.dataset.calstep, kg = roundLoadFor(c.e1 * CAL_PCTS[i] / 100, ex.leaf);
          closeAllModals();
          openVbtRecord(ei, { title: `Calibrate · step ${i + 1} of ${CAL_PCTS.length}`, note: `<b>${wt(kg)}</b> — 2–3 fast reps.`,
            onRecorded: v => { if (v.reps.length) c.steps[i] = { kg, v: v.best, place: v.place }; save(); reopen(); } });
        });
        bg.querySelectorAll('[data-calfail]').forEach(b => b.onclick = () => {
          const kg = roundLoadFor(c.e1 * 0.75, ex.leaf);
          closeAllModals();
          openVbtRecord(ei, { title: 'Calibrate · set to failure', note: `<b>${wt(kg)}</b> — reps until one won't go up. Safeties set.`,
            onRecorded: (v, est) => {
              c.fail = { kg, reps: v.reps.map(r => r.v), place: v.place, v0: est && est.measuredV0 ? est.measuredV0 : null };
              save(); reopen();
            } });
        });
      };
      wire();
      $('#calSave', bg).onclick = () => {
        const f = lvFit(c.steps.filter(Boolean));
        if (!f && !c.fail) return toast('Measure at least three steps first');
        if (f) {
          const mvt = mvtFor(liftId), e1 = (mvt - f.a) / f.b;
          S.settings.lvProfiles = S.settings.lvProfiles || {};
          S.settings.lvProfiles[key] = { a: f.a, b: f.b, n: 3, e1: e1 > 0 ? Math.round(e1 * 10) / 10 : null, at: Date.now(), lift: liftId, cal: true };
        }
        if (c.fail && c.fail.place !== 'pocket') {
          if (c.fail.v0) addMvtObservation(liftId, c.fail.v0);
          const fp = c.fail.reps.length >= 3 ? Slew.fitProfile(c.fail.reps, 10, slewProfile(liftId)) : null;
          if (fp && fp.vlF) saveSlewProfile(liftId, { vlF: fp.vlF, vlFCal: true, slope: fp.slope, cal: Date.now() });
        }
        delete ex.cal;
        save(); closeAllModals(); render();
        toast('Velocity profile saved for ' + exName(ex), 'green');
      };
    },
  });
}

      $('#pfSave', bg).onclick = () => { collect(); save(); closeModal(); render(); toast('Profile saved', 'green'); };
    },
  });
}

/* ============================================================
   AI KEY
   Bring-your-own-key, held on this device and sent nowhere but Anthropic.
   Only voice set logging uses it now, and only when the local grammar can't
   read what was said.
   ============================================================ */
function aiKey() { try { return localStorage.getItem('ironlog.anthropicKey') || ''; } catch (e) { return ''; } }
function setAiKey(k) {
  try { k ? localStorage.setItem('ironlog.anthropicKey', k) : localStorage.removeItem('ironlog.anthropicKey'); }
  catch (e) { /* private mode: no key, so the local parser is all there is */ }
}

/* Direct browser call. The key sits in this origin's localStorage and goes
   nowhere but Anthropic — no repo, no bundle, no host. */
async function claudeParse(text, system) {
  const key = aiKey();
  if (!key) { const e = new Error('nokey'); e.nokey = true; throw e; }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system,
      messages: [{ role: 'user', content: text }],
    }),
  });
  if (!r.ok) {
    const body = await r.text().catch(() => '');
    const err = new Error(body || ('HTTP ' + r.status));
    err.status = r.status; err.body = 'upstream ' + r.status + ' ' + body;
    throw err;
  }
  const data = await r.json();
  const out = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  let clean = out.replace(/```json|```/g, '').trim();
  /* Haiku usually returns a bare array, but occasionally tops it with a
     sentence. Salvage the array rather than throwing the whole reply away. */
  if (clean[0] !== '[') {
    const a = clean.indexOf('['), z = clean.lastIndexOf(']');
    if (a !== -1 && z > a) clean = clean.slice(a, z + 1);
  }
  try {
    return JSON.parse(clean);
  } catch (pe) {
    const err = new Error('badjson');
    err.badjson = true;
    err.raw = (out || '(empty reply)').slice(0, 160);
    throw err;
  }
}


/* ============================================================
   FOOD LOG — leftover data only (roadmap A1)
   Food logging left Ironlog in 0.25.0 for its own app. A log that existed
   before that is kept, untouched and unshown, until it has been exported
   (Settings -> Data) or removed (Clear data). Nothing here logs food.
   ============================================================ */
function hasFoodData() { return !!((S.foods || []).length); }
function dropFood(st) {
  delete st.foods;
  ['kcalTarget', 'proteinTarget', 'carbTarget', 'fatTarget', 'foodExportedAt'].forEach(k => { delete st.settings[k]; });
}
function saveBlob(text, type, name) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function foodExportData() {
  const st = S.settings;
  const entries = [...(S.foods || [])].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return {
    format: 'ironlog-food-log', formatVersion: 1,
    exportedAt: new Date().toISOString(), appVersion: APP_VERSION,
    units: { energy: 'kcal', protein: 'g', carbs: 'g', fat: 'g', fibre: 'g' },
    targets: { kcal: st.kcalTarget, protein: st.proteinTarget, carbs: st.carbTarget, fat: st.fatTarget },
    goal: st.nutritionGoal || null,
    // src: 'manual' typed in, 'ai' parsed by Claude, 'table'/'offline' from the built-in tables
    entries: entries.map(f => ({ id: f.id, date: f.date, meal: f.meal || 'Snacks', name: f.name, serving: f.serving || '',
      kcal: f.kcal || 0, protein: f.p || 0, carbs: f.c || 0, fat: f.f || 0, fibre: f.fib || 0, source: f.src || 'manual' })),
  };
}
function foodExportCsv(data) {
  const DQ = String.fromCharCode(34);   // the CSV quote, spelled out so no regex or literal needs escaping
  const q = v => {
    const s = v == null ? '' : String(v);
    return [',', DQ, '\n', '\r'].some(c => s.includes(c)) ? DQ + s.split(DQ).join(DQ + DQ) + DQ : s;
  };
  const head = ['date', 'meal', 'name', 'serving', 'kcal', 'protein_g', 'carbs_g', 'fat_g', 'fibre_g', 'source'];
  const rows = data.entries.map(e => [e.date, e.meal, e.name, e.serving, e.kcal, e.protein, e.carbs, e.fat, e.fibre, e.source].map(q).join(','));
  return '﻿' + [head.join(','), ...rows].join('\r\n') + '\r\n';   // BOM so Excel reads the £ and accents right
}
function openFoodExport() {
  const d = foodExportData();
  const n = d.entries.length;
  const days = new Set(d.entries.map(e => e.date)).size;
  modal({
    title: 'Export food log',
    body: `<div class="sub" style="margin-bottom:10px">Food logging has moved out of Ironlog into its own app. Your old food log

        <div class="stat"><div class="k">Targets</div><div class="v" style="font-size:15px">${d.targets.kcal ? `${d.targets.kcal} kcal` : 'none'}</div></div>
      </div>
      <button class="btn primary wide" id="fxJson" style="margin-bottom:8px" ${n || d.targets.kcal ? '' : 'disabled'}>Save food log (JSON)</button>
      <div class="sub" style="margin:-2px 0 10px">Everything — entries, targets and goal. This is the file the new food app will import.</div>
      <button class="btn wide" id="fxCsv" ${n ? '' : 'disabled'}>Save as spreadsheet (CSV)</button>
      <div class="sub" style="margin-top:4px">Entries only, one row each, for Excel or Google Sheets.</div>`,
    foot: `<button class="btn ghost" data-close>Close</button>`,
    onOpen: bg => {
      $('#fxJson', bg).onclick = () => { saveBlob(JSON.stringify(foodExportData(), null, 2), 'application/json', `ironlog-food-${today()}.json`); S.settings.foodExportedAt = Date.now(); save(); toast('Food log saved', 'green'); };
      $('#fxCsv', bg).onclick = () => { saveBlob(foodExportCsv(foodExportData()), 'text/csv', `ironlog-food-${today()}.csv`); toast('Spreadsheet saved', 'green'); };
    },
  });

      render();
    });
    $('#planDay').onclick = () => openPlanner(calSelected);
    $('#ciDay').onclick = () => openCheckin(calSelected);
  }

  if (page === 'workout') {
    if (!S.active) {
      $('#startBlank').onclick = newBlank;

    toast(mt.attemptsLocked ? 'Attempts pinned to the plan' : 'Attempts following your tests', 'green');
  });
    $('#editPriority').onclick = openPriority;

/* Ticking a set in the live session. Top level rather than inside wireActive
   because the hold timer ticks its set too, and one path means the PR toast
   and the checks can't drift between them. */
function toggleSetDone(ei, si) {
  const a = S.active;
  const ex = a && a.exercises[ei];
  const s = ex && ex.sets[si];
  if (!s) return;
  if (s.done) { s.done = false; save(); bust(); render(); return; }
  // an empty field takes last time's number: a routine set is one tap
  const was = lastSession(exKey(ex)), from = prevSetFor(ex, si, was);
  if (from && s.setType !== 'amrap') fillSet(ex, s, from, true);   // an AMRAP's reps are today's, never last time's
  /* A timed set is finished by its duration, not its reps — the reps guard
     made every plank and every treadmill session impossible to tick off. */
  const timed = isTimed(ex);
  const kind = kindOf(ex);
  if (!setLogged(ex, s)) return toast({ time: 'Enter a time first', carry: 'Enter a distance or a time first', capcarry: 'Enter a distance first',
    race: 'Enter a time first' }[kind] || 'Enter reps first');
  // carries, races, time caps and stone series: their own records (strongman spec)
  if (kind !== 'reps' && kind !== 'time') {
    const key = exKey(ex);
    const R = isPRSet(s) ? shapeRecords(key, kind) : null;
    s.done = true;
    Cue.logged();
    if (R && kind === 'series') {
      if (s.r > 0) {
        const st = statsFor(key);
        if (st && beatsBest(st, s.w, 1, s.rpe)) toast(`★ PR — ${exFull(ex)} ${s.w > 0 ? wt(s.w) : 'bodyweight'}`, 'gold');
      }
    } else if (R) {
      const what = shapeBeat(kind, R, s);
      if (!R.n) toast(`★ First ${exFull(ex)} logged`, 'gold');
      else if (what) toast(`★ PR (${what}) — ${exFull(ex)} ${setText(ex, s)}`, 'gold');
    }
    startRest(ei, s);
    save(); bust(); render();
    return;
  }
  const commit = () => {
    // PR check against history captured before flipping the flag
    const st = statsFor(exKey(ex));
    const recs = timed ? holdRecords(exKey(ex)) : null;
    s.done = true;
    Cue.logged();
    if (timed) {
      if (isPRSet(s) && (!recs.n || holdBeats(recs, s.w, s.sec))) {
        toast(recs.n ? `★ Best hold — ${exFull(ex)} ${holdLabel(s)}` : `★ First ${exFull(ex)} logged`, 'gold');
      }
    } else if (isPRSet(s) && (!st || beatsBest(st, s.w, s.r, s.rpe))) {
      toast(st ? `★ PR — ${exFull(ex)} ${s.w > 0 ? `${wt(s.w)}×${s.r}` : `${s.r} reps`}` : `★ First ${exFull(ex)} logged`, 'gold');
    }
    const moved = autoAdjust(ex, s);
    if (moved) toast(`Next sets → ${wt(moved.to)} · RIR ${rpeToRir(s.rpe)}, target ${ex.auto.t}`, moved.to > moved.from ? 'green' : '');
    startRest(ei, s);
    save(); bust(); render();
  };
  /* plausibility() reasons about load and reps against history; it has
     nothing to say about a duration, so a timed set skips it rather than
     being asked a question in the wrong units. */
  const why = (isWarm(s) || timed) ? [] : plausibility(exKey(ex), s.w, s.r, s.rpe);
  if (why.length) plausDlg(exKey(ex), s, why, commit); else commit();
}

/* Flip an entry between normal and isometric. The sets are rewritten with it —
   reps cleared going in, time cleared coming out — so no row is left half
   converted. Converted sets are unticked: a ticked hold with no time (or a
   ticked set with no reps) isn't a logged set, and would be dropped silently
   at finish. Warn first if that throws away anything already ticked. */
function setIso(e, on, after) {
  const apply = () => {
    if (on) {
      e.iso = true;
      e.sets.forEach(s => { s.r = null; s.done = false; });
    } else {
      delete e.iso;
      e.sets.forEach(s => { s.r = 0; s.sec = null; s.done = false; delete s.holdMode; delete s.target; });
    }
    after();
  };
  if (e.sets.some(s => s.done)) {
    confirmDlg(on
      ? 'Ticked sets lose their reps and become holds you\'ll need to time or type in. Convert?'
      : 'Ticked holds lose their times and become rep sets you\'ll need to fill in. Convert?', apply, 'Convert');
  } else apply();
}

/* ---------------- hold timer ----------------
   Planned: count in, then count down from the target; finishing logs the
   target, stopping early logs what was held. Test: count in, then count up
   until stopped — a hold to failure, so RIR 0. Manual needs no timer: it's
   the time field on the row.

   The clock is a start timestamp, never a sum of interval ticks: intervals
   throttle when the tab is hidden, and a hold timed with the phone locked
   must still read right on return. */
function openHoldTimer(ei, si) {
  const a = S.active;
  const e = a && a.exercises[ei];
  const s = e && e.sets[si];
  if (!s) return;
  const isoE = isIso(e);
  // a carry or a race is a stopwatch: count in, count up, stop at the line
  const course = ['carry', 'race'].includes(kindOf(e));
  // default to how this set, or the one before it, was last timed
  const prevSet = e.sets.slice(0, si).reverse().find(x => x.holdMode === 'planned' || x.holdMode === 'test');
  let mode = course ? 'test' : s.holdMode === 'planned' || s.holdMode === 'test' ? s.holdMode : prevSet ? prevSet.holdMode : 'planned';
  let target = s.target || (prevSet && prevSet.target) || s.sec || 30;
  let run = null;   // { goAt, iv, warned }

  const stop = () => {
    if (!run) return;
    clearInterval(run.iv);
    run = null;
    Awake.release('hold');
  };
  const log = sec => {
    stop();
    Cue.done();
    s.sec = Math.max(1, Math.floor(sec));   // what the clock showed
    if (!course) {
      s.holdMode = mode;
      s.target = mode === 'planned' ? target : null;
    }
    if (mode === 'test' && isoE) s.rpe = rirToRpe(0);   // held to failure
    save();
    closeModal();
    if (!s.done) toggleSetDone(ei, si); else { bust(); render(); }
  };

  modal({
    title: `${course ? 'Time' : 'Hold'} · ${exFull(e)}`,
    sticky: true,
    onClose: stop,
    body: `
      <div class="seg" id="htMode"${course ? ' style="display:none"' : ''}>
        <button data-m="planned" class="${mode === 'planned' ? 'on' : ''}">Planned</button>
        <button data-m="test" class="${mode === 'test' ? 'on' : ''}">To failure</button>
      </div>
      <div class="field" id="htTargetF" style="margin-top:10px;${mode === 'planned' ? '' : 'display:none'}"><label>Target (m:ss)</label>
        <input type="text" inputmode="numeric" id="htTarget" value="${fmtSec(target)}"></div>
      <div class="timer" id="htClock" style="font-size:64px;text-align:center;margin:14px 0 4px">${mode === 'planned' ? fmtSec(target) : '0:00'}</div>
      <div class="sub" id="htMsg" style="text-align:center;min-height:18px">${s.w > 0 ? `${wt(s.w)}${loadConventionFor(e.leaf) === 'per_side' ? ' per side' : ''} · ` : ''}${course && s.m > 0 ? fmtM(s.m) + ' · ' : ''}three beeps, go on the long one</div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="htGo">Start</button>`,
    onOpen: bg => {
      const clock = $('#htClock', bg), msg = $('#htMsg', bg), go = $('#htGo', bg);
      bg.querySelectorAll('#htMode button').forEach(b => b.onclick = () => {
        if (run) return;
        mode = b.dataset.m;
        bg.querySelectorAll('#htMode button').forEach(x => x.classList.toggle('on', x === b));
        $('#htTargetF', bg).style.display = mode === 'planned' ? '' : 'none';
        clock.textContent = mode === 'planned' ? fmtSec(target) : '0:00';
      });
      const tIn = $('#htTarget', bg);
      tIn.oninput = () => { const v = parseTime(tIn.value); if (v) { target = v; if (!run) clock.textContent = fmtSec(v); } };
      tIn.onblur = () => { tIn.value = fmtSec(target); };
      selectOnFocus(tIn);

      const frame = () => {
        if (!run) return;
        if (!document.body.contains(clock)) { stop(); return; }   // modal gone some other way
        const now = Date.now();
        if (now < run.goAt) {
          clock.textContent = String(Math.ceil((run.goAt - now) / 1000));
          return;
        }
        const el = (now - run.goAt) / 1000;
        if (mode === 'planned') {
          const left = target - el;
          if (left <= 0) return log(target);
          // a short tick on each of the last three seconds
          const whole = Math.ceil(left);
          if (whole <= 3 && whole < run.warned) { run.warned = whole; Cue.tick(); }
          clock.textContent = fmtSec(whole);
        } else clock.textContent = fmtSec(Math.floor(el));
        msg.textContent = course ? 'Stop at the line' : mode === 'planned' ? 'Stop early to log what you held' : 'Stop when the hold breaks';
      };

      go.onclick = () => {
        if (!run) {
          if (mode === 'planned' && !(target > 0)) return toast('Set a target first');
          Cue.unlock();            // this tap is the gesture the browser wants
          if (S.active && S.active.rest) { stopRest(); save(); }   // the rest is over once the hold starts
          Cue.countIn();
          Awake.hold('hold');
          run = { goAt: Date.now() + 2000, warned: 4, iv: setInterval(frame, 100) };
          go.textContent = 'Stop';
          go.classList.remove('primary'); go.classList.add('danger');
          tIn.disabled = true;
          frame();
          return;
        }
        const el = (Date.now() - run.goAt) / 1000;
        if (el < 1) {                                     // stopped in the count-in: nothing held
          stop();
          go.textContent = 'Start';
          go.classList.add('primary'); go.classList.remove('danger');
          tIn.disabled = false;
          clock.textContent = mode === 'planned' ? fmtSec(target) : '0:00';
          msg.textContent = 'Stopped before the hold started — nothing logged';
          return;
        }
        log(mode === 'planned' ? Math.min(el, target) : el);
      };
    },
  });
}

/* ---------------- modifiers ----------------
   Technique, tempo, stance and range of motion ("comp pause", "slow eccentric")
   as structured tags on the entry, instead of prose in the note. They annotate;
   they never split the PR leaf. The splitsPR ones (chains, bands, slingshot,
   equipped) are listed but greyed: giving them their own PR line is prKey's
   job, and prKey is deliberately still unwired (roadmap item 14) — offering
   them now would promise a separation that doesn't happen. Your own modifiers
   are stored as "x:<text>". */
function modVocab() { return catalogue().V.modifier || []; }
function modLabel(id) {
  if (String(id).startsWith('x:')) return String(id).slice(2);
  const m = modVocab().find(x => x.id === id);
  return m ? m.label : String(id);
}
function modsHtml(e) {
  const ms = (e && e.mods) || [];
  return ms.length ? ` <span class="dimmer">· ${ms.map(m => esc(modLabel(m))).join(', ')}</span>` : '';
}
function modChips(e, attr) {
  const ms = e.mods || [];
  return `<div class="row wrap modchips" style="gap:6px;margin-top:8px">
    ${ms.map(m => `<span class="chip">${esc(modLabel(m))}</span>`).join('')}
    <button class="chip modadd" ${attr} title="Technique, adaptations, tempo — tags that don't split the PR">${ms.length ? '✎' : '+ Modifier'}</button>
  </div>`;
}
function openModPicker(e, after) {
  let sel = new Set(e.mods || []);
  const draw = () => {
    const vocab = modVocab();
    const custom = [...sel].filter(m => String(m).startsWith('x:'));
    return `<div class="sub" style="margin-bottom:10px">Tags on this exercise for this session. They don't change which PR it counts toward.</div>
      <div id="mdList">
      <div class="eyebrow" style="margin:4px 0 4px">Technique</div>
      ${vocab.filter(m => !m.splitsPR && m.group !== 'adaptation').map(m => `
        <button class="axrow ${sel.has(m.id) ? 'on' : ''}" data-md="${esc(m.id)}"><span class="lbl">${esc(m.label)}</span><span class="rad"></span></button>`).join('')}
      <div class="eyebrow" style="margin:12px 0 2px">Adaptations</div>
      <div class="sub" style="margin-bottom:4px">How this lift was set up for you. Same PRs, recorded honestly. A first list — tell us what's missing.</div>
      ${vocab.filter(m => m.group === 'adaptation').map(m => `
        <button class="axrow ${sel.has(m.id) ? 'on' : ''}" data-md="${esc(m.id)}"><span class="lbl">${esc(m.label)}</span><span class="rad"></span></button>`).join('')}
      <div class="eyebrow" style="margin:12px 0 4px">Yours and others</div>
      ${custom.map(m => `
        <button class="axrow on" data-md="${esc(m)}"><span class="lbl">${esc(modLabel(m))} <span class="dimmer">yours</span></span><span class="rad"></span></button>`).join('')}
      ${vocab.filter(m => m.splitsPR).map(m => `
        <button class="axrow off" disabled title="Will get its own PR line with roadmap item 14"><span class="lbl">${esc(m.label)} <span class="dimmer">own PR line — not yet</span></span><span class="rad"></span></button>`).join('')}</div>
      <div class="row" style="gap:8px;margin-top:10px">
        <input id="mdNew" class="grow" placeholder="Your own — e.g. close grip, 3-0-1 tempo" maxlength="40">
        <button class="btn sm" id="mdAdd">Add</button>
      </div>`;
  };
  modal({
    title: `Modifiers · ${exFull(e)}`,
    body: draw(),
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="mdOk">Done</button>`,
    onOpen: bg => {
      const bind = () => {
        bg.querySelectorAll('[data-md]').forEach(b => b.onclick = () => {
          const id = b.dataset.md;
          if (sel.has(id)) sel.delete(id); else sel.add(id);
          b.classList.toggle('on', sel.has(id));
        });
        const add = () => {
          const t = $('#mdNew', bg).value.trim().replace(/\s+/g, ' ');
          if (!t) return;
          // a typed name that matches the list ticks that one rather than making a twin
          const known = modVocab().find(m => m.label.toLowerCase() === t.toLowerCase());
          sel.add(known && !known.splitsPR ? known.id : 'x:' + t);
          $('.modal-body', bg).innerHTML = draw(); bind();
        };
        $('#mdAdd', bg).onclick = add;
        $('#mdNew', bg).onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); add(); } };
      };
      bind();
      $('#mdOk', bg).onclick = () => {
        // vocabulary order first, then yours in the order added
        const order = modVocab().map(m => m.id);
        e.mods = [...sel].sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
        closeModal(); after();
      };
    },
  });
}

/* ---------------- exercise data check ----------------
   Roadmap item 6: run against every logged session (and a Liftoff CSV) and
   show that every entry resolves to a leaf, nothing is orphaned, and where
   one old name now lands on more than one variant — the one place PRs can
   have moved. Read-only: it reports and changes nothing. */
function exerciseCheck(st, csvText) {
  const R = { entries: 0, sets: 0, orphans: [], custom: {}, splits: [], drift: [], csv: null };
  const byName = {};                 // legacyName -> key -> { entries, best }
  const scan = (wo, where) => (wo.exercises || []).forEach(e => {
    R.entries++; R.sets += (e.sets || []).length;
    const label = e.legacyName || (e.leaf && e.leaf.movement) || '(unnamed)';
    if (!e.leaf || !e.leaf.movement) { R.orphans.push({ name: label, where, date: wo.date, why: 'no leaf' }); return; }
    const m = movementById(e.leaf.movement);
    if (!m) { R.orphans.push({ name: label, where, date: wo.date, why: `unknown movement "${e.leaf.movement}"` }); return; }
    if (m.custom) R.custom[m.name] = (R.custom[m.name] || 0) + 1;
    if (where !== 'completed' || !e.legacyName) return;
    const k = exKey(e);
    const g = (byName[e.legacyName] = byName[e.legacyName] || {});
    const x = (g[k] = g[k] || { entries: 0, best: 0 });
    x.entries++;
    e.sets.filter(s => s.done !== false && isPRSet(s) && s.w > 0 && s.r > 0)
      .forEach(s => { x.best = Math.max(x.best, e1rm(s.w, s.r, s.rpe)); });
    /* The stored movement differs from what the old name resolves to today.
       Axis changes (equipment, grip) are expected; a different movement is
       worth a look. */
    const r = resolveName(e.legacyName);
    if (r && r.leaf.movement !== e.leaf.movement) R.drift.push({ name: e.legacyName, date: wo.date, now: fullName(e.leaf), resolves: fullName(r.leaf) });
  });
  (st.workouts || []).forEach(w => scan(w, w.status === 'completed' ? 'completed' : w.status || 'other'));
  if (st.active) scan(st.active, 'active');
  Object.entries(byName).forEach(([name, g]) => {
    const keys = Object.keys(g);
    if (keys.length > 1) R.splits.push({ name, variants: keys.map(k => ({ key: k, label: leafName(k) + (variantLabel(keyLeaf(k)) ? ` · ${variantLabel(keyLeaf(k))}` : ''), ...g[k] })) });
  });
  if (csvText != null) {
    try {
      const p = parseImport(csvText);   // any app's export (B8)
      const rows = p.names.map(raw => {
        const m = matchExercise(raw);
        return { raw, mapped: raw, how: m.how, leaf: m.leaf ? fullName(m.leaf) : null };
      });
      R.csv = { sessions: p.sessions.length, sets: p.sets, resolved: rows.filter(x => x.leaf), unresolved: rows.filter(x => !x.leaf),
                guesses: rows.filter(x => x.how === 'guess') };
    } catch (err) { R.csv = { error: 'That CSV isn\'t one Ironlog can read' }; }
  }
  R.ok = !R.orphans.length && !(R.csv && (R.csv.error || R.csv.unresolved.length));
  return R;
}
function exerciseCheckText(R) {
  const L = [`Ironlog ${APP_VERSION} exercise data check`,
    `${R.entries} entries, ${R.sets} sets`, `orphans: ${R.orphans.length}`];
  R.orphans.forEach(o => L.push(`  ORPHAN ${o.name} (${o.where} ${o.date || ''}) — ${o.why}`));
  L.push(`custom movements: ${Object.keys(R.custom).length}`);
  Object.entries(R.custom).forEach(([n, c]) => L.push(`  ${n} ×${c}`));
  L.push(`old names split across variants: ${R.splits.length}`);
  R.splits.forEach(s => L.push(`  ${s.name}: ` + s.variants.map(v => `${v.label} (${v.entries}, best e1 ${Math.round(v.best)})`).join(' | ')));
  L.push(`movement differs from what the old name resolves to: ${R.drift.length}`);
  R.drift.slice(0, 50).forEach(d => L.push(`  ${d.date} ${d.name}: stored ${d.now}, resolves ${d.resolves}`));
  if (R.csv) {
    if (R.csv.error) L.push(`CSV: ${R.csv.error}`);
    else {
      L.push(`CSV: ${R.csv.sessions} sessions, ${R.csv.sets} sets, ${R.csv.resolved.length} names resolve, ${R.csv.unresolved.length} don't`);
      R.csv.unresolved.forEach(u => L.push(`  UNRESOLVED ${u.raw}${u.mapped !== u.raw ? ` (alias ${u.mapped})` : ''}`));
    }
  }
  return L.join('\n');
}

  const list = (items, fn, empty) => items.length ? items.map(fn).join('') : `<div class="sub">${empty}</div>`;
  modal({

      <div class="eyebrow" style="margin-top:12px">One old name, several variants</div>

      <div class="eyebrow" style="margin-top:12px">Custom movements</div>
