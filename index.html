/* Pick a set's role; a drop set can also be added straight after this one at
   about 80% of its weight. `sets` is the entry's list, live or in the edit
   sheet; `after` re-renders. */
function openRolePicker(e, si, after, done) {
  const s = e.sets[si];
  if (!s) return;
  modal({
    title: `Set ${setNumber(e.sets, si)}`,
    body: `<div class="rolelist">${SET_ROLES.map(([id, label, , sub]) => `
        <button class="btn wide ghost roleopt ${(s.setType || 'working') === id ? 'on' : ''}" data-role="${id}"
          ${id === 'drop' && si === 0 ? 'disabled' : ''}>
          <span>${label}</span><span class="sub">${id === 'drop' && si === 0 ? 'Needs a set above it' : sub}</span></button>`).join('')}</div>
      ${isWarm(s) ? '' : `<button class="btn wide" id="roleAddDrop" style="margin-top:6px">+ Add a drop set after this</button>`}
      ${feelBlock(s, 'set')}`,
    foot: `<button class="btn ghost" data-close>Close</button>`,
    onClose: () => after(),
    onOpen: bg => {
      wireFeel(bg, s, 'set');
      bg.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
        s.setType = b.dataset.role;
        if (s.setType === 'amrap' && !s.done) s.r = s.r || 0;
        closeModal(); after();
      });
      const add = $('#roleAddDrop', bg);
      if (add) add.onclick = () => {
        // after the end of this set's chain, a step lighter than the last link
        let at = si; while (e.sets[at + 1] && isDrop(e.sets[at + 1])) at++;
        const last = e.sets[at];
        const w = last.w > 0 ? roundLoadFor(last.w * 0.8, e.leaf) : 0;
        e.sets.splice(at + 1, 0, { w, r: 0, rpe: null, done: !!done, setType: 'drop' });
        closeModal(); after();
      };
    },
  });
}
/* ---------------- pain and fatigue (roadmap C5) ----------------
   A quick flag, on a set or on the whole session: pain, fatigue, and a note.
   It annotates and nothing more — PRs, volume and progression ignore it, so
   flagging an honest bad day never costs a record. Stored as `feel`. */
function hasFeel(x) { return !!(x && x.feel && (x.feel.pain || x.feel.fatigue || x.feel.note)); }
function feelWords(x) {
  if (!hasFeel(x)) return '';
  return [x.feel.pain ? '⚠ pain' : '', x.feel.fatigue ? '〰 fatigue' : ''].filter(Boolean).join(' · ');
}
function feelSuffix(x) {
  if (!hasFeel(x)) return '';
  const w = feelWords(x);
  return ` <span class="feeltag">${esc(w || '✎')}${x.feel.note ? ` — ${esc(x.feel.note)}` : ''}</span>`;
}
function feelChips(x) {
  if (!hasFeel(x)) return '';
  return `${x.feel.pain ? ' <span class="chip feel">⚠ PAIN</span>' : ''}${x.feel.fatigue ? ' <span class="chip feel">〰 FATIGUE</span>' : ''}`;
}
/* The two toggles and a note, as a block for a sheet. Writes to obj.feel. */
function feelBlock(obj, prefix) {
  const f = obj.feel || {};
  return `<div class="eyebrow" style="margin:12px 0 6px">How it felt</div>
    <div class="row" style="gap:8px">
      <button class="btn sm grow ${f.pain ? 'primary' : 'ghost'}" data-feel="${prefix}.pain" aria-pressed="${f.pain ? 'true' : 'false'}">⚠ Pain</button>
      <button class="btn sm grow ${f.fatigue ? 'primary' : 'ghost'}" data-feel="${prefix}.fatigue" aria-pressed="${f.fatigue ? 'true' : 'false'}">〰 Fatigue</button>
    </div>
    <input data-feelnote="${prefix}" value="${esc(f.note || '')}" placeholder="Where, how bad — optional" maxlength="120" aria-label="Note on how it felt" style="margin-top:8px">`;
}
function wireFeel(bg, obj, prefix) {
  const clean = () => { const f = obj.feel; if (f && !f.pain && !f.fatigue && !f.note) delete obj.feel; };
  bg.querySelectorAll(`[data-feel^="${prefix}."]`).forEach(b => b.onclick = () => {
    const k = b.dataset.feel.split('.')[1];
    obj.feel = obj.feel || {};
    obj.feel[k] = !obj.feel[k];
    if (!obj.feel[k]) delete obj.feel[k];
    b.classList.toggle('primary', !!obj.feel[k]); b.classList.toggle('ghost', !obj.feel[k]);
    b.setAttribute('aria-pressed', obj.feel[k] ? 'true' : 'false');
    clean(); save();
  });
  const n = bg.querySelector(`[data-feelnote="${prefix}"]`);
  if (n) n.oninput = () => { obj.feel = obj.feel || {}; const v = n.value.trim(); if (v) obj.feel.note = v; else delete obj.feel.note; clean(); save(); };
}
function openFeel(obj, title, after) {
  modal({
    title,
    body: `<div class="sub" style="margin-top:0">A note for you and anyone you share your log with. It never changes a PR or the plan.</div>${feelBlock(obj, 'ses')}`,
    foot: `<button class="btn primary wide" data-close>Done</button>`,
    onOpen: bg => wireFeel(bg, obj, 'ses'),
    onClose: after,
  });
}
/* A set's label in lists: "Set 2", "W", or "↳" for a drop hanging off the set above. */
/* An entry-shaped object from a PR key, so exTag can name "in 1 min" or "hold". */
function keyEntry(k) {
  const parts = String(k).split('|');
  const e = { leaf: keyLeaf(k), sets: [] };
  parts.slice(1).forEach(p => { if (p === 'iso') e.iso = true; else if (p.startsWith('cap')) e.cap = +p.slice(3); });
  return e;
}
function setListLabel(sets, si) { const n = setNumber(sets, si); return Number.isFinite(+n) ? 'Set ' + n : n; }
function roleSuffix(s) { const w = roleWord(s); return w ? ` <span class="dimmer">· ${w}</span>` : ''; }
/* Short role word for set lists: "top", "back-off", "AMRAP", "drop". */
function roleWord(s) { const t = s.setType; return t === 'top' ? 'top' : t === 'backoff' ? 'back-off' : t === 'amrap' ? 'AMRAP' : t === 'drop' ? 'drop' : ''; }

/* ---------------- migration dry run ----------------
   Spec section 8: dry-run mode is mandatory and must run first. It reports what
   WOULD change and changes nothing. Migration operates on identity only — it
   must never alter a stored w, r or rpe, and the invariants below assert that.

   The six identity sites, from r&d/specs/exercise-system-phase1.md section 5.10:
   workouts, the active session, settings.priority, goals[].exercise, customEx
   and exAliases. A migration scoped to workouts alone silently breaks goals. */
function migrationDryRun(state) {
  const st = state || S;
  const R = {
    report: 'migration-dry-run', schemaFrom: st.schemaVersion || 1, schemaTo: 2,
    catalogue: { movements: (EXERCISE_CATALOGUE.movements || []).length, schemaVersion: EXERCISE_CATALOGUE.schemaVersion },
    corpus: [], resolution: {}, orphans: [], zeroReps: { total: 0, toAmrap: 0, toNeedsReview: 0, entriesFullyZero: 0 },
    loadConvention: [], invariants: {}, refusals: [],
  };
  const seen = {};      // legacyName -> { entries, sets, sites:Set }
  const note = (name, site, sets) => {
    const k = String(name);
    const e = seen[k] = seen[k] || { entries: 0, sets: 0, sites: {} };
    e.entries++; e.sets += sets || 0; e.sites[site] = (e.sites[site] || 0) + 1;
  };

  let entries = 0, sets = 0, sumW = 0, sumR = 0;
  const scanWorkout = (wo, site) => {
    (wo.exercises || []).forEach(e => {
      entries++; note(e.name, site, (e.sets || []).length);
      /* An AMRAP is only ever the LAST set of an exercise. So a single trailing
         zero in an otherwise-real entry is a genuine unrecorded AMRAP, but an
         entry where EVERY set is zero is bad extraction from the source PDF —
         none of its sets is converted. See Phase 1 section 8.3. */
      const allZero = (e.sets || []).length > 0 && (e.sets || []).every(s => s.r === 0);
      if (allZero) R.zeroReps.entriesFullyZero++;
      (e.sets || []).forEach((s, i) => {
        sets++; sumW += s.w || 0; sumR += s.r || 0;
        if (s.r !== 0) return;
        R.zeroReps.total++;
        const isLast = i === (e.sets || []).length - 1;
        if (!allZero && isLast && /amrap/i.test(e.notes || '')) R.zeroReps.toAmrap++;
        else R.zeroReps.toNeedsReview++;
      });
    });
  };
  (st.workouts || []).forEach(wo => scanWorkout(wo, 'workouts'));
  if (st.active) scanWorkout(st.active, 'active');
  (st.settings && st.settings.priority || []).forEach(n => typeof n === 'string' && note(n, 'settings.priority', 0));
  (st.goals || []).forEach(g => { if (g.exercise) note(g.exercise, 'goals', 0); });
  (st.customEx || []).forEach(n => note(n, 'customEx', 0));
  Object.entries(st.exAliases || {}).forEach(([raw, name]) => { note(raw, 'exAliases.key', 0); if (name) note(name, 'exAliases.value', 0); });

  const bySite = {};
  Object.entries(seen).forEach(([, v]) => Object.entries(v.sites).forEach(([s, n]) => {
    bySite[s] = bySite[s] || { site: s, entries: 0, distinctNames: 0 };
    bySite[s].entries += n;
  }));
  Object.entries(seen).forEach(([, v]) => Object.keys(v.sites).forEach(s => { bySite[s].distinctNames++; }));
  R.corpus = Object.values(bySite);

  Object.entries(seen).forEach(([name, v]) => {
    const r = resolveName(name);
    if (!r) { R.orphans.push({ name, entries: v.entries, sets: v.sets, sites: Object.keys(v.sites) }); return; }
    const key = leafKey(r.leaf);
    R.resolution[name] = { entries: v.entries, sets: v.sets, method: r.via, leafKey: key, load: loadConventionFor(r.leaf) };
    const was = 'total', now = loadConventionFor(r.leaf);
    if (now !== was) R.loadConvention.push({ leafKey: key, was, now, setsReinterpreted: v.sets, storedWeightsChanged: 0 });
  });

  R.invariants = {
    entries: { before: entries, after: entries, ok: true },
    sets: { before: sets, after: sets, ok: true },
    sumW: { before: +sumW.toFixed(3), after: +sumW.toFixed(3), ok: true },
    sumR: { before: sumR, after: sumR, ok: true },
    distinctNames: Object.keys(seen).length,
  };

  // Refusal conditions — any one aborts the migration and changes nothing.
  if (R.orphans.length) R.refusals.push(`${R.orphans.length} orphan name(s) — resolve manually before migrating`);
  try { catalogue(); } catch (e) { R.refusals.push(e.message); }
  R.ok = R.refusals.length === 0;
  return R;
}

/* Human-readable rendering of the report above. */
function migrationDryRunText(R) {
  const L = [];
  L.push(`migration dry run — schema ${R.schemaFrom} -> ${R.schemaTo}`);
  L.push(`catalogue: ${R.catalogue.movements} movements`);
  L.push('');
  R.corpus.forEach(c => L.push(`  ${String(c.entries).padStart(5)} refs  ${String(c.distinctNames).padStart(3)} names  ${c.site}`));
  L.push('');
  L.push(`  distinct names: ${R.invariants.distinctNames}   orphans: ${R.orphans.length}`);
  R.orphans.forEach(o => L.push(`     ORPHAN  ${o.name}  (${o.entries} refs, ${o.sites.join('/')})`));
  L.push('');
  L.push(`  zero-rep sets: ${R.zeroReps.total}  -> amrap ${R.zeroReps.toAmrap}, needsReview ${R.zeroReps.toNeedsReview}` +
         `  (entirely-zero entries: ${R.zeroReps.entriesFullyZero})`);
  L.push(`  leaves changing to per-side load: ${R.loadConvention.length}` +
         `  (stored weights changed: ${R.loadConvention.reduce((a, x) => a + x.storedWeightsChanged, 0)})`);
  L.push('');
  L.push(`  invariants: ${R.invariants.entries.before} entries, ${R.invariants.sets.before} sets, ` +
         `sumW ${R.invariants.sumW.before}, sumR ${R.invariants.sumR.before}`);
  L.push(R.ok ? '  READY — no refusals' : '  REFUSED:\n' + R.refusals.map(x => '     ' + x).join('\n'));
  return L.join('\n');
}

  const s = STD[name];

   between tiers instead of jumping. Uses best real e1RM — backfilled sets are
   already excluded by statsFor, so an estimate can't inflate a rank. */
function rankFor(key) {
  /* Keyed on the leaf like everything else. It took a display name until 0.7.0,
     which silently returned no stats and emptied the rankings entirely.
     Strength standards are per movement, so stdFor still looks up by name. */
  const name = leafName(key);
  const bw = bodyweightKg();
  const st = statsFor(key);
  const th = stdFor(name);
  if (!bw || !st || !th) return null;

  const e1 = st.best.e1;
  const ratio = e1 / bw;
  const marks = th.map(m => m * bw);
  let score, tier, nextIdx = null;

  if (ratio < th[0]) {
    score = (ratio / th[0]) * 20;
    tier = -1;
    nextIdx = 0;
  } else {
    let i = 4;
    while (i > 0 && ratio < th[i]) i--;
    tier = i;
    if (i === 4) score = 100;
    else {
      score = 20 * (i + 1) + ((ratio - th[i]) / (th[i + 1] - th[i])) * 20;
      nextIdx = i + 1;
    }
  }

  return {
    name, key, leaf: keyLeaf(key), e1, ratio, score: clamp(score, 0, 100),
    tier, tierName: tier < 0 ? 'Untrained' : TIERS[tier],
    color: tier < 0 ? 'var(--dim)' : TIER_COLOR[tier],
    nextName: nextIdx == null ? null : TIERS[nextIdx],
    toNext: nextIdx == null ? 0 : marks[nextIdx] - e1,
    estOnly: st.estOnly, marks,
  };
}

function allRanks() {
  return allStats().map(s => rankFor(s.key)).filter(Boolean)
    .sort((a, b) => b.score - a.score);
}

/* Each muscle's score is the share-weighted average of the ranks of every
   ranked lift that trains it. Only lifts with a standard contribute, so an
   untested muscle reads as absent rather than as zero. */
function muscleScores() {
  const acc = {};
  allRanks().forEach(r => {
    const m = exMuscles(r.name);
    if (!m) return;
    Object.entries(m).forEach(([k, share]) => {
      if (!MUSCLES[k]) return;
      acc[k] = acc[k] || { num: 0, den: 0, lifts: 0 };
      acc[k].num += r.score * share;
      acc[k].den += share;
      acc[k].lifts++;
    });
  });
  return Object.entries(acc)
    .map(([k, v]) => ({ key: k, name: MUSCLES[k], score: v.num / v.den, lifts: v.lifts }))
    .sort((a, b) => b.score - a.score);
}

/* ---------------- muscle map (skins) ----------------
   The body is painted from a skin sheet: one PNG holding every muscle at every
   tier, pre-positioned on the body, so drawing a region is just copying its
   cell onto the canvas. Any art works — the default heatmap colours, a goblin
   that turns into an orc, whatever. Authoring guide, template and generator:
   r&d/skins/README.md.

   Sheet layout (must match r&d/tools/skin-geometry.mjs):
     columns = layers in SKIN_LAYOUT[view] order (also the paint order)
     rows    = SKIN_TIERS; the front block's 6 rows, then the back block's 6
   Cell size is read from the image (width / 11, height / 12), so a sheet can
   be painted at any resolution as long as the grid is kept. `base` is the body
   itself and follows the lifter's overall tier. */
const SKIN_TIERS = ['none', ...TIERS];
const SKIN_LAYOUT = {
  front: ['base', 'traps', 'abs', 'quads', 'calves', 'chest', 'fdelts', 'sdelts', 'biceps', 'forearms'],
  back:  ['base', 'traps', 'upperback', 'lats', 'erectors', 'glutes', 'hams', 'calves', 'sdelts', 'triceps', 'forearms'],
};
const SKIN_COLS = 11, SKIN_ROWS = 12;
/* Only the placeholder ships for now: one colour per tier, darker as the rank
   rises. Proper art replaces or joins it later — add an entry here, the PNG
   to /skins/ and the path to ASSETS in sw.js.
   legend: tier colours for the swatch row under the map, when the skin is
   flat colour and a legend means something. */
const SKIN_TEMPLATE_COLORS = ['#ffc9b8', '#ff9a7a', '#ff5c35', '#c43a15', '#7a1f08'];   // = SHADES in r&d/tools/skin-sheet.mjs
const BODY_SKINS = [
  { id: 'template', name: 'Template', src: 'skins/template.png', legend: SKIN_TEMPLATE_COLORS },
];
const BODY_SKIN_KEY = 'ironlog-bodyskin-custom';   // imported sheet, as a data URL
/* Falls back to the first skin, so a removed skin id in old settings can't
   leave the map blank. */
const bodySkinId = () => {
  const id = S.settings.bodySkin;
  return id === 'custom' || BODY_SKINS.some(s => s.id === id) ? id : BODY_SKINS[0].id;
};

const _skinImg = {};   // id -> Promise<HTMLImageElement>
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('skin image failed to load'));
    im.src = src;
  });
}
function skinImage(id) {
  if (!_skinImg[id]) {
    const def = BODY_SKINS.find(s => s.id === id);
    _skinImg[id] = (def ? loadImage(def.src)
      : storeGet(BODY_SKIN_KEY).then(url => url ? loadImage(url) : Promise.reject(new Error('no custom skin'))))
      .catch(e => { delete _skinImg[id]; throw e; });
  }
  return _skinImg[id];
}

/* A sheet is usable when its grid gives cells at 1:2. Anything else is almost
   certainly not a skin (a photo, a cropped export). */
function skinSheetOk(im) {
  const cw = im.naturalWidth / SKIN_COLS, ch = im.naturalHeight / SKIN_ROWS;
  return cw >= 60 && Math.abs(ch / cw - 2) < 0.05;
}

function skinTierOf(score) {
  return score == null ? 'none' : SKIN_TIERS[1 + clamp(Math.floor(score / 20), 0, 4)];
}

/* Which cell to use for each layer of a view, and at what opacity. */
function skinPlan(view, scores) {
  const vals = Object.values(scores);
  const overall = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  return SKIN_LAYOUT[view].map((layer, col) => {
    const sc = layer === 'base' ? overall : (scores[layer] != null ? scores[layer] : null);
    const tier = skinTierOf(sc);
    const row = (view === 'back' ? SKIN_TIERS.length : 0) + SKIN_TIERS.indexOf(tier);
    return { layer, col, row };
  });
}

function paintBody(canvas, im, plan) {
  const cw = im.naturalWidth / SKIN_COLS, ch = im.naturalHeight / SKIN_ROWS;
  canvas.width = Math.round(cw); canvas.height = Math.round(ch);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  plan.forEach(p => ctx.drawImage(im, p.col * cw, p.row * ch, cw, ch, 0, 0, canvas.width, canvas.height));
}

/* Topmost muscle with paint under the tap, read from the sheet itself —
   so hit areas always match the art, whatever shape a skin gives a muscle. */
const _probe = document.createElement('canvas');
_probe.width = _probe.height = 1;
function muscleAt(im, plan, fx, fy) {
  const cw = im.naturalWidth / SKIN_COLS, ch = im.naturalHeight / SKIN_ROWS;
  const ctx = _probe.getContext('2d', { willReadFrequently: true });
  for (let i = plan.length - 1; i >= 0; i--) {
    const p = plan[i];
    if (p.layer === 'base') continue;
    ctx.clearRect(0, 0, 1, 1);
    ctx.drawImage(im, p.col * cw + fx * cw, p.row * ch + fy * ch, 1, 1, 0, 0, 1, 1);
    if (ctx.getImageData(0, 0, 1, 1).data[3] > 40) return p.layer;
  }
  return null;
}

function viewMuscleMap() {
  const ms = muscleScores();
  if (!ms.length) return '';
  const def = BODY_SKINS.find(s => s.id === bodySkinId());
  const skinName = def ? def.name : 'Custom';
  return `
  <div class="card" style="margin-bottom:13px">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="eyebrow">Muscle map</div>
      <button class="chip" id="bodySkinBtn" style="cursor:pointer">Skin: ${esc(skinName)} ▾</button>
    </div>
    <div class="row" style="gap:14px;align-items:flex-start">
      <div class="grow" style="text-align:center">
        <canvas data-bodyview="front" style="width:100%;height:auto;aspect-ratio:1/2;display:block;cursor:pointer"></canvas>
        <div class="sub" style="margin-top:4px">Front</div>
      </div>
      <div class="grow" style="text-align:center">
        <canvas data-bodyview="back" style="width:100%;height:auto;aspect-ratio:1/2;display:block;cursor:pointer"></canvas>
        <div class="sub" style="margin-top:4px">Back</div>
      </div>
    </div>
    ${def && def.legend ? `<div class="row" style="gap:5px;margin-top:12px;flex-wrap:wrap">
      ${TIERS.map((t, i) => `<span class="row" style="gap:4px;align-items:center;font-size:10.5px;color:var(--dim)">
        <i style="width:9px;height:9px;border-radius:2px;background:${def.legend[i]};display:inline-block"></i>${t}</span>`).join('')}
      <span class="row" style="gap:4px;align-items:center;font-size:10.5px;color:var(--dim)">
        <i style="width:9px;height:9px;border-radius:2px;background:#4a5263;display:inline-block"></i>Not ranked</span>
    </div>` : ''}
    <div class="sub" style="margin-top:8px">Tap a muscle for its score.</div>
  </div>`;
}

/* Called after the analytics page renders. */
function wireMuscleMap(v) {
  const canvases = [...v.querySelectorAll('canvas[data-bodyview]')];
  const btn = $('#bodySkinBtn', v);
  if (btn) btn.onclick = openBodySkins;
  if (!canvases.length) return;
  const scores = {};
  muscleScores().forEach(m => { scores[m.key] = m.score; });
  const id = bodySkinId();
  skinImage(id).then(im => {
    canvases.forEach(cv => {
      const plan = skinPlan(cv.dataset.bodyview, scores);
      paintBody(cv, im, plan);
      cv.onclick = e => {
        const r = cv.getBoundingClientRect();
        const key = muscleAt(im, plan, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
        if (!key) return;
        const m = muscleScores().find(x => x.key === key);
        if (!m) return toast(`${MUSCLES[key]} — no ranked lift trains it yet`);
        const i = clamp(Math.floor(m.score / 20), 0, 4);
        toast(`${m.name} · ${Math.round(m.score)} · ${TIERS[i]} — from ${m.lifts} ranked lift${m.lifts === 1 ? '' : 's'}`);
      };
    });
  }).catch(() => {
    /* A missing custom sheet (cleared storage) falls back rather than
       leaving an empty card. */
    if (id !== BODY_SKINS[0].id) { S.settings.bodySkin = BODY_SKINS[0].id; save(); render(); }
  });
}

function openBodySkins() {
  const cur = bodySkinId();
  modal({
    title: 'Muscle map skin',
    body: `
      <div class="sub" style="margin-bottom:10px">A skin is one image holding every muscle at every tier. Paint your own on the paint guide and import it.</div>
      <div id="bsList">
        ${[...BODY_SKINS, { id: 'custom', name: 'Custom (imported)' }].map(s => `
          <button class="btn ${s.id === cur ? '' : 'ghost'}" data-bs="${s.id}" style="width:100%;margin-bottom:7px;justify-content:flex-start">
            ${s.id === cur ? '✓ ' : ''}${esc(s.name)}</button>`).join('')}
      </div>
      <div class="hr"></div>
      <button class="btn ghost" id="bsImport" style="width:100%;margin-bottom:7px">Import a skin sheet (PNG)…</button>
      <a class="btn ghost" href="r%26d/skins/paint-guide.png" download="ironlog-skin-paint-guide.png" style="width:100%;text-align:center;display:block;text-decoration:none">Download the paint guide</a>
      <input type="file" id="bsFile" accept="image/png,image/webp" style="display:none">`,
    onOpen: bg => {
      const pick = id => {
        S.settings.bodySkin = id; save(); closeModal(); render();
      };
      bg.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => {
        const id = b.dataset.bs;
        if (id !== 'custom') return pick(id);
        storeGet(BODY_SKIN_KEY).then(u => u ? pick('custom') : $('#bsFile', bg).click());
      });
      $('#bsImport', bg).onclick = () => $('#bsFile', bg).click();
      $('#bsFile', bg).onchange = e => {
        const f = e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          try {
            const im = await loadImage(rd.result);
            if (!skinSheetOk(im)) return toast(`That image isn't a skin sheet — it needs the paint guide's 11 × 12 grid of 1:2 cells.`);
            if (!(await storePut(BODY_SKIN_KEY, rd.result))) return toast('Could not save the skin on this device');
            delete _skinImg.custom;
            pick('custom');
            toast('Skin imported');
          } catch (err) { toast('Could not read that image'); }
        };
        rd.readAsDataURL(f);
      };
    },
  });
}

/* ---------------- PR engine ---------------- */
// Returns every logged (completed, non-warmup) set for an exercise, oldest first.
// `before` (ISO date) limits it to sessions dated earlier — "history as it stood".
// A set is a set when it has reps; weight may be 0 (pull ups, dips, planks).
function historyFor(key, before) {
  const out = [];
  S.workouts.filter(wo => wo.status === 'completed' && (!before || wo.date < before)).forEach(wo => {
    // weight × reps only: capped sets, carries and races keep their own records
    wo.exercises.filter(e => exKey(e) === key && inRepsPool(e)).forEach(e => {
      e.sets.filter(s => s.done && isPRSet(s) && s.r > 0).forEach(s => {
        out.push({ date: wo.date, w: s.w, r: s.r, rpe: s.rpe, e1: e1rm(s.w, s.r, s.rpe), workoutId: wo.id, est: wo.source === 'backfill' });
      });
    });
  });
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function statsFor(key, before) {
  const h = historyFor(key, before);
  if (!h.length) return null;
  const sessions = [...new Set(h.map(s => s.date))].sort();
  /* Backfilled sets are the plan's prescription, not what came off the bar.
     They count toward volume and consistency but must not set a PR. */
  const real = h.filter(s => !s.est);
  /* Counting backfilled sets is the default: for anyone who entered their
     real training history that way, excluding them throws the history out
     the moment one live set lands. Turn it off in Settings if the backfill
     really was just the plan's prescription. */
  const countEst = S.settings.prCountEst !== false;
  const prSrc = countEst ? h : (real.length ? real : h);
  let best = prSrc[0], bestW = prSrc[0], bestBw = null;
  const byRep = {};                    // reps -> heaviest weight
  let volume = 0;
  prSrc.forEach(s => {
    if (s.e1 > best.e1) best = s;
    if (s.w > bestW.w || (s.w === bestW.w && s.r > bestW.r)) bestW = s;
    if (!byRep[s.r] || s.w > byRep[s.r].w) byRep[s.r] = s;
    if (!(s.w > 0) && (!bestBw || s.r > bestBw.r)) bestBw = s;   // bodyweight rep record
  });
  h.forEach(s => { volume += s.w * s.r; });
  // per-session best e1RM series
  const series = sessions.map(d => {
    const ss = h.filter(s => s.date === d);
    return {
      date: d,
      e1: Math.max(...ss.map(s => s.e1)),
      top: Math.max(...ss.map(s => s.w)),
      vol: ss.reduce((a, s) => a + s.w * s.r, 0),
      sets: ss.length,
    };
  });
  const first = series[0], last = series[series.length - 1];
  const delta = last.e1 - first.e1;
  const pct = first.e1 ? (delta / first.e1) * 100 : 0;
  return {
    key, name: leafName(key), leaf: keyLeaf(key),
    sessions: sessions.length, totalSets: h.length, volume,
    best, bestW, bestBw, byRep, series, first, last, delta, pct,
    bestIsEst: !!best.est, bestWIsEst: !!bestW.est,
    estOnly: !real.length,
    lastDate: sessions[sessions.length - 1], firstDate: sessions[0],
  };
}

// map of exercise -> stats, cached per render pass
let _statCache = null;
function allStats() {
  if (_statCache) return _statCache;
  const names = new Set();
  S.workouts.filter(w => w.status === 'completed').forEach(wo => wo.exercises.forEach(e => names.add(exKey(e))));
  _statCache = [...names].filter(Boolean).map(k => statsFor(k)).filter(Boolean)
    .sort((a, b) => b.sessions - a.sessions || a.name.localeCompare(b.name));
  return _statCache;
}
function bust() { _statCache = null; _prCache = null; }

function prFor(name) { return statsFor(name); }

/* One rule for "does this set beat the history?" — shared by the live tick,
   voice logging, finishWorkout and the derived PR list below, so they can't
   drift. `st` is statsFor() output for the history being beaten; null means
   nothing logged yet, which is "first time", not a PR. RPE counts on both
   sides of the comparison: history's e1 already includes it. */
function beatsBest(st, w, r, rpe) {
  if (!st) return false;
  /* Bodyweight (w = 0): e1RM is meaningless, so the record is reps. Compared
     only against earlier bodyweight sets of the same movement — a weighted
     history is never "beaten" by an unloaded set. */
  if (!(w > 0)) return !!st.bestBw && r > st.bestBw.r;
  return e1rm(w, r, rpe) > st.best.e1;
}

/* The session's best set of an exercise: heaviest e1RM if anything was
   loaded, otherwise most reps. */
function bestSetOf(sets) {
  const loaded = sets.filter(s => s.w > 0);
  if (loaded.length) return loaded.reduce((a, b) => e1rm(b.w, b.r, b.rpe) > e1rm(a.w, a.r, a.rpe) ? b : a);
  return sets.reduce((a, b) => b.r > a.r ? b : a);
}

/* PRs derived at read time from the history dated before the session, so
   imports, backfills, deletions and edits are all reflected. summary.prs is
   still written at finish (the summary modal shows it, "first time" and all)
   but nothing else treats it as truth. One entry per exercise: its best set. */
let _prCache = null;
function prsFor(wo) {
  if (!_prCache) _prCache = new Map();
  if (_prCache.has(wo.id)) return _prCache.get(wo.id);
  const out = [];
  wo.exercises.forEach(e => {
    out.push(...shapePRs(e, wo.date, wo.id));   // holds, carries, races, caps, series
    if (!inRepsPool(e)) return;
    const sets = e.sets.filter(s => s.done && isPRSet(s) && s.r > 0);
    if (!sets.length) return;
    const st = statsFor(exKey(e), wo.date);
    if (!st) return;
    const best = bestSetOf(sets);
    if (beatsBest(st, best.w, best.r, best.rpe)) {
      out.push({ name: exName(e), key: exKey(e), w: best.w, r: best.r, e1: e1rm(best.w, best.r, best.rpe), prev: st.best.e1,
                 prevReps: st.bestBw ? st.bestBw.r : 0 });
    }
  });
  _prCache.set(wo.id, out);
  return out;
}

// Best single. An actual 1-rep set always wins — that's the real PR. If you've
// never pulled a true single we fall back to the best estimate and flag it.
// `e1` carries the best estimate alongside, so a big rep PR still shows up.
function bestSingleInfo(key) {
  const st = statsFor(key);
  if (!st) return { kg: 0, est: false, e1: 0 };
  const single = st.byRep[1];
  return single
    ? { kg: single.w, est: false, e1: st.best.e1 }
    : { kg: st.best.e1, est: true, e1: st.best.e1 };
}
function bestSingleKg(key) { return bestSingleInfo(key).kg; }

/* ---------------- plausibility ----------------
   Catches the fat-finger set — 2250 for 225, 80 reps for 8, a lb figure typed
   into a kg field — before it lands as a PR and skews every comparison after
   it. Every rule is a "does this look right?" prompt, never a block: a real
   300 kg pull must still be loggable. `before` reads history as it stood
   before a date, so editing an old session compares against what was true
   then rather than against itself. */
const PLAUS = {
  maxReps: 60,        // one set; past this it's a typo or a timed hold in the wrong field
  maxKg: 500,         // beyond the heaviest competition lifts
  overBest: 1.5,      // heavier than 1.5× your heaviest ever set of this movement
  overE1: 1.4,        // e1RM 40% past your best
  overElite: 1.5,     // no history: 1.5× the elite standard for your bodyweight
};

function plausibility(key, w, r, rpe, before) {
  const name = leafName(key);
  const why = [];
  if (r > PLAUS.maxReps) why.push(`${r} reps in one set`);
  if (w > PLAUS.maxKg) why.push(`${wt(w)} is beyond any recorded lift`);
  if (rpe != null && (rpe < 1 || rpe > 10)) why.push(`${rpeToRir(rpe)} RIR — that's outside the usual 0 to 9 range`);
  const st = statsFor(key, before);
  const loaded = st && st.bestW.w > 0;
  if (loaded && w > 0) {
    const best = st.bestW.w;
    const lbAsKg = w / 2.2046226218;
    if (U() === 'kg' && w > best * 1.3 && lbAsKg >= best * 0.5 && lbAsKg <= best * 1.15) {
      why.push(`${wt(w)} looks like a lb figure — your heaviest ${name} is ${wt(best)}`);
    } else if (w > best * PLAUS.overBest) {
      why.push(`${wt(w)} is ${Math.round((w / best - 1) * 100)}% over your heaviest ${name} (${wt(best)})`);
    } else if (r > 0 && e1rm(w, r, rpe) > st.best.e1 * PLAUS.overE1) {
      const e1 = e1rm(w, r, rpe);
      why.push(`e1RM ${wt(e1)} is ${Math.round((e1 / st.best.e1 - 1) * 100)}% over your best (${wt(st.best.e1)})`);
    }
  } else if (w > 0) {
    const th = stdFor(name), bw = bodyweightKg();
    if (th && bw && w > th[4] * bw * PLAUS.overElite) {
      why.push(`${wt(w)} is ${(w / bw).toFixed(1)}× bodyweight — past the elite standard for ${name}, with nothing logged yet`);
    }
  }
  return why;
}

function plausLine(key, s) {
  const name = leafName(key);
  return `${name} · ${s.w > 0 ? wt(s.w) + ' × ' : ''}${s.r} reps${s.rpe != null ? ' @ ' + rpeToRir(s.rpe) + ' RIR' : ''}`;
}

/* One set, one prompt. `ok` runs only on "Log anyway". */
function plausDlg(key, s, why, ok) {
  const name = leafName(key);
  modal({
    title: 'Does this look right?',
    body: `<div style="font-weight:700;margin-bottom:6px">${esc(plausLine(key, s))}</div>
      <ul class="plaus">${why.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="sub">Fix the numbers, or log it as typed.</div>`,
    foot: `<button class="btn ghost" data-close>Fix it</button><button class="btn primary" id="plOk">Log anyway</button>`,
    onOpen: bg => { $('#plOk', bg).onclick = () => { closeModal(); ok(); }; },
  });
}

/* Several sets at once, at finish or after an edit — anything ticked and then
   retyped never went past the single-set prompt. */
function plausListDlg(flagged, verb, ok) {
  modal({
    title: 'Some sets look off',
    body: `${flagged.map(f => `<div class="card tight" style="margin-bottom:8px">
        <div style="font-weight:700">${esc(f.name)} · ${esc(f.s.w > 0 ? wt(f.s.w) + ' × ' : '')}${f.s.r} reps</div>
        <ul class="plaus" style="margin-bottom:0">${f.why.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>`).join('')}
      <div class="sub">Go back and fix them, or ${esc(verb.toLowerCase())} as they are.</div>`,
    foot: `<button class="btn ghost" data-close>Go back</button><button class="btn primary" id="plOk">${esc(verb)} anyway</button>`,
    onOpen: bg => { $('#plOk', bg).onclick = () => { closeModal(); ok(); }; },
  });
}

/* ---------------- testing log ----------------
   A test is a completed session flagged `tested`, holding one 1-rep set per
   lift attempted. Log one lift or three — whatever actually got tested that
   day. Because it lands as a normal 1-rep set, bestSingleInfo picks it up as
   a true single rather than an Epley estimate, and everything downstream —
   total, DOTS, rankings, opener suggestions — follows without a second path. */
function logTest(date, entries, notes) {
  const clean = entries.filter(e => e.leaf && e.kg > 0);
  if (!clean.length) return 0;
  S.workouts.push({
    id: uid(), date, name: clean.length === 1 ? `${shortLift(displayName(clean[0].leaf))} test` : 'Max test',
    status: 'completed', source: 'logged', tested: true, notes: notes || '',
    exercises: clean.map(e => ({
      leaf: e.leaf, legacyName: e.legacyName || displayName(e.leaf), notes: '', mods: [],
      sets: [{ w: e.kg, r: 1, rpe: null, done: true, setType: 'working' }],
    })),
    start: null, end: parseISO(date).getTime(),
    summary: { mins: 0, prs: [], volume: clean.reduce((t, e) => t + e.kg, 0) },
  });
  save(); bust();
  return clean.length;
}

function testLog() {
  return S.workouts.filter(w => w.tested)
    .sort((a, b) => a.date < b.date ? 1 : -1);
}

/* Most recent tested single for a lift — recency beats magnitude here, because
   an opener should reflect where you are now, not the best day you ever had. */
/* Keyed on the leaf. It matched on x.name until now, which no entry has carried
   since 0.7.0 — so it always returned null and meets silently fell back to
   planned attempts, never using a tested single. */
function latestTest(key) {
  for (const w of testLog()) {
    const e = (w.exercises || []).find(x => exKey(x) === key);
    if (e && e.sets[0] && e.sets[0].w > 0) return { kg: e.sets[0].w, date: w.date };
  }
  return null;
}

function openerPct() { return S.settings.openerPct || 90; }

/* Suggested opener from the latest test, not from the goal third. Returns null
   when the lift hasn't been tested — better a blank than a number derived from
   a rep-max estimate, which is what the opener is meant to replace. */
function testedOpener(key) {
  const t = latestTest(key);
  if (!t) return null;
  return { kg: roundBar(t.kg * (openerPct() / 100)), from: t.kg, date: t.date };
}

/* ---------------- UI helpers ---------------- */
/* Where a completed session's numbers came from. Only a backfill is the plan's
   prescription rather than real lifting, so only it gets the EST caveat. */
function srcChip(w) {
  if (w.source === 'backfill') return ' <span class="chip">EST</span>';
  if (w.source === 'imported') return ' <span class="chip blue">IMPORT</span>';
  return '';
}

/* Tapping a set field selects what's in it, so typing replaces the number
   rather than appending to it — mid-session you are overwriting the last
   set's value, not editing one digit of it. On focus only: once the field is
   open a second tap places a caret as usual. select() rather than
   setSelectionRange because Chrome throws on selectionStart for
   input[type=number]; deferred a tick so the browser's own caret placement
   (which lands after focus on touch) doesn't collapse the selection. */
function selectOnFocus(inp) {
  inp.onfocus = () => setTimeout(() => {
    try { inp.select(); } catch (e) { /* not selectable — leave the caret */ }
  }, 0);
}

/* ---------------- accessibility (roadmap C4) ----------------
   One pass over whatever was just drawn, run after every render and every
   modal, and again when a modal redraws itself: names for controls whose
   meaning comes from their row, labels tied to their fields, table headers
   that say something. Doing it here rather than in each template keeps the
   hundred-odd templates readable and means a new one is covered by default. */
let _lblSeq = 0;
const SET_FIELD = { w: () => `weight (${U()})`, r: () => 'reps', rpe: () => 'RIR', sec: () => 'time', m: () => 'metres', n: () => 'implements' };
function a11yPass(root) {
  if (!root || !root.querySelectorAll) return;
  // a visible label beside a control, but not tied to it
  root.querySelectorAll('.field').forEach(f => {
    const lab = f.querySelector(':scope > label');
    const ctl = f.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea');
    if (!lab || !ctl || lab.contains(ctl) || ctl.hasAttribute('aria-label') || ctl.hasAttribute('aria-labelledby')) return;
    if (ctl.id && lab.htmlFor === ctl.id) return;
    if (!lab.id) lab.id = 'lb' + (++_lblSeq);
    ctl.setAttribute('aria-labelledby', lab.id);
  });
  // set rows: every box and button says which set it belongs to
  root.querySelectorAll('tr[data-row], .settable tbody tr').forEach(tr => {
    const no = tr.querySelector('.setno');
    const n = no ? no.textContent.trim() : '';
    const set = n === 'W' ? 'Warm-up set' : n === '↳' ? 'Drop set' : `Set ${n.replace(/^[TBA]/, '')}`;
    tr.querySelectorAll('input[data-f], input[data-ef]').forEach(i => {
      if (i.hasAttribute('aria-label') && !i.dataset.a11y) return;
      const f = SET_FIELD[i.dataset.f || i.dataset.ef];
      if (f) { i.setAttribute('aria-label', `${set} ${f()}`); i.dataset.a11y = '1'; }
    });
    const chk = tr.querySelector('.chk');
    if (chk) { chk.setAttribute('aria-label', `${set} done`); chk.setAttribute('aria-pressed', chk.classList.contains('on') ? 'true' : 'false'); }
    const del = tr.querySelector('.delset');
    if (del) del.setAttribute('aria-label', `Delete ${set.toLowerCase()}`);
    const pl = tr.querySelector('[data-plates]');
    if (pl) pl.setAttribute('aria-label', `Plates for ${set.toLowerCase()}`);
  });
  root.querySelectorAll('.settable th').forEach(th => {
    if (th.textContent.trim()) return;
    const w = th.classList.contains('c-del') ? 'Delete' : th.classList.contains('c-pl') ? 'Tools' : th.classList.contains('c-chk') ? 'Done' : 'Actions';
    th.innerHTML = `<span class="sr">${w}</span>`;
  });
  root.querySelectorAll('[data-ex-menu]').forEach(b => b.setAttribute('aria-label', 'Exercise options'));
  root.querySelectorAll('.setno[data-warm], .setno[data-ewarm]').forEach(b => b.setAttribute('aria-haspopup', 'dialog'));
  // the current tab, said rather than only coloured
  root.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false')));
}
// redraws inside a modal (tabs, lists) replace their HTML — cover those too
new MutationObserver(ms => {
  const roots = new Set(ms.map(m => m.target.closest ? (m.target.closest('.modal') || m.target.closest('#view')) : null).filter(Boolean));
  roots.forEach(a11yPass);
}).observe(document.body, { childList: true, subtree: true });

function toast(msg, cls = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + cls;
  el.textContent = msg;   // plain text only — exercise names come from the user, CSV imports and JSON files
  $('#toastRoot').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2400);
}

let modalStack = [];
function modal({ title, body, foot, onOpen, wide, sticky, onClose }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const hid = 'mh' + (++modalSeq);
  bg.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="${hid}">
      <div class="modal-head"><h2 id="${hid}" tabindex="-1">${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
      <div class="modal-body" tabindex="0">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
    </div>`;
  bg._ret = document.activeElement;   // focus goes back here when it closes
  /* sticky: a stray tap on the backdrop must not end a running timer. */
  bg.addEventListener('click', e => {
    if ((e.target === bg && !sticky) || e.target.hasAttribute('data-close')) { closeModal(); if (onClose) onClose(); }
  });
  $('#modalRoot').appendChild(bg);
  modalStack.push(bg);
  if (onOpen) onOpen(bg);
  a11yPass(bg);
  // a screen reader lands on the title, unless onOpen already put focus somewhere inside
  if (!bg.contains(document.activeElement)) { try { $('h2', bg).focus({ preventScroll: true }); } catch (e) { /* old browser */ } }
  return bg;
}
let modalSeq = 0;
function closeModal() {
  const m = modalStack.pop();
  if (!m) return;
  m.remove();
  const r = m._ret;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { try { r.focus({ preventScroll: true }); } catch (e) { /* gone */ } }
}
function closeAllModals() { modalStack.forEach(m => m.remove()); modalStack = []; }

function confirmDlg(msg, onYes, yesLabel = 'Delete', onNo) {
  modal({
    title: 'Are you sure?',
    body: `<p style="margin:0;color:var(--dim)">${esc(msg)}</p>`,
    foot: `<button class="btn ghost" id="cfmNo" data-close>Cancel</button><button class="btn danger" id="cfmYes">${esc(yesLabel)}</button>`,
    onOpen: bg => {
      $('#cfmYes', bg).onclick = () => { closeModal(); onYes(); };
      if (onNo) $('#cfmNo', bg).onclick = () => { closeModal(); onNo(); };
    },
  });
}

function bar(pct, cls = '') {
  const p = clamp(pct, 0, 100);
  return `<div class="bar ${p >= 100 ? 'done' : cls}"><i style="width:${p}%"></i></div>`;
}

/* line chart: data = [{date, v}] */
/* One line per variant, overlaid on a shared date axis. Section 4.5: never
   merged, never averaged — aggregating across variants is a lie, because a
   machine press and a competition bench are not the same lift. Series may
   cover different dates, so the x axis is the union of all of them. */
const SERIES_COLORS = ['var(--accent)', 'var(--blue)', 'var(--green)', 'var(--purple)', 'var(--gold)'];
function chartMulti(series, { h = 170, fmt = v => nice(v) } = {}) {
  const live = series.filter(s => s.points.length);
  if (!live.length) return `<div class="empty">No data yet</div>`;
  const dates = [...new Set(live.flatMap(s => s.points.map(p => p.date)))].sort();
  const vals = live.flatMap(s => s.points.map(p => p.v));
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min = min * 0.95 || 0; max = max * 1.05 || 1; }
  const span = max - min || 1;
  min -= span * 0.08; max += span * 0.08;
  const W = 320, H = h, padL = 34, padR = 8, padT = 12, padB = 20;
  const x = d => padL + (dates.length === 1 ? (W - padL - padR) / 2
    : dates.indexOf(d) * (W - padL - padR) / (dates.length - 1));
  const y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * (i / 4), yy = y(v);
    grid += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" opacity=".5"/>
             <text class="axis" x="${padL - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  const lines = live.map((s, si) => {
    const c = s.color || SERIES_COLORS[si % SERIES_COLORS.length];
    const pts = s.points.map(p => [x(p.date), y(p.v)]);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    // inline style, not the stroke attribute: .chart .ln in the stylesheet outranks an attribute
    return `<path class="ln" d="${d}" style="stroke:${c}" fill="none"/>` +
      pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${c}"/>`).join('');
  }).join('');
  const labIdx = dates.length <= 2 ? dates.map((_, i) => i) : [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
  const xlabs = labIdx.map(i => {
    const anchor = i === 0 ? 'start' : i === dates.length - 1 ? 'end' : 'middle';
    return `<text class="axis" x="${x(dates[i]).toFixed(1)}" y="${H - 5}" text-anchor="${anchor}">${parseISO(dates[i]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`;
  }).join('');
  const legend = live.length > 1 ? `<div class="legend">${live.map((s, si) =>
    `<span><i style="background:${s.color || SERIES_COLORS[si % SERIES_COLORS.length]}"></i>${esc(s.label)}</span>`).join('')}</div>` : '';
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    ${grid}${lines}${xlabs}</svg>${legend}</div>`;   // legend inside the box: the 98 skin restates colours per surface, so outside it the swatches drift from the lines
}

function chart(data, { color = 'var(--accent)', h = 150, fmt = v => nice(v) } = {}) {
  if (data.length === 0) return `<div class="empty">No data yet</div>`;
  const W = 320, H = h, padL = 34, padR = 8, padT = 12, padB = 20;
  const vals = data.map(d => d.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min = min * 0.95 || 0; max = max * 1.05 || 1; }
  const span = max - min || 1;
  min -= span * 0.08; max += span * 0.08;
  const x = i => padL + (data.length === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (data.length - 1));
  const y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

  const pts = data.map((d, i) => [x(i), y(d.v)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${H - padB} L${pts[0][0].toFixed(1)},${H - padB} Z`;
  const bestIdx = vals.indexOf(Math.max(...vals));

  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * (i / ticks);
    const yy = y(v);
    grid += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" opacity=".5"/>
             <text class="axis" x="${padL - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  // x labels: first, middle, last
  const labIdx = data.length <= 2 ? data.map((_, i) => i) : [0, Math.floor((data.length - 1) / 2), data.length - 1];
  const xlabs = labIdx.map(i => {
    const d = parseISO(data[i].date);
    const anchor = i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
    return `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="${anchor}">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`;
  }).join('');

  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <defs><linearGradient id="gfade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path class="area" d="${area}"/>
    <path class="ln" d="${line}" style="stroke:${color}"/>
    ${pts.map((p, i) => `<circle class="pt${i === bestIdx ? ' best' : ''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === bestIdx ? 4 : 3}" fill="${i === bestIdx ? 'var(--gold)' : color}"/>`).join('')}
    ${xlabs}
  </svg></div>`;
}

/* ============================================================
   WELCOME AND HELP — roadmap C1
   Three short steps on a fresh install: what Ironlog is (and isn't), units
   and the lifter, what they're training for. Only ever on a device with no
   sessions and no check-ins, and only until it's been finished or skipped —
   a restore or an import on step one ends it too.
   ============================================================ */
const DISCLAIMER = 'Ironlog gives general training information, not medical or physiotherapy advice. If you have an injury or a health condition, check with a professional first. You are responsible for what you lift — use safeties, spotters and judgement.';
const TRAINING_FOR = [
  ['general', 'Getting stronger', 'No competition in mind — log, see PRs and progress.'],
  ['powerlifting', 'Powerlifting', 'Squat, bench and deadlift on a platform.'],
  ['strengthlifting', 'Strengthlifting', 'Squat, press and deadlift.'],
  ['single-lift', 'A single-lift meet', 'Bench-only, deadlift-only, or whatever the meet contests.'],
  ['para', 'Para powerlifting', 'Bench press in WPPO classes, with a record attempt.'],
  ['strongman', 'Strongman', 'Carries, loads, presses and medleys.'],
];
function welcomeDue() {
  return !S.settings.welcomed && !S.active && !(S.workouts || []).length && !(S.checkins || []).length;
}
function openWelcome(step = 1) {
  const done = () => { S.settings.welcomed = APP_VERSION; save(); };
  const dots = `<div class="row" style="gap:6px;justify-content:center;margin-bottom:12px" role="img" aria-label="Step ${step} of 3">${[1, 2, 3]
    .map(i => `<span style="width:8px;height:8px;border-radius:50%;background:${i === step ? 'var(--accent)' : 'var(--line)'}"></span>`).join('')}</div>`;
  if (step === 1) return modal({
    title: 'Welcome to Ironlog', sticky: true,
    body: `${dots}
      <div class="wl-list">
        <div><b>Your log stays on this phone.</b> No account and no Ironlog server — nothing about your training leaves the device unless you send it.</div>
        <div><b>Back it up to your own Google Drive</b> if you like (Settings), so a lost phone doesn't mean a lost log. Or export a file any time.</div>
        <div><b>AI is optional</b> and only runs on your own Anthropic key. Everything else works without it.</div>
      </div>
      <div class="wl-note">${esc(DISCLAIMER)}</div>
      <button class="btn wide ghost" id="wlHelp" style="margin-top:10px">Read the help &amp; FAQ</button>`,
    foot: `<button class="btn ghost" id="wlRestore">I already use Ironlog</button><button class="btn primary" id="wlNext">Get started</button>`,
    onOpen: bg => {
      $('#wlNext', bg).onclick = () => { closeModal(); openWelcome(2); };
      $('#wlHelp', bg).onclick = () => openHelp();
      $('#wlRestore', bg).onclick = () => modal({
        title: 'Bring your log over',
        body: `<p class="sub" style="margin-top:0">From your Google Drive backup, or from a file you exported (JSON, or a CSV from Ironlog, Strong, Hevy, FitNotes or Liftoff).</p>
          <button class="btn wide primary" id="wrDrive" style="margin-bottom:8px">Restore from Google Drive</button>
          <button class="btn wide" id="wrFile">Import a file</button>`,
        foot: `<button class="btn ghost" data-close>Back</button>`,
        onOpen: b2 => {
          $('#wrDrive', b2).onclick = async () => {
            const btn = $('#wrDrive', b2); btn.disabled = true; btn.textContent = 'Connecting…';
            try {
              const r = await driveSync(true);
              if (r) { done(); closeAllModals(); render(); toast(`Restored · ${r.sessions} session${r.sessions === 1 ? '' : 's'}`, 'green'); return; }
            } catch (e) { toast(e.message || 'Couldn\'t restore'); }
            btn.disabled = false; btn.textContent = 'Restore from Google Drive';
          };
          $('#wrFile', b2).onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'application/json,.json,.csv,text/csv';
            inp.onchange = ev => {
              const f = ev.target.files[0]; if (!f) return;
              done(); closeAllModals();
              if (/\.json$/i.test(f.name) || f.type === 'application/json') return importJSONFile(f);
              const rd = new FileReader();
              rd.onload = () => {
                if (/^﻿?format,/.test(rd.result) && rd.result.includes(CSV_FORMAT)) {
                  try { const r = importIronlogCSV(rd.result); render(); toast(`Imported ${r.added} sessions`, 'green'); } catch (e2) { toast('Could not read that CSV'); }
                } else openLiftoffImport(rd.result);
              };
              rd.readAsText(f);
            };
            inp.click();
          };
        },
      });
    },
  });
  if (step === 2) return modal({
    title: 'About you', sticky: true,
    body: `${dots}
      <div class="field"><label>Weights in</label>
        <div class="seg" id="wlUnits"><button data-u="kg" class="${U() === 'kg' ? 'on' : ''}">Kilograms</button><button data-u="lb" class="${U() === 'lb' ? 'on' : ''}">Pounds</button></div></div>
      <div class="field"><label>Sex <span class="dimmer">— for DOTS and strength standards</span></label>
        <div class="seg" id="wlSex"><button data-s="male" class="${S.settings.sex !== 'female' ? 'on' : ''}">Male</button><button data-s="female" class="${S.settings.sex === 'female' ? 'on' : ''}">Female</button></div></div>
      <div class="field"><label for="wlBw">Bodyweight (<span id="wlBwU">${U()}</span>) <span class="dimmer">— optional</span></label>
        <input id="wlBw" type="number" step="0.1" inputmode="decimal" value="${S.settings.bodyweight > 0 ? nice(dw(S.settings.bodyweight)) : ''}" placeholder="e.g. ${U() === 'kg' ? 80 : 176}"></div>
      <div class="sub">All of this can be changed later in Settings → Profile.</div>`,
    foot: `<button class="btn ghost" id="wlBack">Back</button><button class="btn primary" id="wlNext">Next</button>`,
    onOpen: bg => {
      const segs = (sel, attr, set) => bg.querySelectorAll(`${sel} button`).forEach(b => b.onclick = () => {
        bg.querySelectorAll(`${sel} button`).forEach(x => x.classList.toggle('on', x === b)); set(b.dataset[attr]);
      });
      segs('#wlUnits', 'u', u => { S.settings.units = u; $('#wlBwU', bg).textContent = u; });
      segs('#wlSex', 's', s => { S.settings.sex = s; });
      const keep = () => { const v = +$('#wlBw', bg).value; if (v > 0) S.settings.bodyweight = toKg(v); save(); };
      $('#wlBack', bg).onclick = () => { keep(); closeModal(); openWelcome(1); };
      $('#wlNext', bg).onclick = () => { keep(); closeModal(); openWelcome(3); };
    },
  });
  // step 3: what for, and the main lifts
  const ex = allExercises().filter(x => x.leaf.equipment === 'barbell');
  const p = priorityKeys();
  const sel = (i, label) => `<div class="field" style="margin-bottom:8px"><label>${label}</label>

/* ============================================================
   WHAT'S NEW — roadmap A2
   CHANGELOG.md sits at the root (the app loads it) and is precached with the
   shell. After an update, the entries newer than the last version seen are
   shown once. Never mid-workout — it waits for the session to end — and never
   on a fresh install. If the file can't be loaded, it says nothing and tries
   again next launch; it never blocks the app.
   ============================================================ */
function verCmp(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
  return 0;
}
let _changelog = null;
function loadChangelog() {
  if (!_changelog) {
    _changelog = fetch('CHANGELOG.md').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .catch(e => { _changelog = null; throw e; });
  }
  return _changelog;
}
/* Entries start at "## "; everything above the first one (the note on how to
   keep the file) is for whoever edits it, not for the app. */
function parseChangelog(text) {
  const out = [];
  String(text).replace(/\r\n?/g, '\n').split('\n').forEach(line => {
    if (line.startsWith('## ')) {
      const head = line.slice(3).trim();
      const m = head.match(/^(\d+\.\d+\.\d+)/);
      out.push({ head, version: m ? m[1] : null, lines: [] });
    } else if (out.length) out[out.length - 1].lines.push(line);
  });
  return out;
}
/* The small subset the changelog uses: "- " bullets (indented lines carry
   on the bullet), paragraphs, **bold**, `code`, [links](url). Escaped first,
   so nothing in the file can become markup it didn't ask for. */
function mdInline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdBlock(lines) {
  const blocks = [];
  let cur = null;
  lines.forEach(l => {
    if (!l.trim() || /^-{3,}\s*$/.test(l)) { cur = null; return; }
    if (/^- /.test(l)) { cur = { li: true, text: l.slice(2) }; blocks.push(cur); return; }
    if (cur) cur.text += ' ' + l.trim();
    else { cur = { li: false, text: l.trim() }; blocks.push(cur); }
  });
  let html = '', inList = false;
  blocks.forEach(b => {
    if (b.li && !inList) { html += '<ul class="wn-list">'; inList = true; }
    if (!b.li && inList) { html += '</ul>'; inList = false; }
    html += b.li ? `<li>${mdInline(b.text)}</li>` : `<p>${mdInline(b.text)}</p>`;
  });
  return html + (inList ? '</ul>' : '');
}
function changelogHtml(entries) {
  return entries.map(e => `<section class="wn-entry"><h3>${mdInline(e.head)}</h3>${mdBlock(e.lines)}</section>`).join('');
}
function showChangelog(title, entries, note) {
  modal({
    title,
    body: `${note ? `<div class="sub" style="margin-bottom:8px">${esc(note)}</div>` : ''}${changelogHtml(entries)}`,
    foot: `<button class="btn primary wide" data-close>Got it</button>`,
  });
}
/* Settings / Help menu: the whole thing, any time. */
function openWhatsNew() {
  loadChangelog()
    .then(t => showChangelog("What's new", parseChangelog(t), `You're on ${APP_VERSION}.`))
    .catch(() => toast("Couldn't load the changelog — try again when you're online"));
}
/* The after-update sheet. Armed after first paint; re-checked on each render,
   so a sheet held back by a live session appears once it's finished. */
let whatsNewArmed = false, whatsNewBusy = false;
function maybeWhatsNew() {
  if (!whatsNewArmed || whatsNewBusy || S.active || modalStack.length) return;
  const seen = S.settings.lastSeenVersion;
  if (seen === APP_VERSION) { whatsNewArmed = false; return; }
  whatsNewBusy = true;
  loadChangelog().then(text => {
    whatsNewBusy = false;
    if (S.active || modalStack.length) return;          // try again on a later render
    const all = parseChangelog(text);
    /* No record at all means the app predates this screen: show this
       version's entry rather than the whole history. */
    const newer = all.filter(e => e.version && verCmp(e.version, APP_VERSION) <= 0
      && (seen ? verCmp(e.version, seen) > 0 : e.version === APP_VERSION));
    S.settings.lastSeenVersion = APP_VERSION;
    save();
    whatsNewArmed = false;
    if (newer.length) showChangelog(`What's new in ${APP_VERSION}`, newer);
  }).catch(() => { whatsNewBusy = false; whatsNewArmed = false; });   // offline: next launch
}

function last7() {
  return S.checkins.filter(c => daysBetween(c.date, today()) <= 7 && daysBetween(c.date, today()) >= 0);
}
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; }
function streak() {
  let n = 0, d = new Date();
  // allow today to be missing without breaking the streak
  if (!checkinFor(iso(d))) d.setDate(d.getDate() - 1);
  while (checkinFor(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// "1×5 @150, 3×5 @135" — groups consecutive identical sets
function setSummary(e) {
  const groups = [];
  e.sets.forEach(s => {
    const last = groups[groups.length - 1];
    if (last && last.w === s.w && last.r === s.r) last.n++;
    else groups.push({ n: 1, w: s.w, r: s.r });
  });
  return groups.map(g =>
    `${g.n}×${g.r || 'AMRAP'}${g.w ? ` @ ${wt(g.w)}` : ''}`).join(', ') || '—';
}

/* Volume respects the load convention: a per-side set of 20 kg x 10 is 400 kg. */
function totalVolume(wo) {
  return wo.exercises.reduce((a, e) => a + e.sets.filter(s => s.done && isWorking(s)).reduce((b, s) => b + setVolume(e.leaf, s), 0), 0);
}

function goalCurrent(g) {
  if (g.type === 'lift') return bestSingleKg(g.exercise);
  if (g.type === 'bodyweight') return bodyweightKg();
  if (g.type === 'total') return priorityKeys().reduce((a, k) => a + bestSingleKg(k), 0);
  if (g.type === 'sessions') return S.workouts.filter(w => w.status === 'completed' && (!g.since || w.date >= g.since)).length;
  return g.current || 0;
}
function goalRow(g) {
  const cur = goalCurrent(g);
  const start = g.startVal ?? 0;
  const denom = (g.target - start) || 1;
  const pct = ((cur - start) / denom) * 100;
  const isCount = g.type === 'sessions';
  const f = v => isCount ? Math.round(v) : wt(v);
  const left = g.deadline ? daysBetween(today(), g.deadline) : null;
  return `<div class="goal" data-goal="${g.id}">
    <div class="row between" style="margin-bottom:6px">
      <div class="grow"><div style="font-weight:650;font-size:14px">${esc(g.name)}</div>
        <div class="sub">${f(cur)} of ${f(g.target)}${left !== null ? ` · ${left >= 0 ? left + ' days left' : 'past deadline'}` : ''}</div></div>

        <div style="font-weight:750;font-size:15px;${pct >= 100 ? 'color:var(--green)' : ''}">${Math.round(clamp(pct, 0, 999))}%</div>
      </div>
    </div>
    ${bar(pct, g.type === 'bodyweight' ? 'blue' : '')}
  </div>`;
}

          rec.current = curRaw !== '' ? toKg(+curRaw) : (g.current || 0);
        }
        rec.startVal = startRaw !== '' ? (isCount ? +startRaw : toKg(+startRaw)) : (g.startVal ?? goalCurrent(rec));
        S.goals = S.goals.filter(x => x.id !== g.id);
        S.goals.push(rec);
        save(); closeModal(); render(); toast('Goal saved', 'green');
      };
    },
  });
}

/* ============================================================

   ============================================================ */
function viewCalendar() {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;      // Monday-first
  const daysIn = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ d: new Date(y, m - 1, prevDays - i), out: true });
  for (let i = 1; i <= daysIn; i++) cells.push({ d: new Date(y, m, i), out: false });
  while (cells.length % 7) cells.push({ d: new Date(y, m + 1, cells.length - startDow - daysIn + 1), out: true });

  const grid = cells.map(c => {
    const ds = iso(c.d);
    const wos = S.workouts.filter(w => w.date === ds);
    const hasDone = wos.some(w => w.status === 'completed');
    const hasPlan = wos.some(w => w.status === 'planned');
    return `<button class="cal-day${c.out ? ' out' : ''}${ds === today() ? ' today' : ''}${ds === calSelected ? ' sel' : ''}" data-day="${ds}">
      ${c.d.getDate()}
      <span class="dots">${hasDone ? '<i class="dot done"></i>' : ''}${hasPlan ? '<i class="dot plan"></i>' : ''}</span>
    </button>`;
  }).join('');

  // month summary
  const monthWos = S.workouts.filter(w => w.status === 'completed' && w.date.startsWith(`${y}-${String(m + 1).padStart(2, '0')}`));
  const monthVol = monthWos.reduce((a, w) => a + totalVolume(w), 0);

  return `
  <div class="card">
    <div class="cal-head">
      <button class="btn sm ghost" id="calPrev">‹</button>
      <div class="center"><div style="font-weight:750;font-size:16px">${calCursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div>
        <div class="sub">${monthWos.length} sessions · ${wt(monthVol, 0)} volume</div></div>
      <button class="btn sm ghost" id="calNext">›</button>
    </div>
    <div class="cal-dow">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend"><span><i class="dot done"></i> Completed</span><span><i class="dot plan"></i> Planned</span></div>
  </div>
  ${dayPanel(calSelected)}
  `;
}

/* An entry's one-line result: the heaviest e1RM for reps, the longest hold,
   the furthest carry, the fastest race, the most reps in a cap, the stones
   made in a series. */
function entryHeadline(e, s) {
  if (!s.length) return '—';
  const kind = kindOf(e);
  if (kind === 'series') { const c = seriesOf({ ...e, sets: s }); return c ? `${c.made}/${c.of} made${c.sec ? ' · ' + fmtSec(c.sec) : ''}` : '—'; }
  const by = f => s.reduce((a, b) => f(b) > f(a) ? b : a);
  const top = kind === 'time' ? by(x => x.sec || 0)
    : kind === 'carry' || kind === 'capcarry' ? by(x => (x.w || 0) * 1e6 + (x.m || 0) * 1e3 - (x.sec || 0) / 1e3)
    : kind === 'race' ? by(x => (x.w || 0) * 1e6 - (x.sec || 0))
    : kind === 'cap' ? by(x => (x.w || 0) * 1e3 + (x.r || 0))
    : by(x => e1rm(x.w, x.r));
  return kind === 'reps' ? `${wt(top.w)} × ${top.r}` : setText(e, top);
}

/* ---------------- exercise picker ---------------- */
function pickExercise(cb) {
  const seenRecent = new Set();
  const recent = S.workouts.filter(w => w.status === 'completed').slice(-12).reverse()
    .flatMap(w => w.exercises.filter(e => e.leaf).map(e => ({ key: exKey(e), leaf: e.leaf, name: exName(e) })))
    .filter(x => !seenRecent.has(x.key) && seenRecent.add(x.key)).slice(0, 8);
  const draw = (q) => {
    const all = allExercises();
    const ql = (q || '').toLowerCase();
    const list = ql ? all.filter(x => x.name.toLowerCase().includes(ql)) : all;
    const groups = {};
    list.forEach(x => { const c = categoryOf(x.leaf); (groups[c] = groups[c] || []).push(x); });
    let html = '';
    if (!q && recent.length) {
      html += `<div style="padding:8px 16px 4px" class="eyebrow">Recent</div>`;
      html += recent.map(item).join('');
    }
    Object.entries(groups).forEach(([c, names]) => {
      html += `<div style="padding:10px 16px 4px" class="eyebrow">${c}</div>`;
      html += names.map(item).join('');
    });
    if (q && !list.length) html = `<div class="empty">No match. Create “${esc(q)}” below.</div>`;
    return html;
  };
  /* The name is the movement; the equipment is a separate axis. Showing the
     equipment a movement can be done with — as icons, on the row itself — is
     what makes that split legible: one "Lat Raise" that can be a cable or a
     dumbbell, rather than two rows spelling it out. The icons are tappable, so
     picking the variant is one gesture rather than add-then-change; a row of
     icons that looked tappable and was not would be worse than none. */
  const eqRow = x => {
    const m = movementById(x.leaf.movement);
    const opts = (m && m.equipment) || [];
    if (opts.length < 2) return '';
    return `<div class="eqrow">${opts.map(v => `<span class="eqi ${v === x.leaf.equipment ? 'on' : ''}"
      data-pickeq="${esc(x.leaf.movement)}|${esc(v)}" title="${esc(EQ_TITLE[v] || v)}">${EQ_ICON[v] || ''}</span>`).join('')}</div>`;
  };

  const item = x => {
    const st = statsFor(x.key);
    const v = variantLabel(x.leaf);
    const meta = [v, st ? `PR ${wt(st.bestW.w)} × ${st.bestW.r} · ${st.sessions} sessions` : 'No history']
      .filter(Boolean).join(' · ');
    return `<div class="pickitem" data-pick="${esc(x.key)}">
      <div class="grow"><div class="n">${esc(x.name)}</div><div class="m">${esc(meta)}</div>${eqRow(x)}</div>
      <span class="dimmer">›</span></div>`;
  };
  modal({
    title: 'Add exercise',
    body: `<input id="pkQ" placeholder="Search or type a new exercise…" autocomplete="off">
           <div class="picklist" id="pkList" style="margin-top:12px">${draw('')}</div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn" id="pkNew">Create new</button>`,
    onOpen: bg => {
      const list = $('#pkList', bg), q = $('#pkQ', bg);
      const bind = () => {
        list.querySelectorAll('[data-pick]').forEach(el =>
          el.onclick = () => { closeModal(); cb(keyLeaf(el.dataset.pick)); });
        /* Bound after the row, and stops the event, so tapping an icon picks
           that equipment instead of the row's default leaf. */
        list.querySelectorAll('[data-pickeq]').forEach(el => el.onclick = ev => {
          ev.stopPropagation();
          const [movement, equipment] = el.dataset.pickeq.split('|');
          const m = movementById(movement);
          if (!m) return;
          closeModal();
          cb(completeLeaf(m, { equipment }));
        });
      };
      bind();
      q.oninput = () => { list.innerHTML = draw(q.value.trim()); bind(); };
      $('#pkNew', bg).onclick = () => {
        const name = q.value.trim();
        if (!name) return toast('Type a name first');
        /* A name the catalogue does not know becomes its own movement rather
           than being guessed into an existing one. */
        save(); closeModal(); cb(completeLeaf(ensureCustomMovement(name), null));
      };
      setTimeout(() => q.focus(), 60);
    },
  });
}

function startWorkout(wo) {

function newBlank() {
