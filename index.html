function fieldForMeet(m) {
  const hay = `${m.name} ${m.wclass || ''} ${m.fed || ''}`.toLowerCase();
  if (/west midlands|spring/.test(hay) && /93/.test(hay + (m.wclass || ''))) return FIELDS['wm-93-classic'];
  return null;
}

function platformPct() { return S.settings.platformPct || 96; }
const half = n => Math.round(n * 2) / 2;

/* Gym maxes aren't platform totals: openers are conservative, thirds get
   missed, and nerves cost kilos. The haircut is a blunt instrument but a
   truthful one — better than comparing a good gym day against competition
   results as though they were the same thing. */
function predictPlacing(field, gymTotal, applyHaircut = true) {
  if (!field || !gymTotal) return null;
  const total = applyHaircut ? half(gymTotal * (platformPct() / 100)) : half(gymTotal);
  const sorted = [...field.lifters].sort((a, b) => b.total - a.total);
  // ties go to the lighter lifter, and at 93kg he's at the top of the class
  const above = sorted.filter(l => l.total >= total);
  const place = above.length + 1;
  const rows = sorted.map((l, i) => ({ ...l, place: i < above.length ? i + 1 : i + 2 }));
  rows.splice(above.length, 0, { name: 'You', bw: null, total, place, me: true });
  const nxt = sorted[above.length - 1];
  return {
    total, place, fieldSize: sorted.length + 1, ladder: rows,
    costNext: nxt ? half(nxt.total + 0.5 - total) : null,
    nextName: nxt ? nxt.name : null,
  };
}

/* Total from the tested singles that existed on a given date, so the placing
   delta tracks real test results rather than needing its own log. */
function testedTotalAsOf(date) {
  const lifts = priorityKeys();
  let t = 0, found = 0;
  lifts.forEach(n => {
    const hit = testLog().filter(w => w.date <= date)
      .map(w => w.exercises.find(e => exKey(e) === n))
      .find(e => e && e.sets[0] && e.sets[0].w > 0);
    if (hit) { t += hit.sets[0].w; found++; }
  });
  return found === lifts.length ? t : null;
}

function ord(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* A competition total is made of lifts you have actually tested, not of Epley
   estimates off a set of five. An untested lift contributes nothing and says so,
   rather than quietly inflating the total and the DOTS built on it. */
function priorityStats() {
  const slots = EVENT_TYPES[DEFAULT_EVENT_TYPE].lifts;
  const lifts = priorityKeys().map((k, i) => {
    const t = latestTest(k);
    return { name: leafName(k), key: k, leaf: keyLeaf(k), slot: slots[i] ? slots[i].slot : k,
             label: slots[i] ? slots[i].label : leafName(k),
             kg: t ? t.kg : 0, tested: !!t, date: t ? t.date : null };
  });
  const total = lifts.reduce((a, l) => a + l.kg, 0);
  const untested = lifts.filter(l => !l.tested).length;
  const bw = bodyweightKg();
  return { lifts, total, untested, bw, dots: untested ? 0 : dots(total, bw, S.settings.sex) };
}

    ${past.reverse().map(m => `<div class="card tight"><div class="row between">

      <button class="btn xs ghost" data-edit-meet="${m.id}">Edit</button></div></div>`).join('')}` : ''}

function priorityLeaf(k) {
  const i = EVENT_TYPES[DEFAULT_EVENT_TYPE].lifts.findIndex(l => l.slot === k);
  const p = (S.settings.priority || [])[i];
  return p && p.leaf ? p.leaf : null;
}
function priorityKeys() { return (S.settings.priority || []).map(p => p && p.leaf ? leafKey(p.leaf) : p); }
function priorityKey(slot) { const l = priorityLeaf(slot); return l ? leafKey(l) : ''; }
function liftName(k) {
  const l = priorityLeaf(k);
  return l ? displayName(l) : k;
}

/* A tested single is better evidence than a number generated from a PDF months
   ago, so it wins — unless the meet is locked, in which case your hand-entered
   attempts stand. The planned figures are never overwritten, only outranked:
   unlock the meet and they come straight back.
   Third goes to whichever is higher. Testing above your goal third doesn't mean
   you should open at 90% of a target you've already beaten. */
/* WPPO bodyweight classes, kg. */
const PARA_CLASSES = {
  male: ['49', '54', '59', '65', '72', '80', '88', '97', '107', '107+'],
  female: ['41', '45', '50', '55', '61', '67', '73', '79', '86', '86+'],
};
/* Para attempts go up in whole kilograms (0.5 only for a record attempt). */
function attemptRound(m) { return eventType(m).para ? (kg => Math.round(kg)) : roundBar; }
function attemptsFor(m, lift) {
  const roundBar = attemptRound(m);   // shadows the plate rounding for a para event
  const slot = typeof lift === 'string' ? lift : lift.slot;
  const goal = (m.lifts && m.lifts[slot]) || 0;
  const a = (m.attempts && m.attempts[slot]) || null;
  const planned = a && (a.o || a.s)
    ? { o: a.o || 0, s: a.s || 0 }
    : goal
      ? (() => { const p = m.pct || { o: 90, s: 95 }; return { o: roundBar(goal * (p.o / 100)), s: roundBar(goal * (p.s / 100)) }; })()
      : { o: 0, s: 0 };

  const key = typeof lift === 'string' ? priorityKey(lift) : liftKey(lift);
  const t = typeof lift === 'string' ? latestTest(key) : liftBest(lift);
  // no test: the best recent e1RM, cut to a platform figure (C2)
  const e1 = !t && key ? recentE1(key) : null;
  const base = t ? t.kg : e1 ? roundBar(e1.kg * (platformPct() / 100)) : 0;
  if (!base || m.attemptsLocked) {
    return { ...planned, third: goal, from: 'planned', tested: t || null, planned };
  }
  /* Strategy (events spec §1). Standard is the rule from before strategies. */
  const st = ATTEMPT_STRATEGY[m.strategy] || ATTEMPT_STRATEGY.standard;
  const third = roundBar(st.third(goal, base));
  const o = roundBar(base * ((openerPct() + st.o) / 100));
  // second sits proportionally between opener and third rather than at a fixed %
  const s = roundBar(o + (third - o) * st.s);
  return { o, s, third, from: t ? 'tested' : 'e1rm', tested: t || null, e1, base, planned };

        <div class="stat"><div class="k">${T.complete ? 'Total' : 'Subtotal'}</div><div class="v">${T.total ? nice(dw(T.total)) : '—'}</div></div>

              <div class="res">${res === 'good' ? (i === 3 ? 'Record lift' : 'Good lift') : res === 'miss' ? 'No lift' : '&nbsp;'}</div>

          }).join('')}</div>${T.para ? '<div class="sub" style="margin-top:6px">The record attempt doesn\'t count toward your result.</div>' : ''}</div>`;
      }).join('')}

      <button class="btn wide" id="mdTests" ${T.per.some(p => p.best) ? '' : 'disabled'}>${d.saved ? '✓ Saved as tested singles' : 'Save results as tested singles'}</button>`;
  };

  const smTab = () => {
    const evs = m.events || [];
    const field = d.field || 0;
    const tot = evs.reduce((a, ev) => { const r = d.sm[ev.id] || {}; return a + (field && r.place > 0 ? Math.max(0, field + 1 - r.place) : 0); }, 0);
    return `<div class="grid2" style="margin-bottom:10px">
        <div class="field" style="margin:0"><label for="mdField">Competitors</label><input id="mdField" type="number" inputmode="numeric" value="${field || ''}" placeholder="e.g. 10"></div>
        <div class="stat"><div class="k">Points</div><div class="v">${field ? tot : '—'}</div></div>
      </div>
      ${evs.length ? evs.map(ev => {
        const r = d.sm[ev.id] || {};
        const ph = { max: U(), reps: 'reps', time: 'm:ss', distance: 'metres', hold: 'm:ss' }[ev.rule] || '';
        return `<div class="md-lift"><div class="row between"><b>${esc(ev.name || 'Event')}</b><span class="sub">${esc(smRuleText(ev))}</span></div>

      }).join('') : '<div class="sub">No events yet — add them with Edit on the event card.</div>'}
      <div class="sub" style="margin-top:6px">Points: the winner of an event scores as many as there are competitors, then one fewer per place.</div>`;

  const checkTab = () => `
    <div class="eyebrow" style="margin-bottom:6px">Rack heights</div>
    <div class="grid2">${(pts ? [] : RACK_FIELDS).map(([k, l]) => `<div class="field"><label for="mdr-${k}">${l}</label><input id="mdr-${k}" data-mdrack="${k}" value="${esc(d.rack[k] || '')}" placeholder="e.g. 7 / in 2"></div>`).join('')}</div>
    ${pts ? '<div class="field"><label for="mdr-notes">Implement notes</label><input id="mdr-notes" data-mdrack="notes" value="' + esc(d.rack.notes || '') + '" placeholder="yoke height, stone sizes…"></div>' : ''}
    <div class="eyebrow" style="margin:10px 0 6px">Gear · ${d.gear.filter(g => g.ok).length}/${d.gear.length} packed</div>
    ${d.gear.map((g, i) => `<label class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" data-mdgear="${i}" ${g.ok ? 'checked' : ''} style="width:auto"><span class="grow">${esc(g.n)}</span>
      <button class="btn xs ghost" data-mdgearrm="${i}" aria-label="Remove ${esc(g.n)}">×</button></label>`).join('')}
    <div class="row" style="gap:8px;margin-top:8px"><input id="mdGearNew" class="grow" placeholder="Add an item"><button class="btn sm" id="mdGearAdd">Add</button></div>`;

  const body = () => `<div class="seg" id="mdTabs" style="margin-bottom:12px">${tabs.map(([k, l]) => `<button data-mdtab="${k}" class="${mdTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>

    onOpen: bg => {
      const keep = () => save();

        const num = (sel, f) => { const el = $(sel, bg); if (el) el.onchange = () => { f(el.value); keep(); redraw(); }; };
        num('#mdStart', v => { d.start[(lifts[clamp(mdLift, 0, lifts.length - 1)] || {}).slot] = v; });
        num('#mdPer', v => { d.perMin = +v > 0 ? +v : 1; });
        num('#mdFlight', v => { d.flight = Math.max(1, Math.round(+v || 1)); });
        num('#mdOrder', v => { d.order = Math.max(1, Math.round(+v || 1)); });
        num('#mdBw', v => { d.bw = +v > 0 ? toKg(+v) : 0; });
        num('#mdField', v => { d.field = Math.max(0, Math.round(+v || 0)); });
        bg.querySelectorAll('[data-mdw]').forEach(el => { selectOnFocus(el); el.onchange = () => {
          const [slot, i] = el.dataset.mdw.split('.'); const arr = d.att[slot] = d.att[slot] || [];

        if (tb) tb.onclick = () => {
          const T = mdTotals(m);
          // a good record attempt doesn't score, but it was lifted: it's the tested single
          const top = p => Math.max(p.best, p.rec && p.rec.res === 'good' ? p.rec.w : 0);
          const entries = T.per.filter(p => top(p) > 0).map(p => ({ leaf: keyLeaf(liftKey(p.lift)), kg: top(p), legacyName: p.lift.label }));
          const n = logTest(m.date <= today() ? m.date : today(), entries, `${m.name} — meet results`);
          if (n) { d.saved = true; keep(); toast(`${n} result${n === 1 ? '' : 's'} saved as tested singles`, 'green'); redraw(); }
        };
        bg.querySelectorAll('[data-smres]').forEach(el => el.onchange = () => { const r = d.sm[el.dataset.smres] = d.sm[el.dataset.smres] || {}; r.res = el.value.trim(); keep(); });
        bg.querySelectorAll('[data-smplace]').forEach(el => el.onchange = () => { const r = d.sm[el.dataset.smplace] = d.sm[el.dataset.smplace] || {}; r.place = Math.max(0, Math.round(+el.value || 0)); keep(); redraw(); });
        bg.querySelectorAll('[data-mdrack]').forEach(el => el.oninput = () => { d.rack[el.dataset.mdrack] = el.value; keep(); });
        bg.querySelectorAll('[data-mdgear]').forEach(el => el.onchange = () => { d.gear[+el.dataset.mdgear].ok = el.checked; keep(); redraw(); });
        bg.querySelectorAll('[data-mdgearrm]').forEach(b => b.onclick = ev => { ev.preventDefault(); d.gear.splice(+b.dataset.mdgearrm, 1); keep(); redraw(); });
        const add = $('#mdGearAdd', bg);
        if (add) add.onclick = () => { const v = $('#mdGearNew', bg).value.trim(); if (!v) return; d.gear.push({ n: v, ok: false }); keep(); redraw(); };
      };
      wire();
    },
    onClose: () => render(),
  });
}

/* ---------------- strongman shows (events spec §4) ---------------- */
const SM_RULES = [['max', 'Max weight'], ['reps', 'Max reps'], ['time', 'Fastest time'], ['distance', 'Furthest distance'], ['hold', 'Longest hold']];
function smRuleText(ev) {
  const W = ev.w > 0 ? wt(ev.w) : '';
  switch (ev.rule) {
    case 'max': return 'max weight';
    case 'reps': return `${W ? W + ' · ' : ''}max reps${ev.cap ? ` in ${capLabel(ev.cap)}` : ''}`;
    case 'time': return `${W ? W + ' · ' : ''}${ev.target ? fmtM(ev.target) + ' ' : ''}for time${ev.cap ? `, ${capLabel(ev.cap)} cap` : ''}`;
    case 'distance': return `${W ? W + ' · ' : ''}furthest${ev.cap ? ` in ${capLabel(ev.cap)}` : ''}`;
    case 'hold': return `${W ? W + ' · ' : ''}longest hold`;
    default: return '';
  }
}
/* Your best at exactly this event, from history — the prep question. */
function smBest(ev) {
  if (!ev.key) return null;
  const k = ev.key, w0 = ev.w > 0 ? ev.w : 0, leaf = keyLeaf(k), metric = metricFor(leaf);
  if (ev.rule === 'max') { const st = statsFor(k); return st ? `${wt(st.bestW.w)} × ${st.bestW.r}` : null; }
  if (ev.rule === 'reps') {
    if (ev.cap) { const R = shapeRecords(`${k}|cap${ev.cap}`, 'cap'); const n = R.most[w0]; return n ? `${n} reps in ${capLabel(ev.cap)}` : null; }
    const n = Math.max(0, ...historyFor(k).filter(s => s.w >= w0).map(s => s.r));
    return n ? `${n} reps at ${w0 ? wt(w0) + '+' : 'any weight'}` : null;
  }
  if (ev.rule === 'time') {
    if (metric === 'race') {
      const R = shapeRecords(k, 'race');
      const hits = Object.entries(R.fast).filter(([key]) => key.startsWith(`${w0}|`) && (!ev.target || key.endsWith(`|${ev.target}`))).map(([, v]) => v);
      return hits.length ? fmtSec(Math.min(...hits)) : null;
    }
    const f = shapeRecords(k, 'carry').fast[`${w0}|${ev.target || 0}`];
    return f ? `${fmtSec(f)} for ${fmtM(ev.target)}` : null;
  }
  if (ev.rule === 'distance') {
    const far = ev.cap ? shapeRecords(`${k}|cap${ev.cap}`, 'capcarry').far[w0] : shapeRecords(k, 'carry').far[w0];
    return far ? fmtM(far) : null;
  }
  if (ev.rule === 'hold') {
    const r = holdRecords(metric === 'time' ? k : `${k}|iso`).byWeight[w0];
    return r ? fmtSec(r) : null;
  }
  return null;
}
function smLastTrained(ev) {
  if (!ev.key) return null;
  const mv = keyLeaf(ev.key).movement;
  const w = S.workouts.filter(x => x.status === 'completed' && (x.exercises || []).some(e => e.leaf && e.leaf.movement === mv))
    .sort((a, b) => a.date < b.date ? 1 : -1)[0];
  return w ? w.date : null;
}
function strongmanCard(m) {
  const days = daysBetween(today(), m.date), weeks = Math.floor(days / 7);

  return `<div class="card">
    <div class="row between" style="margin-bottom:12px">
      <div class="grow"><div style="font-weight:750;font-size:16px">${esc(m.name)}</div>
        <div class="sub">Strongman · ${fmtDate(m.date, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}${m.loc ? ' · ' + esc(m.loc) : ''}${m.fed ? ' · ' + esc(m.fed) : ''}</div></div>
      <button class="btn xs ghost" data-edit-meet="${m.id}">Edit</button>
    </div>
    <div class="row between" style="margin-bottom:12px">
      <div class="countdown"><span class="n">${days}</span><span class="sub">days out${weeks ? ` · ${weeks} week${weeks === 1 ? '' : 's'}` : ''}</span></div>
      ${m.wclass ? `<span class="chip">${esc(m.wclass)}${m.bwTarget ? ` · target ${wt(m.bwTarget)}` : ''}</span>` : ''}
    </div>

    ${m.notes ? `<div class="sub" style="margin-top:8px">“${esc(m.notes)}”</div>` : ''}
  </div>`;
}

      <div id="smEvents">${m.events.map(evRow).join('')}</div>

      <div class="field" style="margin-top:12px"><label>Notes</label><textarea id="smNotes" rows="2">${esc(m.notes || '')}</textarea></div>`,
    foot: `${ex ? '<button class="btn danger" id="smDel">Delete</button>' : ''}<button class="btn primary" id="smSave">Save show</button>`,
    onOpen: bg => {

/* ============================================================
   RUN-IN BLOCKS — roadmap C6, r&d/specs/blocks-spec.md
   An event's run-in is a list of {kind, weeks}, laid out backwards from the
   meet date at read time, so moving the meet moves the plan. The block a date
   falls in steers autoregulation: its RIR, and whether loads are set at all.
   ============================================================ */
const BLOCK_KINDS = {
  accumulation: { label: 'Accumulation', rir: 3, reps: '8–12', auto: true, color: 'var(--blue)', tip: 'build volume — more sets, moderate weights' },
  intensification: { label: 'Intensification', rir: 2, reps: '3–6', auto: true, color: 'var(--purple)', tip: 'heavier, fewer reps, volume coming down' },
  peak: { label: 'Peak', rir: 1, reps: '1–3', auto: false, color: 'var(--gold)', tip: 'heavy singles and doubles at the planned weights' },
  taper: { label: 'Taper', rir: null, reps: '', auto: false, color: 'var(--green)', tip: 'keep the weights, about half the sets — arrive fresh' },
  deload: { label: 'Deload', rir: 4, reps: '', auto: false, color: 'var(--dim)', tip: 'lighter and easier; let it recover' },
};
const BLOCK_TEMPLATES = [
  ['16 weeks', [['accumulation', 6], ['intensification', 5], ['peak', 3], ['taper', 2]]],
  ['12 weeks', [['accumulation', 4], ['intensification', 4], ['peak', 3], ['taper', 1]]],
  ['8 weeks', [['accumulation', 3], ['intensification', 3], ['peak', 1], ['taper', 1]]],
  ['Strongman 10', [['accumulation', 4], ['intensification', 3], ['peak', 2], ['taper', 1]]],
];
/* Dates for each block: the last ends the day before the meet. */
function blockDates(m) {
  const out = [];
  let end = parseISO(m.date); end.setDate(end.getDate() - 1);
  for (let i = (m.blocks || []).length - 1; i >= 0; i--) {
    const b = m.blocks[i];
    const start = new Date(end); start.setDate(start.getDate() - b.weeks * 7 + 1);
    out.unshift({ ...b, start: iso(start), end: iso(end), i });
    end = new Date(start); end.setDate(end.getDate() - 1);
  }
  return out;
}
/* The block a date falls in, from the nearest upcoming event with a run-in. */
function activeBlock(date = today()) {
  const meets = S.meets.filter(m => (m.blocks || []).length && m.date > date).sort((a, b) => a.date < b.date ? -1 : 1);
  for (const m of meets) {
    const bs = blockDates(m);
    const b = bs.find(x => x.start <= date && date <= x.end);
    if (b) {
      const week = Math.floor(daysBetween(b.start, date) / 7) + 1;
      return { meet: m, block: b, kind: BLOCK_KINDS[b.kind] || BLOCK_KINDS.accumulation, week, next: bs[b.i + 1] || null, days: daysBetween(date, m.date) };
    }
  }
  return null;
}
function runInLine(date, withTip) {
  const a = activeBlock(date);
  if (!a) return '';
  return `<div class="runin-line" style="border-color:${a.kind.color}">
    <b style="color:${a.kind.color}">${esc(a.kind.label)}</b> · week ${a.week} of ${a.block.weeks}${a.kind.rir != null ? ` · target RIR ${a.kind.rir}` : ''}${a.kind.reps ? ` · ${a.kind.reps} reps` : ''}
    · ${a.days} day${a.days === 1 ? '' : 's'} to ${esc(a.meet.name)}
    ${withTip ? `<div class="sub">${esc(a.kind.tip)}${a.kind.auto ? '' : ' — loads stay as planned'}</div>` : ''}
  </div>`;
}
function runInSection(m) {
  const bs = blockDates(m);
  if (!bs.length) return `<button class="btn wide ghost" data-runin="${m.id}" style="margin-bottom:14px">Plan the run-in — blocks counting down to this event</button>`;
  const first = parseISO(bs[0].start).getTime(), last = parseISO(m.date).getTime(), span = Math.max(1, last - first);
  const now = Date.now();
  const pos = clamp((now - first) / span, 0, 1);
  const a = activeBlock(today());
  const mine = a && a.meet.id === m.id ? a : null;
  return `<div style="margin-bottom:14px">
    <div class="row between" style="margin-bottom:6px"><span class="eyebrow">Run-in · ${bs.reduce((n, b) => n + b.weeks, 0)} weeks</span>
      <button class="btn xs ghost" data-runin="${m.id}">Edit</button></div>
    <div class="runin-bar" role="img" aria-label="${esc(bs.map(b => `${(BLOCK_KINDS[b.kind] || {}).label} ${b.weeks} weeks from ${fmtDate(b.start)}`).join(', '))}">
      ${bs.map(b => `<i style="flex:${b.weeks};background:${(BLOCK_KINDS[b.kind] || BLOCK_KINDS.accumulation).color}" title="${esc((BLOCK_KINDS[b.kind] || {}).label)} · ${fmtDate(b.start)} – ${fmtDate(b.end)}"></i>`).join('')}
      ${now >= first && now <= last ? `<span class="runin-now" style="left:${(pos * 100).toFixed(1)}%"></span>` : ''}
    </div>
    <div class="row wrap" style="gap:4px 10px;margin-top:6px">${bs.map(b => `<span class="sub" style="font-size:11px"><i class="runin-key" style="background:${(BLOCK_KINDS[b.kind] || {}).color}"></i>${esc((BLOCK_KINDS[b.kind] || {}).label)} ${b.weeks}w</span>`).join('')}</div>
    <div class="sub" style="margin-top:6px">${mine
      ? `Now: <b>${esc(mine.kind.label)}</b>, week ${mine.week} of ${mine.block.weeks}${mine.next ? ` · ${esc((BLOCK_KINDS[mine.next.kind] || {}).label)} from ${fmtDate(mine.next.start)}` : ' · then the meet'}`
      : today() < bs[0].start ? `Starts ${fmtDate(bs[0].start)} (${daysBetween(today(), bs[0].start)} days)` : ''}</div>
  </div>`;
}
function openBlocks(id) {
  const m = S.meets.find(x => x.id === id);
  if (!m) return;
  let bl = (m.blocks || []).map(b => ({ ...b }));
  if (!bl.length) {
    const wk = Math.max(0, Math.floor(daysBetween(today(), m.date) / 7));
    const tpl = eventType(m).events ? BLOCK_TEMPLATES[3] : BLOCK_TEMPLATES.find(([, b]) => b.reduce((n, x) => n + x[1], 0) <= Math.max(wk, 8)) || BLOCK_TEMPLATES[2];
    bl = tpl[1].map(([kind, weeks]) => ({ kind, weeks }));
  }
  const draw = () => {
    const probe = { date: m.date, blocks: bl };

    const total = bl.reduce((n, b) => n + b.weeks, 0);
    return `<div class="sub" style="margin-top:0">Laid out backwards from ${esc(m.name)} on ${fmtDate(m.date)}. Accumulation and intensification set your loads from RIR; peak, taper and deload keep the planned weights.</div>

      ${bl.map((b, i) => `<div class="row" style="gap:6px;align-items:center;margin-bottom:6px">

  };
  modal({

    onOpen: bg => {

   the same set the priority lifts come from — a competition lift is a barbell

/* ============================================================
   TRAINING PROGRAMS
   A program ships as window.IRONLOG_PROGRAM (see program.js) and installs
   its sessions as planned workouts. Ids are derived from the program id and
   date so re-installing can never duplicate, and removing is exact.
   ============================================================ */
/* Fetched on demand and cached for the session. theProgram() stays synchronous
   for the render paths and returns null until something has awaited
   loadProgram(); nothing renders the full program without loading it first. */
let _program = null;
function theProgram() { return _program; }
async function loadProgram() {
  if (_program) return _program;
  try {
    const r = await fetch('program.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _program = await r.json();
    return _program;
  } catch (e) {
    console.warn('program.json', e);
    return null;
  }
}
function programInstalled(id) { return S.programs.includes(id); }
/* Where a session lands, in priority order:
     1. an explicit date on the session wins — a plan written against real dates
        keeps them, and installing it changes nothing;
     2. otherwise lay it out on the weekdays the program declares, counting
        whole weeks from the start date;
     3. otherwise just count days from the start.
   Only the resolved date is stored. */
function sessionDate(P, s, startDate) {
  if (s.date) return s.date;
  const start = parseISO(startDate || today());
  const week = Math.max(1, s.week || 1) - 1;
  const day = Math.max(1, s.day || 1) - 1;
  const wd = Array.isArray(P.weekdays) && P.weekdays.length ? P.weekdays : null;
  const d = new Date(start);
  if (wd) {
    const target = wd[Math.min(day, wd.length - 1)];
    const delta = (target - start.getDay() + 7) % 7;     // first such weekday on or after the start
    d.setDate(d.getDate() + delta + week * 7);
  } else {
    d.setDate(d.getDate() + week * 7 + day);
  }
  return iso(d);
}
function programNeedsStart(P) { return (P.workouts || []).some(w => !w.date); }

/* Ids derive from content, not array position, so inserting a session no longer
   renumbers every one after it. Sessions installed before 0.10 carry the old
   positional id; installProgram checks both forms, so nothing is duplicated and
   nothing already logged is re-keyed (Phase 1 section 8.6). */
function progWorkoutId(P, s, date, slot) {
  const base = s.date || (s.week != null || s.day != null)
    ? (s.date ? `d${s.date}` : `w${s.week || 1}d${s.day || 1}`)
    : `d${date}`;
  return `${P.id}#${base}${slot > 1 ? '.' + slot : ''}`;
}
function legacyProgWorkoutId(P, i) { return `${P.id}#${i}`; }

function installProgram(P, startDate) {
  const existing = new Set(S.workouts.map(w => w.id));
  const start = startDate || (S.programStarts || {})[P.id] || today();
  if (programNeedsStart(P)) {
    S.programStarts = S.programStarts || {};
    S.programStarts[P.id] = start;
  }
  const slots = {};
  let added = 0;
  P.workouts.forEach((w, i) => {
    const date = sessionDate(P, w, start);
    const slot = (slots[date] = (slots[date] || 0) + 1);
    const id = progWorkoutId(P, w, date, slot);
    // both forms, so a plan installed before 0.10 is not installed twice over
    if (existing.has(id) || existing.has(legacyProgWorkoutId(P, i))) return;
    S.workouts.push({
      id, date, name: w.name, status: 'planned', prog: P.id, block: w.block,
      exercises: w.exercises.map(e => ({
        leaf: (resolveName(e.name) || {}).leaf || completeLeaf(customMovementFor(e.name), null), legacyName: e.name, notes: e.notes || '', mods: modsFromNote(e.notes),
        sets: e.sets.map(s => ({ w: s.w, r: s.r, rpe: null, done: false, setType: 'working' })),
      })),
    });
    added++;
  });

  (P.meets || []).forEach(m => {
    if (S.meets.some(x => x.name === m.name && x.date === m.date)) return;
    S.meets.push({ id: uid(), prog: P.id, ...m });
  });

  /* Spec section 7: a program may SUGGEST priority lifts; installing must not
     impose them. Only fill them in while they are still the untouched default —
     a lifter who has chosen their own competition lifts keeps them. */
  const stock = ['back-squat', 'bench-press', 'deadlift'];
  const untouched = (S.settings.priority || []).every((p, i) =>
    typeof p === 'string' ? p === ['Back Squat', 'Bench Press', 'Deadlift'][i]
                          : !!(p && p.leaf && p.leaf.movement === stock[i]));
  if (P.priority && untouched) {
    S.settings.priority = P.priority.slice(0, 3).map((n, i) => {
      const r = resolveName(n);
      const l = EVENT_TYPES[DEFAULT_EVENT_TYPE].lifts[i];
      return { slot: l ? l.slot : 'squat',
               leaf: r ? r.leaf : completeLeaf(customMovementFor(n), null) };
    });
  }
  if (!S.programs.includes(P.id)) S.programs.push(P.id);
  save(); bust();
  return added;
}

function removeProgram(id) {
  // only planned sessions — anything already trained stays in your history
  const before = S.workouts.length;
  S.workouts = S.workouts.filter(w => !(w.prog === id && w.status === 'planned'));
  S.meets = S.meets.filter(m => m.prog !== id);
  S.programs = S.programs.filter(x => x !== id);
  save(); bust();
  return before - S.workouts.length;
}

function programStats(P) {
  const mine = S.workouts.filter(w => w.prog === P.id);
  return {
    planned: mine.filter(w => w.status === 'planned').length,
    done: mine.filter(w => w.status === 'completed').length,
    total: P.workouts.length,
    next: mine.filter(w => w.status === 'planned' && w.date >= today())
      .sort((a, b) => a.date < b.date ? -1 : 1)[0],
  };
}

/* A plan written in weeks rather than dates needs to know when it begins.
   One question, asked once, defaulting to today. */
function installWithStart(P) {
  if (!programNeedsStart(P)) return Promise.resolve(installProgram(P));
  return new Promise(res => {
    modal({
      title: 'When does it start?',
      body: `<div class="sub" style="margin-top:0">${esc(P.name)} is written in weeks, not dates. Pick the day week 1 begins — everything else follows from it.</div>
        <div class="field" style="margin-top:12px"><label>Start date</label>
          <input type="date" id="pgStart" value="${today()}"></div>`,

/* ============================================================
   SETTINGS
   ============================================================ */
/* ---------------- backfill ----------------
   Flips planned sessions in a past window to completed at their prescribed
   loads. Those numbers are the plan's, not what actually came off the bar
   (and AMRAP sets are a guess by definition), so each session is flagged
   `source: 'backfill'`: the PR engine can exclude flagged sets from bests, the
   card shows a badge, and everything stays editable so real numbers from
   another app can replace them set by set. */
/* The window ends yesterday. Today's session is still ahead of you — sweeping it
   into a backfill would mark it done before you've trained it. */
function backfillWindow(days) {
  return {
    from: iso(new Date(Date.now() - days * 86400000)),
    to: iso(new Date(Date.now() - 86400000)),
  };
}

function backfillPlanned(days) {
  const { from, to } = backfillWindow(days);
  const hits = S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to);
  if (!hits.length) return 0;

  hits.forEach(w => {
    w.exercises.forEach(e => e.sets.forEach(s => { if (s.r > 0 || s.sec > 0) s.done = true; }));
    w.exercises = w.exercises
      .map(e => ({ ...e, sets: e.sets.filter(s => s.done) }))
      .filter(e => e.sets.length);
    w.status = 'completed';
    w.source = 'backfill';
    w.end = parseISO(w.date).getTime();
    w.summary = {
      mins: 0, prs: [],
      volume: w.exercises.reduce((t, e) =>
        t + e.sets.filter(s => isWorking(s)).reduce((x, s) => x + s.w * s.r, 0), 0),
    };
  });
  save(); bust();
  return hits.length;
}

function countPlanned(days) {
  const { from, to } = backfillWindow(days);
  return S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to).length;
}

/* ---------------- CSV import ----------------
   Liftoff exports one row per set: Date, Duration, Workout Name, Exercise Name,
   Set Order, Weight, Reps, Distance, Seconds, RPE, Notes.

   Imported history is real lifting — an actual training log from another app —
   so it lands as `source: 'imported'` and counts toward PRs unconditionally,
   never gated by prCountEst and never badged EST. That is the whole reason the
   backfilled boolean became a three-way source.

   Three things the format forces:
   - Weight comes out in pounds, as the round-trip of a kg original (176.369809748
     is 80 kg). Detected rather than assumed, and confirmable in the preview.
   - `Set Order` repeats within a session when an exercise is done in two blocks,
     so row order is the only reliable ordering.
   - A day can carry several timestamps — a session stopped and restarted. Ironlog
     dates are day-resolution, so a day is one workout. */

const LB_PER_KG = 2.2046226218;

/* Fields can be quoted and contain commas, quotes and newlines. Notes is free
   text, so parse properly rather than splitting on commas. */
function parseCSV(text, raw) {   // raw: keep values exactly (Ironlog's own CSV round-trips)
  const t = text.replace(/^\uFEFF/, '');
  // the delimiter is whichever of , ; or tab the header row uses most (Strong's newer export is ;-separated)
  const head = t.slice(0, t.indexOf('\n') < 0 ? t.length : t.indexOf('\n'));
  const cnt = ch => head.split(ch).length - 1;
  const delim = [',', ';', '\t'].reduce((a, b) => cnt(b) > cnt(a) ? b : a, ',');
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') {
        if (t[i + 1] === '"') { field += '"'; i++; }
        else q = false;
      } else field += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const hdr = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.length && r.some(v => v.trim() !== ''))
    .map(r => { const o = {}; hdr.forEach((h, i) => o[h] = raw ? (r[i] || '') : (r[i] || '').trim()); return o; });
}

/* "00 hours 30 minutes 19 seconds" -> minutes. */
function liftoffMins(d) {
  if (!d) return 0;
  const h = /(\d+)\s*hour/.exec(d), m = /(\d+)\s*minute/.exec(d);
  return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
}

/* Pounds, if converting lands on clean kg. A log kept in kg and exported in lb
   round-trips to values like 79.99999999; one kept in lb sits on whole numbers
   and fails this. Only ever the default for the toggle in the preview. */
function guessUnit(weights) {
  const w = weights.filter(x => x > 0);
  if (w.length < 3) return 'kg';
  let clean = 0;
  w.forEach(x => {
    const kg = x / LB_PER_KG;
    if (Math.abs(kg * 4 - Math.round(kg * 4)) < 0.04) clean++;
  });
  return clean / w.length > 0.8 ? 'lb' : 'kg';
}

function toKgFrom(v, unit) {
  const kg = unit === 'lb' ? v / LB_PER_KG : v;
  return Math.round(kg * 100) / 100;
}

const normEx = n => n.toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

/* Import name -> leaf. Returns { leaf, how }:
     alias  — you mapped this name before
     exact  — a catalogue name or alias, which may pin the equipment
     parsed — the equipment/grip/arm words taken out ("Smith Machine Shrug",
              "Incline Dumbbell Bench Press", "One Arm Cable Front Raise") and
              the rest matched exactly; the words become the leaf's axes
     guess  — only after dropping "seated"/"standing"; always shown for review
     new    — nothing; comes in as its own exercise unless you pick one
   An equipment word the movement can't take ("Bodyweight Lateral Raise") is a
   miss, never a quiet fallback to the default equipment: that would put the
   sets on another variant's PRs. The mapping carries the leaf, not a display
   name — a name loses the equipment on the way back in. */
const IMPORT_AXES = [
  ['smith machine', { equipment: 'smith' }], ['smith', { equipment: 'smith' }],
  ['hex bar', { equipment: 'trap_bar' }], ['trap bar', { equipment: 'trap_bar' }],
  ['safety squat bar', { equipment: 'safety_squat_bar' }], ['ssb', { equipment: 'safety_squat_bar' }],
  ['ez bar', { equipment: 'barbell', attachment: 'ez_bar' }],
  ['dumbbell', { equipment: 'dumbbells' }], ['dumbbells', { equipment: 'dumbbells' }], ['db', { equipment: 'dumbbells' }],
  ['barbell', { equipment: 'barbell' }], ['kettlebell', { equipment: 'kettlebell' }], ['kb', { equipment: 'kettlebell' }],
  ['cable', { equipment: 'cable' }], ['sled', { equipment: 'plate_loaded_machine' }],
  ['plate loaded', { equipment: 'plate_loaded_machine' }], ['machine', { equipment: 'machine' }],
  ['band', { equipment: 'resistance_band' }], ['bodyweight', { equipment: 'bodyweight' }],
  ['one arm', { execution: 'unilateral' }], ['single arm', { execution: 'unilateral' }],
  ['one leg', { execution: 'unilateral' }], ['single leg', { execution: 'unilateral' }],
  ['alternating', { execution: 'alternating' }],
  ['rope', { attachment: 'rope' }], ['v bar', { attachment: 'v_handle' }], ['v handle', { attachment: 'v_handle' }],
  ['straight bar', { attachment: 'straight_bar' }],

/* Spellings that differ only in plural or "tricep"/"triceps". */
function nameForms(s) {
  const out = new Set([s]);
  const sw = (x, a, b) => x.replace(new RegExp(`\\b${a}\\b`, 'g'), b);
  [...out].forEach(x => { out.add(sw(x, 'tricep', 'triceps')); out.add(sw(x, 'triceps', 'tricep')); out.add(sw(x, 'bicep', 'biceps')); });
  [...out].forEach(x => { out.add(x.replace(/ups$/, 'up').replace(/dips$/, 'dip').replace(/(raise|curl|press|row|squat)s$/, '$1')); });
  return [...out];
}
function resolveForms(s) {
  for (const f of nameForms(s)) { const r = resolveName(f); if (r) return r; }
  return null;
}
function smartMatch(raw) {
  const k = normEx(raw);
  if (!k) return null;
  const direct = resolveForms(k);
  if (direct) return { leaf: direct.leaf, how: 'exact' };
  let rest = ' ' + k + ' ';
  const axes = {};
  IMPORT_AXES.forEach(([ph, ax]) => {
    const re = new RegExp(` ${ph} `);
    if (re.test(rest)) { rest = rest.replace(re, ' '); Object.keys(ax).forEach(a => { if (!axes[a]) axes[a] = ax[a]; }); }
  });
  rest = rest.trim().replace(/\s+/g, ' ');
  const tryRest = (s, how) => {
    if (!s || !Object.keys(axes).length && how === 'parsed') return null;
    const r = resolveForms(s);
    if (!r) return null;
    const m = r.movement;
    let leaf = r.leaf;
    if (axes.equipment) {
      if (!(m.equipment || []).includes(axes.equipment)) return null;
      leaf = withAxis(leaf, 'equipment', axes.equipment);
    }
    if (axes.execution) {
      if (!(m.execution || []).includes(axes.execution)) return null;
      leaf = withAxis(leaf, 'execution', axes.execution);
    }
    if (axes.attachment && attachmentsFor(m, leaf.equipment).includes(axes.attachment)) leaf = withAxis(leaf, 'attachment', axes.attachment);
    return { leaf, how };
  };

    || tryRest(rest.replace(/\b(seated|standing|flat)\b/g, ' ').replace(/\s+/g, ' ').trim(), 'guess');
}
function matchExercise(name) {
  const alias = S.exAliases && S.exAliases[name];
  if (alias && String(alias).startsWith('leaf:')) {
    const l = keyLeaf(String(alias).slice(5));
    if (movementById(l.movement)) return { leaf: l, how: 'alias' };
  }
  const sm = smartMatch(name);
  if (sm) return sm;
  /* Aliases saved before 0.22.1 hold a display name, which drops the equipment
     ("Smith Machine Shrug" was saved as "Shrug"), so the matcher goes first. */
  if (alias && !String(alias).startsWith('leaf:') && alias !== '[object Object]') {
    const r = resolveName(alias);
    if (r) return { leaf: r.leaf, how: 'alias' };
  }
  const k = normEx(name);
  const own = allExercises().find(x => normEx(x.name) === k);
  if (own) return { leaf: own.leaf, how: 'exact' };
  return { leaf: null, how: 'new', suggest: suggestExercise(k) };
}

/* A suggestion only — never applied without a tap. Word overlap against
   catalogue names and aliases, so whatever it suggests is a real leaf. */
function suggestExercise(k) {
  const w = k.split(' ');
  let best = null, bs = 0;
  const { byName, byAlias } = catalogue();
  const consider = (n, hit) => {
    const pw = normEx(n).split(' ');
    const sc = w.filter(x => pw.includes(x)).length / Math.max(w.length, pw.length);
    if (sc > bs) { bs = sc; best = hit; }
  };
  byName.forEach((hit, n) => consider(n, hit));
  byAlias.forEach((hit, n) => consider(n, hit));
  return bs >= 0.5 && best ? completeLeaf(best.m, best.a) : null;
}

/* Parse to day-grouped sessions. Exercise names stay raw here; mapping is applied
   at import time, after the review screen. */
function parseLiftoff(text) {
  const rows = parseCSV(text);
  if (!rows.length || !('Exercise Name' in rows[0]) || !('Date' in rows[0])) {
    throw new Error('not a Liftoff export');
  }
  let skipped = 0;
  const good = rows.filter(r => {
    const ok = r['Exercise Name'] && r.Date && (+r.Weight > 0 || +r.Reps > 0 || +r.Seconds > 0);
    if (!ok) skipped++;
    return ok;
  });
  const unit = guessUnit(good.map(r => +r.Weight || 0));
  const byDay = new Map();
  good.forEach(r => {
    const date = r.Date.slice(0, 10);
    if (!byDay.has(date)) byDay.set(date, { date, mins: new Map(), ex: new Map() });
    const d = byDay.get(date);
    d.mins.set(r.Date, liftoffMins(r.Duration));      // one duration per timestamp, not per row
    const raw = r['Exercise Name'];
    if (!d.ex.has(raw)) d.ex.set(raw, { raw, sets: [], secs: 0 });
    const e = d.ex.get(raw);
    if (+r.Seconds > 0) e.secs = Math.max(e.secs, +r.Seconds);
    e.sets.push({ lb: +r.Weight || 0, r: +r.Reps || 0, sec: +r.Seconds || null, rpe: r.RPE ? +r.RPE : null });
  });
  const sessions = [...byDay.values()]
    .map(d => ({
      date: d.date,
      mins: [...d.mins.values()].reduce((a, b) => a + b, 0),
      exercises: [...d.ex.values()],
    }))
    .filter(d => d.exercises.length)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const names = [...new Set(sessions.flatMap(s => s.exercises.map(e => e.raw)))];
  return { sessions, skipped, unit, names, sets: good.length };
}

/* ---------------- other apps (roadmap B8) ----------------
   Strong, Hevy, FitNotes and any CSV with a date, an exercise and a weight or
   reps column, read by column name rather than position. Every format lands
   in the same shape parseLiftoff produces, so the preview, the name review,
   the dry-run report and the import itself are shared. Liftoff keeps its own
   reader (and its "liftoff:<date>" ids, so an old file still de-duplicates).
   Sessions are one per workout where the app records a start time, otherwise
   one per day. */
const IMPORT_SOURCES = { liftoff: 'Liftoff', strong: 'Strong', hevy: 'Hevy', fitnotes: 'FitNotes', csv: 'CSV' };
const IMPORT_COLS = {
  date: ['date', 'start_time', 'start time', 'workout date', 'day', 'date time', 'datetime'],
  end: ['end_time', 'end time'],
  session: ['workout name', 'workout_name', 'title', 'workout', 'session', 'routine', 'routine name'],
  duration: ['duration', 'duration (sec)', 'duration (min)', 'workout duration'],
  exercise: ['exercise name', 'exercise_name', 'exercise_title', 'exercise', 'movement', 'lift'],
  setOrder: ['set order', 'set_order', 'set_index', 'set', 'set #', 'set number'],
  setType: ['set_type', 'set type'],
  weight: ['weight', 'weight_kg', 'weight_lbs', 'weight (kg)', 'weight (kgs)', 'weight (lbs)', 'weight (lb)', 'load', 'kg', 'lbs', 'lb'],
  unit: ['weight unit', 'weight_unit', 'unit', 'units'],
  reps: ['reps', 'repetitions', 'rep'],
  rpe: ['rpe'], rir: ['rir'],
  seconds: ['seconds', 'duration_seconds', 'time', 'duration (s)', 'secs'],
  distance: ['distance', 'distance_km', 'distance_miles', 'distance (meters)', 'distance (m)', 'distance (km)', 'distance_meters'],
  distUnit: ['distance unit', 'distance_unit'],
  notes: ['notes', 'exercise_notes', 'set notes', 'comment', 'note'],
  category: ['category'],
};
function importColumns(headers) {
  const lc = headers.map(h => h.toLowerCase().trim());
  const col = {};
  Object.entries(IMPORT_COLS).forEach(([f, names]) => {
    for (const n of names) { const i = lc.indexOf(n); if (i >= 0) { col[f] = headers[i]; break; } }
  });
  return col;
}
function importFormat(headers, rows) {
  const lc = headers.map(h => h.toLowerCase().trim());
  if (lc.includes('exercise name') && lc.includes('date') && lc.includes('duration')
    && rows.some(r => /hour|minute/i.test(r[headers[lc.indexOf('duration')]] || ''))) return 'liftoff';
  if (lc.includes('exercise_title') && lc.includes('start_time')) return 'hevy';
  if (lc.includes('category') && lc.includes('exercise') && lc.some(h => /^weight \((kgs|lbs)\)$/.test(h))) return 'fitnotes';
  if (lc.includes('exercise name') && lc.includes('set order')) return 'strong';
  return 'csv';
}
const impNum = v => { const s = String(v == null ? '' : v).trim(); if (!s) return 0; const n = +(s.includes('.') ? s : s.replace(',', '.')); return Number.isFinite(n) ? n : 0; };
/* A date cell to a day, and whether slashed dates could be either way round. */
function importDay(s, dmy) {
  const t = String(s || '').trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(t);
  if (m) {
    const [a, b] = dmy ? [m[2], m[1]] : [m[1], m[2]];
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${a.padStart(2, '0')}-${b.padStart(2, '0')}`;
  }

function importSetType(v, order) {
  const s = String(v || '').toLowerCase().trim(), o = String(order || '').toLowerCase().trim();
  if (/^warm|^w$/.test(s) || o === 'w') return 'warmup';
  if (/^drop|^d$/.test(s) || o === 'd') return 'drop';
  if (/amrap/.test(s)) return 'amrap';
  if (/^fail|^f$/.test(s) || o === 'f') return 'failure';
  return 'working';
}
function importMins(v, header) {
  const s = String(v || '').trim();
  if (!s) return 0;
  if (/^\d+(\.\d+)?$/.test(s)) { const n = +s; return String(header).toLowerCase().includes('sec') || n >= 300 ? Math.round(n / 60) : Math.round(n); }
  const h = /(\d+)\s*h/i.exec(s), m = /(\d+)\s*m(?!s)/i.exec(s);
  if (h || m) return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);

}

  const n = impNum(v);
  if (!(n > 0)) return 0;

  if (/km|kilomet/.test(u)) return n * 1000;
  if (/yard|\byd/.test(u)) return n * 0.9144;
  if (/feet|\bft\b/.test(u)) return n * 0.3048;

/* A distance with no unit in the file (Strong's older export): metres on a

function importDist(m, metric) {
  if (m > 0) return m;

}
/* Parse any supported CSV. `opt.dmy` reads slashed dates day-first. */
function parseImport(text, opt = {}) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('empty');
  const headers = Object.keys(rows[0]);
  const fmt = importFormat(headers, rows);
  if (fmt === 'liftoff') return { ...parseLiftoff(text), src: 'liftoff', label: 'Liftoff', unitFrom: 'guess' };
  const c = importColumns(headers);
  if (!c.date || !c.exercise || !(c.weight || c.reps || c.seconds || c.distance)) throw new Error('unknown CSV');
  // slashed dates: day-first unless a value proves otherwise
  const slashed = rows.map(r => /^(\d{1,2})[/.-](\d{1,2})[/.-]\d{2,4}/.exec(String(r[c.date]).trim())).filter(Boolean);
  const provesMdy = slashed.some(m => +m[2] > 12), provesDmy = slashed.some(m => +m[1] > 12);
  const dmy = opt.dmy != null ? opt.dmy : !provesMdy;
