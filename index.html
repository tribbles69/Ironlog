function repeatWorkout(id) {
  const p = S.workouts.find(w => w.id === id);
  if (!p) return;
  const copy = structuredClone(p);
  copy.id = uid(); copy.status = 'active'; copy.start = Date.now(); copy.date = today();
  delete copy.summary; delete copy.end;
  copy.exercises.forEach(e => e.sets.forEach(s => { s.done = false; }));
  startWorkout(copy);
}

function elapsed() {
  if (!S.active || !S.active.start) return '0:00';
  const s = Math.floor((Date.now() - S.active.start) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}

// last time this exercise was performed before now
function lastSession(key) {
  const prev = S.workouts.filter(w => w.status === 'completed' && w.exercises.some(e => exKey(e) === key))
    .sort((a, b) => a.date < b.date ? 1 : -1)[0];
  if (!prev) return null;
  const ex = prev.exercises.find(e => exKey(e) === key);
  return { date: prev.date, sets: ex.sets.filter(s => s.done && isWorking(s)) };
}

/* ---------------- fast entry (roadmap B2) ----------------
   Last time's numbers sit beside each set and in its empty fields. Ticking an
   empty row logs them; tapping Prev fills them in to edit; the bar under the
   table steps the selected set's weight and reps and copies it down. RIR is
   never carried over: it's how today felt. */
/* Last session's set in the same working position — warm-ups don't shift it. */
function prevSetFor(e, si, prev) {
  const s = e.sets[si];
  if (!prev || !s || isWarm(s)) return null;
  return prev.sets[si - e.sets.slice(0, si).filter(x => isWarm(x)).length] || null;
}
const FILL_FIELDS = { reps: ['w', 'r'], cap: ['w', 'r'], series: ['w'], time: ['w', 'sec'],
  carry: ['w', 'm', 'sec'], capcarry: ['w', 'm'], race: ['w', 'n', 'm', 'sec'] };
function fillFields(e) { return FILL_FIELDS[kindOf(e)] || FILL_FIELDS.reps; }
/* Copy a set's numbers into another. `onlyEmpty` leaves anything typed alone,
   and fills the weight only into a row with nothing in it at all — reps typed
   without a weight may be a bodyweight set today. */
function fillSet(e, s, from, onlyEmpty) {
  const blank = !(s.w > 0) && fillFields(e).every(f => f === 'w' || !(s[f] > 0));
  fillFields(e).forEach(f => {
    if (!(from[f] > 0)) return;
    if (onlyEmpty && (s[f] > 0 || (f === 'w' && !blank))) return;
    s[f] = from[f];
    if (f === 'w') delete s.auto;   // chosen, not computed: autoregulation leaves it be
  });
}
/* The set the step bar acts on: the one last touched while it's still open,
   otherwise the first one not yet ticked. */
let fastSel = {};
function fastReset() { fastSel = { _id: S.active && S.active.id }; }
function curSet(e, ei) {
  if (fastSel._id !== (S.active && S.active.id)) fastReset();   // a new session starts unselected
  const k = fastSel[ei];
  if (k != null && e.sets[k] && !e.sets[k].done) return k;
  const i = e.sets.findIndex(s => !s.done);
  return i < 0 ? e.sets.length - 1 : i;
}
function wStep() { return U() === 'lb' ? 5 : 2.5; }
function fastBar(e, ei) {
  const k = kindOf(e);
  if (!['reps', 'cap', 'series'].includes(k)) return '';
  const st = `${nice(wStep())} ${U()}`;
  return `<div class="fastbar">
    <div class="fb-grp"><button class="fbtn" data-step="${ei}.w.-1" aria-label="Weight down ${st}">−</button><span>${st}</span><button class="fbtn" data-step="${ei}.w.1" aria-label="Weight up ${st}">+</button></div>
    ${k === 'series' ? '' : `<div class="fb-grp"><button class="fbtn" data-step="${ei}.r.-1" aria-label="One rep fewer">−</button><span>rep</span><button class="fbtn" data-step="${ei}.r.1" aria-label="One rep more">+</button></div>`}
    <button class="btn xs ghost" data-copydown="${ei}" title="Copy the selected set to the sets below it">⇣ Copy down</button>
  </div>`;
}

/* Sets done, sets planned and volume for the live session. Pulled out of
   activeWorkout() because the 98 skin's status readout wants the same three
   numbers, and two places counting sets is two places to get it wrong.

   Not sessionTotals() — that one already exists further down, takes a finished
   workout and counts only working sets. This counts warm-ups too, because the
   progress readout is "how much of what is on screen have I done". */
function liveTotals() {
  const a = S.active;
  if (!a) return null;
  return {
    vol: totalVolume(a),
    setsDone: a.exercises.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0),
    setsTotal: a.exercises.reduce((n, e) => n + e.sets.length, 0),
  };
}

function activeWorkout() {
  const a = S.active;
  const { vol, setsDone, setsTotal } = liveTotals();

  return `
  <div class="timerbar">
    <div class="row between">
      <div class="grow">
        <div class="eyebrow">In progress</div>
        <div class="timer" id="timer">${elapsed()}</div>
      </div>
      <div class="right">
        <div class="sub">${setsDone}/${setsTotal} sets · ${wt(vol, 0)}</div>
        <button class="btn primary sm" id="finishBtn" style="margin-top:6px">Finish</button>
      </div>
    </div>
    <div class="row" style="margin-top:11px;gap:8px">
      <input id="woName" value="${esc(a.name)}" style="font-weight:650" aria-label="Session name">
      <button class="btn sm ${a.off ? 'primary' : 'ghost'}" id="offBtn" title="Off day — kept out of progression and stall checks">${a.off ? '✓ Off day' : 'Off day'}</button>
      <button class="btn sm danger" id="discardBtn">Discard</button>
    </div>
    ${runInLine(a.date, true)}
    <button class="btn xs ${hasFeel(a) ? 'primary' : 'ghost'} wide" id="feelBtn" style="margin-top:8px">${hasFeel(a) ? `Feels: ${esc(feelWords(a) || 'note')}` : 'How it feels today…'}</button>
    <div class="row" style="margin-top:8px">
      <button class="btn sm wide" id="voiceBtn">🎤 Log a set</button>
    </div>
    <div id="restHost">${restBarHtml()}</div>
  </div>

  ${a.exercises.map((e, ei) => exerciseCard(e, ei)).join('')}

  <button class="btn wide big" id="addEx">+ Add exercise</button>
  `;
}

/* Measured sets, listed under the table. Kept out of the set row itself: that
   table is already eight columns on a phone, and velocity belongs to the set as
   a whole rather than to a cell. */
function vbtStrip(e) {
  const rows = e.sets.map((s, i) => ({ s, i })).filter(x => x.s.vbt);
  if (!rows.length) return '';
  return `<div class="vbtstrip">${rows.map(({ s, i }) => {
    const v = s.vbt;
    return `<div class="row between">
      <span class="sub">Set ${i + 1}</span>
      <span class="mono grow">${v.best.toFixed(2)} m/s${v.loss >= 5 ? ` <span class="dimmer">▾${v.loss.toFixed(0)}%</span>` : ''}</span>
      ${v.est ? `<span class="mono sub" style="color:var(--purple)">RIR ${rpeToRir(v.est.rpe)}</span>` : ''}
    </div>`;
  }).join('')}</div>`;
}

/* ---------------- live card pieces for the B1 shapes ---------------- */
function shapeBanner(e) {
  const kind = kindOf(e), key = exKey(e);
  const R = shapeRecords(key, kind);
  if (!R.n) return `<span class="chip">First time — everything is a PR</span>`;
  const ref = e.sets.find(s => isWorking(s)) || {};
  const w0 = ref.w > 0 ? ref.w : 0;
  const atW = w0 > 0 ? ` at ${wt(w0)}` : '';
  const chips = [];
  if (kind === 'series') {
    if (R.series) chips.push(`★ Best series ${R.series.made}/${R.series.of} made${R.series.sec ? ' · ' + fmtSec(R.series.sec) : ''}`);
  } else if (kind === 'carry' || kind === 'capcarry') {
    if (R.far[w0]) chips.push(`★ Furthest ${fmtM(R.far[w0])}${atW}`);
    if (kind === 'carry' && ref.m > 0 && R.fast[`${w0}|${ref.m}`]) chips.push(`★ Fastest ${fmtM(ref.m)} ${fmtSec(R.fast[`${w0}|${ref.m}`])}`);
  } else if (kind === 'race') {
    const f = R.fast[raceKey(ref)];
    if (f) chips.push(`★ Fastest ${fmtSec(f)}`);
  } else if (kind === 'cap') {
    if (R.most[w0]) chips.push(`★ Most ${R.most[w0]} reps${atW} in ${capLabel(e.cap)}`);
  }
  if (!chips.length && R.heavy > 0) chips.push(`★ Heaviest ${wt(R.heavy)}`);
  // anything ticked today that beats it
  let beat = null;
  if (kind === 'series') { const c = seriesOf(e); if (c && c.made && seriesBetter(c, R.series)) beat = `${c.made} made`; }
  else for (const s of e.sets) if (s.done && isPRSet(s) && shapeBeat(kind, R, s)) { beat = setText(e, s); break; }
  return chips.map(c => `<span class="chip gold">${esc(c)}</span>`).join('') + (beat ? `<span class="chip green">▲ BEAT IT · ${esc(beat)}</span>` : '');
}
/* One of the B1 shapes (not plain reps, not a hold)? */
function shapeKind(e) { const k = kindOf(e); return k !== 'reps' && k !== 'time'; }
function shapeHead(e, edit) {
  // the edit sheet has no Prev or plate column: one fewer
  const kind = kindOf(e), span = edit ? 3 : 4, pl = edit ? '' : '<th class="c-pl"></th>';
  if (kind === 'carry') return `<th colspan="${span}">${U()} · metres · time</th>`;
  if (kind === 'capcarry') return `<th colspan="${span}">${U()} · metres in ${esc(capLabel(e.cap))}</th>`;
  if (kind === 'race') return `<th colspan="${span}">top ${U()} · implements · metres · time</th>`;
  if (kind === 'cap') return `<th class="c-kg">${U()}</th>${pl}<th class="c-reps" colspan="2">Reps in ${esc(capLabel(e.cap))}</th>`;
  return `<th class="c-kg">${U()}</th>${pl}<th colspan="2">Stone</th>`;   // series
}
function shapeRow(e, ei, si, s, f = 'f') {
  const kind = kindOf(e), k = `${ei}.${si}`;
  const num = (fld, val, ph, step = '0.5', mode = 'decimal') => `<input type="number" step="${step}" inputmode="${mode}" data-${f}="${fld}" data-k="${k}" value="${val == null || val === 0 ? '' : val}" placeholder="${ph}" aria-label="${ph}">`;
  const time = () => `<input type="text" inputmode="numeric" data-${f}="sec" data-k="${k}" value="${fmtSec(s.sec)}" placeholder="m:ss" aria-label="time">`;
  const W = num('w', s.w ? dw(s.w) : '', U());
  const timer = f === 'f' ? `<button class="plbtn" data-hold="${k}" title="Time it" aria-label="Time it">⏱</button>` : '';
  const span = f === 'f' ? 4 : 3, pl = f === 'f' ? '<td class="c-pl"></td>' : '';
  if (kind === 'carry') return `<td colspan="${span}"><div class="multi">${W}${num('m', s.m, 'metres', '1', 'numeric')}${time()}${timer}</div></td>`;
  if (kind === 'capcarry') return `<td colspan="${span}"><div class="multi">${W}${num('m', s.m, 'metres', '1', 'numeric')}</div></td>`;
  if (kind === 'race') return `<td colspan="${span}"><div class="multi">${W}${num('n', s.n, 'n', '1', 'numeric')}${num('m', s.m, 'metres', '1', 'numeric')}${time()}${timer}</div></td>`;
  if (kind === 'cap') return `<td class="c-wt">${W}</td>${pl}<td colspan="2">${num('r', s.r || '', 'reps', '1', 'numeric')}</td>`;
  // series: each set is one stone, made or missed
  return `<td class="c-wt">${W}</td>${pl}
    <td colspan="2"><button class="btn xs ${s.r > 0 ? '' : 'danger'} wide" data-${f === 'f' ? 'made' : 'emade'}="${k}">${s.r > 0 ? '✓ Made' : '✗ Missed'}</button></td>`;
}

function exerciseCard(e, ei) {
  const st = statsFor(exKey(e));
  const prev = lastSession(exKey(e));
  const bestE1 = st ? st.best.e1 : 0;

  // did anything today beat the historical PR?
  const todayBest = Math.max(0, ...e.sets.filter(s => s.done && isPRSet(s) && s.w && s.r).map(s => e1rm(s.w, s.r, s.rpe)));
  const beatE1 = st && todayBest > bestE1;

  const timed = isTimed(e);
  const isoE = isIso(e);
  const kind = kindOf(e);
  const special = kind !== 'reps' && kind !== 'time';   // the B1 shapes

  /* A timed movement never earns a weight PR, so the weight banner would sit on
     "First time — everything is a PR" forever. Best hold is the number that
     actually means something here, and reading it straight from history keeps
     the stats machine (which is built on weight × reps) out of it. An
     isometric hold's record is per weight, so the banner shows the one at the
     load on today's first working set — the record actually being chased. */
  const recs = timed ? holdRecords(exKey(e)) : null;
  const refW = isoE ? ((e.sets.find(s => isWorking(s) && s.w > 0) || {}).w || 0) : 0;
  const holdBest = timed ? (isoE ? recs.byWeight[refW] || 0 : recs.best) : 0;
  const todayHold = timed
    ? Math.max(0, ...e.sets.filter(s => s.done && isWorking(s) && s.sec && (!isoE || (s.w > 0 ? s.w : 0) === refW)).map(s => s.sec))
    : 0;
  const atW = isoE ? ` at ${refW > 0 ? wt(refW) : 'bodyweight'}` : '';

  const prBanner = special ? shapeBanner(e) : timed
    ? (recs.n
      ? (holdBest
        ? `<span class="chip gold">★ Best ${fmtSec(holdBest)}${atW}</span>
           ${todayHold > holdBest ? `<span class="chip green">▲ BEAT IT · ${fmtSec(todayHold)}</span>` : ''}`
        : `<span class="chip gold">★ Longest ${fmtSec(recs.best)}</span><span class="chip">nothing yet${atW}</span>`)
      : `<span class="chip">First time — everything is a PR</span>`)
    : st
      ? `<span class="chip gold">★ PR ${wt(st.bestW.w)} × ${st.bestW.r}${st.bestWIsEst ? ' <span class="dimmer">EST</span>' : ''}</span>
       <span class="chip">e1RM ${wt(bestE1)}</span>
       <span class="dimmer">${st.sessions} sessions</span>
       ${beatE1 ? `<span class="chip green">▲ BEAT IT · ${wt(todayBest)}</span>` : ''}`
      : `<span class="chip">First time — everything is a PR</span>`;

  /* Autoregulation and stall: one line under the banner. */
  const stall = kind === 'reps' ? stallFor(exKey(e)) : null;
  const autoLine = e.auto || stall ? `<div class="row wrap" style="gap:6px;margin-top:6px">
      ${e.auto ? `<span class="chip blue" title="Loads set from RIR">⟳ AUTO · target RIR ${e.auto.t}</span>
        <span class="sub">${e.auto.day ? `today e1 ${wt(e.auto.day)}` : e.auto.e1 ? `working e1 ${wt(e.auto.e1)}` : 'plan weights until RIR is logged'}</span>` : ''}
      ${stall ? `<span class="chip" style="color:var(--gold)" title="No e1RM gain over the last ${stall.n} sessions — consider a deload or a variation">⚠ Stalled · ${stall.n} sessions</span>` : ''}
    </div>` : '';
  const rirPh = e.auto ? String(e.auto.t) : '—';

  const cur = curSet(e, ei);
  const rows = e.sets.map((s, si) => {
    const isPR = s.done && isPRSet(s) && s.r > 0 && beatsBest(st, s.w, s.r, s.rpe);
    const isFirstPR = s.done && isPRSet(s) && s.r > 0 && !st;
    const p = prevSetFor(e, si, prev);
    const sel = (!s.done && si === cur ? ' sel' : '') + (isDrop(s) && si > 0 ? ' droprow' : '');
    const prevCell = inner => p ? `<td class="c-prev mono"><button class="prevbtn" data-prev="${ei}.${si}" aria-label="Fill with last time's set">${inner}</button></td>` : `<td class="c-prev mono">—</td>`;
    const setNo = `<td class="c-set">${setNoBtn(e.sets, si, `data-warm="${ei}.${si}"`)}</td>
      <td class="c-del"><button class="delset" data-delset="${ei}.${si}" title="Delete set">×</button></td>`;
    const chk = `<td class="c-chk"><button class="chk ${s.done ? 'on' : ''}" data-done="${ei}.${si}">✓</button></td>`;
    const holdBtn = `<button class="plbtn" data-hold="${ei}.${si}" title="Hold timer">⏱</button>`;
    if (special) {
      return `<tr class="${s.done ? 'done' : ''}${sel}" data-row="${ei}.${si}">
      ${setNo}
      ${prevCell(esc(prevText(e, p)))}
      ${shapeRow(e, ei, si, s)}
      ${chk}
    </tr>`;
    }
    /* An isometric hold keeps its load and its RIR, and swaps reps for time.
       Held to failure (test mode) means RIR 0 by definition, so it's shown
       rather than asked. */
    if (isoE) {
      return `<tr class="${s.done ? 'done' : ''}${sel}" data-row="${ei}.${si}">
      ${setNo}
      ${p && p.sec ? prevCell(`${p.w > 0 ? nice(dw(p.w)) + '·' : ''}${fmtSec(p.sec)}`) : '<td class="c-prev mono">—</td>'}
      <td class="c-wt"><input type="number" step="0.5" inputmode="decimal" data-f="w" data-k="${ei}.${si}" value="${s.w ? dw(s.w) : ''}" placeholder="0"></td>
      <td class="c-pl">${holdBtn}</td>
      <td class="c-time"><input type="text" inputmode="numeric" data-f="sec" data-k="${ei}.${si}" value="${fmtSec(s.sec)}" placeholder="m:ss"></td>
      <td>${s.holdMode === 'test'
        ? `<span class="mono dimmer" title="Held to failure — RIR 0">0</span>`
        : `<input type="number" step="1" inputmode="numeric" data-f="rpe" data-k="${ei}.${si}" value="${s.rpe == null ? '' : rpeToRir(s.rpe)}" placeholder="—">`}</td>
      ${chk}
    </tr>`;
    }
    /* A timed movement has no reps or weight input (spec §6) — one duration
       field, and the plate button goes with the weight it belonged to. */
    if (timed) {
      return `<tr class="${s.done ? 'done' : ''}${sel}" data-row="${ei}.${si}">
      ${setNo}
      ${p && p.sec ? prevCell(fmtSec(p.sec)) : '<td class="c-prev mono">—</td>'}
      <td class="c-time" colspan="3"><input type="text" inputmode="numeric" data-f="sec" data-k="${ei}.${si}" value="${fmtSec(s.sec)}" placeholder="m:ss"></td>
      <td class="c-pl">${holdBtn}</td>
      ${chk}
    </tr>`;
    }
    return `<tr class="${s.done ? 'done' : ''} ${isPR || isFirstPR ? 'pr' : ''}${sel}" data-row="${ei}.${si}">
      ${setNo}
      ${prevCell(`${p && p.w > 0 ? `${nice(dw(p.w))}×` : ''}${p ? p.r : ''}${p && p.rpe ? `<span class="prir">@${rpeToRir(p.rpe)} RIR</span>` : ''}`)}
      <td class="c-wt"><input type="number" step="0.5" inputmode="decimal" data-f="w" data-k="${ei}.${si}" value="${s.w ? dw(s.w) : ''}" placeholder="${p && p.w > 0 ? nice(dw(p.w)) : '0'}"></td>
      <td class="c-pl">${s.w > 0 ? `<button class="plbtn" data-plates="${ei}.${si}" title="Plates">▤</button>` : ''}</td>
      <td><input type="number" inputmode="numeric" data-f="r" data-k="${ei}.${si}" value="${s.r || ''}" placeholder="${s.setType === 'amrap' ? 'max' : p && p.r > 0 ? p.r : '0'}"></td>
      <td><input type="number" step="1" inputmode="numeric" data-f="rpe" data-k="${ei}.${si}" value="${s.rpe == null ? '' : rpeToRir(s.rpe)}" placeholder="${rirPh}"></td>
      ${chk}
    </tr>`;
  }).join('');

  return `<div class="ex-card">
    <div class="ex-head">
      <div class="row between">
        <div class="ex-name grow" data-exdetail="${esc(exKey(e))}" title="Open ${esc(exName(e))}">${esc(exName(e))}${isoE ? ' <span class="chip">HOLD</span>' : ''}${e.cap > 0 ? ` <span class="chip">IN ${esc(capLabel(e.cap).toUpperCase())}</span>` : ''}${e.series ? ' <span class="chip">SERIES</span>' : ''}</div>
        ${timed || !inRepsPool(e) && kind !== 'cap' ? '' : `<button class="btn xs ghost" data-ramp="${ei}" title="Warm-up ramp">▲ Warm-up</button>`}
        <button class="icon-btn" data-ex-menu="${ei}">⋯</button>
      </div>
      ${leafChip(e.leaf, ei)}
      ${modChips(e, `data-mods="${ei}"`)}
      <div class="pr-banner">${prBanner}</div>
      ${autoLine}
      ${e.notes ? `<div class="ex-note">${esc(e.notes)}</div>` : ''}
    </div>
    <table class="settable">
      <thead><tr><th class="c-set">Set</th><th class="c-del"></th><th class="c-prev">Prev</th>${special ? shapeHead(e) : isoE
      ? `<th class="c-kg">${U()}</th><th class="c-pl"></th><th class="c-reps">Time</th><th class="c-rpe">RIR</th>`
      : timed
      ? `<th class="c-time" colspan="4">Time</th>`
      : `<th class="c-kg">${U()}</th><th class="c-pl"></th><th class="c-reps">Reps</th><th class="c-rpe">RIR</th>`}<th class="c-chk"></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${fastBar(e, ei)}
    ${lvPanel(e, ei)}
    ${vbtStrip(e)}
    ${e.series ? `<div class="row" style="gap:8px;align-items:center;padding:8px 12px 0">
      <label class="sub grow" for="ss${ei}">Series time</label>
      <input id="ss${ei}" type="text" inputmode="numeric" data-series-sec="${ei}" value="${fmtSec(e.seriesSec)}" placeholder="m:ss" style="width:90px"></div>` : ''}
    <div class="ex-foot">
      <button class="btn sm ghost grow" data-addset="${ei}">+ ${e.series ? 'Stone' : 'Set'}</button>
      <button class="btn sm ghost" data-rmset="${ei}">− ${e.series ? 'Stone' : 'Set'}</button>
      ${vbtAvailable() && kind === 'reps' ? `<button class="btn sm ghost" data-vbt="${ei}" title="Measure bar speed">◉ Measure</button>` : ''}
    </div>
  </div>`;
}

/* ---------------- warm-up ramp ----------------
   Builds a ladder to a target load. Fewer, bigger jumps for a heavy single;
   more reps and shallower steps for volume work. The point is to arrive at the
   top set primed but not spent — on a test day a bad warm-up costs you the
   number outright, in either direction. */
const RAMP = {
  single: { pcts: [0.40, 0.55, 0.70, 0.80, 0.88, 0.94], reps: [5, 3, 2, 1, 1, 1], rest: [60, 90, 120, 180, 210, 240] },
  low:    { pcts: [0.45, 0.60, 0.75, 0.86],             reps: [5, 4, 3, 2],       rest: [60, 90, 120, 180] },
  high:   { pcts: [0.50, 0.70, 0.85],                   reps: [8, 5, 3],          rest: [60, 75, 90] },
};

function warmupRamp(targetKg, reps = 1, barKg = 20, round = roundBar, roundWork = round) {
  if (!targetKg || targetKg <= 0) return [];
  const spec = reps <= 2 ? RAMP.single : reps <= 6 ? RAMP.low : RAMP.high;
  const out = [];

  if (barKg > 0 && targetKg > barKg * 1.5) {
    out.push({ kg: barKg, reps: reps <= 2 ? 8 : 10, rest: 45, bar: true });
  }

  spec.pcts.forEach((p, i) => {
    const kg = round(targetKg * p);
    if (kg <= barKg) return;                       // below the empty bar: skip
    if (out.some(x => Math.abs(x.kg - kg) < 0.01)) return;   // duplicate after rounding
    if (kg >= targetKg) return;                    // never warm up at or above the target
    out.push({ kg, reps: spec.reps[i], rest: spec.rest[i], pct: Math.round(p * 100) });
  });

  out.push({ kg: roundWork(targetKg), reps, rest: 0, work: true });
  return out;
}

function fmtRest(s) {
  if (!s) return '';
  return s >= 60 ? `${Math.round(s / 60)}${s % 60 ? `:${String(s % 60).padStart(2, '0')}` : ' min'}` : `${s}s`;
}

/* Bar weight is asked for rather than assumed — a hex bar, a Smith carriage and
   a comp bar are three different starting points, and getting it wrong throws
   every percentage below about 60%. */
function openRamp(name, presetKg) {
  const st = statsFor(name);
  const suggestion = presetKg || (st ? roundBar(st.best.e1) : 0);
  const leaf = String(name).includes('/') ? keyLeaf(name) : null;
  const barred = !leaf || BAR_EQUIPMENT.includes(leaf.equipment);   // plates on a bar: round to what loads
  const bar0 = barred ? barFor(leaf) : null;

  const draw = (targetDisp, reps, barDisp) => {
    const barKg = toKg(barDisp), inv = inventory(), eff = barKg + collarPair();
    /* Warm-ups load from plain plates (2.5 kg and up): nobody wants 1.25s
       and 0.5s on a 60% single. The work set gets the whole inventory. */
    const plain = inv.filter(p => p.kg >= 2.5 - 1e-9);
    const round = barred ? (kg => loadableNear(kg, eff, plain.length ? plain : inv)) : (kg => roundLoadFor(kg, leaf));
    const roundWork = barred ? (kg => loadableNear(kg, eff, inv)) : round;
    const ramp = warmupRamp(toKg(targetDisp), reps, barKg, round, roundWork);
    if (!ramp.length) return `<div class="sub">Enter a target weight.</div>`;
    return `<table class="settable"><thead><tr>
        <th class="c-set">#</th><th>${U()}</th><th>Reps</th><th>Rest</th></tr></thead><tbody>
      ${ramp.map((r, i) => `<tr class="${r.work ? 'pr' : ''}">
        <td class="c-set"><div class="setno ${r.work ? '' : 'warm'}">${r.work ? '★' : r.bar ? 'B' : i}</div></td>
        <td class="mono"><b>${nice(dw(r.kg))}</b>${r.bar ? ' <span class="dimmer">bar</span>' : r.pct ? ` <span class="dimmer">${r.pct}%</span>` : ''}
          ${barred && !r.bar ? `<div class="dimmer" style="font-size:10.5px">${esc(plateLine(r.kg, eff, inv))}</div>` : ''}</td>
        <td class="mono">${r.reps}</td>
        <td class="mono dimmer">${r.work ? '—' : fmtRest(r.rest)}</td>
      </tr>`).join('')}
    </tbody></table>`;
  };
  const barDisp0 = nice(dw(bar0 ? bar0.kg : (S.settings.barKg || 20)));

  modal({
    title: `Warm-up · ${leafName(name)}`,
    body: `
      <div class="row" style="gap:8px">
        <div class="field grow"><label>Target (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rTarget" value="${suggestion ? dw(suggestion) : ''}"></div>
        <div class="field" style="width:80px"><label>Reps</label>
          <input type="number" inputmode="numeric" id="rReps" value="1"></div>
        <div class="field" style="width:88px"><label>Bar (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rBar" value="${barDisp0}"></div>
      </div>
      ${bar0 ? `<div class="sub" style="margin:-4px 0 8px">${esc(bar0.name)}${collarPair() ? ` · collars ${wt(collarPair() / 2, 2)} each` : ''}${barred ? ' · steps rounded to plates you have' : ''}</div>` : ''}
      <div id="rOut">${draw(suggestion ? dw(suggestion) : 0, 1, barDisp0)}</div>
      <div class="sub" style="margin-top:9px">Rest is a floor, not a target — on the last two steps take longer if you need it.</div>
    `,
    foot: `<button class="btn primary" data-close>Done</button>`,
    onOpen: bg => {
      const upd = () => {
        const bar = +$('#rBar', bg).value || 20;
        if (!bar0 || bar0.isDefault) { S.settings.barKg = toKg(bar); save(); }   // a plain barbell remembers; a tagged bar lives in Settings
        $('#rOut', bg).innerHTML = draw(+$('#rTarget', bg).value || 0, +$('#rReps', bg).value || 1, bar);
      };
      ['#rTarget', '#rReps', '#rBar'].forEach(s => { $(s, bg).oninput = upd; });
    },
  });
}

/* ---------------- plate maths ----------------
   Works from a real inventory, in pairs, because a stack you can't build is
   worse than no answer. If the target isn't loadable it says so and gives the
   nearest weight you can actually make in both directions. */
const DEFAULT_PLATES = [
  { kg: 25, pairs: 4 }, { kg: 20, pairs: 4 }, { kg: 15, pairs: 2 },
  { kg: 10, pairs: 4 }, { kg: 5, pairs: 2 }, { kg: 2.5, pairs: 2 },
  { kg: 1.25, pairs: 2 }, { kg: 0.5, pairs: 2 },
];

/* Bars carry the equipment they're for, so a trap-bar deadlift loads from the
   trap bar and a log press from the log without asking. Presets are starting
   points — real bars vary, so each one is editable in Settings. */
const BAR_EQUIPMENT = ['barbell', 'safety_squat_bar', 'trap_bar', 'axle', 'log'];
const BAR_PRESETS = [
  { name: 'Barbell', kg: 20, eq: 'barbell' }, { name: "Women's bar", kg: 15, eq: '' },
  { name: 'Deadlift bar', kg: 20, eq: '' }, { name: 'Safety squat bar', kg: 30, eq: 'safety_squat_bar' },
  { name: 'Trap bar', kg: 25, eq: 'trap_bar' }, { name: 'Axle', kg: 20, eq: 'axle' }, { name: 'Log', kg: 50, eq: 'log' },
];
/* The bar for a lift: one tagged with its equipment, else the preset for that
   equipment (flagged, so the sheet can say it's a guess), else the usual bar. */
function barFor(leaf) {
  const bl = bars(), eq = leaf && leaf.equipment;
  const tagged = eq && bl.find(b => b.eq === eq);
  if (tagged) return tagged;
  if (eq && eq !== 'barbell') { const p = BAR_PRESETS.find(b => b.eq === eq); if (p) return { ...p, preset: true }; }
  const usual = bl.find(b => Math.abs(b.kg - (S.settings.barKg || 20)) < 1e-9) || bl[0];
  return { ...usual, isDefault: true };
}
/* Both collars together; they ride on every loaded bar. */
function collarPair() { return (S.settings.collarKg > 0 ? S.settings.collarKg : 0) * 2; }
/* Nearest weight the inventory can build on this bar; a tie goes to the lighter. */
function loadableNear(kg, barKg, inv) {
  const n = nearestLoadable(kg, barKg, inv);
  if (n.below == null) return n.above == null ? kg : n.above;
  if (n.above == null) return n.below;
  return kg - n.below <= n.above - kg ? n.below : n.above;
}
/* "20 + 5 + 1.25 a side" */
function plateLine(kg, barKg, inv) {
  const r = loadPlates(kg, barKg, inv);
  if (r.impossible || !r.perSide.length) return r.impossible ? '' : 'empty bar';
  return r.perSide.flatMap(p => Array(p.count).fill(String(dw(p.kg, 2)))).join(' + ') + ' a side';
}

/* One editable bar row in Settings. */
const BAR_FOR = [['', 'For: —'], ['barbell', 'Barbell'], ['safety_squat_bar', 'SSB'], ['trap_bar', 'Trap'], ['axle', 'Axle'], ['log', 'Log']];
function barRow(k, b) {
  return `<div class="row" style="gap:6px;margin-bottom:6px">
    <input class="grow" data-bn="${k}" value="${esc(b.name || '')}" placeholder="name" aria-label="Bar name" style="min-width:0">
    <input type="number" step="0.5" inputmode="decimal" data-bk="${k}" value="${b.kg ? nice(dw(b.kg)) : ''}" placeholder="${U()}" aria-label="Bar weight" style="width:64px">
    <select data-be="${k}" aria-label="Used for" style="width:96px">${BAR_FOR.map(([v, l]) => `<option value="${v}" ${(b.eq || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <button class="btn sm ghost" data-brm="${k}" aria-label="Remove bar">−</button>
  </div>`;
}

function inventory() {
  const inv = S.settings.plates && S.settings.plates.length ? S.settings.plates : DEFAULT_PLATES;
  return inv.filter(p => p.kg > 0 && p.pairs > 0).sort((a, b) => b.kg - a.kg);
}
function bars() {
  return (S.settings.bars && S.settings.bars.length ? S.settings.bars : [{ name: 'Barbell', kg: 20 }])
    .filter(b => b.kg > 0);
}

/* Greedy is optimal here: every plate set in use is "canonical" (each size at
   least twice the next), so taking the heaviest that fits never strands you. */
function loadPlates(targetKg, barKg, inv) {
  const side = (targetKg - barKg) / 2;
  if (side < 0) return { impossible: 'under', bar: barKg };
  if (side === 0) return { perSide: [], achieved: barKg, exact: true, bar: barKg };

  let left = side;
  const perSide = [];
  inv.forEach(p => {
    const n = Math.min(p.pairs, Math.floor((left + 1e-9) / p.kg));
    if (n > 0) { perSide.push({ kg: p.kg, count: n }); left -= n * p.kg; }
  });

  if (left > 1e-9) {
    /* Greedy only stops short when the set isn't canonical (25/20/15/10 isn't,
       and neither is a 1 kg plate beside 1.25) or pairs run out. Then search:
       the heaviest reachable per-side load, fewest plates on a tie. */
    let best = { sum: side - left, n: perSide.reduce((a, p) => a + p.count, 0), pick: [...perSide] };
    const walk = (i, sum, n, pick) => {
      if (sum > side + 1e-9) return;
      if (sum > best.sum + 1e-9 || (Math.abs(sum - best.sum) < 1e-9 && n < best.n)) best = { sum, n, pick: [...pick] };
      if (i >= inv.length || Math.abs(sum - side) < 1e-9) return;
      for (let c = Math.min(inv[i].pairs, Math.floor((side - sum + 1e-9) / inv[i].kg)); c >= 0; c--) {
        if (c) pick.push({ kg: inv[i].kg, count: c });
        walk(i + 1, sum + c * inv[i].kg, n + c, pick);
        if (c) pick.pop();
      }
    };
    walk(0, 0, 0, []);
    perSide.length = 0; perSide.push(...best.pick);
    left = side - best.sum;
  }
  const achieved = barKg + (side - left) * 2;
  return { perSide, achieved, exact: Math.abs(left) < 1e-9, short: left * 2, bar: barKg };
}

/* Every weight the inventory can build, for "nearest loadable" answers. */
function loadableWeights(barKg, inv) {
  let sums = [0];
  inv.forEach(p => {
    const next = new Set(sums);
    sums.forEach(s => { for (let n = 1; n <= p.pairs; n++) next.add(s + n * p.kg); });
    sums = [...next];
  });
  return sums.map(s => barKg + s * 2).sort((a, b) => a - b);
}

function nearestLoadable(targetKg, barKg, inv) {
  const all = loadableWeights(barKg, inv);
  let below = null, above = null;
  for (const w2 of all) {
    if (w2 <= targetKg + 1e-9) below = w2;
    if (w2 >= targetKg - 1e-9) { above = w2; break; }
  }
  return { below, above };
}

const PLATE_COLOR = {
  25: '#c8102e', 20: '#1f57c3', 15: '#e8b923', 10: '#4fb477',
  5: '#e8ecf3', 2.5: '#c8102e', 1.25: '#8a93a5', 0.5: '#8a93a5',
};

function openPlates(targetKg, presetBar, leaf) {
  /* A Smith load already includes the carriage, so the plate maths has to
     subtract it rather than a 20 kg barbell — otherwise it tells you to hang
     the carriage's weight in plates. */
  const smith = leaf && leaf.equipment === 'smith';
  if (smith && !(S.settings.smithKg > 0)) {
    return modal({
      title: 'Smith carriage weight',
      body: `<div class="sub" style="margin-top:0">Your Smith loads include the carriage, so working out the plates needs its weight. Carriages vary between about 7 and 25 kg — check the sticker, or weigh the empty bar.</div>
        <div class="field" style="margin-top:12px"><label>Carriage weight (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="smKg" placeholder="e.g. 15"></div>`,
      foot: `<button class="btn ghost" data-close>Not now</button><button class="btn primary" id="smSave">Save</button>`,
      onOpen: bg => { $('#smSave', bg).onclick = () => {
        const v = +$('#smKg', bg).value;
        if (!(v > 0)) return toast('Enter the carriage weight');
        S.settings.smithKg = toKg(v); save(); closeModal();
        openPlates(targetKg, presetBar, leaf);
      }; },
    });
  }
  /* The lift's own bar first (a trap bar for a trap-bar pull), then the rest
     of your bars to switch to. */
  const own = smith ? null : barFor(leaf);
  const bl = smith ? [{ name: 'Smith carriage', kg: S.settings.smithKg }]
    : own && own.preset ? [own, ...bars()] : bars();
  let barIdx = smith ? 0 : presetBar ? Math.max(0, bl.findIndex(b => b.kg === presetBar))
    : Math.max(0, bl.findIndex(b => b.name === own.name && b.kg === own.kg));
  const collars = smith ? 0 : collarPair();

  const draw = () => {
    const bar = { ...bl[barIdx], kg: bl[barIdx].kg + collars };   // collars ride on the bar
    const inv = inventory();
    const r = loadPlates(targetKg, bar.kg, inv);

    if (r.impossible === 'under') {
      return `<div class="sub">${wt(targetKg)} is below the ${esc(bar.name)} at ${wt(bar.kg)}.</div>`;
    }

    const stack = r.perSide.length
      ? r.perSide.map(p => `<div class="row" style="gap:9px;align-items:center;padding:6px 0">
          <div style="width:34px;height:34px;border-radius:7px;background:${PLATE_COLOR[p.kg] || '#8a93a5'};
            display:grid;place-items:center;font-size:11.5px;font-weight:800;color:${p.kg === 5 ? '#14181d' : '#fff'}">${dw(p.kg, 2)}</div>
          <div class="grow"><b>${dw(p.kg, 2)}${U()}</b> <span class="sub">× ${p.count} per side</span></div>
          <div class="mono sub">${nice(dw(p.kg * p.count * 2))}</div>
        </div>`).join('')
      : `<div class="sub">Empty bar.</div>`;

    let warn = '';
    if (!r.exact) {
      const n = nearestLoadable(targetKg, bar.kg, inv);
      warn = `<div style="border-left:3px solid var(--gold);background:rgba(255,197,66,.08);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:10px">
        <b>Not loadable.</b> <span class="sub">Your inventory reaches ${wt(r.achieved)} — ${wt(r.short)} short.
        Nearest you can build: ${n.below ? wt(n.below) : '—'}${n.above && n.above !== r.achieved ? ` or ${wt(n.above)}` : ''}.</span></div>`;
    }

    return `${warn}
      ${bl[barIdx].preset ? `<div class="sub" style="margin-bottom:8px">${esc(bl[barIdx].name)} taken as ${wt(bl[barIdx].kg)} — add yours in Settings → Bars if it differs.</div>` : ''}
      ${collars ? `<div class="sub" style="margin-bottom:8px">Includes collars, ${wt(collars / 2)} each.</div>` : ''}
      <div class="row between" style="margin-bottom:8px">
        <div><div class="eyebrow">Per side</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1">${dw((r.achieved - bar.kg) / 2, 2)}</div></div>
        <div class="right"><div class="eyebrow">Total on bar</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1;color:${r.exact ? 'var(--green)' : 'var(--gold)'}">${dw(r.achieved, 2)}</div></div>
      </div>
      ${stack}`;
  };

  modal({
    title: `Plates · ${wt(targetKg)}`,
    body: `${bl.length > 1 ? `<div class="seg" id="pBars" style="margin-bottom:11px">
        ${bl.map((b, i) => `<button data-bar="${i}" class="${i === barIdx ? 'on' : ''}">${esc(b.name)} ${nice(dw(b.kg))}</button>`).join('')}
      </div>` : `<div class="sub" style="margin-bottom:9px">${esc(bl[0].name)} at ${wt(bl[0].kg)}</div>`}
      <div id="pOut">${draw()}</div>`,
    foot: `${leaf ? '<button class="btn ghost" id="pRamp">▲ Ramp to this</button>' : ''}<button class="btn primary" data-close>Done</button>`,
    onOpen: bg => {
      const rampBtn = $('#pRamp', bg);
      if (rampBtn) rampBtn.onclick = () => { closeModal(); openRamp(leafKey(leaf), targetKg); };
      bg.querySelectorAll('[data-bar]').forEach(b => b.onclick = () => {
        barIdx = +b.dataset.bar;
        if (!bl[barIdx].preset && !bl[barIdx].eq) { S.settings.barKg = bl[barIdx].kg; save(); }
        bg.querySelectorAll('[data-bar]').forEach(x => x.classList.toggle('on', +x.dataset.bar === barIdx));
        $('#pOut', bg).innerHTML = draw();
      });
    },
  });
}

function finishWorkout(force) {
  const a = S.active;
  /* What counts as logged depends on the metric. Keeping only `s.r > 0` threw
     away every timed set at the moment of finishing: a session of nothing but
     planks refused to finish at all, and a mixed session dropped the planks
     from the saved record without saying so. */
  const logged = a.exercises.map(e => {
    const x = { ...e, sets: e.sets.filter(s => s.done && setLogged(e, s))
      .map(s => { const y = { ...s }; delete y.auto; delete y.planW; return y; }) };   // live-only markers
    delete x.rest;   // the session's ±15 s override; it isn't part of the record
    return x;
  }).filter(e => e.sets.length);
  if (!logged.length) return toast('Log at least one set first');

  // sets ticked and then retyped never met the single-set prompt
  if (!force) {
    const flagged = [];
    logged.forEach(e => {
      if (!inRepsPool(e)) return;               // nothing to say about a duration, a distance or a capped set
      e.sets.filter(s => isWorking(s) && s.r > 0).forEach(s => {
        const why = plausibility(exKey(e), s.w, s.r, s.rpe);
        if (why.length) flagged.push({ name: exFull(e), s, why });
      });
    });
    if (flagged.length) return plausListDlg(flagged, 'Finish', () => finishWorkout(true));
  }

  harvestLvp(logged);   // today's warm-up profiles join the stored ones (D1)
  // PRs — compare against history BEFORE this workout is saved
  const prs = [];
  logged.forEach(e => {
    prs.push(...shapePRs(e, null, a.id));   // holds, carries, races, caps, series: their own records
    if (!inRepsPool(e)) return;             // none of those is an e1RM
    const st = statsFor(exKey(e));
    const working = e.sets.filter(s => isPRSet(s) && s.r > 0);
    if (!working.length) return;
    const best = bestSetOf(working);
    const e1 = e1rm(best.w, best.r, best.rpe);
    if (!st) prs.push({ name: exName(e), key: exKey(e), w: best.w, r: best.r, e1, first: true });
    else if (beatsBest(st, best.w, best.r, best.rpe)) prs.push({ name: exName(e), key: exKey(e), w: best.w, r: best.r, e1, prev: st.best.e1, prevReps: st.bestBw ? st.bestBw.r : 0 });
  });

  const mins = a.start ? Math.max(1, Math.round((Date.now() - a.start) / 60000)) : 0;
  const done = {
    id: a.id, date: a.date, name: a.name, status: 'completed', source: 'logged',
    ...(a.off ? { off: true } : {}), ...(a.block ? { block: a.block, prog: a.prog } : {}),
    exercises: logged, start: a.start, end: Date.now(), ...(hasFeel(a) ? { feel: a.feel } : {}),
    summary: { mins, prs, volume: logged.reduce((t, e) => t + e.sets.filter(s => isWorking(s)).reduce((x, s) => x + s.w * s.r, 0), 0) },
  };

  // if this came from a plan, replace the planned entry
  if (a.plannedFrom) S.workouts = S.workouts.filter(w => w.id !== a.plannedFrom);
  S.workouts = S.workouts.filter(w => w.id !== done.id);
  S.workouts.push(done);
  stopRest();
  S.active = null;
  save(); bust();
  showSummary(done);
  autoSync();
  if (persist.state !== 'granted') requestPersistence();   // the first logged session is the moment worth protecting
}

/* ---------------- shareable session card ----------------
   Two cards, both drawn by hand to a canvas at 1080 wide so they land as real
   images rather than screenshots of a phone. Quick is a square with the totals
   — the one for a story. Full grows with the session: every set, then what
   the session asked of each muscle and how hard. No external fonts or
   libraries: the artifact sandbox blocks outside requests and a missing font
   would silently ruin the layout. */
const CARD = {
  bg: '#0d0f14', tile: '#171c26', accent: '#ff5c35', text: '#e8ecf3', dim: '#8a93a5', line: '#252c3a',
  gold: '#ffc542', goldBg: 'rgba(255,197,66,.09)', warm: '#546074',
  light: '#3b7ddd', moderate: '#4fb477', hard: '#ff5c35',
};
const cardFont = (sz, wt2 = 600) => `${wt2} ${sz}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;

/* Trim to the pixel width, not a character count — "Bulgarian Split Squat"
   and "Dips" are the same length in characters to nobody. */
function fitText(x, s, maxW) {
  if (x.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (x.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return s.slice(0, lo).trimEnd() + '…';
}

function wrapText(x, text, px, py, maxW, lineH, maxLines) {
  const lines = [];
  let cur = '';
  text.split(' ').forEach(wd => {
    const t = cur ? cur + ' ' + wd : wd;
    if (!cur || x.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = wd; }
  });
  if (cur) lines.push(cur);
  lines.slice(0, maxLines).forEach((l, i) => {
    const last = i === maxLines - 1 && lines.length > maxLines;
    x.fillText(last ? fitText(x, lines.slice(i).join(' '), maxW) : l, px, py + i * lineH);
  });
}

function roundRect(x, px, py, w2, h2, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w2, py, px + w2, py + h2, r);
  x.arcTo(px + w2, py + h2, px, py + h2, r);
  x.arcTo(px, py + h2, px, py, r);
  x.arcTo(px, py, px + w2, py, r);
  x.closePath();
}

/* Takes the entry, not the leaf: whether a set is a hold depends on the entry's
   iso flag as well as the movement. */
function setLabel(s, e) { return setText(e, s); }

function sessionTotals(wo) {
  const ws = wo.exercises.map(e => ({ e, sets: e.sets.filter(s => isWorking(s)) })).filter(o => o.sets.length);
  return {
    ws,
    sets: ws.reduce((n, o) => n + o.sets.filter(s => !isDrop(s)).length, 0),   // a drop chain is one set
    reps: ws.reduce((n, o) => n + o.sets.reduce((a, s) => a + s.r, 0), 0),
    volume: ws.reduce((n, o) => n + o.sets.reduce((a, s) => a + s.w * s.r, 0), 0),
    mins: wo.summary && wo.summary.mins ? wo.summary.mins : 0,
    prs: prsFor(wo),
  };
}

/* What the session asked of each muscle: working sets × the movement's share,
   so five sets of squats read as two quad sets, one and a bit of glutes, and so
   on. Intensity is the mean RPE of those sets when it was logged, otherwise
   the top set against the all-time best e1RM. Movements with no muscle map
   (a custom name) are skipped and counted so the card can say so. */
function sessionMuscles(wo) {
  const acc = {};
  let unknown = 0;
  wo.exercises.forEach(e => {
    // a plank is core work; counting only sets with reps left timed holds out of the map
    const sets = e.sets.filter(s => isWorking(s) && (s.r > 0 || s.sec > 0 || s.m > 0));
    if (!sets.length) return;
    const m = exMuscles(exName(e));
    if (!m) { unknown++; return; }
    const rpes = sets.map(s => s.rpe).filter(r => r >= 1 && r <= 10);
    let hard;                                              // 0 = easy, 1 = maximal
    if (rpes.length) hard = clamp((rpes.reduce((a, b) => a + b, 0) / rpes.length - 5) / 5, 0, 1);
    else {
      const st = statsFor(exKey(e));
      const top = Math.max(...sets.map(s => e1rm(s.w, s.r)));
      hard = st && st.best.e1 > 0 && top > 0 ? clamp((top / st.best.e1 - 0.6) / 0.4, 0, 1) : 0.5;
    }
    Object.entries(m).forEach(([k, share]) => {
      if (!MUSCLES[k]) return;
      const a = acc[k] = acc[k] || { key: k, name: MUSCLES[k], sets: 0, hardSum: 0 };
      a.sets += sets.length * share;
      a.hardSum += hard * sets.length * share;
    });
  });
  const list = Object.values(acc).map(a => ({ ...a, hard: a.sets ? a.hardSum / a.sets : 0 }))
    .sort((a, b) => b.sets - a.sets);
  return { list, unknown, max: list.length ? list[0].sets : 0 };
}
function intensityOf(h) {
  return h >= 0.7 ? { word: 'Hard', color: CARD.hard }
    : h >= 0.4 ? { word: 'Moderate', color: CARD.moderate }
    : { word: 'Light', color: CARD.light };
}

function cardHead(x, wo, W, P) {
  x.fillStyle = CARD.bg; x.fillRect(0, 0, W, x.canvas.height);
  x.fillStyle = CARD.accent; x.fillRect(0, 0, W, 8);
  x.fillStyle = CARD.dim; x.font = cardFont(26, 600);
  x.fillText(fmtDate(wo.date, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase(), P, 96);
  x.fillStyle = CARD.text; x.font = cardFont(54, 800);
  x.fillText(fitText(x, wo.name, W - P * 2), P, 158);
  return 158;
}
function cardFoot(x, W, H, P) {
  const handle = (S.settings.handle || '').trim();
  x.textAlign = 'left'; x.fillStyle = CARD.dim; x.font = cardFont(23, 600);
  x.fillText(handle || 'IRONLOG', P, H - 44);
}

/* Square, four big numbers, what got done in one breath. */
function quickCardCanvas(wo) {
  const W = 1080, H = 1080, P = 72;
  const t = sessionTotals(wo);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  cardHead(x, wo, W, P);

  const tiles = [
    [wt(t.volume, 0), 'VOLUME'], [String(t.sets), 'SETS'], [String(t.reps), 'REPS'],
    t.mins ? [`${t.mins}m`, 'TIME'] : [String(t.ws.length), 'EXERCISES'],
  ];
  const tw = (W - P * 2 - 24) / 2, th = 210;
  tiles.forEach((s, i) => {
    const tx = P + (i % 2) * (tw + 24), ty = 230 + Math.floor(i / 2) * (th + 24);
    x.fillStyle = CARD.tile; roundRect(x, tx, ty, tw, th, 22); x.fill();
    x.fillStyle = CARD.text; x.font = cardFont(74, 800);
    x.fillText(fitText(x, s[0], tw - 60), tx + 30, ty + 118);
    x.fillStyle = CARD.dim; x.font = cardFont(24, 650);
    x.fillText(s[1], tx + 30, ty + 168);
  });

  let y = 230 + th * 2 + 24 + 70;
  if (t.prs.length) {
    x.fillStyle = CARD.goldBg; roundRect(x, P, y - 44, W - P * 2, 72, 16); x.fill();
    x.fillStyle = CARD.gold; x.font = cardFont(30, 750);
    const label = `★ ${t.prs.length} PERSONAL RECORD${t.prs.length === 1 ? '' : 'S'}`;
    x.fillText(fitText(x, `${label}  ${t.prs.map(p => p.name).join(' · ')}`, W - P * 2 - 48), P + 24, y + 4);
    y += 92;
  }
  x.fillStyle = CARD.dim; x.font = cardFont(27, 600);
  wrapText(x, t.ws.map(o => `${exFull(o.e)} ×${o.sets.length}`).join(' · '), P, y + 10, W - P * 2, 38, 2);
  cardFoot(x, W, H, P);
  return c;
}

/* Everything, height grows with the session. Measured first, drawn second. */
function fullCardCanvas(wo) {
  const W = 1080, P = 72;
  const t = sessionTotals(wo);
  const mus = sessionMuscles(wo);
  const musRows = mus.list.slice(0, 10);
  const allSets = wo.exercises.map(e => ({ e, sets: e.sets })).filter(o => o.sets.length);
  const setLines = allSets.reduce((n, o) => n + o.sets.length, 0);
  const prRows = Math.min(t.prs.length, 6);

  const H = 330
    + (prRows ? 60 + prRows * 58 + 20 : 0)
    + 60 + allSets.length * 64 + setLines * 40 + 20
    + (musRows.length ? 60 + musRows.length * 50 + (mus.unknown ? 40 : 0) + 20 : 0)
    + 110;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  let y = cardHead(x, wo, W, P) + 64;

  const stats = [[wt(t.volume, 0), 'VOLUME'], [String(t.sets), 'SETS'], [String(t.reps), 'REPS'],
    ...(t.mins ? [[`${t.mins}m`, 'TIME']] : [])];
  const cw = (W - P * 2) / stats.length;
  stats.forEach((s, i) => {
    x.fillStyle = CARD.text; x.font = cardFont(40, 780); x.fillText(s[0], P + i * cw, y + 44);
    x.fillStyle = CARD.dim; x.font = cardFont(21, 600); x.fillText(s[1], P + i * cw, y + 76);
  });
  y += 108;

  const section = (label, color = CARD.dim) => {
    x.textAlign = 'left'; x.fillStyle = color; x.font = cardFont(22, 700);
    x.fillText(label, P, y + 30); y += 60;
  };

  if (prRows) {
    section(`★ ${t.prs.length} PERSONAL RECORD${t.prs.length === 1 ? '' : 'S'}`, CARD.gold);
    t.prs.slice(0, prRows).forEach(p => {
      x.fillStyle = CARD.goldBg; roundRect(x, P, y, W - P * 2, 48, 10); x.fill();
      x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(27, 650);
      x.fillText(fitText(x, p.name, W / 2), P + 18, y + 32);
      x.textAlign = 'right'; x.fillStyle = CARD.gold; x.font = cardFont(27, 780);
      x.fillText(p.label || (p.w > 0 ? `${wt(p.w)} × ${p.r}` : `${p.r} reps`), W - P - 18, y + 32);
      y += 58;
    });
    y += 20;
  }

  section('EVERY SET');
  const prKeys = new Set(t.prs.filter(p => !p.label).map(p => p.key));   // reps PRs, by leaf: names collapse across variants now
  allSets.forEach(({ e, sets }) => {
    x.strokeStyle = CARD.line; x.lineWidth = 2;
    x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
    const working = sets.filter(s => isWorking(s));
    const vol = working.reduce((a, s) => a + s.w * s.r, 0);
    const scored = inRepsPool(e) ? working.filter(s => isPRSet(s) && s.r > 0) : [];
    const prSet = prKeys.has(exKey(e)) && scored.length ? bestSetOf(scored) : null;   // the one set prsFor scored
    const reps = working.reduce((a, s) => a + s.r, 0);
    x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(29, 680);
    x.fillText(fitText(x, exFull(e), W - P * 2 - 260), P, y + 42);
    x.textAlign = 'right'; x.fillStyle = CARD.dim; x.font = cardFont(24, 600);
    // timed: total time. bodyweight: reps, not 0kg
    const totSec = working.reduce((a, s) => a + (s.sec || 0), 0);
    const kind = kindOf(e), totM = working.reduce((a, s) => a + (s.m || 0), 0);
    x.fillText(`${working.length} set${working.length === 1 ? '' : 's'} · ${kind === 'time' || kind === 'race' ? fmtSec(totSec)
      : kind === 'carry' || kind === 'capcarry' ? (totM > 0 ? fmtM(totM) : fmtSec(totSec))
      : kind === 'series' ? entryHeadline(e, working)
      : vol > 0 && kind === 'reps' ? wt(vol, 0) : reps + ' reps'}`, W - P, y + 42);
    y += 64;
    sets.forEach((s, si) => {
      const isPR = s === prSet;
      x.textAlign = 'left';
      x.fillStyle = isWarm(s) ? CARD.warm : CARD.dim; x.font = cardFont(23, 600);
      x.fillText(setNumber(sets, si), P + 12, y + 28);
      x.fillStyle = isWarm(s) ? CARD.warm : isPR ? CARD.gold : CARD.text; x.font = cardFont(26, isPR ? 780 : 620);
      x.fillText(setLabel(s, e) + (roleWord(s) ? `  · ${roleWord(s)}` : '') + (isPR ? '  ★' : ''), P + 64, y + 28);
      if (s.w > 0 && s.r > 0 && isPRSet(s) && kind === 'reps') {
        x.textAlign = 'right'; x.fillStyle = CARD.dim; x.font = cardFont(22, 600);
        x.fillText(`e1RM ${wt(e1rm(s.w, s.r, s.rpe))}`, W - P, y + 28);
      }
      y += 40;
    });
  });
  y += 20;

  if (musRows.length) {
    section('MUSCLES WORKED');
    const barX = P + 250, barW = W - P - barX - 170;
    musRows.forEach(m => {
      const it = intensityOf(m.hard);
      x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(25, 640);
      x.fillText(m.name, P, y + 30);
      x.fillStyle = CARD.line; roundRect(x, barX, y + 10, barW, 26, 13); x.fill();
      x.fillStyle = it.color; roundRect(x, barX, y + 10, Math.max(26, barW * (m.sets / mus.max)), 26, 13); x.fill();
      x.textAlign = 'right'; x.fillStyle = it.color; x.font = cardFont(22, 700);
      x.fillText(it.word.toUpperCase(), W - P, y + 30);
      x.fillStyle = CARD.dim; x.font = cardFont(20, 600);
      x.fillText(`${m.sets.toFixed(1)} sets`, W - P - 130, y + 30);
      y += 50;
    });
    if (mus.unknown) {
      x.textAlign = 'left'; x.fillStyle = CARD.warm; x.font = cardFont(21, 600);
      x.fillText(`+ ${mus.unknown} movement${mus.unknown === 1 ? '' : 's'} with no muscle map`, P, y + 26);
      y += 40;
    }
    y += 20;
  }
  cardFoot(x, W, H, P);
  return c;
}

/* Share sheet where the platform allows it, download where it doesn't — the
   sandbox may block navigator.share, and a silent failure is worse than a file
   in the downloads folder. */
async function shareSession(wo, mode = 'quick') {
  let c;
  try { c = mode === 'full' ? fullCardCanvas(wo) : quickCardCanvas(wo); }
  catch (e) { console.warn('share card', e); return toast('Could not build the image'); }

  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  if (!blob) return toast('Could not build the image');
  const file = new File([blob], `session-${wo.date}-${mode}.png`, { type: 'image/png' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // user dismissed: not an error
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Image saved', 'green');
}

/* e1RM against last time, per rep-based lift in a session (roadmap B5):
   today's best set against the last session before this one, and the
   all-time best as it stood. Drops and warm-ups don't count. */
function e1Changes(wo) {
  const seen = new Set(), out = [];
  wo.exercises.forEach(e => {
    if (kindOf(e) !== 'reps' || !e.leaf) return;
    const key = exKey(e);
    if (seen.has(key)) return;
    seen.add(key);
    const sets = wo.exercises.filter(x => exKey(x) === key && kindOf(x) === 'reps')
      .flatMap(x => x.sets.filter(s => s.done !== false && isPRSet(s) && s.w > 0 && s.r > 0));
    if (!sets.length) return;
    const today = Math.max(...sets.map(s => e1rm(s.w, s.r, s.rpe)));
    const st = statsFor(key, wo.date);
    const last = st && st.last ? st.last.e1 : null;
    out.push({ name: exFull(e), key, today, last, best: st ? st.best.e1 : null, lastDate: st && st.last ? st.last.date : null });
  });
  return out;
}
function e1ChangeRows(rows) {
  return rows.map(r => {
    const d = r.last ? r.today - r.last : null;
    const col = d == null ? 'var(--dim)' : d > 0.05 ? 'var(--green)' : d < -0.05 ? 'var(--red)' : 'var(--dim)';
    return `<div class="exline"><span>${esc(r.name)}</span>
      <span class="mono"><b>${wt(r.today)}</b> <span style="color:${col}">${d == null ? 'first' : `${d > 0.05 ? '▲' : d < -0.05 ? '▼' : '='} ${wt(Math.abs(d))}`}</span></span></div>`;
  }).join('');
}

/* ============================================================
   EDIT A COMPLETED SESSION
   Works on a clone; nothing touches S.workouts until Save. Same table as the
   live session so nothing has to be relearned. A set unticked here is dropped
   from the log on save — finishWorkout keeps only ticked sets, and history
   reads only ticked sets, so that's the one meaning of the tick. PRs are
   derived at read time by prsFor, so the calendar, analytics and share cards
   follow an edit with no second bookkeeping path; only summary.prs, the
   at-finish snapshot, is rebuilt.
   ============================================================ */
let editDraft = null;

function openEditWorkout(id) {
  const wo = S.workouts.find(w => w.id === id);
  if (!wo || wo.status !== 'completed') return;
  editDraft = structuredClone(wo);
  editDraft.exercises.forEach(e => e.sets.forEach(s => { s.done = s.done !== false; }));
  renderEditWorkout();
}

    ${e.series ? `<div class="row" style="gap:8px;align-items:center;padding:8px 12px 0">
      <label class="sub grow" for="ess${ei}">Series time</label>
      <input id="ess${ei}" type="text" inputmode="numeric" data-eseries-sec="${ei}" value="${fmtSec(e.seriesSec)}" placeholder="m:ss" style="width:90px"></div>` : ''}
    <div class="ex-foot"><button class="btn sm ghost grow" data-eaddset="${ei}">+ ${e.series ? 'Stone' : 'Set'}</button></div>
  </div>`;

  modal({
    title: 'Edit session',
    body: `
      <div class="grid2">
        <div class="field"><label>Name</label><input id="eName" value="${esc(d.name)}"></div>
        <div class="field"><label>Date</label><input type="date" id="eDate" value="${d.date}" max="${today()}"></div>
      </div>
      <div class="row between" style="margin-bottom:10px;gap:8px">
        <div class="sub grow">Untick a set to drop it. PRs and analytics follow the edit.</div>
        <button class="btn xs ${hasFeel(d) ? 'primary' : 'ghost'}" id="eFeel">${hasFeel(d) ? esc(feelWords(d) || 'Felt: note') : 'How it felt'}</button>
        <button class="btn xs ${d.off ? 'primary' : 'ghost'}" id="eOff" title="Off day — kept out of progression and stall checks">${d.off ? '✓ Off day' : 'Off day'}</button>
      </div>
      ${d.exercises.length ? d.exercises.map(exCard).join('') : `<div class="empty" style="padding:14px">No exercises — add one below.</div>`}
      <button class="btn wide ghost" id="eAddEx">+ Add exercise</button>
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="eSave">Save changes</button>`,
    onOpen: bg => {
      const grab = () => {
        d.name = $('#eName', bg).value.trim() || d.name;
        d.date = $('#eDate', bg).value || d.date;
      };
      const re = () => { grab(); renderEditWorkout(); };
      // typing updates the draft silently so focus is never stolen
      bg.querySelectorAll('[data-ef]').forEach(inp => {
        selectOnFocus(inp);
        inp.oninput = () => {
        const [ei, si] = key(inp.dataset.k);
        const s = d.exercises[ei].sets[si];
        const val = inp.value === '' ? null : +inp.value;
        if (inp.dataset.ef === 'w') s.w = val ? toKg(val) : 0;
        if (inp.dataset.ef === 'r') s.r = val || 0;
        if (inp.dataset.ef === 'rpe') s.rpe = rirToRpe(val == null ? null : Math.round(val));
        if (inp.dataset.ef === 'm') s.m = val > 0 ? val : null;
        if (inp.dataset.ef === 'n') s.n = val > 0 ? Math.round(val) : null;
        if (inp.dataset.ef === 'sec') { s.sec = parseTime(inp.value); if (s.holdMode) { s.holdMode = 'manual'; s.target = null; } }
        };
        if (inp.dataset.ef === 'sec') inp.onblur = () => {
          const [ei, si] = key(inp.dataset.k);
          inp.value = fmtSec(d.exercises[ei].sets[si].sec);
        };
      });
      bg.querySelectorAll('[data-emade]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.emade); const s = d.exercises[ei].sets[si];
        if (s.r > 0) { s.r = 0; s.miss = true; } else { s.r = 1; delete s.miss; }
        re();
      });
      bg.querySelectorAll('[data-eseries-sec]').forEach(inp => {
        selectOnFocus(inp);
        const ex = d.exercises[+inp.dataset.eseriesSec];
        inp.oninput = () => { ex.seriesSec = parseTime(inp.value) || null; };
        inp.onblur = () => { inp.value = ex.seriesSec ? fmtSec(ex.seriesSec) : ''; };
      });
      bg.querySelectorAll('[data-edone]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.edone); const s = d.exercises[ei].sets[si]; s.done = !s.done; re();
      });
      bg.querySelectorAll('[data-ewarm]').forEach(b => b.onclick = () => {
        grab(); const [ei, si] = key(b.dataset.ewarm); openRolePicker(d.exercises[ei], si, renderEditWorkout, true);
      });
      bg.querySelectorAll('[data-edelset]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.edelset);
        d.exercises[ei].sets.splice(si, 1);
        if (!d.exercises[ei].sets.length) d.exercises.splice(ei, 1);
        re();
      });
      bg.querySelectorAll('[data-eaddset]').forEach(b => b.onclick = () => {
        const ex = d.exercises[+b.dataset.eaddset];
        const last = ex.sets[ex.sets.length - 1] || { w: 0, r: 0 };
        ex.sets.push({ w: last.w, r: kindOf(ex) === 'series' ? 1 : last.r, sec: last.sec || null, rpe: null, done: true, setType: 'working',
          ...(last.m > 0 ? { m: last.m } : {}), ...(last.n > 0 ? { n: last.n } : {}) });
        re();
      });
      bg.querySelectorAll('[data-emods]').forEach(b => b.onclick = () => {
        grab();
        openModPicker(d.exercises[+b.dataset.emods], renderEditWorkout);
      });
      bg.querySelectorAll('[data-eex-iso]').forEach(b => b.onclick = () => {
        grab();
        const ex = d.exercises[+b.dataset.eexIso];
        setIso(ex, !isIso(ex), () => { ex.sets.forEach(s => { s.done = true; }); renderEditWorkout(); });
      });
      bg.querySelectorAll('[data-eex-up]').forEach(b => b.onclick = () => {
        const i = +b.dataset.eexUp;
        if (i > 0) { const [x] = d.exercises.splice(i, 1); d.exercises.splice(i - 1, 0, x); re(); }
      });
      bg.querySelectorAll('[data-eex-down]').forEach(b => b.onclick = () => {
        const i = +b.dataset.eexDown;
        if (i < d.exercises.length - 1) { const [x] = d.exercises.splice(i, 1); d.exercises.splice(i + 1, 0, x); re(); }
      });
      bg.querySelectorAll('[data-eex-rm]').forEach(b => b.onclick = () => {
        grab();
        const i = +b.dataset.eexRm, ex = d.exercises[i];
        confirmDlg(`Remove ${exFull(ex)} and its ${ex.sets.length} set${ex.sets.length === 1 ? '' : 's'} from this session?`,
          () => { d.exercises.splice(i, 1); renderEditWorkout(); }, 'Remove');
      });
      $('#eAddEx', bg).onclick = () => {
        grab();
        pickExercise(leaf => {
          d.exercises.push({ leaf, legacyName: displayName(leaf), notes: '', mods: [], sets: [{ w: 0, r: metricFor(leaf) === 'reps_weight' ? 0 : null, sec: null, rpe: null, done: true, setType: 'working' }] });
          renderEditWorkout();
        });
      };
      $('#eOff', bg).onclick = () => { d.off = !d.off; if (!d.off) delete d.off; re(); };
      $('#eFeel', bg).onclick = () => { grab(); openFeel(d, 'How the session felt', renderEditWorkout); };
      $('#eSave', bg).onclick = () => { grab(); saveEdit(false); };
    },
  });
}

function saveEdit(force) {
  const d = editDraft;
  if (!d) return;
  // same metric-aware rule as finishWorkout — editing a session must not be a way to lose its holds
  const logged = d.exercises.map(e => ({
    ...e,
    sets: e.sets.filter(s => s.done && setLogged(e, s)),
  })).filter(e => e.sets.length);
  if (!logged.length) return toast('Keep at least one ticked set, or delete the session instead');

  if (!force) {
    const flagged = [];
    logged.forEach(e => {
      if (!inRepsPool(e)) return;               // nothing to say about a duration, a distance or a capped set
      e.sets.filter(s => isWorking(s) && s.r > 0).forEach(s => {
        const why = plausibility(exKey(e), s.w, s.r, s.rpe, d.date);
        if (why.length) flagged.push({ name: exFull(e), s, why });
      });
    });
    if (flagged.length) return plausListDlg(flagged, 'Save', () => saveEdit(true));
  }

  const orig = S.workouts.find(w => w.id === d.id) || {};
  const done = {
    ...orig, name: d.name, date: d.date, exercises: logged, edited: Date.now(), off: d.off || undefined, feel: hasFeel(d) ? d.feel : undefined,
    summary: {
      ...(orig.summary || {}),
      volume: logged.reduce((t, e) => t + e.sets.filter(s => isWorking(s)).reduce((x, s) => x + s.w * s.r, 0), 0),
      prs: [],
    },
  };
  S.workouts = S.workouts.filter(w => w.id !== d.id);
  S.workouts.push(done);
  bust();
  done.summary.prs = prsFor(done);   // the at-finish snapshot, rebuilt against history before this date
  if (page === 'calendar') calSelected = done.date;
  editDraft = null;
  save(); bust(); closeAllModals(); render();
  toast('Session updated', 'green');
  autoSync();
}

/* The headline chart (roadmap B5): e1RM per session for the main lifts —
   your priority lifts, or else the three most-trained heavy barbell lifts.
   The last twelve months, so a long history doesn't flatten the recent line. */
function mainLiftKeys() {
  const pk = priorityKeys().filter(k => statsFor(k));
  if (pk.length) return pk.slice(0, 5);
  return allStats().filter(s => s.leaf && isMainLift({ leaf: s.leaf })).slice(0, 3).map(s => s.key);
}
function mainLiftChart() {
  const keys = mainLiftKeys();
  if (!keys.length) return '';
  const d = new Date(); d.setFullYear(d.getFullYear() - 1);
  const since = iso(d);
  const series = keys.map((k, i) => {
    const st = statsFor(k);
    const recent = st.series.filter(p => p.date >= since);
    return { label: leafName(k), color: SERIES_COLORS[i % SERIES_COLORS.length],
      points: (recent.length >= 2 ? recent : st.series).map(p => ({ date: p.date, v: dw(p.e1) })), st };
  });
  return `<div class="card" style="margin-bottom:13px">
    <div class="row between" style="margin-bottom:6px"><div class="eyebrow">e1RM trend · main lifts</div>
      <div class="sub" style="font-size:11px">${priorityKeys().some(k => keys.includes(k)) ? 'your priority lifts' : 'most-trained heavy lifts'}</div></div>
    ${chartMulti(series, { fmt: v => nice(Math.round(v)) })}
    <div class="row wrap" style="gap:6px;margin-top:8px">${series.map(s => {
      const pct = s.st.pct;
      return `<button class="chip" data-exdetail="${esc(keys[series.indexOf(s)])}" style="border-color:${s.color}">${esc(s.label)} ${wt(s.st.best.e1)}
        <span style="color:${pct > 1 ? 'var(--green)' : pct < -1 ? 'var(--red)' : 'var(--dim)'}">${pct > 1 ? '▲' : pct < -1 ? '▼' : '—'}${Math.abs(Math.round(pct))}%</span></button>`;
    }).join('')}</div>
  </div>`;
}

let detailMetric = 'e1';
/* Every leaf of this movement that has been logged, plus the primary — so the
   page always offers the canonical variant even before it has been done. */
function movementVariants(movementId) {
  const keys = new Set();
  S.workouts.filter(w => w.status === 'completed').forEach(wo => wo.exercises.forEach(e => {
    // holds, caps, carries and races keep their own records and have no e1RM, so they're not a variant row here
    if (e.leaf && e.leaf.movement === movementId && inRepsPool(e)) keys.add(exKey(e));
  }));
  const m = movementById(movementId);
  if (m) keys.add(leafKey(completeLeaf(m, null)));
  return [...keys].map(k => ({ key: k, leaf: keyLeaf(k), name: displayName(keyLeaf(k)), stats: statsFor(k) }))
    .sort((a, b) => (b.stats ? b.stats.sessions : 0) - (a.stats ? a.stats.sessions : 0));
}
/* The primary variant is the movement at its defaults — Aaron's IPF squat is
   Back Squat / barbell / bilateral, not "best squat variant". */
function primaryVariantKey(movementId) {
  const m = movementById(movementId);
  return m ? leafKey(completeLeaf(m, null)) : null;
}

let _mvTab = 'info';
/* The movement page. A parent rolls its leaves up for presentation and stores
   nothing (section 4.3); the headline is the primary variant's or nothing at
   all (4.4), never the maximum across variants. */
function openMovementPage(movementId, focusKey) {
  const m = movementById(movementId);
  if (!m) return toast('Not in the exercise catalogue');
  const vars = movementVariants(movementId);
  let focus = focusKey && vars.some(v => v.key === focusKey) ? focusKey : (vars[0] && vars[0].key);
  _mvTab = 'info';

  const strip = () => `<div class="varstrip">${vars.map(v => `
    <button class="vartab ${v.key === focus ? 'on' : ''}" data-var="${esc(v.key)}">
      <span class="n">${esc(variantLabel(v.leaf) || 'Standard')}</span>
      <span class="m">${v.stats ? `${v.stats.sessions} session${v.stats.sessions === 1 ? '' : 's'}` : 'not logged'}</span>
    </button>`).join('')}</div>`;

  const infoTab = () => {
    const leaf = keyLeaf(focus);
    const atts = attachmentsFor(m, leaf.equipment);
    const icons = (list, cur, iconMap, labelMap) => `<div class="iconrow">${list.map(v =>
      `<span class="ic ${v === cur ? 'on' : ''}" title="${esc((labelMap && labelMap[v]) || v)}">${(iconMap && iconMap[v]) || ''}</span>`).join('')}</div>`;
    const muscles = ms => (ms || []).map(x => `<span class="chip">${esc(x)}</span>`).join(' ') || '<span class="sub">—</span>';
    return `
      <div class="row wrap" style="gap:7px;margin-bottom:12px">
        <span class="chip">${esc(m.category)}</span>
        <span class="chip">${esc(m.metric || 'reps_weight') === 'time' ? 'timed' : 'reps × weight'}</span>
        <span class="chip">${loadConventionFor(leaf) === 'per_side' ? 'per side' : 'total'} load</span>
        ${m.verified === false ? '<span class="chip">unverified</span>' : ''}
      </div>
      <div class="eyebrow">Equipment</div>
      ${icons(m.equipment || [], leaf.equipment, EQ_ICON, EQ_TITLE)}
      <div class="eyebrow" style="margin-top:12px">Execution</div>
      ${icons(m.execution || [], leaf.execution, EXEC_ICON, EXEC_LABEL)}
      ${atts.length > 1 ? `<div class="eyebrow" style="margin-top:12px">Attachment</div>
        <div class="row wrap" style="gap:6px;margin-top:6px">${atts.map(a =>
          `<span class="chip ${a === leaf.attachment ? 'accent' : ''}">${esc(ATT_TITLE[a] || a)}</span>`).join('')}</div>` : ''}
      <div class="eyebrow" style="margin-top:14px">Primary muscles</div>
      <div class="row wrap" style="gap:6px;margin-top:6px">${muscles(m.primary)}</div>
      ${(m.secondary || []).length ? `<div class="eyebrow" style="margin-top:12px">Secondary</div>
        <div class="row wrap" style="gap:6px;margin-top:6px">${muscles(m.secondary)}</div>` : ''}
      <div class="sub" style="margin-top:14px">${vars.length} variant${vars.length === 1 ? '' : 's'} known · each keeps its own records.</div>`;
  };

  const statsTab = () => {
    const pk = primaryVariantKey(movementId);
    const ps = statsFor(pk);
    /* Section 4.4 — the headline is the primary variant's, or nothing. A
       machine chest press outranking a competition bench is nonsense. */
    const headline = ps
      ? `<div class="stats grid3" style="margin-bottom:6px">
          <div class="stat"><div class="k">Best e1RM</div><div class="v">${w(ps.best.e1)}</div><div class="d">${esc(variantLabel(keyLeaf(pk)) || 'standard')}</div></div>
          <div class="stat"><div class="k">Top set</div><div class="v">${w(ps.bestW.w)}</div><div class="d">× ${ps.bestW.r}</div></div>
          <div class="stat"><div class="k">Sessions</div><div class="v">${ps.sessions}</div><div class="d">${ps.totalSets} sets</div></div>
        </div>`
      : `<div class="card tight" style="margin-bottom:10px"><div class="sub">No headline figure — the primary variant
          (${esc(variantLabel(keyLeaf(pk)) || 'the standard version')}) hasn't been logged. Variants are never rolled up into one number.</div></div>`;
    const rows = vars.filter(v => v.stats).map((v, i) => `
      <tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${SERIES_COLORS[i % SERIES_COLORS.length]};margin-right:7px"></i>${esc(variantLabel(v.leaf) || 'Standard')}</td>
        <td class="r mono">${w(v.stats.best.e1)}</td>
        <td class="r mono dimmer">${v.stats.sessions}s</td></tr>`).join('');
    const series = vars.filter(v => v.stats).map((v, i) => ({
      label: variantLabel(v.leaf) || 'Standard', color: SERIES_COLORS[i % SERIES_COLORS.length],
      points: v.stats.series.map(p => ({ date: p.date, v: dw(p.e1) })),
    }));
    /* The variant picked in the strip gets its own numbers — the headline
       above stays the primary's (section 4.4). */
    const fv = vars.find(v => v.key === focus);
    const fs = fv && fv.stats;
    const focusStrip = fv && focus !== pk ? `
      <div class="eyebrow" style="margin:12px 0 6px">${esc(variantLabel(fv.leaf) || 'Standard')}</div>
      ${fs ? `<div class="stats grid3">

    /* Every PR this variant has had, newest first — the same records the

    const base = focus ? focus.split('|')[0] : null;
    const timeline = !base ? [] : S.workouts.filter(wo => wo.status === 'completed')
      .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0)

    return `${headline}${focusStrip}
      <div class="eyebrow" style="margin:14px 0 6px">Estimated 1RM by variant</div>

      <table class="vartable"><tbody>${rows || '<tr><td class="sub">Nothing logged yet</td></tr>'}</tbody></table>
      ${tl}`;
  };

  const historyTab = () => {
    const rows = [];
    S.workouts.filter(wo => wo.status === 'completed').forEach(wo => wo.exercises.forEach(e => {
      if (!e.leaf || e.leaf.movement !== movementId) return;
      const working = e.sets.filter(s => s.done && isWorking(s));
      if (!working.length) return;
      rows.push({ date: wo.date, name: exName(e), variant: [exVariant(e), exTag(e), ...(e.mods || []).map(modLabel)].filter(Boolean).join(' · '),

      <div class="card tight" style="margin-bottom:8px">
        <div class="row between" style="margin-bottom:6px">

            <div class="sub">${fmtDate(r.date)} · ${relDay(r.date)}</div></div>
          <button class="btn xs ghost" data-hist-wo="${esc(r.id)}">View</button>
        </div>
        ${r.sets.map((s, i) => `<div class="exline"><span class="dimmer">${setListLabel(r.sets, i)}</span>
          <span class="mono">${shapeKind(r) ? esc(setText(r, s)) : isTimed(r) ? `${holdLabel(s)}${r.iso && s.rpe ? ` @ ${rpeToRir(s.rpe)}` : ''}` : `${s.w > 0 ? `${wt(s.w)} × ${s.r == null ? 'AMRAP' : s.r}` : `${s.r == null ? 'AMRAP' : s.r} reps`}${s.rpe ? ` @ ${rpeToRir(s.rpe)}` : ''}`}${roleSuffix(s)}${feelSuffix(s)}</span></div>`).join('')}
      </div>`).join('');
  };

  const body = () => `
    <div class="seg" id="mvTabs">
      <button data-mvtab="info" class="${_mvTab === 'info' ? 'on' : ''}">Info</button>
      <button data-mvtab="stats" class="${_mvTab === 'stats' ? 'on' : ''}">Statistics</button>

    </div>
    ${strip()}

  modal({
    title: m.name,
    body: body(),
    foot: `<button class="btn primary wide" data-close>Close</button>`,
    onOpen: bg => {
      const bind = () => {
        bg.querySelectorAll('[data-mvtab]').forEach(b => b.onclick = () => { _mvTab = b.dataset.mvtab; redraw(); });
        bg.querySelectorAll('[data-var]').forEach(b => b.onclick = () => { focus = b.dataset.var; redraw(); });
        bg.querySelectorAll('[data-hist-wo]').forEach(b => b.onclick = () => { closeAllModals(); viewCompleted(b.dataset.histWo); });

      bind();
    },
  });
}

/* Entered from a leaf; opens that leaf's movement page focused on it. */
function openExDetail(key) {

/* ============================================================
   MEETS
   ============================================================ */
/* Log one lift or several — whatever actually got tested. Blank rows are
   skipped, so a squat-only day is a first-class entry, not a partial one. */
/* Tests are the big three only — squat, bench, deadlift — pinned to the
   priority-lift variants, so the rows are fixed rather than picked. (0.16.3:
   the old picker preselected by name against key-valued options, so every row
   fell back to the first barbell lift, and the entries it sent carried no leaf,
   so logTest filtered all of them out and nothing could ever save.) */
const TEST_FALLBACK = { squat: 'Back Squat', bench: 'Bench Press', deadlift: 'Deadlift' };
function testRows() {
  return EVENT_TYPES[DEFAULT_EVENT_TYPE].lifts.map(l => {
    const leaf = priorityLeaf(l.slot) || leafForName(TEST_FALLBACK[l.slot] || l.label);
    return { slot: l.slot, label: l.label, leaf, name: displayName(leaf) };
  });
}
function openTestLog() {

   Raw, via the OpenPowerlifting project (public domain, attribution kept).
   One year is a small sample — a single strong entry shifts everything under
   it — so this is a range, not a promise. */

   attempts are planned and how a total is scored. Powerlifting is the only type
   built so far; adding another — weightlifting, strongman, a push-pull — is a
   record in here plus a movement in the catalogue, not new code.

   and the priority lifts. The three keys that used to be written out by hand in
   eight places now come from lifts[].slot. */
const EVENT_TYPES = {
  powerlifting: {
    id: 'powerlifting',
    label: 'Powerlifting',
    blurb: 'Squat, bench and deadlift. Three attempts at each, best of each counted, DOTS from the total.',

  strengthlifting: {

    label: 'Strengthlifting',
    blurb: 'Squat, overhead press and deadlift. Three attempts at each, best of each counted.',
    icon: '◈',
    lifts: [
      { slot: 'squat',    label: 'Squat',    movement: 'back-squat',     equipment: 'barbell' },
      { slot: 'press',    label: 'Press',    movement: 'overhead-press', equipment: 'barbell' },
      { slot: 'deadlift', label: 'Deadlift', movement: 'deadlift',       equipment: 'barbell' },
    ],

    wclass: true,
  },
  'single-lift': {
    id: 'single-lift',
    label: 'Single lift',
    blurb: 'One lift, three attempts. Bench-only, deadlift-only, or whatever the meet contests.',
    icon: '▲',
    chooseLift: true,     // the lift is picked per event, not fixed by the type
    lifts: [],
    attempts: true,
    scored: 'total',
    wclass: true,
  },
  /* WPPO para powerlifting (roadmap C3, events spec §5): bench only, whole-kg
     increases, an optional fourth record attempt that doesn't count. */
  para: {
    id: 'para',
    label: 'Para powerlifting',
    blurb: 'Bench press only, WPPO classes. Three attempts plus an optional record attempt; best lift and total of good lifts.',
    icon: '◆',
    lifts: [{ slot: 'bench', label: 'Bench', movement: 'bench-press', equipment: 'barbell' }],
    attempts: true,
    scored: 'para',
    wclass: true,
    para: true,
  },
  /* A show is its own list of events, each with its rules (events spec §4). */

    label: 'Strongman',
    blurb: 'The show\'s events — max lifts, reps, carries, medleys, holds — with results and points.',
    icon: '⛓',
    lifts: [],
    attempts: false,
    scored: 'points',
    wclass: true,
    events: true,
  },

const DEFAULT_EVENT_TYPE = 'powerlifting';
/* Events saved before types existed are powerlifting meets — no migration
   needed, the default covers them. */

}
/* The type supplies the lifts; an event may carry its own, which is how a
   single-lift meet says which lift it actually contests. */
function eventLifts(m) {
  if (m && Array.isArray(m.lifts$) && m.lifts$.length) return m.lifts$;
  return eventType(m).lifts;
}

/* Which leaf a contested lift means for YOU. Your own choice for that slot wins
   — an IPF squat is whatever you compete with — and otherwise it falls back to
   the movement the type names. Resolving by movement rather than by position in
   settings.priority is what lets a discipline contest a lift that is not one of
   your three, like the strengthlifting press. */
function liftKey(lift) {
  const p = priorityLeaf(lift.slot);
  if (p) return leafKey(p);
  const mv = movementById(lift.movement);
  if (!mv) return '';
  return leafKey(completeLeaf(mv, { equipment: lift.equipment }));
}
function liftBest(lift) { return latestTest(liftKey(lift)); }
function eventTypeList() { return Object.values(EVENT_TYPES); }
