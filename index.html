/* ---------------- food database ----------------
   USDA SR Legacy (public domain) and CoFID / McCance & Widdowson's (Open
   Government Licence), reduced to the five numbers this app logs, per 100 g.

   The curated LOCAL_FOODS table above stays, because it is the only source of
   per-item weights — an egg is 50 g, a slice of bread 40 g, a pint 568 ml — and
   the datasets only ever describe 100 g. So the two are used for different
   halves of the answer:

     what it is   -> the curated table when it knows the food, the database
                     otherwise. Curated is hand-tuned and encodes the form
                     people log — rice and pasta cooked, mince at 5%, a whole
                     egg — where both datasets lead with raw weights. Letting
                     the database override turned 250 g of rice into 878 kcal.
     how much     -> the curated per-item weight when a count was given,
                     otherwise the grams stated.

   The model is now the fallback, not the path: an ordinary day of food costs
   nothing to log. */

/* Both datasets are American-spelled or use the formal name; people type
   neither. The query is rewritten before matching, never the table. */
const FOOD_SYNONYMS = {
  // spellings CoFID does not use
  yoghurt: 'yogurt', yog: 'yogurt', hummus: 'houmous',
  // everyday shorthand
  mayo: 'mayonnaise', veg: 'vegetables', spuds: 'potatoes', brew: 'tea',
  jacket: 'baked', tinned: 'canned', fizzy: 'carbonated',
};

/* Words that describe amount or freshness rather than the food. Dropping them
   means "200g raw chicken" and "chicken" reach the same row. */
const FOOD_STOP = new Set([
  'a', 'an', 'the', 'of', 'with', 'some', 'my', 'and', 'plus', 'about', 'approx',
  'g', 'gram', 'grams', 'gr', 'kg', 'ml', 'l', 'litre', 'oz', 'lb', 'lbs', 'x',
  'raw', 'fresh', 'slice', 'slices', 'piece', 'pieces', 'serving', 'servings',
  'one', 'two', 'three', 'four', 'five', 'six', 'half', 'couple', 'few',
]);

function foodTokens(s) {
  return String(s || '').toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .split(/\s+/)
    .filter(w => w && !/^\d/.test(w) && !FOOD_STOP.has(w))
    .map(w => FOOD_SYNONYMS[w] || w);
}

/* A short query with no qualifier means the plain version of the food. The
   datasets lead with flavoured and processed variants as often as not, so
   nudge toward the ordinary one and away from the ones nobody meant. */
const FOOD_PLAIN = /\b(plain|natural|unsweetened|whole|boiled|grilled|unfortified)\b/;
const FOOD_FANCY = /\b(fruit|flavou?red|chocolate|strawberry|barbecue|sweetened|toasted|fried|battered|dried|powder|infant|baby)\b/;

/* FOOD_DB is a tab-separated blob rather than an object literal: no quotes,
   brackets or per-field commas, which is about a third off the byte count, and
   one split rebuilds it. Parsed on first use, so a session that never opens the
   Food tab never pays for it. */
let _foodIndex = null;
function foodIndex() {
  if (_foodIndex) return _foodIndex;
  _foodIndex = FOOD_DB.split('\n').map(line => {
    const p = line.split('\t');
    const name = p[0];
    return {
      name, kcal: +p[1] || 0, p: +p[2] || 0, c: +p[3] || 0, f: +p[4] || 0, fib: +p[5] || 0,
      t: foodTokens(name),
    };
  });
  return _foodIndex;
}

/* Every query term must appear; then the least-qualified entry wins, so
   "chicken breast" lands on plain chicken breast rather than on
   "chicken, breast, meat only, cooked, stewed, with salt". */
function foodSearch(query, limit = 5) {
  const q = foodTokens(query);
  if (!q.length) return [];
  const qualified = FOOD_FANCY.test(query.toLowerCase());
  const idx = foodIndex();
  const out = [];
  for (let i = 0; i < idx.length; i++) {
    const e = idx[i];
    let hit = 0;
    for (const w of q) if (e.t.some(t => t === w || t.startsWith(w) || w.startsWith(t))) hit++;
    if (hit < q.length) continue;
    let score = (e.t.length - q.length);                 // surplus words = less generic
    if (e.t[0] === q[0]) score -= 2;                     // leads with the food itself
    if (FOOD_PLAIN.test(e.name.toLowerCase())) score -= 1;
    if (!qualified && FOOD_FANCY.test(e.name.toLowerCase())) score += 2;
    out.push({ e, score: score + i / 1e6 });             // ties go to CoFID, listed first
  }
  out.sort((a, b) => a.score - b.score);
  return out.slice(0, limit).map(x => x.e);
}

/* Grams for a chunk. `each` is the per-item weight when the food has one. */
function foodGrams(raw, each) {
  const m = raw.match(/(\d+(?:\.\d+)?)\s*(kgs?|kilos?|grams?|gr|g|oz|lbs?|lb|ml|l|litres?)\b/);
  if (m) return parseFloat(m[1]) * (UNITS[m[2].replace(/s$/, '')] || UNITS[m[2]] || 1);
  const cm = raw.match(/(\d+(?:\.\d+)?)\s/) ||
             raw.match(new RegExp('\\b(' + Object.keys(WORDNUM).join('|') + ')\\b'));
  const count = cm ? (parseFloat(cm[1]) || WORDNUM[cm[1]] || 1) : 1;
  return count * (each || 100);
}

/* One chunk of text -> a logged item, or null if neither source knows it. */
function lookupFood(chunk, defaultMeal) {
  const raw = String(chunk || '').trim().toLowerCase();
  if (!raw) return null;

  const curated = curatedRow(raw);                  // {row, kwLen} | null
  const dbHit = foodSearch(raw, 1)[0] || null;

  /* Curated wins when its row is genuinely about the food asked for, because
     it is hand-tuned and encodes the form people log — rice and pasta cooked,
     mince at 5%, a whole egg — where the dataset leads with raw weights.
     Letting the database override everything turned 250 g of rice into 878 kcal.

     But several curated rows are deliberate lump-togethers: hummus is filed
     under chickpeas, almonds under nuts, Weetabix under cereal, orange juice
     under orange. Those are wrong by 50% or more, and the database names each
     one properly. So curated only wins if its own name accounts for the head
     of the query — "white rice" is still Rice (cooked), but "hummus" is no
     longer chickpeas. */
  const q = foodTokens(raw);
  const head = q[q.length - 1];
  const curNames = curated ? foodTokens(curated.row[0]) : null;
  const curatedNamesIt = !!(curNames && head &&
    curNames.some(t => t === head || t.startsWith(head) || head.startsWith(t)));
  const useDb = dbHit && (!curated || !curatedNamesIt);
  if (!dbHit && !curated) return null;

  const each = curated ? curated.row[7] : 0;        // per-item weight, whichever source names it
  const grams = foodGrams(raw, each);
  const k = grams / 100;
  const r = n => Math.round(n * k * 10) / 10;

  const src = useDb
    ? { name: dbHit.name, kcal: dbHit.kcal, p: dbHit.p, c: dbHit.c, f: dbHit.f, fib: dbHit.fib }
    : { name: curated.row[0], kcal: curated.row[2], p: curated.row[3], c: curated.row[4], f: curated.row[5], fib: curated.row[6] };

  const counted = !/\d\s*(kgs?|kilos?|grams?|gr|g|oz|lbs?|lb|ml|l|litres?)\b/.test(raw) && each;
  return {
    name: src.name,
    serving: counted ? `${Math.round(grams / each)} × ${curated.row[0].toLowerCase()}` : `${Math.round(grams)} g`,
    meal: defaultMeal,
    kcal: Math.round(src.kcal * k), protein: r(src.p), carbs: r(src.c), fats: r(src.f), fiber: r(src.fib),
    tier: useDb ? 'db' : 'curated',
  };
}

/* The curated table, matched on its keyword lists as whole words: "boiled"
   must not hit 'oil', "steak" must not hit 'tea', "eggplant" must not hit
   'egg', "priced" must not hit 'rice'. A trailing s or es is allowed so
   "2 eggs" and "potatoes" still land. Multi-word keywords match inside a
   longer phrase. Longest keyword wins, so "chicken breast" beats "chicken". */
const _kwRe = new Map();
function kwRegex(kw) {
  let re = _kwRe.get(kw);
  if (!re) {
    re = new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:e?s)?\\b');
    _kwRe.set(kw, re);
  }
  return re;
}
function curatedRow(raw) {
  let hit = null, hitLen = 0;
  for (const row of LOCAL_FOODS) {
    for (const kw of row[1].split('|')) {
      if (kw.length > hitLen && kwRegex(kw).test(raw)) { hit = row; hitLen = kw.length; }
    }
  }
  return hit ? { row: hit, kwLen: hitLen } : null;
}

/* Same contract as the serverless parser: text in, array out. */
function estimateOffline(text) {
  const meal = guessMeal();
  return text.split(/,|\band\b|\+|\n|;/g)
    .map(chunk => lookupFood(chunk, meal))
    .filter(Boolean);
}

/* Split a description into chunks and resolve each one locally. `chunks`
   keeps every piece in the order it was typed, with its table hit or null,
   so the log can be written back in that order once the model has answered
   for the ones the tables couldn't name. */
function resolveFoods(text) {
  const meal = guessMeal();
  const found = [], missed = [], chunks = [];
  text.split(/,|\band\b|\+|\n|;/g).forEach(chunk => {
    const t = chunk.trim();
    if (!t) return;
    const hit = lookupFood(t, meal);
    chunks.push({ text: t, hit });
    if (hit) found.push(hit); else missed.push(t);
  });
  return { found, missed, chunks };
}

/* ---------------- parsing ---------------- */
/* The parser can fail four ways and the fix differs each time, so say
   which one it was rather than making him read Netlify's logs. */
function parseError(e) {
  if (!navigator.onLine) return "You're offline, so parsing is unavailable.";
  if (e.empty) return "Nothing recognisable as food in that.";
  const b = e.body || '';
  if (e.nokey) return 'No API key saved. Add one in Settings → AI parsing to use Claude.';
  if (e.status === 404) return 'No parser at this address. Add your own API key in Settings → AI parsing.';
  if (b.includes('ANTHROPIC_API_KEY is not set')) return 'The site has no API key set. Add ANTHROPIC_API_KEY in Netlify, then redeploy.';
  if (b.includes('upstream 401') || b.includes('upstream 403')) return 'The API key was rejected — check it hasn\'t been revoked.';
  if (b.includes('upstream 400')) return 'The API rejected the request — usually no credit on the Anthropic account.';
  if (b.includes('upstream 429')) return 'Rate limited. Wait a moment and try again.';
  if (e.status >= 500) return 'The parser errored (' + (e.status || '?') + ').';
  if (e.badjson) return 'Claude replied, but not as JSON: ' + e.raw;
  /* fetch() rejects with a TypeError when the request never lands at all —
     VPN, DNS filter, blocker or CORS. Worth saying which, rather than
     lumping it in with a parse failure. */
  if (e.name === 'TypeError') return 'Could not reach the API (' + e.message + '). VPN, DNS filter or content blocker?';
  return "The parser didn't answer \u2014 " + (e.message || 'no detail given') + '.';
}

function addParsed(items, src) {
  const d = fDate();
  items.forEach(it => S.foods.push({
    id: uid(), date: d, meal: MEALS.includes(it.meal) ? it.meal : 'Snacks',
    name: it.name || 'Item', serving: it.serving || '',
    kcal: +it.kcal || 0, p: +it.protein || 0, c: +it.carbs || 0,
    f: +it.fats || 0, fib: +it.fiber || 0, src,
  }));
  syncCheckinKcal(d); save();
}

const FOOD_SYSTEM = `You convert a description of food eaten into structured nutrition data.
Reply with ONLY a JSON array, no prose, no markdown fences.
Each element: {"name":string,"serving":string,"meal":"Breakfast"|"Lunch"|"Dinner"|"Snacks","kcal":number,"protein":number,"carbs":number,"fats":number,"fiber":number}
Grams of macros, kcal as a whole number. Assume UK products and portion sizes.
If a quantity is not given, assume one typical serving and say so in "serving".
Guess the meal from the food and the wording. Return [] if there is no food in the input.`;

function aiKey() { try { return localStorage.getItem('ironlog.anthropicKey') || ''; } catch (e) { return ''; } }
function setAiKey(k) {
  try { k ? localStorage.setItem('ironlog.anthropicKey', k) : localStorage.removeItem('ironlog.anthropicKey'); }
  catch (e) { /* private mode: parsing falls back to the table */ }
}

/* Direct browser call. The key sits in this origin's localStorage and goes
   nowhere but Anthropic — no repo, no bundle, no host. */
async function claudeParse(text, system = FOOD_SYSTEM) {
  const key = aiKey();
  if (!key) { const e = new Error('nokey'); e.nokey = true; throw e; }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system,
      messages: [{ role: 'user', content: text }],
    }),
  });
  if (!r.ok) {
    const body = await r.text().catch(() => '');
    const err = new Error(body || ('HTTP ' + r.status));
    err.status = r.status; err.body = 'upstream ' + r.status + ' ' + body;
    throw err;
  }
  const data = await r.json();
  const out = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  let clean = out.replace(/```json|```/g, '').trim();
  /* Haiku usually returns a bare array, but occasionally tops it with a
     sentence. Salvage the array rather than throwing the whole reply away. */
  if (clean[0] !== '[') {
    const a = clean.indexOf('['), z = clean.lastIndexOf(']');
    if (a !== -1 && z > a) clean = clean.slice(a, z + 1);
  }
  try {
    return JSON.parse(clean);
  } catch (pe) {
    const err = new Error('badjson');
    err.badjson = true;
    err.raw = (out || '(empty reply)').slice(0, 160);
    throw err;
  }
}

/* On a host with no function (GitHub Pages) the endpoint 404s every time.
   Remember that for the session so only the first keyless parse pays for it. */
let netlifyAbsent = false;
async function netlifyParse(text) {
  if (netlifyAbsent) { const e = new Error('no parser'); e.status = 404; throw e; }
  const r = await fetch('/.netlify/functions/parse-food', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  if (!r.ok) {
    if (r.status === 404) netlifyAbsent = true;
    const body = await r.text().catch(() => '');
    const err = new Error(body || ('HTTP ' + r.status));
    err.status = r.status; err.body = body;
    throw err;
  }
  return r.json();
}

async function parseFood() {
  const box = $('#foodInput');
  const text = (box.value || '').trim();
  if (!text) { toast('Type what you ate first'); return; }
  const st = $('#foodStatus');
  const btn = $('#foodParse');
  btn.disabled = true;
  st.innerHTML = '<div class="sub" style="margin-top:8px">Parsing…</div>';

  // the tables first: 2,848 UK foods plus the curated rows, no network, no key
  const { found, missed, chunks } = resolveFoods(text);

  /* render() replaces #foodStatus, so anything written after it has to
     re-query the node. */
  const status = html => { const el = $('#foodStatus'); if (el) el.innerHTML = html; };
  const finish = n => {
    box.value = ''; btn.disabled = false; render();
    if (n) toast(`Added ${n} item${n === 1 ? '' : 's'}`, 'green');
  };

  if (!missed.length) {
    addParsed(found, 'table');
    finish(found.length);
    return;
  }

  /* Only what the tables couldn't name goes to the model, in one call. Table
     hits are held back until it answers so the log reads in the order it was
     typed — "chicken feet, 200g rice" must not come out as rice then feet.
     If the call fails the table hits still go in. */
  const rest = missed.join(', ');
  try {
    const items = aiKey() ? await claudeParse(rest) : await netlifyParse(rest);
    if (!Array.isArray(items)) throw new Error('bad response');
    if (!items.length) { const e = new Error('empty'); e.empty = true; throw e; }

    /* One model item per unresolved chunk is the usual case and maps 1:1.
       Anything else — a chunk split in two, one dropped — can't be mapped
       honestly, so the model's items all land where the first unknown was. */
    const oneEach = items.length === missed.length;
    const ai = items.slice();
    let placed = false;
    chunks.forEach(c => {
      if (c.hit) { addParsed([c.hit], 'table'); return; }
      if (oneEach) addParsed([ai.shift()], 'ai');
      else if (!placed) { addParsed(ai, 'ai'); placed = true; }
    });
    finish(found.length + items.length);
    if (items.length < missed.length) {
      status(`<div class="sub" style="margin-top:8px">The AI returned ${items.length} item${items.length === 1 ? '' : 's'} for the ${missed.length} it was sent
        (${esc(missed.map(m => '“' + m + '”').join(', '))}) — check the log and add anything missing by hand.</div>`);
    }
  } catch (e) {
    console.warn('parse failed', e);
    addParsed(found, 'table');
    finish(found.length);
    /* No key and things left over is the common case on a static host, and
       "no parser at this address" is the wrong thing to say about it. */
    const why = !aiKey()
      ? `${missed.length} item${missed.length === 1 ? ' needs' : 's need'} AI parsing — no API key saved in Settings → AI parsing.`
      : parseError(e);
    status(`<div class="sub" style="margin-top:8px;color:${found.length ? 'var(--dim)' : 'var(--red)'}">
      ${found.length ? `Logged ${found.length} item${found.length === 1 ? '' : 's'} from the food tables. ` : ''}
      Nothing in the tables matches ${esc(missed.map(m => '“' + m + '”').join(', '))}.
      ${esc(why)} Add ${missed.length === 1 ? 'it' : 'them'} by hand.</div>`);
  }
}

let _rec = null;
function dictateFood() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('#foodMic'), box = $('#foodInput');
  if (!SR) return toast('This browser has no speech recognition — type it instead');
  if (_rec) { _rec.stop(); return; }
  const rec = _rec = new SR();
  rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = false;
  const before = (box.value || '').trim();
  btn.textContent = '● Listening';
  btn.classList.add('primary');
  rec.onresult = ev => {
    let t = '';
    for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
    box.value = before ? before + ', ' + t.trim() : t.trim();
  };
  rec.onerror = ev => toast(ev.error === 'not-allowed' ? 'Microphone blocked' : 'Could not hear that');
  rec.onend = () => { _rec = null; btn.textContent = '🎤 Speak'; btn.classList.remove('primary'); };
  try { rec.start(); } catch (e) { rec.onend(); }
}

function shiftFoodDay(n) {
  if (n === 0) { foodDate = null; render(); return; }
  const dt = parseISO(fDate());
  dt.setDate(dt.getDate() + n);
  const next = iso(dt);
  if (next > today()) return;
  foodDate = next === today() ? null : next;
  render();
}

/* ---------------- voice set logging ----------------
   "bench two twenty five by eight at two RIR" -> a logged set.

   Recognition is on-device where Chrome offers it (processLocally), so audio
   from a gym floor never leaves the phone. Parsing is local too: the grammar
   below plus the 736-movement database covers ordinary gym speech, and Haiku
   is only called when that fails outright. Nothing commits until you've seen
   what it understood — a misheard weight is worse than no weight. */

/* Recognisers hand back a mix of words and digits for the same utterance —
   "two twenty five" can arrive as "225", "2 25" or "two twenty five" depending
   on the phrase and the engine. All three have to land on 225. */
const NUM_ONES = {
  zero: 0, oh: 0, o: 0, nought: 0,
  one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
  ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
  sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19,
};
const NUM_TENS = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };

function numAtom(t) {
  if (/^\d+(\.\d+)?$/.test(t)) return { v: parseFloat(t), kind: 'digit', digits: t.replace(/\..*$/, '').length };
  if (t in NUM_ONES) return { v: NUM_ONES[t], kind: 'one' };
  if (t in NUM_TENS) return { v: NUM_TENS[t], kind: 'ten' };
  if (t === 'hundred') return { v: 100, kind: 'hundred' };
  if (t === 'thousand') return { v: 1000, kind: 'thousand' };
  return null;
}

/* Consume as many number tokens as possible from tokens[i], returning the value
   and how many were used.

   The awkward case is the lifting idiom: "two twenty five" is 225, not 2+20+5,
   and "one forty" is 140. The rule is that a bare single digit followed by a
   tens word (or by "oh") is a hundreds digit. "Two hundred and twenty five"
   still parses the ordinary way. */
function readNumber(tokens, i) {
  const start = i;
  let total = 0, cur = 0, seen = false, hundreds = null;

  // "a hundred" / "a hundred and ten"
  if (tokens[i] === 'a' && tokens[i + 1] === 'hundred') { tokens = tokens.slice(); tokens[i] = 'one'; }

  while (i < tokens.length) {
    const t = tokens[i];
    if (t === 'and' && seen) { i++; continue; }
    if (t === 'point' || t === 'decimal') {
      const d = numAtom(tokens[i + 1]);
      if (!d) break;
      let frac = '';
      let j = i + 1;
      while (j < tokens.length) { const a = numAtom(tokens[j]); if (!a || a.kind === 'hundred' || a.kind === 'thousand') break; frac += String(a.v); j++; }
      cur = (total + cur) + parseFloat('0.' + frac);
      total = 0; i = j; seen = true;
      break;
    }
    if (t === 'half' && seen) { cur += 0.5; i++; break; }

    const a = numAtom(t);
    if (!a) break;

    if (a.kind === 'digit') {
      // "2 25" from the recogniser: a lone digit then a two-digit number
      if (seen && hundreds === null && a.digits === 2 && cur >= 1 && cur <= 9 && total === 0) {
        cur = cur * 100 + a.v; i++; continue;
      }
      if (seen) break;               // a second full number belongs to the next field
      cur = a.v; seen = true; i++;
      continue;
    }
    if (a.kind === 'hundred') { cur = (cur || 1) * 100; seen = true; i++; continue; }
    if (a.kind === 'thousand') { total += (cur || 1) * 1000; cur = 0; seen = true; i++; continue; }

    if (a.kind === 'one') {
      if (!seen) {
        // could be the hundreds digit of "two twenty five" / "one oh five"
        const nx = numAtom(tokens[i + 1]);
        if (a.v >= 1 && a.v <= 9 && nx && (nx.kind === 'ten' || (nx.kind === 'one' && nx.v === 0))) {
          hundreds = a.v; cur = a.v * 100; seen = true; i++; continue;
        }
        cur = a.v; seen = true; i++; continue;
      }
      if (hundreds !== null || cur % 100 === 0 || (cur % 10 === 0 && cur % 100 !== 0)) { cur += a.v; i++; continue; }
      break;
    }
    if (a.kind === 'ten') {
      if (!seen) { cur = a.v; seen = true; i++; continue; }
      if (cur > 0 && cur % 100 === 0) { cur += a.v; i++; continue; }   // "two hundred and twenty five"
      break;
    }
    break;
  }
  if (!seen) return null;
  return { value: total + cur, used: i - start };
}

/* Pull every number out of an utterance, tagged with the word that introduced
   it, so the caller can tell "by eight" (reps) from "at eight" (RPE). */
function scanNumbers(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length; i++) {
    const n = readNumber(tokens, i);
    if (!n) continue;
    out.push({ value: n.value, at: i, end: i + n.used, before: tokens[i - 1] || '', after: tokens[i + n.used] || '' });
    i += n.used - 1;
  }
  return out;
}

/* Gym shorthand. The right-hand side is a canonical name resolved through the
   normal matcher, so these stay correct if the library is renamed. */
const VOICE_ALIASES = {
  bench: 'Bench Press', benches: 'Bench Press', benching: 'Bench Press',
  'flat bench': 'Bench Press', 'comp bench': 'Bench Press',
  squat: 'Back Squat', squats: 'Back Squat', squatting: 'Back Squat',
  'back squat': 'Back Squat', 'high bar': 'High Bar Squat', 'low bar': 'Low Bar Squat',
  deadlift: 'Deadlift', deadlifts: 'Deadlift', deads: 'Deadlift', dead: 'Deadlift',
  ohp: 'Overhead Press', 'overhead press': 'Overhead Press', 'shoulder press': 'Overhead Press',
  press: 'Overhead Press', 'military press': 'Overhead Press',
  rdl: 'Romanian Deadlift', rdls: 'Romanian Deadlift',
  sldl: 'Stiff Leg Deadlift',
  'close grip': 'Close Grip Bench', cgbp: 'Close Grip Bench',
  incline: 'Incline Bench', 'incline bench': 'Incline Bench',
  row: 'Barbell Row', rows: 'Barbell Row', 'barbell row': 'Barbell Row',
  pendlay: 'Pendlay Row', 'pull up': 'Pull Up', 'pull ups': 'Pull Up', pullups: 'Pull Up',
  'chin up': 'Chin Up', 'chin ups': 'Chin Up', chins: 'Chin Up',
  pulldown: 'Lat Pulldown', 'lat pulldown': 'Lat Pulldown',
  curl: 'Barbell Curl', curls: 'Barbell Curl',
  pushdown: 'Tricep Pushdown', pushdowns: 'Tricep Pushdown',
  'leg press': 'Leg Press', 'hip thrust': 'Hip Thrust', 'front squat': 'Front Squat',
  'pause squat': 'Pause Squat', 'pause bench': 'Pause Bench', 'box squat': 'Box Squat',
  'good morning': 'Good Morning', 'face pull': 'Face Pull', dips: 'Dips',
};

/* Resolve a spoken exercise name. Unlike the CSV importer this may fall back to
   a fuzzy match, because nothing commits until the confirmation card is
   accepted — the user sees the name before it lands. Anything below an exact
   match is reported so the card can say how sure it is. */
function voiceMatchExercise(spoken, active) {
  const k = normEx(spoken);
  if (!k) return null;

  // 1. an exercise already open in this session
  if (active && active.exercises.length) {
    const inSession = active.exercises.map(e => e.name);
    const exact = inSession.find(n => normEx(n) === k);
    if (exact) return { name: exact, how: 'session', sure: true };
    const part = inSession.find(n => { const nk = normEx(n); return nk.includes(k) || k.includes(nk); });
    if (part) return { name: part, how: 'session', sure: true };
  }
  // 2. gym shorthand
  if (VOICE_ALIASES[k]) {
    const target = VOICE_ALIASES[k];
    const real = allExercises().find(n => normEx(n) === normEx(target))
      || Object.keys(EX_DB).find(n => normEx(n) === normEx(target));
    return { name: real || target, how: 'alias', sure: true };
  }
  // 3. exact, in the log or the database
  const own = allExercises().find(n => normEx(n) === k);
  if (own) return { name: own, how: 'exact', sure: true };
  const db = Object.keys(EX_DB).find(n => normEx(n) === k);
  if (db) return { name: db, how: 'db', sure: true };

  // 4. best effort, flagged as unsure
  const w = k.split(' ');
  let best = null, bs = 0;
  const consider = n => {
    const pw = normEx(n).split(' ');
    const hit = w.filter(x => pw.includes(x)).length;
    const sc = hit / Math.max(w.length, pw.length);
    if (sc > bs) { bs = sc; best = n; }
  };
  allExercises().forEach(consider);
  if (bs < 0.5) Object.keys(EX_DB).forEach(consider);
  return bs >= 0.5 ? { name: best, how: 'fuzzy', sure: false } : null;
}

const REP_WORDS = ['by', 'x', 'times', 'for'];
const RPE_WORDS = ['at', 'rpe', '@'];

/* The grammar, in one pass:
     [exercise] <weight> [kg|lb] (by|x|for) <reps> [at <n> (rpe|rir)]
   Every part except the numbers is optional — mid-session "two twenty by five"
   means the exercise you're already on. */
function parseSetSpeech(text, active) {
  const raw = String(text || '').toLowerCase().trim();
  if (!raw) return null;
  const tokens = raw
    .replace(/[,!?]/g, ' ')
    .replace(/@/g, ' at ')
    .replace(/(\d)\s*(kg|kgs|kilos?|kilograms?)\b/g, '$1 kg')
    .replace(/(\d)\s*(lbs?|pounds?)\b/g, '$1 lb')
    .replace(/\bx(\d)/g, 'x $1')
    .split(/\s+/).filter(Boolean);

  const nums = scanNumbers(tokens);
  if (!nums.length) return null;

  const out = { exercise: null, exerciseHow: null, sure: true, kg: null, reps: null, rpe: null, rir: null, unit: null, said: raw };

  // RPE / RIR: the number introduced by "at", or followed by the word itself
  let rpeIdx = -1;
  nums.forEach((n, i) => {
    const isRir = n.after === 'rir' || tokens[n.end] === 'rir';
    const isRpe = n.after === 'rpe' || tokens[n.end] === 'rpe' || n.before === 'rpe';
    if (isRir) { out.rir = n.value; out.rpe = clamp(10 - n.value, 4, 10); rpeIdx = i; }
    else if (isRpe) { out.rpe = clamp(n.value, 4, 10); out.rir = 10 - out.rpe; rpeIdx = i; }
  });
  if (rpeIdx < 0) {
    // bare "at eight" after reps — only plausible as an RPE
    const i = nums.findIndex(n => RPE_WORDS.includes(n.before) && n.value >= 4 && n.value <= 10);
    if (i > 0) { out.rpe = nums[i].value; out.rir = 10 - out.rpe; rpeIdx = i; }
  }

  const rest = nums.filter((_, i) => i !== rpeIdx);

  // reps: the number introduced by by/x/times/for; else the second number
  let repIdx = rest.findIndex(n => REP_WORDS.includes(n.before));
  if (repIdx < 0 && rest.length >= 2) repIdx = 1;
  if (repIdx >= 0) out.reps = Math.round(rest[repIdx].value);

  // weight: the first number that isn't the reps
  const wIdx = rest.findIndex((_, i) => i !== repIdx);
  if (wIdx >= 0) {
    const n = rest[wIdx];
    out.kg = n.value;
    const unitTok = tokens[n.end];
    if (unitTok === 'lb') out.unit = 'lb';
    else if (unitTok === 'kg') out.unit = 'kg';
    // words before the first number are the exercise
    const head = tokens.slice(0, n.at).filter(w => !['log', 'add', 'set', 'did', 'i', 'a', 'an', 'the', 'do', 'just'].includes(w)).join(' ');
    if (head) {
      const m = voiceMatchExercise(head, active);
      if (m) { out.exercise = m.name; out.exerciseHow = m.how; out.sure = m.sure; }
      else { out.exercise = null; out.exerciseHow = 'unknown'; out.sure = false; out.heard = head; }
    }
  }

  if (out.kg == null || out.reps == null) return null;
  if (out.unit === 'lb') out.kg = Math.round(out.kg / LB_PER_KG * 100) / 100;
  else if (out.unit == null && U() === 'lb') { out.unit = 'lb'; out.kg = Math.round(out.kg / LB_PER_KG * 100) / 100; }
  else out.unit = out.unit || 'kg';

  if (out.kg <= 0 || out.reps <= 0 || out.reps > 100) return null;
  return out;
}

/* Chrome 138+ can run recognition entirely on the device. Ask for it whenever
   it's there, so gym audio never leaves the phone; where it isn't, say so on
   the button rather than quietly streaming to a server. */
let _voiceMode = null;          // 'local' | 'cloud' | null until first use

function speechCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition; }

async function voiceLocalState() {
  const SR = speechCtor();
  if (!SR) return 'none';
  if (typeof SR.available !== 'function') return 'unknown';
  try { return await SR.available({ langs: ['en-GB'], processLocally: true }); }
  catch (e) { return 'unknown'; }
}

/* Offer to fetch the on-device model once, rather than nagging every session. */
async function voiceInstallLocal() {
  const SR = speechCtor();
  if (!SR || typeof SR.install !== 'function') return false;
  try { return await SR.install({ langs: ['en-GB'], processLocally: true }); }
  catch (e) { return false; }
}

let _setRec = null;

function dictateSet() {
  const SR = speechCtor();
  const btn = $('#voiceBtn');
  if (!SR) return toast('This browser has no speech recognition — type the set instead');
  if (_setRec) { _setRec.stop(); return; }
  if (!S.active) return toast('Start a workout first');

  const idle = () => { _setRec = null; if ($('#voiceBtn')) { $('#voiceBtn').textContent = '🎤 Log a set'; $('#voiceBtn').classList.remove('primary'); } };

  const run = (local) => {
    const rec = _setRec = new SR();
    rec.lang = 'en-GB';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 3;
    if (local && 'processLocally' in rec) { rec.processLocally = true; _voiceMode = 'local'; }
    else _voiceMode = 'cloud';

    let finalText = '', heard = false;
    rec.onresult = ev => {
      let t = '';
      for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      finalText = t.trim();
      heard = true;
      if (btn) btn.textContent = '● ' + (finalText.slice(0, 22) || 'Listening');
    };
    rec.onerror = ev => {
      // an on-device model that isn't there reports a service error: retry in the cloud once
      if (local && (ev.error === 'service-not-allowed' || ev.error === 'language-not-supported')) {
        rec.onend = null; _setRec = null;
        toast('On-device model unavailable — using cloud recognition');
        return run(false);
      }
      if (ev.error === 'not-allowed') toast('Microphone blocked — allow it in site settings');
      else if (ev.error !== 'aborted' && ev.error !== 'no-speech') toast('Could not hear that');
    };
    rec.onend = () => {
      idle();
      if (heard && finalText) resolveVoiceSet(finalText);
    };
    try { rec.start(); if (btn) { btn.textContent = '● Listening'; btn.classList.add('primary'); } }
    catch (e) { idle(); }
  };

  voiceLocalState().then(st => {
    if (st === 'available' || st === 'unknown') return run(true);
    if (st === 'downloadable' && !S.settings.voiceLocalDeclined) {
      return confirmDlg(
        'Download the on-device speech model? Recognition then runs entirely on the phone and works with no signal. It is a one-off download of a few tens of MB.',
        async () => {
          toast('Downloading the speech model…');
          const ok = await voiceInstallLocal();
          toast(ok ? 'On-device speech ready' : 'Download failed — using cloud recognition', ok ? 'green' : '');
          run(ok);
        },
        'Download',
        () => { S.settings.voiceLocalDeclined = true; save(); run(false); });
    }
    run(false);
  });
}

/* Local grammar first. Haiku is only reached when the grammar can't make a set
   out of the utterance at all — which is the point of having the grammar. */
async function resolveVoiceSet(text) {
  const local = parseSetSpeech(text, S.active);
  if (local) return confirmVoiceSet(local, 'local');

  if (!aiKey()) {
    return confirmVoiceSet(
      { exercise: null, exerciseHow: 'unknown', sure: false, kg: null, reps: null, rpe: null, rir: null, said: text },
      'failed');
  }
  toast('Asking Claude…');
  try {
    const r = await claudeParseSet(text);
    const p = {
      exercise: null, exerciseHow: null, sure: false, said: text,
      kg: r.kg != null ? +r.kg : null, reps: r.reps != null ? Math.round(r.reps) : null,
      rpe: r.rpe != null ? clamp(+r.rpe, 4, 10) : null,
    };
    p.rir = p.rpe != null ? 10 - p.rpe : null;
    if (r.exercise) {
      const m = voiceMatchExercise(r.exercise, S.active);
      if (m) { p.exercise = m.name; p.exerciseHow = m.how; p.sure = m.sure; }
      else { p.heard = r.exercise; p.exerciseHow = 'unknown'; }
    }
    confirmVoiceSet(p, 'ai');
  } catch (e) {
    confirmVoiceSet({ exercise: null, exerciseHow: 'unknown', sure: false, kg: null, reps: null, rpe: null, said: text }, 'failed');
  }
}

const SET_SYSTEM = `You turn a spoken gym sentence into one logged set.
Reply with JSON only: {"exercise":string|null,"kg":number|null,"reps":number|null,"rpe":number|null}
- Weight in kilograms. If the speaker clearly used pounds, convert (1 kg = 2.2046226218 lb).
- "at 2 RIR" means 2 reps in reserve, so rpe = 8. "at RPE 8" means rpe = 8.
- Lifting shorthand: "two twenty five" is 225, "one forty" is 140.
- exercise is the movement name only, no weight or reps. null if not stated.
- Use null for anything not stated. No prose, no code fences.`;

function claudeParseSet(text) { return claudeParse(text, SET_SYSTEM); }

/* Nothing is written until this card is accepted. It shows the transcript as
   well as the reading of it, because the two failure modes look very different:
   a misheard word is the recogniser, a wrong field is the grammar. */
function confirmVoiceSet(p, via) {
  const usable = p.kg > 0 && p.reps > 0;
  const dispW = p.kg ? nice(dw(p.kg)) : '';
  const viaChip = via === 'ai' ? '<span class="chip blue">CLAUDE</span>'
    : via === 'local' ? `<span class="chip">${_voiceMode === 'local' ? 'ON-DEVICE' : 'VOICE'}</span>` : '';

  modal({
    title: usable ? 'Log this set?' : "Didn't catch that",
    body: `
      <div class="sub" style="margin-bottom:10px">${viaChip} heard “${esc(p.said || '')}”</div>
      ${!usable ? `<div class="sub" style="color:var(--red);margin-bottom:10px">
        Couldn't read a weight and reps out of that. Try “bench two twenty five by eight at two RIR”,
        or fill it in below.</div>` : ''}
      <div class="field"><label>Exercise</label>
        <button class="btn wide" id="vsEx" style="justify-content:flex-start">${esc(p.exercise || (p.heard ? p.heard + ' — tap to choose' : 'Tap to choose'))}</button>
        ${p.exerciseHow === 'fuzzy' ? '<div class="sub" style="margin-top:4px;color:var(--gold)">Best guess — check it</div>' : ''}
        ${p.exerciseHow === 'unknown' ? '<div class="sub" style="margin-top:4px;color:var(--gold)">Not recognised — pick the exercise</div>' : ''}
      </div>
      <div class="row" style="gap:8px">
        <div class="grow"><label>Weight (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="vsW" value="${dispW}"></div>
        <div class="grow"><label>Reps</label>
          <input type="number" inputmode="numeric" id="vsR" value="${p.reps || ''}"></div>
        <div class="grow"><label>RPE</label>
          <input type="number" step="0.5" inputmode="decimal" id="vsRpe" value="${p.rpe ?? ''}" placeholder="—"></div>
      </div>
      ${p.rir != null && p.rpe != null ? `<div class="sub" style="margin-top:6px">${p.rir} in reserve → RPE ${p.rpe}</div>` : ''}
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="vsGo">Log set</button>`,
    onOpen: bg => {
      let name = p.exercise;
      $('#vsEx', bg).onclick = () => pickExercise(n => { name = n; $('#vsEx', bg).textContent = n; });
      $('#vsGo', bg).onclick = () => {
        const w = +$('#vsW', bg).value, r = +$('#vsR', bg).value;
        const rpeRaw = $('#vsRpe', bg).value;
        if (!name) return toast('Pick the exercise first');
        if (!(r > 0)) return toast('Reps are needed');
        const kg = toKg(w), reps = Math.round(r), rpe = rpeRaw === '' ? null : +rpeRaw;
        const commit = () => { closeModal(); applyVoiceSet(name, kg, reps, rpe); };
        const why = plausibility(name, kg, reps, rpe);
        if (why.length) plausDlg(name, { w: kg, r: reps, rpe }, why, commit); else commit();
      };
    },
  });
}

/* Appends to the exercise if it's already open in the session, otherwise adds
   it. Marked done on the way in — the set already happened. PR check mirrors
   the tick-box path so a voice PR announces itself the same way. */
function applyVoiceSet(name, kg, reps, rpe) {
  const a = S.active;
  if (!a) return toast('No active workout');
  let ex = a.exercises.find(e => e.name === name);
  if (!ex) { ex = { name, notes: '', sets: [] }; a.exercises.push(ex); }

  const st = statsFor(name);
  ex.sets.push({ w: kg, r: reps, rpe: rpe, done: true, warm: false });
  save(); bust(); render();

  if (!st || beatsBest(st, kg, reps, rpe)) toast(st ? `★ PR — ${name} ${kg > 0 ? `${wt(kg)}×${reps}` : `${reps} reps`}` : `★ First ${name} logged`, 'gold');
  else toast(`${name} ${wt(kg)} × ${reps}${rpe ? ` @ ${rpe}` : ''}`, 'green');
}

/* ============================================================
   BOOT
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.page));
$('#settingsBtn').onclick = openSettings;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* First paint waits on the initial read. Without this the app would render an
   empty log for a frame and then flash the real one in over the top. */
async function boot() {
  const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;' +
    'background:#0d0f14;color:#8b93a7;font:500 15px/1.4 system-ui,-apple-system,sans-serif';
  veil.textContent = 'Loading your log…';
  document.body.appendChild(veil);

  S = await load();

  // a bundled program installs itself on a fresh app so the plan is just *there*
  const P = theProgram();
  if (P && !programInstalled(P.id)) {
    const fresh = !S.workouts.length && !S.checkins.length && !S.meets.length && !S.active;
    if (fresh) installProgram(P);     // existing data: leave it to Settings → Install
  }

  if (S.active) page = 'workout';     // resume straight into a live session
  go(page);
  veil.remove();
  requestPersistence();
}

boot();

/* ---------------- offline + updates ----------------
   The service worker caches the app so it opens with no signal at all. When a
   new version is deployed it installs in the background and swaps in on the
   next launch — never mid-session, which would lose the sets on screen. */
if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state !== 'installed' || !navigator.serviceWorker.controller) return;
          if (S && S.active) {
            toast('Update downloaded — it will apply next time you open the app');
            return;                                  // mid-workout: leave it waiting
          }
          toast('Update ready — restarting', 'green');
          setTimeout(() => reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' }), 1400);
        });
      });
      setInterval(() => reg.update(), 60 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
