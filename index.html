/* ---------------- warm-up ramp ----------------
   Builds a ladder to a target load. Fewer, bigger jumps for a heavy single;
   more reps and shallower steps for volume work. The point is to arrive at the
   top set primed but not spent — on a test day a bad warm-up costs you the
   number outright, in either direction. */
const RAMP = {
  single: { pcts: [0.40, 0.55, 0.70, 0.80, 0.88, 0.94], reps: [5, 3, 2, 1, 1, 1], rest: [60, 90, 120, 180, 210, 240] },
  low:    { pcts: [0.45, 0.60, 0.75, 0.86],             reps: [5, 4, 3, 2],       rest: [60, 90, 120, 180] },
  high:   { pcts: [0.50, 0.70, 0.85],                   reps: [8, 5, 3],          rest: [60, 75, 90] },
};

function warmupRamp(targetKg, reps = 1, barKg = 20) {
  if (!targetKg || targetKg <= 0) return [];
  const spec = reps <= 2 ? RAMP.single : reps <= 6 ? RAMP.low : RAMP.high;
  const out = [];

  if (barKg > 0 && targetKg > barKg * 1.5) {
    out.push({ kg: barKg, reps: reps <= 2 ? 8 : 10, rest: 45, bar: true });
  }

  spec.pcts.forEach((p, i) => {
    const kg = roundBar(targetKg * p);
    if (kg <= barKg) return;                       // below the empty bar: skip
    if (out.some(x => Math.abs(x.kg - kg) < 0.01)) return;   // duplicate after rounding
    if (kg >= targetKg) return;                    // never warm up at or above the target
    out.push({ kg, reps: spec.reps[i], rest: spec.rest[i], pct: Math.round(p * 100) });
  });

  out.push({ kg: roundBar(targetKg), reps, rest: 0, work: true });
  return out;
}

function fmtRest(s) {
  if (!s) return '';
  return s >= 60 ? `${Math.round(s / 60)}${s % 60 ? `:${String(s % 60).padStart(2, '0')}` : ' min'}` : `${s}s`;
}

/* Bar weight is asked for rather than assumed — a hex bar, a Smith carriage and
   a comp bar are three different starting points, and getting it wrong throws
   every percentage below about 60%. */
function openRamp(name, presetKg) {
  const st = statsFor(name);
  const suggestion = presetKg || (st ? roundBar(st.best.e1) : 0);

  const draw = (targetDisp, reps, barDisp) => {
    const ramp = warmupRamp(toKg(targetDisp), reps, toKg(barDisp));
    if (!ramp.length) return `<div class="sub">Enter a target weight.</div>`;
    return `<table class="settable"><thead><tr>
        <th class="c-set">#</th><th>${U()}</th><th>Reps</th><th>Rest</th></tr></thead><tbody>
      ${ramp.map((r, i) => `<tr class="${r.work ? 'pr' : ''}">
        <td class="c-set"><div class="setno ${r.work ? '' : 'warm'}">${r.work ? '★' : r.bar ? 'B' : i}</div></td>
        <td class="mono"><b>${nice(dw(r.kg))}</b>${r.bar ? ' <span class="dimmer">bar</span>' : r.pct ? ` <span class="dimmer">${r.pct}%</span>` : ''}</td>
        <td class="mono">${r.reps}</td>
        <td class="mono dimmer">${r.work ? '—' : fmtRest(r.rest)}</td>
      </tr>`).join('')}
    </tbody></table>`;
  };

  modal({
    title: `Warm-up · ${name}`,
    body: `
      <div class="row" style="gap:8px">
        <div class="field grow"><label>Target (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rTarget" value="${suggestion ? dw(suggestion) : ''}"></div>
        <div class="field" style="width:80px"><label>Reps</label>
          <input type="number" inputmode="numeric" id="rReps" value="1"></div>
        <div class="field" style="width:88px"><label>Bar (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="rBar" value="${nice(dw(S.settings.barKg || 20))}"></div>
      </div>
      <div id="rOut">${draw(suggestion ? dw(suggestion) : 0, 1, dw(S.settings.barKg || 20))}</div>
      <div class="sub" style="margin-top:9px">Rest is a floor, not a target — on the last two steps take longer if you need it.</div>
    `,
    foot: `<button class="btn primary" data-close>Done</button>`,
    onOpen: bg => {
      const upd = () => {
        const bar = +$('#rBar', bg).value || 20;
        S.settings.barKg = toKg(bar);
        save();
        $('#rOut', bg).innerHTML = draw(+$('#rTarget', bg).value || 0, +$('#rReps', bg).value || 1, bar);
      };
      ['#rTarget', '#rReps', '#rBar'].forEach(s => { $(s, bg).oninput = upd; });
    },
  });
}

/* ---------------- plate maths ----------------
   Works from a real inventory, in pairs, because a stack you can't build is
   worse than no answer. If the target isn't loadable it says so and gives the
   nearest weight you can actually make in both directions. */
const DEFAULT_PLATES = [
  { kg: 25, pairs: 4 }, { kg: 20, pairs: 4 }, { kg: 15, pairs: 2 },
  { kg: 10, pairs: 4 }, { kg: 5, pairs: 2 }, { kg: 2.5, pairs: 2 },
  { kg: 1.25, pairs: 2 }, { kg: 0.5, pairs: 2 },
];

function inventory() {
  const inv = S.settings.plates && S.settings.plates.length ? S.settings.plates : DEFAULT_PLATES;
  return inv.filter(p => p.kg > 0 && p.pairs > 0).sort((a, b) => b.kg - a.kg);
}
function bars() {
  return (S.settings.bars && S.settings.bars.length ? S.settings.bars : [{ name: 'Barbell', kg: 20 }])
    .filter(b => b.kg > 0);
}

/* Greedy is optimal here: every plate set in use is "canonical" (each size at
   least twice the next), so taking the heaviest that fits never strands you. */
function loadPlates(targetKg, barKg, inv) {
  const side = (targetKg - barKg) / 2;
  if (side < 0) return { impossible: 'under', bar: barKg };
  if (side === 0) return { perSide: [], achieved: barKg, exact: true, bar: barKg };

  let left = side;
  const perSide = [];
  inv.forEach(p => {
    const n = Math.min(p.pairs, Math.floor((left + 1e-9) / p.kg));
    if (n > 0) { perSide.push({ kg: p.kg, count: n }); left -= n * p.kg; }
  });

  const achieved = barKg + (side - left) * 2;
  return { perSide, achieved, exact: Math.abs(left) < 1e-9, short: left * 2, bar: barKg };
}

/* Every weight the inventory can build, for "nearest loadable" answers. */
function loadableWeights(barKg, inv) {
  let sums = [0];
  inv.forEach(p => {
    const next = new Set(sums);
    sums.forEach(s => { for (let n = 1; n <= p.pairs; n++) next.add(s + n * p.kg); });
    sums = [...next];
  });
  return sums.map(s => barKg + s * 2).sort((a, b) => a - b);
}

function nearestLoadable(targetKg, barKg, inv) {
  const all = loadableWeights(barKg, inv);
  let below = null, above = null;
  for (const w2 of all) {
    if (w2 <= targetKg + 1e-9) below = w2;
    if (w2 >= targetKg - 1e-9) { above = w2; break; }
  }
  return { below, above };
}

const PLATE_COLOR = {
  25: '#c8102e', 20: '#1f57c3', 15: '#e8b923', 10: '#4fb477',
  5: '#e8ecf3', 2.5: '#c8102e', 1.25: '#8a93a5', 0.5: '#8a93a5',
};

function openPlates(targetKg, presetBar) {
  const bl = bars();
  let barIdx = Math.max(0, bl.findIndex(b => b.kg === (presetBar || S.settings.barKg || 20)));

  const draw = () => {
    const bar = bl[barIdx];
    const inv = inventory();
    const r = loadPlates(targetKg, bar.kg, inv);

    if (r.impossible === 'under') {
      return `<div class="sub">${wt(targetKg)} is below the ${esc(bar.name)} at ${wt(bar.kg)}.</div>`;
    }

    const stack = r.perSide.length
      ? r.perSide.map(p => `<div class="row" style="gap:9px;align-items:center;padding:6px 0">
          <div style="width:34px;height:34px;border-radius:7px;background:${PLATE_COLOR[p.kg] || '#8a93a5'};
            display:grid;place-items:center;font-size:11.5px;font-weight:800;color:${p.kg === 5 ? '#14181d' : '#fff'}">${nice(p.kg)}</div>
          <div class="grow"><b>${nice(dw(p.kg))}${U()}</b> <span class="sub">× ${p.count} per side</span></div>
          <div class="mono sub">${nice(dw(p.kg * p.count * 2))}</div>
        </div>`).join('')
      : `<div class="sub">Empty bar.</div>`;

    let warn = '';
    if (!r.exact) {
      const n = nearestLoadable(targetKg, bar.kg, inv);
      warn = `<div style="border-left:3px solid var(--gold);background:rgba(255,197,66,.08);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:10px">
        <b>Not loadable.</b> <span class="sub">Your inventory reaches ${wt(r.achieved)} — ${wt(r.short)} short.
        Nearest you can build: ${n.below ? wt(n.below) : '—'}${n.above && n.above !== r.achieved ? ` or ${wt(n.above)}` : ''}.</span></div>`;
    }

    return `${warn}
      <div class="row between" style="margin-bottom:8px">
        <div><div class="eyebrow">Per side</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1">${nice(dw((r.achieved - bar.kg) / 2, 2))}</div></div>
        <div class="right"><div class="eyebrow">Total on bar</div>
          <div class="mono" style="font-size:30px;font-weight:800;line-height:1.1;color:${r.exact ? 'var(--green)' : 'var(--gold)'}">${nice(dw(r.achieved))}</div></div>
      </div>
      ${stack}`;
  };

  modal({
    title: `Plates · ${wt(targetKg)}`,
    body: `${bl.length > 1 ? `<div class="seg" id="pBars" style="margin-bottom:11px">
        ${bl.map((b, i) => `<button data-bar="${i}" class="${i === barIdx ? 'on' : ''}">${esc(b.name)} ${nice(dw(b.kg))}</button>`).join('')}
      </div>` : `<div class="sub" style="margin-bottom:9px">${esc(bl[0].name)} at ${wt(bl[0].kg)}</div>`}
      <div id="pOut">${draw()}</div>`,
    foot: `<button class="btn primary" data-close>Done</button>`,
    onOpen: bg => {
      bg.querySelectorAll('[data-bar]').forEach(b => b.onclick = () => {
        barIdx = +b.dataset.bar;
        S.settings.barKg = bl[barIdx].kg; save();
        bg.querySelectorAll('[data-bar]').forEach(x => x.classList.toggle('on', +x.dataset.bar === barIdx));
        $('#pOut', bg).innerHTML = draw();
      });
    },
  });
}

function finishWorkout(force) {
  const a = S.active;
  const logged = a.exercises.map(e => ({ ...e, sets: e.sets.filter(s => s.done && s.r > 0) }))
    .filter(e => e.sets.length);
  if (!logged.length) return toast('Log at least one set first');

  // sets ticked and then retyped never met the single-set prompt
  if (!force) {
    const flagged = [];
    logged.forEach(e => e.sets.filter(s => !s.warm).forEach(s => {
      const why = plausibility(e.name, s.w, s.r, s.rpe);
      if (why.length) flagged.push({ name: e.name, s, why });
    }));
    if (flagged.length) return plausListDlg(flagged, 'Finish', () => finishWorkout(true));
  }

  // PRs — compare against history BEFORE this workout is saved
  const prs = [];
  logged.forEach(e => {
    const st = statsFor(e.name);
    const working = e.sets.filter(s => !s.warm);
    if (!working.length) return;
    const best = bestSetOf(working);
    const e1 = e1rm(best.w, best.r, best.rpe);
    if (!st) prs.push({ name: e.name, w: best.w, r: best.r, e1, first: true });
    else if (beatsBest(st, best.w, best.r, best.rpe)) prs.push({ name: e.name, w: best.w, r: best.r, e1, prev: st.best.e1, prevReps: st.bestBw ? st.bestBw.r : 0 });
  });

  const mins = a.start ? Math.max(1, Math.round((Date.now() - a.start) / 60000)) : 0;
  const done = {
    id: a.id, date: a.date, name: a.name, status: 'completed', source: 'logged',
    exercises: logged, start: a.start, end: Date.now(),
    summary: { mins, prs, volume: logged.reduce((t, e) => t + e.sets.filter(s => !s.warm).reduce((x, s) => x + s.w * s.r, 0), 0) },
  };

  // if this came from a plan, replace the planned entry
  if (a.plannedFrom) S.workouts = S.workouts.filter(w => w.id !== a.plannedFrom);
  S.workouts = S.workouts.filter(w => w.id !== done.id);
  S.workouts.push(done);
  S.active = null;
  save(); bust();
  showSummary(done);
}

/* ---------------- shareable session card ----------------
   Two cards, both drawn by hand to a canvas at 1080 wide so they land as real
   images rather than screenshots of a phone. Quick is a square with the totals
   — the one for a story. Full grows with the session: every set, then what
   the session asked of each muscle and how hard. No external fonts or
   libraries: the artifact sandbox blocks outside requests and a missing font
   would silently ruin the layout. */
const CARD = {
  bg: '#0d0f14', tile: '#171c26', accent: '#ff5c35', text: '#e8ecf3', dim: '#8a93a5', line: '#252c3a',
  gold: '#ffc542', goldBg: 'rgba(255,197,66,.09)', warm: '#546074',
  light: '#3b7ddd', moderate: '#4fb477', hard: '#ff5c35',
};
const cardFont = (sz, wt2 = 600) => `${wt2} ${sz}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;

/* Trim to the pixel width, not a character count — "Bulgarian Split Squat"
   and "Dips" are the same length in characters to nobody. */
function fitText(x, s, maxW) {
  if (x.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (x.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return s.slice(0, lo).trimEnd() + '…';
}

function wrapText(x, text, px, py, maxW, lineH, maxLines) {
  const lines = [];
  let cur = '';
  text.split(' ').forEach(wd => {
    const t = cur ? cur + ' ' + wd : wd;
    if (!cur || x.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = wd; }
  });
  if (cur) lines.push(cur);
  lines.slice(0, maxLines).forEach((l, i) => {
    const last = i === maxLines - 1 && lines.length > maxLines;
    x.fillText(last ? fitText(x, lines.slice(i).join(' '), maxW) : l, px, py + i * lineH);
  });
}

function roundRect(x, px, py, w2, h2, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w2, py, px + w2, py + h2, r);
  x.arcTo(px + w2, py + h2, px, py + h2, r);
  x.arcTo(px, py + h2, px, py, r);
  x.arcTo(px, py, px + w2, py, r);
  x.closePath();
}

function setLabel(s) {
  return `${s.w > 0 ? wt(s.w) + ' × ' : ''}${s.r}${s.w > 0 ? '' : ' reps'}${s.rpe ? ' @ ' + s.rpe : ''}`;
}

function sessionTotals(wo) {
  const ws = wo.exercises.map(e => ({ e, sets: e.sets.filter(s => !s.warm) })).filter(o => o.sets.length);
  return {
    ws,
    sets: ws.reduce((n, o) => n + o.sets.length, 0),
    reps: ws.reduce((n, o) => n + o.sets.reduce((a, s) => a + s.r, 0), 0),
    volume: ws.reduce((n, o) => n + o.sets.reduce((a, s) => a + s.w * s.r, 0), 0),
    mins: wo.summary && wo.summary.mins ? wo.summary.mins : 0,
    prs: prsFor(wo),
  };
}

/* What the session asked of each muscle: working sets × the movement's share,
   so five sets of squats read as two quad sets, one and a bit of glutes, and so
   on. Intensity is the mean RPE of those sets when it was logged, otherwise
   the top set against the all-time best e1RM. Movements with no muscle map
   (a custom name) are skipped and counted so the card can say so. */
function sessionMuscles(wo) {
  const acc = {};
  let unknown = 0;
  wo.exercises.forEach(e => {
    const sets = e.sets.filter(s => !s.warm && s.r > 0);
    if (!sets.length) return;
    const m = exMuscles(e.name);
    if (!m) { unknown++; return; }
    const rpes = sets.map(s => s.rpe).filter(r => r >= 1 && r <= 10);
    let hard;                                              // 0 = easy, 1 = maximal
    if (rpes.length) hard = clamp((rpes.reduce((a, b) => a + b, 0) / rpes.length - 5) / 5, 0, 1);
    else {
      const st = statsFor(e.name);
      const top = Math.max(...sets.map(s => e1rm(s.w, s.r)));
      hard = st && st.best.e1 > 0 && top > 0 ? clamp((top / st.best.e1 - 0.6) / 0.4, 0, 1) : 0.5;
    }
    Object.entries(m).forEach(([k, share]) => {
      if (!MUSCLES[k]) return;
      const a = acc[k] = acc[k] || { key: k, name: MUSCLES[k], sets: 0, hardSum: 0 };
      a.sets += sets.length * share;
      a.hardSum += hard * sets.length * share;
    });
  });
  const list = Object.values(acc).map(a => ({ ...a, hard: a.sets ? a.hardSum / a.sets : 0 }))
    .sort((a, b) => b.sets - a.sets);
  return { list, unknown, max: list.length ? list[0].sets : 0 };
}
function intensityOf(h) {
  return h >= 0.7 ? { word: 'Hard', color: CARD.hard }
    : h >= 0.4 ? { word: 'Moderate', color: CARD.moderate }
    : { word: 'Light', color: CARD.light };
}

function cardHead(x, wo, W, P) {
  x.fillStyle = CARD.bg; x.fillRect(0, 0, W, x.canvas.height);
  x.fillStyle = CARD.accent; x.fillRect(0, 0, W, 8);
  x.fillStyle = CARD.dim; x.font = cardFont(26, 600);
  x.fillText(fmtDate(wo.date, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase(), P, 96);
  x.fillStyle = CARD.text; x.font = cardFont(54, 800);
  x.fillText(fitText(x, wo.name, W - P * 2), P, 158);
  return 158;
}
function cardFoot(x, W, H, P) {
  const handle = (S.settings.handle || '').trim();
  x.textAlign = 'left'; x.fillStyle = CARD.dim; x.font = cardFont(23, 600);
  x.fillText(handle || 'IRONLOG', P, H - 44);
}

/* Square, four big numbers, what got done in one breath. */
function quickCardCanvas(wo) {
  const W = 1080, H = 1080, P = 72;
  const t = sessionTotals(wo);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  cardHead(x, wo, W, P);

  const tiles = [
    [wt(t.volume, 0), 'VOLUME'], [String(t.sets), 'SETS'], [String(t.reps), 'REPS'],
    t.mins ? [`${t.mins}m`, 'TIME'] : [String(t.ws.length), 'EXERCISES'],
  ];
  const tw = (W - P * 2 - 24) / 2, th = 210;
  tiles.forEach((s, i) => {
    const tx = P + (i % 2) * (tw + 24), ty = 230 + Math.floor(i / 2) * (th + 24);
    x.fillStyle = CARD.tile; roundRect(x, tx, ty, tw, th, 22); x.fill();
    x.fillStyle = CARD.text; x.font = cardFont(74, 800);
    x.fillText(fitText(x, s[0], tw - 60), tx + 30, ty + 118);
    x.fillStyle = CARD.dim; x.font = cardFont(24, 650);
    x.fillText(s[1], tx + 30, ty + 168);
  });

  let y = 230 + th * 2 + 24 + 70;
  if (t.prs.length) {
    x.fillStyle = CARD.goldBg; roundRect(x, P, y - 44, W - P * 2, 72, 16); x.fill();
    x.fillStyle = CARD.gold; x.font = cardFont(30, 750);
    const label = `★ ${t.prs.length} PERSONAL RECORD${t.prs.length === 1 ? '' : 'S'}`;
    x.fillText(fitText(x, `${label}  ${t.prs.map(p => p.name).join(' · ')}`, W - P * 2 - 48), P + 24, y + 4);
    y += 92;
  }
  x.fillStyle = CARD.dim; x.font = cardFont(27, 600);
  wrapText(x, t.ws.map(o => `${o.e.name} ×${o.sets.length}`).join(' · '), P, y + 10, W - P * 2, 38, 2);
  cardFoot(x, W, H, P);
  return c;
}

/* Everything, height grows with the session. Measured first, drawn second. */
function fullCardCanvas(wo) {
  const W = 1080, P = 72;
  const t = sessionTotals(wo);
  const mus = sessionMuscles(wo);
  const musRows = mus.list.slice(0, 10);
  const allSets = wo.exercises.map(e => ({ e, sets: e.sets })).filter(o => o.sets.length);
  const setLines = allSets.reduce((n, o) => n + o.sets.length, 0);
  const prRows = Math.min(t.prs.length, 6);

  const H = 330
    + (prRows ? 60 + prRows * 58 + 20 : 0)
    + 60 + allSets.length * 64 + setLines * 40 + 20
    + (musRows.length ? 60 + musRows.length * 50 + (mus.unknown ? 40 : 0) + 20 : 0)
    + 110;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  let y = cardHead(x, wo, W, P) + 64;

  const stats = [[wt(t.volume, 0), 'VOLUME'], [String(t.sets), 'SETS'], [String(t.reps), 'REPS'],
    ...(t.mins ? [[`${t.mins}m`, 'TIME']] : [])];
  const cw = (W - P * 2) / stats.length;
  stats.forEach((s, i) => {
    x.fillStyle = CARD.text; x.font = cardFont(40, 780); x.fillText(s[0], P + i * cw, y + 44);
    x.fillStyle = CARD.dim; x.font = cardFont(21, 600); x.fillText(s[1], P + i * cw, y + 76);
  });
  y += 108;

  const section = (label, color = CARD.dim) => {
    x.textAlign = 'left'; x.fillStyle = color; x.font = cardFont(22, 700);
    x.fillText(label, P, y + 30); y += 60;
  };

  if (prRows) {
    section(`★ ${t.prs.length} PERSONAL RECORD${t.prs.length === 1 ? '' : 'S'}`, CARD.gold);
    t.prs.slice(0, prRows).forEach(p => {
      x.fillStyle = CARD.goldBg; roundRect(x, P, y, W - P * 2, 48, 10); x.fill();
      x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(27, 650);
      x.fillText(fitText(x, p.name, W / 2), P + 18, y + 32);
      x.textAlign = 'right'; x.fillStyle = CARD.gold; x.font = cardFont(27, 780);
      x.fillText(p.w > 0 ? `${wt(p.w)} × ${p.r}` : `${p.r} reps`, W - P - 18, y + 32);
      y += 58;
    });
    y += 20;
  }

  section('EVERY SET');
  const prNames = new Set(t.prs.map(p => p.name));
  allSets.forEach(({ e, sets }) => {
    x.strokeStyle = CARD.line; x.lineWidth = 2;
    x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
    const working = sets.filter(s => !s.warm);
    const vol = working.reduce((a, s) => a + s.w * s.r, 0);
    const prSet = prNames.has(e.name) && working.length ? bestSetOf(working) : null;   // the one set prsFor scored
    const reps = working.reduce((a, s) => a + s.r, 0);
    x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(29, 680);
    x.fillText(fitText(x, e.name, W - P * 2 - 260), P, y + 42);
    x.textAlign = 'right'; x.fillStyle = CARD.dim; x.font = cardFont(24, 600);
    x.fillText(`${working.length} sets · ${vol > 0 ? wt(vol, 0) : reps + ' reps'}`, W - P, y + 42);   // bodyweight: reps, not 0kg
    y += 64;
    let n = 0;
    sets.forEach(s => {
      const isPR = s === prSet;
      x.textAlign = 'left';
      x.fillStyle = s.warm ? CARD.warm : CARD.dim; x.font = cardFont(23, 600);
      x.fillText(s.warm ? 'W' : String(++n), P + 12, y + 28);
      x.fillStyle = s.warm ? CARD.warm : isPR ? CARD.gold : CARD.text; x.font = cardFont(26, isPR ? 780 : 620);
      x.fillText(setLabel(s) + (isPR ? '  ★' : ''), P + 64, y + 28);
      if (s.w > 0 && s.r > 0 && !s.warm) {
        x.textAlign = 'right'; x.fillStyle = CARD.dim; x.font = cardFont(22, 600);
        x.fillText(`e1RM ${wt(e1rm(s.w, s.r, s.rpe))}`, W - P, y + 28);
      }
      y += 40;
    });
  });
  y += 20;

  if (musRows.length) {
    section('MUSCLES WORKED');
    const barX = P + 250, barW = W - P - barX - 170;
    musRows.forEach(m => {
      const it = intensityOf(m.hard);
      x.textAlign = 'left'; x.fillStyle = CARD.text; x.font = cardFont(25, 640);
      x.fillText(m.name, P, y + 30);
      x.fillStyle = CARD.line; roundRect(x, barX, y + 10, barW, 26, 13); x.fill();
      x.fillStyle = it.color; roundRect(x, barX, y + 10, Math.max(26, barW * (m.sets / mus.max)), 26, 13); x.fill();
      x.textAlign = 'right'; x.fillStyle = it.color; x.font = cardFont(22, 700);
      x.fillText(it.word.toUpperCase(), W - P, y + 30);
      x.fillStyle = CARD.dim; x.font = cardFont(20, 600);
      x.fillText(`${m.sets.toFixed(1)} sets`, W - P - 130, y + 30);
      y += 50;
    });
    if (mus.unknown) {
      x.textAlign = 'left'; x.fillStyle = CARD.warm; x.font = cardFont(21, 600);
      x.fillText(`+ ${mus.unknown} movement${mus.unknown === 1 ? '' : 's'} with no muscle map`, P, y + 26);
      y += 40;
    }
    y += 20;
  }
  cardFoot(x, W, H, P);
  return c;
}

/* Share sheet where the platform allows it, download where it doesn't — the
   sandbox may block navigator.share, and a silent failure is worse than a file
   in the downloads folder. */
async function shareSession(wo, mode = 'quick') {
  let c;
  try { c = mode === 'full' ? fullCardCanvas(wo) : quickCardCanvas(wo); }
  catch (e) { console.warn('share card', e); return toast('Could not build the image'); }

  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  if (!blob) return toast('Could not build the image');
  const file = new File([blob], `session-${wo.date}-${mode}.png`, { type: 'image/png' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // user dismissed: not an error
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Image saved', 'green');
}

/* ============================================================
   EDIT A COMPLETED SESSION
   Works on a clone; nothing touches S.workouts until Save. Same table as the
   live session so nothing has to be relearned. A set unticked here is dropped
   from the log on save — finishWorkout keeps only ticked sets, and history
   reads only ticked sets, so that's the one meaning of the tick. PRs are
   derived at read time by prsFor, so the calendar, analytics and share cards
   follow an edit with no second bookkeeping path; only summary.prs, the
   at-finish snapshot, is rebuilt.
   ============================================================ */
let editDraft = null;

function openEditWorkout(id) {
  const wo = S.workouts.find(w => w.id === id);
  if (!wo || wo.status !== 'completed') return;
  editDraft = structuredClone(wo);
  editDraft.exercises.forEach(e => e.sets.forEach(s => { s.done = s.done !== false; }));
  renderEditWorkout();
}

function renderEditWorkout() {
  closeAllModals();
  const d = editDraft;
  const key = k => k.split('.').map(Number);
  const exCard = (e, ei) => `<div class="ex-card" style="margin-bottom:9px">
    <div class="ex-head"><div class="row between" style="gap:6px">
      <div class="ex-name grow">${esc(e.name)}</div>
      <button class="btn xs ghost" data-eex-up="${ei}" title="Move up">↑</button>
      <button class="btn xs ghost" data-eex-down="${ei}" title="Move down">↓</button>
      <button class="btn xs danger" data-eex-rm="${ei}" title="Remove exercise">✕</button>
    </div></div>
    <table class="settable">
      <thead><tr><th class="c-set">Set</th><th class="c-del"></th><th>${U()}</th><th>Reps</th><th>RPE</th><th class="c-chk"></th></tr></thead>
      <tbody>${e.sets.map((s, si) => `<tr class="${s.done ? 'done' : ''}">
        <td class="c-set"><div class="setno ${s.warm ? 'warm' : ''}" data-ewarm="${ei}.${si}" title="Toggle warm-up">${s.warm ? 'W' : si + 1 - e.sets.slice(0, si).filter(x => x.warm).length}</div></td>
        <td class="c-del"><button class="delset" data-edelset="${ei}.${si}" title="Delete set">×</button></td>
        <td class="c-wt"><input type="number" step="0.5" inputmode="decimal" data-ef="w" data-k="${ei}.${si}" value="${s.w ? dw(s.w) : ''}" placeholder="0"></td>
        <td><input type="number" inputmode="numeric" data-ef="r" data-k="${ei}.${si}" value="${s.r || ''}" placeholder="0"></td>
        <td><input type="number" step="0.5" inputmode="decimal" data-ef="rpe" data-k="${ei}.${si}" value="${s.rpe ?? ''}" placeholder="—"></td>
        <td class="c-chk"><button class="chk ${s.done ? 'on' : ''}" data-edone="${ei}.${si}" title="Untick to drop this set">✓</button></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="ex-foot"><button class="btn sm ghost grow" data-eaddset="${ei}">+ Set</button></div>
  </div>`;

  modal({
    title: 'Edit session',
    body: `
      <div class="grid2">
        <div class="field"><label>Name</label><input id="eName" value="${esc(d.name)}"></div>
        <div class="field"><label>Date</label><input type="date" id="eDate" value="${d.date}" max="${today()}"></div>
      </div>
      <div class="sub" style="margin-bottom:10px">Untick a set to drop it. PRs and analytics follow the edit.</div>
      ${d.exercises.length ? d.exercises.map(exCard).join('') : `<div class="empty" style="padding:14px">No exercises — add one below.</div>`}
      <button class="btn wide ghost" id="eAddEx">+ Add exercise</button>
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="eSave">Save changes</button>`,
    onOpen: bg => {
      const grab = () => {
        d.name = $('#eName', bg).value.trim() || d.name;
        d.date = $('#eDate', bg).value || d.date;
      };
      const re = () => { grab(); renderEditWorkout(); };
      // typing updates the draft silently so focus is never stolen
      bg.querySelectorAll('[data-ef]').forEach(inp => inp.oninput = () => {
        const [ei, si] = key(inp.dataset.k);
        const s = d.exercises[ei].sets[si];
        const val = inp.value === '' ? null : +inp.value;
        if (inp.dataset.ef === 'w') s.w = val ? toKg(val) : 0;
        if (inp.dataset.ef === 'r') s.r = val || 0;
        if (inp.dataset.ef === 'rpe') s.rpe = val;
      });
      bg.querySelectorAll('[data-edone]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.edone); const s = d.exercises[ei].sets[si]; s.done = !s.done; re();
      });
      bg.querySelectorAll('[data-ewarm]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.ewarm); const s = d.exercises[ei].sets[si]; s.warm = !s.warm; re();
      });
      bg.querySelectorAll('[data-edelset]').forEach(b => b.onclick = () => {
        const [ei, si] = key(b.dataset.edelset);
        d.exercises[ei].sets.splice(si, 1);
        if (!d.exercises[ei].sets.length) d.exercises.splice(ei, 1);
        re();
      });
      bg.querySelectorAll('[data-eaddset]').forEach(b => b.onclick = () => {
        const ex = d.exercises[+b.dataset.eaddset];
        const last = ex.sets[ex.sets.length - 1] || { w: 0, r: 0 };
        ex.sets.push({ w: last.w, r: last.r, rpe: null, done: true, warm: false });
        re();
      });
      bg.querySelectorAll('[data-eex-up]').forEach(b => b.onclick = () => {
        const i = +b.dataset.eexUp;
        if (i > 0) { const [x] = d.exercises.splice(i, 1); d.exercises.splice(i - 1, 0, x); re(); }
      });
      bg.querySelectorAll('[data-eex-down]').forEach(b => b.onclick = () => {
        const i = +b.dataset.eexDown;
        if (i < d.exercises.length - 1) { const [x] = d.exercises.splice(i, 1); d.exercises.splice(i + 1, 0, x); re(); }
      });
      bg.querySelectorAll('[data-eex-rm]').forEach(b => b.onclick = () => {
        grab();
        const i = +b.dataset.eexRm, ex = d.exercises[i];
        confirmDlg(`Remove ${ex.name} and its ${ex.sets.length} set${ex.sets.length === 1 ? '' : 's'} from this session?`,
          () => { d.exercises.splice(i, 1); renderEditWorkout(); }, 'Remove');
      });
      $('#eAddEx', bg).onclick = () => {
        grab();
        pickExercise(name => {
          d.exercises.push({ name, notes: '', sets: [{ w: 0, r: 0, rpe: null, done: true, warm: false }] });
          renderEditWorkout();
        });
      };
      $('#eSave', bg).onclick = () => { grab(); saveEdit(false); };
    },
  });
}

function saveEdit(force) {
  const d = editDraft;
  if (!d) return;
  const logged = d.exercises.map(e => ({ ...e, sets: e.sets.filter(s => s.done && s.r > 0) })).filter(e => e.sets.length);
  if (!logged.length) return toast('Keep at least one ticked set, or delete the session instead');

  if (!force) {
    const flagged = [];
    logged.forEach(e => e.sets.filter(s => !s.warm).forEach(s => {
      const why = plausibility(e.name, s.w, s.r, s.rpe, d.date);
      if (why.length) flagged.push({ name: e.name, s, why });
    }));
    if (flagged.length) return plausListDlg(flagged, 'Save', () => saveEdit(true));
  }

  const orig = S.workouts.find(w => w.id === d.id) || {};
  const done = {
    ...orig, name: d.name, date: d.date, exercises: logged, edited: Date.now(),
    summary: {
      ...(orig.summary || {}),
      volume: logged.reduce((t, e) => t + e.sets.filter(s => !s.warm).reduce((x, s) => x + s.w * s.r, 0), 0),
      prs: [],
    },
  };
  S.workouts = S.workouts.filter(w => w.id !== d.id);
  S.workouts.push(done);
  bust();
  done.summary.prs = prsFor(done);   // the at-finish snapshot, rebuilt against history before this date
  if (page === 'calendar') calSelected = done.date;
  editDraft = null;
  save(); bust(); closeAllModals(); render();
  toast('Session updated', 'green');
}

let detailMetric = 'e1';
function openExDetail(name) {
  const s = statsFor(name);
  if (!s) return;
  const draw = () => {
    const data = s.series.map(x => ({
      date: x.date,
      v: detailMetric === 'e1' ? dw(x.e1) : detailMetric === 'top' ? dw(x.top) : dw(x.vol, 0),
    }));
    return chart(data, { h: 160, fmt: v => nice(Math.round(v)) });
  };
  const repRows = Object.keys(s.byRep).map(Number).sort((a, b) => a - b).slice(0, 12)
    .map(r => {
      const x = s.byRep[r];
      return `<tr><td><b>${r}RM</b></td><td class="muted">${fmtDate(x.date, { month: 'short', day: 'numeric', year: '2-digit' })}</td>
        <td class="mono"><b>${wt(x.w)}</b> <span class="dimmer">· e1RM ${wt(x.e1)}</span></td></tr>`;
    }).join('');

        <div class="stat"><div class="k">Progress</div><div class="v ${trendCls}" style="color:${s.pct > 1 ? 'var(--green)' : s.pct < -1 ? 'var(--red)' : 'inherit'}">${s.pct >= 0 ? '+' : ''}${Math.round(s.pct)}<small>%</small></div>
          <div class="d">${s.delta >= 0 ? '+' : ''}${wt(s.delta)} e1RM</div></div>
        <div class="stat"><div class="k">Volume</div><div class="v">${w(s.volume, 0)}</div><div class="d">all time</div></div>
      </div>

        <button data-metric="e1" class="${detailMetric === 'e1' ? 'on' : ''}">Est. 1RM</button>
        <button data-metric="top" class="${detailMetric === 'top' ? 'on' : ''}">Top set</button>
        <button data-metric="vol" class="${detailMetric === 'vol' ? 'on' : ''}">Volume</button>

      ${[...s.series].reverse().slice(0, 8).map(x => `
        <div class="exline"><span>${fmtDate(x.date)}</span>
          <span class="mono muted">top ${wt(x.top)} · e1RM ${wt(x.e1)} · ${x.sets} sets</span></div>`).join('')}

      <div class="sub" style="margin-top:14px">First logged ${fmtDate(s.firstDate, { month: 'short', day: 'numeric', year: 'numeric' })} · last ${relDay(s.lastDate)}</div>
    `,

}

/* Log one lift or several — whatever actually got tested. Blank rows are
   skipped, so a squat-only day is a first-class entry, not a partial one. */
let testDraft = null;

  modal({

      <div class="field"><label>Date</label><input type="date" id="tDate" value="${today()}"></div>

    `,

    onOpen: bg => {
      bg.querySelectorAll('[data-tramp]').forEach(b => b.onclick = () => {
        const i = +b.dataset.tramp;
        openRamp($(`#tEx${i}`, bg).value, toKg(+$(`#tKg${i}`, bg).value || 0) || null);
      });

/* ---------------- placing predictor ----------------
   Field data: 2025 EPA West Midlands Spring Championship, Men's 93kg Classic
   Raw, via the OpenPowerlifting project (public domain, attribution kept).
   One year is a small sample — a single strong entry shifts everything under
   it — so this is a range, not a promise. */
const FIELDS = {
  'wm-93-classic': {
    label: 'EPA West Midlands Spring · 2025',
    div: "Men's 93kg · Classic Raw",
    bombRate: 1 / 18,
    lifters: [
      ['Jacob Rutherford', 86.5, 657.5], ['Benny Cave', 91.8, 642.5],
      ['Abdul Nasir', 92.4, 640.0], ['Jack A. Nightingale', 90.3, 630.0],
      ['Mohammed Khusal', 90.7, 622.5], ['Ryan Bristow', 83.6, 610.0],
      ['Wojciech Herezo', 91.3, 600.0], ['Yat Yin Dung', 88.6, 527.5],
      ['Usman Hussain', 87.2, 505.0], ['Waqar Ali', 83.3, 502.5],
      ['Reece Wootley', 86.6, 500.0], ['Harvir Singh Cheema', 92.5, 480.0],
      ['Rohan Warfield', 90.2, 477.5], ['Mitchell Jones', 90.7, 455.0],
      ['Glenn Cooper', 89.3, 430.0], ['Jarnail Singh Chahal', 85.1, 387.5],
      ['Stephen Porretta', 87.8, 360.0],
    ].map(([name, bw, total]) => ({ name, bw, total })),
  },
};

function fieldForMeet(m) {
  const hay = `${m.name} ${m.wclass || ''} ${m.fed || ''}`.toLowerCase();
  if (/west midlands|spring/.test(hay) && /93/.test(hay + (m.wclass || ''))) return FIELDS['wm-93-classic'];
  return null;
}

function platformPct() { return S.settings.platformPct || 96; }
const half = n => Math.round(n * 2) / 2;

/* Gym maxes aren't platform totals: openers are conservative, thirds get
   missed, and nerves cost kilos. The haircut is a blunt instrument but a
   truthful one — better than comparing a good gym day against competition
   results as though they were the same thing. */
function predictPlacing(field, gymTotal, applyHaircut = true) {
  if (!field || !gymTotal) return null;
  const total = applyHaircut ? half(gymTotal * (platformPct() / 100)) : half(gymTotal);
  const sorted = [...field.lifters].sort((a, b) => b.total - a.total);
  // ties go to the lighter lifter, and at 93kg he's at the top of the class
  const above = sorted.filter(l => l.total >= total);
  const place = above.length + 1;
  const rows = sorted.map((l, i) => ({ ...l, place: i < above.length ? i + 1 : i + 2 }));
  rows.splice(above.length, 0, { name: 'You', bw: null, total, place, me: true });
  const nxt = sorted[above.length - 1];
  return {
    total, place, fieldSize: sorted.length + 1, ladder: rows,
    costNext: nxt ? half(nxt.total + 0.5 - total) : null,
    nextName: nxt ? nxt.name : null,
  };
}

/* Total from the tested singles that existed on a given date, so the placing
   delta tracks real test results rather than needing its own log. */
function testedTotalAsOf(date) {
  const lifts = S.settings.priority;
  let t = 0, found = 0;
  lifts.forEach(n => {
    const hit = testLog().filter(w => w.date <= date)
      .map(w => w.exercises.find(e => e.name === n))
      .find(e => e && e.sets[0] && e.sets[0].w > 0);
    if (hit) { t += hit.sets[0].w; found++; }
  });
  return found === lifts.length ? t : null;
}

function ord(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function priorityStats() {
  const p = S.settings.priority;
  const lifts = p.map(n => ({ name: n, ...bestSingleInfo(n) }));
  const total = lifts.reduce((a, l) => a + l.kg, 0);
  const bw = bodyweightKg();
  return { lifts, total, bw, dots: dots(total, bw, S.settings.sex) };
}

  return `

  <div class="bigtotal">
    <div class="row between">

      ${ps.lifts.map(l => `<div class="l"><div class="k">${esc(shortLift(l.name))}</div>
        <div class="v">${l.kg ? w(l.kg, 0) : '—'}</div>

    </div>

      <div><div class="k eyebrow">Bodyweight</div><div class="v">${ps.bw ? nice(dw(ps.bw)) : '—'}<small class="sub"> ${U()}</small></div></div>
    </div>
    ${!ps.bw ? `<div class="sub" style="margin-top:9px">Log a check-in with your bodyweight to get a DOTS score.</div>` : ''}
  </div>

  <div class="sechead"><h2>Tests</h2><button class="btn xs" id="logTestBtn">+ Log a test</button></div>
  ${(() => {
      const tl = testLog();
      if (!tl.length) return `<div class="card"><div class="sub">No tested singles yet. Openers fall back to the planned numbers until you log one.</div></div>`;
      return `<div class="card flush">${tl.slice(0, 8).map(t => `
        <div class="ex-row">
          <div class="grow">
            <div class="n">${esc(t.name)}</div>
            <div class="m">${fmtDate(t.date, { month: 'short', day: 'numeric', year: '2-digit' })} · ${relDay(t.date)}${t.notes ? ' · ' + esc(t.notes) : ''}</div>
          </div>
          <div class="pr">${t.exercises.map(e => `${shortLift(e.name)} ${wt(e.sets[0].w)}`).join('<br>')}</div>

  <div class="sechead"><h2>Upcoming</h2><button class="btn xs" id="addMeet">+ Add meet</button></div>

  ${past.length ? `<div class="sechead"><h2>Past</h2></div>
    ${past.reverse().map(m => `<div class="card tight"><div class="row between">

      <button class="btn xs ghost" data-edit-meet="${m.id}">Edit</button></div></div>`).join('')}` : ''}
  `;

function liftName(k) {
  const i = ['squat', 'bench', 'deadlift'].indexOf(k);
  return (i >= 0 && S.settings.priority[i]) || k;
}

/* A tested single is better evidence than a number generated from a PDF months
   ago, so it wins — unless the meet is locked, in which case your hand-entered
   attempts stand. The planned figures are never overwritten, only outranked:
   unlock the meet and they come straight back.
   Third goes to whichever is higher. Testing above your goal third doesn't mean
   you should open at 90% of a target you've already beaten. */
function attemptsFor(m, lift) {
  const goal = (m.lifts && m.lifts[lift]) || 0;
  const a = (m.attempts && m.attempts[lift]) || null;
  const planned = a && (a.o || a.s)
    ? { o: a.o || 0, s: a.s || 0 }
    : goal
      ? (() => { const p = m.pct || { o: 90, s: 95 }; return { o: roundBar(goal * (p.o / 100)), s: roundBar(goal * (p.s / 100)) }; })()
      : { o: 0, s: 0 };

  const t = latestTest(liftName(lift));
  if (!t || m.attemptsLocked) {
    return { ...planned, third: goal, from: 'planned', tested: t || null, planned };
  }

  const third = Math.max(goal, t.kg);
  const o = roundBar(t.kg * (openerPct() / 100));
  // second sits proportionally between opener and third rather than at a fixed %
  const s = roundBar(o + (third - o) * 0.55);
  return { o, s, third, from: 'tested', tested: t, planned };
}
function pctOf(v, goal) { return v && goal ? Math.round((v / goal) * 100) + '%' : '—'; }

function shortLift(n) {
  const s = n.toLowerCase();
  if (s.includes('squat')) return 'Squat';
  if (s.includes('bench')) return 'Bench';
  if (s.includes('dead')) return 'Deadlift';
  return n;
}

function meetCard(m, ps) {
  const days = daysBetween(today(), m.date);
  const weeks = Math.floor(days / 7);
  const keys = ['squat', 'bench', 'deadlift'];
  const goalTotal = keys.reduce((a, k) => a + (m.lifts[k] || 0), 0);
  const curTotal = ps.total;
  const pct = goalTotal ? (curTotal / goalTotal) * 100 : 0;
  const projDots = dots(goalTotal, m.bwTarget || ps.bw, S.settings.sex);

  const rows = keys.map((k, i) => {
    const goal = m.lifts[k] || 0;
    const cur = ps.lifts[i] ? ps.lifts[i].kg : 0;
    const p = goal ? (cur / goal) * 100 : 0;
    const gap = goal - cur;
    const att = attemptsFor(m, k);
    const o = att.o, s2 = att.s, third = att.third || goal;
    return `<div style="margin-bottom:14px">
      <div class="row between" style="margin-bottom:5px">
        <div><b>${esc(shortLift(ps.lifts[i] ? ps.lifts[i].name : k))}</b>
          <span class="sub"> · now ${cur ? wt(cur) : '—'} → goal ${goal ? wt(goal) : '—'}</span></div>
        <div class="mono" style="font-weight:700;${p >= 100 ? 'color:var(--green)' : ''}">${Math.round(p)}%</div>
      </div>
      ${bar(p, ['', 'blue', 'gold'][i] || '')}
      <div class="sub" style="margin-top:4px">${gap > 0 ? `${wt(gap)} to go` : gap < 0 ? `${wt(-gap)} over goal` : 'on target'}${weeks > 0 && gap > 0 ? ` · ${wt(gap / Math.max(weeks, 1))}/week needed` : ''}</div>
      <div class="attempts">
        <div class="att o"><div class="k">Opener</div><div class="v">${o ? nice(dw(o, 1)) : '—'}</div><div class="p">${pctOf(o, third)}</div></div>
        <div class="att"><div class="k">Second</div><div class="v">${s2 ? nice(dw(s2, 1)) : '—'}</div><div class="p">${pctOf(s2, third)}</div></div>
        <div class="att t"><div class="k">Third</div><div class="v">${third ? nice(dw(third, 1)) : '—'}</div><div class="p">100%</div></div>
      </div>
      ${(() => {
          if (att.from === 'tested') {
            const pl = att.planned;
            const d = pl.o ? att.o - pl.o : 0;
            return `<div class="sub" style="margin-top:5px">
              From your ${wt(att.tested.kg)} test (${relDay(att.tested.date)}) at ${openerPct()}%${att.third > goal ? ` · third raised to your tested max` : ''}
              ${pl.o ? ` · plan said ${wt(pl.o)}<b style="color:${d > 0 ? 'var(--green)' : d < 0 ? 'var(--gold)' : 'var(--dim)'}">${d ? ` (${d > 0 ? '+' : ''}${wt(d)})` : ''}</b>` : ''}
            </div>`;
          }
          return `<div class="sub" style="margin-top:5px">Planned opener · no tested single for this lift yet</div>`;
        })()}
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="row between" style="margin-bottom:12px">
      <div class="grow">
        <div style="font-weight:750;font-size:16px">${esc(m.name)}</div>
        <div class="sub">${fmtDate(m.date, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}${m.loc ? ' · ' + esc(m.loc) : ''}${m.fed ? ' · ' + esc(m.fed) : ''}</div>
      </div>
      <button class="btn xs ghost" data-edit-meet="${m.id}">Edit</button>
    </div>

    <div class="row between" style="margin-bottom:12px">
      <div class="countdown"><span class="n">${days}</span><span class="sub">days out${weeks ? ` · ${weeks} week${weeks === 1 ? '' : 's'}` : ''}</span></div>
      ${m.wclass ? `<span class="chip">${esc(m.wclass)}${m.bwTarget ? ` · target ${wt(m.bwTarget)}` : ''}</span>` : ''}
    </div>

    <div class="stats grid3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Goal total</div><div class="v">${goalTotal ? w(goalTotal, 0) : '—'}</div>
        <div class="d">now ${wt(curTotal, 0)}</div></div>
      <div class="stat"><div class="k">To go</div><div class="v">${goalTotal ? w(Math.max(0, goalTotal - curTotal), 0) : '—'}</div>
        <div class="d">${weeks > 0 && goalTotal > curTotal ? `${wt((goalTotal - curTotal) / weeks, 1)}/wk` : 'on track'}</div></div>
      <div class="stat"><div class="k">Goal DOTS</div><div class="v" style="color:var(--purple)">${projDots ? Math.round(projDots) : '—'}</div>
        <div class="d">now ${ps.dots ? Math.round(ps.dots) : '—'}</div></div>
    </div>

    <div style="margin-bottom:12px">
      <div class="row between" style="margin-bottom:5px"><span class="eyebrow">Total progress</span>
        <span class="mono" style="font-weight:700">${Math.round(pct)}%</span></div>
      ${bar(pct)}
    </div>

    <div class="row between" style="margin:16px 0 9px">
      <span class="eyebrow">Attempt plan</span>
      <button class="btn xs ghost" data-lockmeet="${m.id}">${m.attemptsLocked ? '🔒 Pinned to plan' : '↻ Following tests'}</button>
    </div>
    ${rows}

    ${m.notes ? `<div class="sub" style="margin-top:4px">“${esc(m.notes)}”</div>` : ''}
    ${(() => {
      const field = fieldForMeet(m);
      if (!field) return '';
      const now = predictPlacing(field, curTotal);
      if (!now) return '';
      const goal = goalTotal ? predictPlacing(field, goalTotal) : null;

      // delta against the placing your previous test produced
      const dates = testLog().map(t => t.date);
      const prevTotal = dates[1] ? testedTotalAsOf(dates[1]) : null;
      const prev = prevTotal ? predictPlacing(field, prevTotal) : null;
      const moved = prev ? prev.place - now.place : 0;

      const myIdx = now.ladder.findIndex(r => r.me);
      const from = Math.max(3, myIdx - 3);
      const rows2 = [...now.ladder.slice(0, 3), ...(from > 3 ? [null] : []), ...now.ladder.slice(from, myIdx + 4)];

      return `
    <div class="hr"></div>
    <div class="row between" style="margin-bottom:10px">
      <div><div class="eyebrow">Predicted finish</div>
        <div class="mono" style="font-size:34px;font-weight:800;color:var(--gold);line-height:1.05;margin-top:1px">${ord(now.place)}</div>
        <div class="sub">of ${now.fieldSize} · ${wt(now.total)} on the platform</div></div>
      ${prev ? `<div class="right">
        <div class="eyebrow">Since last test</div>
        <div style="font-size:22px;font-weight:800;margin-top:3px;color:${moved > 0 ? 'var(--green)' : moved < 0 ? 'var(--red)' : 'var(--dim)'}">${moved > 0 ? `▲ ${moved}` : moved < 0 ? `▼ ${-moved}` : '—'}</div>
        <div class="sub">${moved === 0 ? 'same place' : `place${Math.abs(moved) === 1 ? '' : 's'} ${moved > 0 ? 'gained' : 'lost'}`}</div>
      </div>` : ''}
    </div>
    ${now.costNext !== null ? `
    <div style="border-left:3px solid var(--red);background:rgba(255,255,255,.03);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:10px">
      <div class="eyebrow">Cost of ${ord(now.place - 1)} place</div>
      <div class="row" style="gap:8px;align-items:baseline">
        <span style="font-size:25px;font-weight:800">+${wt(now.costNext)}</span>
        <span class="sub">to pass ${esc(now.nextName)}</span>
      </div>
    </div>` : ''}
    ${goal ? `<div class="sub" style="margin-bottom:10px">At your goal total of ${wt(goalTotal, 0)} — ${wt(goal.total)} platform — that's <b style="color:var(--gold)">${ord(goal.place)}</b>.</div>` : ''}
    <div class="card flush" style="background:transparent;margin-bottom:9px">
      ${rows2.map(r => r === null
          ? `<div style="padding:5px 13px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)">⋯</div>`
          : `<div class="row" style="gap:11px;padding:8px 13px;border-bottom:1px solid var(--line);border-left:3px solid ${r.me ? 'var(--gold)' : 'transparent'};${r.me ? 'background:rgba(255,197,66,.09)' : ''}">
          <div class="mono" style="width:26px;color:${r.me ? 'var(--gold)' : 'var(--dim)'}">${r.place}</div>
          <div class="grow" style="font-size:13.5px;${r.me ? 'font-weight:700' : ''};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
          <div class="mono" style="font-size:14px;${r.me ? 'color:var(--gold);font-weight:700' : ''}">${nice(dw(r.total, 1))}</div>
        </div>`).join('')}
    </div>
    <div class="sub">Modelled on the ${esc(field.label)} field — ${field.lifters.length} finishers, one year, so read it as a range rather than a promise. Around ${Math.round(field.bombRate * 100)}% of the class bombed out that year, which quietly works in your favour. Gym maxes are cut to ${platformPct()}% for a platform estimate (Settings). Results data from the OpenPowerlifting project.</div>`;
    })()}
  </div>`;
}

function openMeet(id) {
  const ps = priorityStats();
  const existing = S.meets.find(x => x.id === id);
  const m = existing || {

/* ============================================================
   TRAINING PROGRAMS
   A program ships as window.IRONLOG_PROGRAM (see program.js) and installs
   its sessions as planned workouts. Ids are derived from the program id and
   date so re-installing can never duplicate, and removing is exact.
   ============================================================ */
function theProgram() { return window.IRONLOG_PROGRAM || null; }
function programInstalled(id) { return S.programs.includes(id); }
function progWorkoutId(P, i) { return `${P.id}#${i}`; }

function installProgram(P) {
  const existing = new Set(S.workouts.map(w => w.id));
  let added = 0;
  P.workouts.forEach((w, i) => {
    const id = progWorkoutId(P, i);
    if (existing.has(id)) return;              // already there (or already completed)
    S.workouts.push({
      id, date: w.date, name: w.name, status: 'planned', prog: P.id, block: w.block,
      exercises: w.exercises.map(e => ({
        name: e.name, notes: e.notes || '',
        sets: e.sets.map(s => ({ w: s.w, r: s.r, rpe: null, done: false, warm: false })),
      })),
    });
    added++;
  });

  (P.meets || []).forEach(m => {
    if (S.meets.some(x => x.name === m.name && x.date === m.date)) return;
    S.meets.push({ id: uid(), prog: P.id, ...m });
  });

  if (P.priority) S.settings.priority = [...P.priority];
  if (!S.programs.includes(P.id)) S.programs.push(P.id);
  save(); bust();
  return added;
}

function removeProgram(id) {
  // only planned sessions — anything already trained stays in your history
  const before = S.workouts.length;
  S.workouts = S.workouts.filter(w => !(w.prog === id && w.status === 'planned'));
  S.meets = S.meets.filter(m => m.prog !== id);
  S.programs = S.programs.filter(x => x !== id);
  save(); bust();
  return before - S.workouts.length;
}

function programStats(P) {
  const mine = S.workouts.filter(w => w.prog === P.id);
  return {
    planned: mine.filter(w => w.status === 'planned').length,
    done: mine.filter(w => w.status === 'completed').length,
    total: P.workouts.length,
    next: mine.filter(w => w.status === 'planned' && w.date >= today())
      .sort((a, b) => a.date < b.date ? -1 : 1)[0],
  };
}

function openProgram() {
  const P = theProgram();
  if (!P) return toast('No program file loaded');
  const on = programInstalled(P.id);
  const st = programStats(P);
  modal({
    title: 'Training program',
    body: `
      <div style="font-weight:750;font-size:16px">${esc(P.name)}</div>
      <div class="sub" style="margin-bottom:12px">${esc(P.subtitle || '')}</div>
      ${on ? `
        <div class="stats grid3" style="margin-bottom:12px">
          <div class="stat"><div class="k">Planned</div><div class="v">${st.planned}</div><div class="d">sessions ahead</div></div>
          <div class="stat"><div class="k">Completed</div><div class="v">${st.done}</div><div class="d">from this plan</div></div>
          <div class="stat"><div class="k">Total</div><div class="v">${st.total}</div><div class="d">in the program</div></div>
        </div>
        ${st.next ? `<div class="sub">Next up: <b>${esc(st.next.name)}</b> · ${fmtDate(st.next.date)} (${relDay(st.next.date)})</div>` : ''}
        <div class="hr"></div>
        <p class="sub" style="margin-top:0">Removing clears only the <b>planned</b> sessions — sessions you've already
        trained stay in your history and analytics.</p>
        <button class="btn danger wide" id="pgRemove">Remove planned sessions</button>`
      : `<p class="sub">Installs <b>${P.workouts.length}</b> planned sessions${(P.meets || []).length ? ` and ${P.meets.length} meets` : ''},
         and sets your priority lifts to ${esc((P.priority || []).join(', '))}.</p>
         <button class="btn primary wide" id="pgInstall">Add to planned workouts</button>`}
    `,
    foot: `<button class="btn ghost" data-close>Close</button>`,
    onOpen: bg => {
      const ins = $('#pgInstall', bg);
      if (ins) ins.onclick = () => {
        const n = installProgram(P);
        closeAllModals(); render();
        toast(`${n} sessions added to your calendar`, 'green');
      };
      const rm = $('#pgRemove', bg);
      if (rm) rm.onclick = () => confirmDlg(
        `Remove ${st.planned} planned sessions from ${P.name}? Completed sessions are kept.`,
        () => { const n = removeProgram(P.id); closeAllModals(); render(); toast(`${n} planned sessions removed`); },
        'Remove');
    },
  });
}

/* ============================================================
   SETTINGS
   ============================================================ */
/* ---------------- backfill ----------------
   Flips planned sessions in a past window to completed at their prescribed
   loads. Those numbers are the plan's, not what actually came off the bar
   (and AMRAP sets are a guess by definition), so each session is flagged
   `source: 'backfill'`: the PR engine can exclude flagged sets from bests, the
   card shows a badge, and everything stays editable so real numbers from
   another app can replace them set by set. */
/* The window ends yesterday. Today's session is still ahead of you — sweeping it
   into a backfill would mark it done before you've trained it. */
function backfillWindow(days) {
  return {
    from: iso(new Date(Date.now() - days * 86400000)),
    to: iso(new Date(Date.now() - 86400000)),
  };
}

function backfillPlanned(days) {
  const { from, to } = backfillWindow(days);
  const hits = S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to);
  if (!hits.length) return 0;

  hits.forEach(w => {
    w.exercises.forEach(e => e.sets.forEach(s => { if (s.r > 0) s.done = true; }));
    w.exercises = w.exercises
      .map(e => ({ ...e, sets: e.sets.filter(s => s.done) }))
      .filter(e => e.sets.length);
    w.status = 'completed';
    w.source = 'backfill';
    w.end = parseISO(w.date).getTime();
    w.summary = {
      mins: 0, prs: [],
      volume: w.exercises.reduce((t, e) =>
        t + e.sets.filter(s => !s.warm).reduce((x, s) => x + s.w * s.r, 0), 0),
    };
  });
  save(); bust();
  return hits.length;
}

function countPlanned(days) {
  const { from, to } = backfillWindow(days);
  return S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to).length;
}

/* ---------------- CSV import ----------------
   Liftoff exports one row per set: Date, Duration, Workout Name, Exercise Name,
   Set Order, Weight, Reps, Distance, Seconds, RPE, Notes.

   Imported history is real lifting — an actual training log from another app —
   so it lands as `source: 'imported'` and counts toward PRs unconditionally,
   never gated by prCountEst and never badged EST. That is the whole reason the
   backfilled boolean became a three-way source.

   Three things the format forces:
   - Weight comes out in pounds, as the round-trip of a kg original (176.369809748
     is 80 kg). Detected rather than assumed, and confirmable in the preview.
   - `Set Order` repeats within a session when an exercise is done in two blocks,
     so row order is the only reliable ordering.
   - A day can carry several timestamps — a session stopped and restarted. Ironlog
     dates are day-resolution, so a day is one workout. */

const LB_PER_KG = 2.2046226218;

/* Fields can be quoted and contain commas, quotes and newlines. Notes is free
   text, so parse properly rather than splitting on commas. */
function parseCSV(text) {
  const t = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') {
        if (t[i + 1] === '"') { field += '"'; i++; }
        else q = false;
      } else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const hdr = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.length && r.some(v => v.trim() !== ''))
    .map(r => { const o = {}; hdr.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });
}

/* "00 hours 30 minutes 19 seconds" -> minutes. */
function liftoffMins(d) {
  if (!d) return 0;
  const h = /(\d+)\s*hour/.exec(d), m = /(\d+)\s*minute/.exec(d);
  return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
}

/* Pounds, if converting lands on clean kg. A log kept in kg and exported in lb
   round-trips to values like 79.99999999; one kept in lb sits on whole numbers
   and fails this. Only ever the default for the toggle in the preview. */
function guessUnit(weights) {
  const w = weights.filter(x => x > 0);
  if (w.length < 3) return 'kg';
  let clean = 0;
  w.forEach(x => {
    const kg = x / LB_PER_KG;
    if (Math.abs(kg * 4 - Math.round(kg * 4)) < 0.04) clean++;
  });
  return clean / w.length > 0.8 ? 'lb' : 'kg';
}

function toKgFrom(v, unit) {
  const kg = unit === 'lb' ? v / LB_PER_KG : v;
  return Math.round(kg * 100) / 100;
}

const normEx = n => n.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

/* Exact normalised match only — first against what's already in the log, then
   against EX_DB. Anything else is a suggestion for the review screen and is
   never applied on its own: token overlap alone maps "Incline Bench Press" onto
   "Bench Press", which would plant a fake PR on a competition lift. */
function matchExercise(name) {
  const alias = S.exAliases && S.exAliases[name];
  if (alias) return { name: alias, how: 'alias' };
  const k = normEx(name);
  const own = allExercises().find(n => normEx(n) === k);
  if (own) return { name: own, how: 'exact' };
  const db = Object.keys(EX_DB).find(n => normEx(n) === k);
  if (db) return { name: db, how: 'db' };
  return { name: null, how: 'new', suggest: suggestExercise(k) };
}

function suggestExercise(k) {
  const w = k.split(' ');
  let best = null, bs = 0;
  const consider = n => {
    const pw = normEx(n).split(' ');
    const hit = w.filter(x => pw.includes(x)).length;
    const sc = hit / Math.max(w.length, pw.length);
    if (sc > bs) { bs = sc; best = n; }
  };
  allExercises().forEach(consider);
  Object.keys(EX_DB).forEach(consider);
  return bs >= 0.6 ? best : null;
}

/* Parse to day-grouped sessions. Exercise names stay raw here; mapping is applied
   at import time, after the review screen. */
function parseLiftoff(text) {
  const rows = parseCSV(text);
  if (!rows.length || !('Exercise Name' in rows[0]) || !('Date' in rows[0])) {
    throw new Error('not a Liftoff export');
  }
  let skipped = 0;
  const good = rows.filter(r => {
    const ok = r['Exercise Name'] && r.Date && (+r.Weight > 0 || +r.Reps > 0 || +r.Seconds > 0);
    if (!ok) skipped++;
    return ok;
  });
  const unit = guessUnit(good.map(r => +r.Weight || 0));
  const byDay = new Map();
  good.forEach(r => {
    const date = r.Date.slice(0, 10);
    if (!byDay.has(date)) byDay.set(date, { date, mins: new Map(), ex: new Map() });
    const d = byDay.get(date);
    d.mins.set(r.Date, liftoffMins(r.Duration));      // one duration per timestamp, not per row
    const raw = r['Exercise Name'];
    if (!d.ex.has(raw)) d.ex.set(raw, { raw, sets: [], secs: 0 });
    const e = d.ex.get(raw);
    if (+r.Seconds > 0) e.secs = Math.max(e.secs, +r.Seconds);
    e.sets.push({ lb: +r.Weight || 0, r: +r.Reps || 0, rpe: r.RPE ? +r.RPE : null });
  });
  const sessions = [...byDay.values()]
    .map(d => ({
      date: d.date,
      mins: [...d.mins.values()].reduce((a, b) => a + b, 0),
      exercises: [...d.ex.values()],
    }))
    .filter(d => d.exercises.length)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const names = [...new Set(sessions.flatMap(s => s.exercises.map(e => e.raw)))];
  return { sessions, skipped, unit, names, sets: good.length };
}

/* Which existing sessions an import would land on. A backfill is the plan's
   prescription and real data supersedes it; a logged session is real too, so
   that one is left alone and the import sits alongside it. */
function importCollisions(sessions) {
  const out = { replace: [], alongside: [], already: [] };
  sessions.forEach(s => {
    const srcId = 'liftoff:' + s.date;
    if (S.workouts.some(w => w.srcId === srcId)) { out.already.push(s.date); return; }
    const same = S.workouts.filter(w => w.status === 'completed' && w.date === s.date);
    if (same.some(w => w.source === 'backfill')) out.replace.push(s.date);
    else if (same.length) out.alongside.push(s.date);
  });
  return out;
}

/* mapping: raw name -> Ironlog name. Every raw name must be present. */
function importLiftoff(sessions, mapping, unit) {
  let added = 0, replaced = 0, skipped = 0;
  sessions.forEach(s => {
    const srcId = 'liftoff:' + s.date;
    if (S.workouts.some(w => w.srcId === srcId)) { skipped++; return; }

    const built = s.exercises.map(e => ({
      name: mapping[e.raw] || e.raw,
      notes: e.secs ? `${e.secs} s hold` : '',
      sets: e.sets.map(x => ({
        w: toKgFrom(x.lb, unit), r: x.r, rpe: x.rpe, done: true, warm: false,
      })),
    }));
    /* Two raw names can map onto one Ironlog name, and an exercise done in two
       blocks arrives twice — fold both into one entry, keeping set order. */
    const merged = [];
    built.forEach(e => {
      const prev = merged.find(m => m.name === e.name);
      if (prev) { prev.sets.push(...e.sets); if (!prev.notes) prev.notes = e.notes; }
      else merged.push(e);
    });

    const before = S.workouts.length;
    S.workouts = S.workouts.filter(w =>
      !(w.status === 'completed' && w.date === s.date && w.source === 'backfill'));
    replaced += before - S.workouts.length;

    S.workouts.push({
      id: uid(), date: s.date, name: 'Liftoff import', status: 'completed',
      source: 'imported', srcId,
      exercises: merged,
      start: null, end: parseISO(s.date).getTime(),
      summary: {
        mins: s.mins, prs: [],
        volume: merged.reduce((t, e) => t + e.sets.reduce((x, v) => x + v.w * v.r, 0), 0),
      },
    });
    added++;
  });

  // remember names so a second import of the same file doesn't ask again
  Object.entries(mapping).forEach(([raw, name]) => {
    if (name && name !== raw) S.exAliases[raw] = name;
    if (name && !allExercises().includes(name) && !S.customEx.includes(name)) S.customEx.push(name);
  });
  S.workouts.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  save(); bust();
  return { added, replaced, skipped };
}

/* ---------------- CSV import UI ----------------
   Two steps, because an import that guesses silently is worse than one that
   asks. Preview confirms what was read (and the unit, which is inferred);
   review confirms every exercise name that didn't match exactly. Doing nothing
   on the review screen is the safe outcome — unmatched names come in under
   their own name rather than being folded into an existing lift. */

function openLiftoffImport(text) {
  let p;
  try { p = parseLiftoff(text); }
  catch (e) { return toast('That does not look like a Liftoff CSV export'); }
  if (!p.sessions.length) return toast('No sessions found in that file');

  let unit = p.unit;
  const col = importCollisions(p.sessions);
  const span = p.sessions.length === 1
    ? p.sessions[0].date
    : `${p.sessions[0].date} → ${p.sessions[p.sessions.length - 1].date}`;

  const notes = [];
  if (col.replace.length) notes.push(`${col.replace.length} date${col.replace.length === 1 ? '' : 's'} already hold a backfilled session — the imported data replaces it`);
  if (col.alongside.length) notes.push(`${col.alongside.length} date${col.alongside.length === 1 ? '' : 's'} already hold a logged session — the import lands alongside it`);
  if (col.already.length) notes.push(`${col.already.length} session${col.already.length === 1 ? '' : 's'} already imported from this file — skipped`);
  if (p.skipped) notes.push(`${p.skipped} empty row${p.skipped === 1 ? '' : 's'} ignored`);

  modal({
    title: 'Import Liftoff CSV',
    body: `
      <div class="sub" style="margin-bottom:10px">
        <b>${p.sessions.length}</b> session${p.sessions.length === 1 ? '' : 's'} ·
        <b>${p.sets}</b> sets · ${esc(span)}
      </div>
      <div class="field"><label>Weights in this file are</label>
        <div class="seg" id="liUnit">
          <button data-lu="lb" class="${unit === 'lb' ? 'on' : ''}">Pounds</button>
          <button data-lu="kg" class="${unit === 'kg' ? 'on' : ''}">Kilograms</button>
        </div>
        <div class="sub" id="liUnitEg" style="margin-top:4px"></div>
      </div>
      ${notes.length ? `<div class="hr"></div><div class="sub">${notes.map(n => `• ${esc(n)}`).join('<br>')}</div>` : ''}
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="liNext">Next</button>`,
    onOpen: bg => {
      const eg = $('#liUnitEg', bg);
      const sample = p.sessions[0].exercises[0].sets[0].lb;
      const showEg = () => { eg.textContent = `e.g. ${nice(sample)} reads as ${nice(toKgFrom(sample, unit))} kg`; };
      showEg();
      bg.querySelectorAll('#liUnit button').forEach(b => b.onclick = () => {
        unit = b.dataset.lu;
        bg.querySelectorAll('#liUnit button').forEach(x => x.classList.toggle('on', x === b));
        showEg();
      });
      $('#liNext', bg).onclick = () => { closeModal(); reviewLiftoffNames(p, unit); };
    },
  });
}

function reviewLiftoffNames(p, unit) {
  // resolve what we can; everything else is the user's call
  const mapping = {}, review = [];
  p.names.forEach(n => {
    const m = matchExercise(n);
    if (m.name) mapping[n] = m.name;
    else { mapping[n] = n; review.push({ raw: n, suggest: m.suggest }); }
  });

  const auto = p.names.length - review.length;
  if (!review.length) return confirmLiftoffImport(p, mapping, unit, auto, 0);

  const row = (r, i) => `
    <div class="pickitem" style="display:block;padding:10px 16px">
      <div class="n">${esc(r.raw)}</div>
      <div class="seg" data-li="${i}" data-chosen="" style="margin-top:6px;flex-wrap:wrap">
        <button data-lv="new" class="on">Keep as new</button>
        ${r.suggest ? `<button data-lv="sug">${esc(r.suggest)}</button>` : ''}
        <button data-lv="pick">Choose…</button>
      </div>
    </div>`;

  modal({
    wide: true,
    title: 'Match exercises',
    body: `
      <div class="sub" style="margin-bottom:10px">
        ${auto} name${auto === 1 ? '' : 's'} matched your log exactly.
        ${review.length} didn't — each comes in as a new exercise unless you merge it.
        Suggestions are only suggestions: merging the wrong one moves real sets onto
        the wrong lift's PR.
      </div>
      <div class="picklist">${review.map(row).join('')}</div>
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="liGo">Import</button>`,
    onOpen: bg => {
      const select = (seg, b, chosen) => {
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        seg.dataset.chosen = chosen || '';
      };
      bg.querySelectorAll('[data-li]').forEach(seg => {
        const r = review[+seg.dataset.li];
        seg.querySelectorAll('button').forEach(b => b.onclick = () => {
          if (b.dataset.lv === 'pick') {
            // the normal picker, so any of the 736 movements or your own log is reachable
            pickExercise(name => {
              b.textContent = name;
              select(seg, b, name);
            });
            return;
          }
          select(seg, b, b.dataset.lv === 'sug' ? r.suggest : '');
        });
      });
      $('#liGo', bg).onclick = () => {
        let merged = 0;
        bg.querySelectorAll('[data-li]').forEach(seg => {
          const r = review[+seg.dataset.li];
          const chosen = seg.dataset.chosen;
          if (chosen && chosen !== r.raw) { mapping[r.raw] = chosen; merged++; }
        });
        closeModal();
        confirmLiftoffImport(p, mapping, unit, auto, merged);
      };
    },
  });
}

function confirmLiftoffImport(p, mapping, unit, auto, merged) {
  const col = importCollisions(p.sessions);
  const warn = col.replace.length
    ? ` ${col.replace.length} backfilled session${col.replace.length === 1 ? '' : 's'} will be replaced.`
    : '';
  confirmDlg(
    `Import ${p.sessions.length} session${p.sessions.length === 1 ? '' : 's'} as real training history.` +
    ` They count toward your PRs.${warn}`,
    () => {
      const r = importLiftoff(p.sessions, mapping, unit);
      closeAllModals(); render();
      const bits = [`${r.added} session${r.added === 1 ? '' : 's'} imported`];
      if (r.replaced) bits.push(`${r.replaced} backfill replaced`);
      if (r.skipped) bits.push(`${r.skipped} already there`);
      if (merged) bits.push(`${merged} name${merged === 1 ? '' : 's'} merged`);
      toast(bits.join(' · '), 'green');
    },
    'Import');
}

}


/* ============================================================
   FOOD  —  nutrition log
   Parsing runs through a serverless function so the API key
   never reaches the phone. No network = manual entry, which is
   the only mode that has to work in a basement gym.
   ============================================================ */
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
let foodDate = null;                 // null = today
const fDate = () => foodDate || today();

function foodsOn(date) { return S.foods.filter(f => f.date === date); }

function macroTotals(list) {
  return list.reduce((t, f) => ({
    kcal: t.kcal + (+f.kcal || 0), p: t.p + (+f.p || 0),
    c: t.c + (+f.c || 0), f: t.f + (+f.f || 0), fib: t.fib + (+f.fib || 0),
  }), { kcal: 0, p: 0, c: 0, f: 0, fib: 0 });
}

/* Keep the check-in in step: the daily kcal box on Home is the same
   number, so logging food fills it in rather than asking twice. */
function syncCheckinKcal(date) {
  const t = macroTotals(foodsOn(date));
  let ci = S.checkins.find(c => c.date === date);
  if (!ci) {
    if (!t.kcal) return;
    ci = { date, weight: null, sleepH: null, sleepQ: null, energy: null,
           soreness: null, stress: null, kcal: null, notes: '' };
    S.checkins.push(ci);
  }
  ci.kcal = t.kcal ? Math.round(t.kcal) : null;
}

function macroBar(label, val, target, unit) {
  const pct = target ? clamp(Math.round(val / target * 100), 0, 100) : 0;
  const over = target && val > target * 1.05;
  return `<div style="margin-bottom:9px">
    <div class="row between" style="font-size:12px;margin-bottom:3px">
      <span class="muted">${label}</span>
      <span class="mono">${Math.round(val)}${target ? ` / ${target}` : ''}${unit}</span>
    </div>
    <div style="height:6px;border-radius:99px;background:var(--line);overflow:hidden">
      <div style="height:100%;width:${target ? pct : 0}%;border-radius:99px;
        background:${over ? 'var(--gold)' : 'var(--accent)'}"></div>
    </div></div>`;
}

function viewFood() {
  const d = fDate();
  const list = foodsOn(d);
  const t = macroTotals(list);
  const st = S.settings;
  const isToday = d === today();

  // training that day, so food and work sit on one screen
  const wo = S.workouts.filter(w => w.date === d && w.status === 'completed');
  const trained = wo.length
    ? `${wo.length} session${wo.length === 1 ? '' : 's'} · ${wt(wo.reduce((a, w) => a + totalVolume(w), 0), 0)} volume`
    : 'No training logged';

  const byMeal = MEALS.map(m => {
    const items = list.filter(f => (f.meal || 'Snacks') === m);
    if (!items.length) return '';
    const mt = macroTotals(items);
    return `<div class="hr"></div>
      <div class="row between" style="margin-bottom:6px">
        <span style="font-weight:700">${m}</span>
        <span class="muted mono" style="font-size:12px">${Math.round(mt.kcal)} kcal</span>
      </div>
      ${items.map(f => `<div class="exline">
        <span class="grow" data-edit-food="${f.id}" style="cursor:pointer">${esc(f.name)}${f.serving ? ` <span class="muted">· ${esc(f.serving)}</span>` : ''}
          ${f.src === 'ai' ? '<span class="chip">EST</span>' : ''}${f.src === 'offline' || f.src === 'table' ? '<span class="chip">TABLE</span>' : ''}</span>
        <span class="muted mono" style="white-space:nowrap">${Math.round(f.kcal)} · ${Math.round(f.p)}p</span>
        <button class="btn ghost xs" data-del-food="${f.id}">×</button>
      </div>`).join('')}`;
  }).join('');

  return `
  <div class="card">
    <div class="row between">
      <div>
        <div style="font-weight:700">${isToday ? 'Today' : fmtDate(d)}</div>
        <div class="sub">${trained}</div>
      </div>
      <div class="row" style="gap:4px">
        <button class="btn ghost sm" data-food-day="-1">‹</button>
        ${isToday ? '' : '<button class="btn ghost sm" data-food-day="0">Today</button>'}
        <button class="btn ghost sm" data-food-day="1" ${isToday ? 'disabled' : ''}>›</button>
      </div>
    </div>
    <div class="hr"></div>
    ${macroBar('Calories', t.kcal, st.kcalTarget, ' kcal')}
    ${macroBar('Protein', t.p, st.proteinTarget, ' g')}
    ${macroBar('Carbs', t.c, st.carbTarget, ' g')}
    ${macroBar('Fat', t.f, st.fatTarget, ' g')}
    ${t.fib ? `<div class="sub" style="margin-top:2px">Fibre ${Math.round(t.fib)} g</div>` : ''}
    ${st.kcalTarget ? '' : '<div class="sub" style="margin-top:6px">No targets set — <b data-food-targets style="color:var(--accent)">add them</b> to see progress bars.</div>'}
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Add food</div>
    <textarea id="foodInput" rows="2" placeholder="200g chicken breast, 150g rice, an apple"
      style="width:100%;resize:vertical"></textarea>
    <div class="row" style="gap:8px;margin-top:8px">
      <button class="btn grow" id="foodMic" title="Dictate">🎤 Speak</button>
      <button class="btn primary grow" id="foodParse">Parse</button>
      <button class="btn grow" id="foodManual">Enter manually</button>
    </div>
    <div class="sub" style="margin-top:6px">Parsing estimates macros and picks the meal. Everything is editable after.</div>
    <div id="foodStatus"></div>
  </div>

  <div class="card">
    <div class="row between">
      <div style="font-weight:700">Log</div>
      <span class="muted mono" style="font-size:12px">${list.length} item${list.length === 1 ? '' : 's'}</span>
    </div>
    ${list.length ? byMeal : '<div class="sub" style="margin-top:6px">Nothing logged yet.</div>'}
  </div>

  ${foodHistoryCard()}`;
}

function foodHistoryCard() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dt = parseISO(fDate()); dt.setDate(dt.getDate() - i);
    const dd = iso(dt);
    days.push({ d: dd, t: macroTotals(foodsOn(dd)) });
  }
  const logged = days.filter(x => x.t.kcal > 0);
  if (!logged.length) return '';
  const avgK = Math.round(logged.reduce((a, x) => a + x.t.kcal, 0) / logged.length);
  const avgP = Math.round(logged.reduce((a, x) => a + x.t.p, 0) / logged.length);
  const max = Math.max(...days.map(x => x.t.kcal), 1);
  return `<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <div style="font-weight:700">Last 7 days</div>
      <span class="muted mono" style="font-size:12px">${avgK} kcal · ${avgP}g protein avg</span>
    </div>
    <div class="row" style="align-items:flex-end;gap:5px;height:64px">
      ${days.map(x => `<div class="grow" style="text-align:center">
        <div style="height:${Math.round(x.t.kcal / max * 52)}px;border-radius:3px;
