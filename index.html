  'flat bench': 'Bench Press', 'comp bench': 'Bench Press',
  squat: 'Back Squat', squats: 'Back Squat', squatting: 'Back Squat',
  'back squat': 'Back Squat', 'high bar': 'High Bar Squat', 'low bar': 'Low Bar Squat',
  deadlift: 'Deadlift', deadlifts: 'Deadlift', deads: 'Deadlift', dead: 'Deadlift',
  ohp: 'Overhead Press', 'overhead press': 'Overhead Press', 'shoulder press': 'Overhead Press',
  press: 'Overhead Press', 'military press': 'Overhead Press',
  rdl: 'Romanian Deadlift', rdls: 'Romanian Deadlift',
  sldl: 'Stiff Leg Deadlift',
  'close grip': 'Close Grip Bench', cgbp: 'Close Grip Bench',
  incline: 'Incline Bench', 'incline bench': 'Incline Bench',
  row: 'Barbell Row', rows: 'Barbell Row', 'barbell row': 'Barbell Row',
  pendlay: 'Pendlay Row', 'pull up': 'Pull Up', 'pull ups': 'Pull Up', pullups: 'Pull Up',
  'chin up': 'Chin Up', 'chin ups': 'Chin Up', chins: 'Chin Up',
  pulldown: 'Lat Pulldown', 'lat pulldown': 'Lat Pulldown',
  curl: 'Barbell Curl', curls: 'Barbell Curl',
  pushdown: 'Tricep Pushdown', pushdowns: 'Tricep Pushdown',
  'leg press': 'Leg Press', 'hip thrust': 'Hip Thrust', 'front squat': 'Front Squat',
  'pause squat': 'Pause Squat', 'pause bench': 'Pause Bench', 'box squat': 'Box Squat',
  'good morning': 'Good Morning', 'face pull': 'Face Pull', dips: 'Dips',
};

/* Resolve a spoken exercise name. Unlike the CSV importer this may fall back to
   a fuzzy match, because nothing commits until the confirmation card is
   accepted — the user sees the name before it lands. Anything below an exact
   match is reported so the card can say how sure it is. */
function voiceMatchExercise(spoken, active) {
  const k = normEx(spoken);
  if (!k) return null;

  // 1. an exercise already open in this session
  if (active && active.exercises.length) {
    const inSession = active.exercises.map(e => e.name);
    const exact = inSession.find(n => normEx(n) === k);
    if (exact) return { name: exact, how: 'session', sure: true };
    const part = inSession.find(n => { const nk = normEx(n); return nk.includes(k) || k.includes(nk); });
    if (part) return { name: part, how: 'session', sure: true };
  }
  // 2. gym shorthand
  if (VOICE_ALIASES[k]) {
    const target = VOICE_ALIASES[k];
    const real = allExercises().find(x => normEx(x.name) === normEx(target));
    if (real) return { name: real.name, leaf: real.leaf, how: 'alias', sure: true };
    const rt = resolveName(target);
    if (rt) return { name: displayName(rt.leaf), leaf: rt.leaf, how: 'alias', sure: true };
    return { name: target, leaf: null, how: 'alias', sure: false };
  }
  // 3. exact, in the log or the database
  const own = allExercises().find(x => normEx(x.name) === k);
  if (own) return { name: own.name, leaf: own.leaf, how: 'exact', sure: true };

  // 4. best effort, flagged as unsure
  const w = k.split(' ');
  let best = null, bs = 0;
  const consider = n => {
    const pw = normEx(n).split(' ');
    const hit = w.filter(x => pw.includes(x)).length;
    const sc = hit / Math.max(w.length, pw.length);
    if (sc > bs) { bs = sc; best = n; }
  };
  allExercises().forEach(x => consider(x.name));
  if (!best || bs < 0.5) return null;
  const bl = allExercises().find(x => x.name === best);
  return { name: best, leaf: bl ? bl.leaf : null, how: 'fuzzy', sure: false };
}

const REP_WORDS = ['by', 'x', 'times', 'for'];
const RPE_WORDS = ['at', 'rpe', '@'];

/* The grammar, in one pass:
     [exercise] <weight> [kg|lb] (by|x|for) <reps> [at <n> (rpe|rir)]
   Every part except the numbers is optional — mid-session "two twenty by five"
   means the exercise you're already on. */
function parseSetSpeech(text, active) {
  const raw = String(text || '').toLowerCase().trim();
  if (!raw) return null;
  const tokens = raw
    .replace(/[,!?]/g, ' ')
    .replace(/@/g, ' at ')
    .replace(/(\d)\s*(kg|kgs|kilos?|kilograms?)\b/g, '$1 kg')
    .replace(/(\d)\s*(lbs?|pounds?)\b/g, '$1 lb')
    .replace(/\bx(\d)/g, 'x $1')
    .split(/\s+/).filter(Boolean);

  const nums = scanNumbers(tokens);
  if (!nums.length) return null;

  const out = { exercise: null, exerciseHow: null, sure: true, kg: null, reps: null, rpe: null, rir: null, unit: null, said: raw };

  // RPE / RIR: the number introduced by "at", or followed by the word itself
  let rpeIdx = -1;
  nums.forEach((n, i) => {
    const isRir = n.after === 'rir' || tokens[n.end] === 'rir';
    const isRpe = n.after === 'rpe' || tokens[n.end] === 'rpe' || n.before === 'rpe';
    if (isRir) { out.rir = n.value; out.rpe = clamp(10 - n.value, 4, 10); rpeIdx = i; }
    else if (isRpe) { out.rpe = clamp(n.value, 4, 10); out.rir = 10 - out.rpe; rpeIdx = i; }
  });
  if (rpeIdx < 0) {
    // bare "at two" after reps, no unit word — read as RIR, which is what's
    // shown and typed everywhere else now
    const i = nums.findIndex(n => RPE_WORDS.includes(n.before) && n.value >= 0 && n.value <= 6);
    if (i > 0) { out.rir = nums[i].value; out.rpe = clamp(10 - out.rir, 4, 10); rpeIdx = i; }
  }

  const rest = nums.filter((_, i) => i !== rpeIdx);

  // reps: the number introduced by by/x/times/for; else the second number
  let repIdx = rest.findIndex(n => REP_WORDS.includes(n.before));
  if (repIdx < 0 && rest.length >= 2) repIdx = 1;
  if (repIdx >= 0) out.reps = Math.round(rest[repIdx].value);

  // weight: the first number that isn't the reps
  const wIdx = rest.findIndex((_, i) => i !== repIdx);
  if (wIdx >= 0) {
    const n = rest[wIdx];
    out.kg = n.value;
    const unitTok = tokens[n.end];
    if (unitTok === 'lb') out.unit = 'lb';
    else if (unitTok === 'kg') out.unit = 'kg';
    // words before the first number are the exercise
    const head = tokens.slice(0, n.at).filter(w => !['log', 'add', 'set', 'did', 'i', 'a', 'an', 'the', 'do', 'just'].includes(w)).join(' ');
    if (head) {
      const m = voiceMatchExercise(head, active);
      if (m) { out.exercise = m.name; out.exerciseHow = m.how; out.sure = m.sure; }
      else { out.exercise = null; out.exerciseHow = 'unknown'; out.sure = false; out.heard = head; }
    }
  }

  if (out.kg == null || out.reps == null) return null;
  if (out.unit === 'lb') out.kg = Math.round(out.kg / LB_PER_KG * 100) / 100;
  else if (out.unit == null && U() === 'lb') { out.unit = 'lb'; out.kg = Math.round(out.kg / LB_PER_KG * 100) / 100; }
  else out.unit = out.unit || 'kg';

  if (out.kg <= 0 || out.reps <= 0 || out.reps > 100) return null;
  return out;
}

/* Chrome 138+ can run recognition entirely on the device. Ask for it whenever
   it's there, so gym audio never leaves the phone; where it isn't, say so on
   the button rather than quietly streaming to a server. */
let _voiceMode = null;          // 'local' | 'cloud' | null until first use

function speechCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition; }

async function voiceLocalState() {
  const SR = speechCtor();
  if (!SR) return 'none';
  if (typeof SR.available !== 'function') return 'unknown';
  try { return await SR.available({ langs: ['en-GB'], processLocally: true }); }
  catch (e) { return 'unknown'; }
}

/* Offer to fetch the on-device model once, rather than nagging every session. */
async function voiceInstallLocal() {
  const SR = speechCtor();
  if (!SR || typeof SR.install !== 'function') return false;
  try { return await SR.install({ langs: ['en-GB'], processLocally: true }); }
  catch (e) { return false; }
}

let _setRec = null;

function dictateSet() {
  const SR = speechCtor();
  const btn = $('#voiceBtn');
  if (!SR) return toast('This browser has no speech recognition — type the set instead');
  if (_setRec) { _setRec.stop(); return; }
  if (!S.active) return toast('Start a workout first');

  const idle = () => { _setRec = null; if ($('#voiceBtn')) { $('#voiceBtn').textContent = '🎤 Log a set'; $('#voiceBtn').classList.remove('primary'); } };

  const run = (local) => {
    const rec = _setRec = new SR();
    rec.lang = 'en-GB';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 3;
    if (local && 'processLocally' in rec) { rec.processLocally = true; _voiceMode = 'local'; }
    else _voiceMode = 'cloud';

    let finalText = '', heard = false;
    rec.onresult = ev => {
      let t = '';
      for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      finalText = t.trim();
      heard = true;
      if (btn) btn.textContent = '● ' + (finalText.slice(0, 22) || 'Listening');
    };
    rec.onerror = ev => {
      // an on-device model that isn't there reports a service error: retry in the cloud once
      if (local && (ev.error === 'service-not-allowed' || ev.error === 'language-not-supported')) {
        rec.onend = null; _setRec = null;
        toast('On-device model unavailable — using cloud recognition');
        return run(false);
      }
      if (ev.error === 'not-allowed') toast('Microphone blocked — allow it in site settings');
      else if (ev.error !== 'aborted' && ev.error !== 'no-speech') toast('Could not hear that');
    };
    rec.onend = () => {
      idle();
      if (heard && finalText) resolveVoiceSet(finalText);
    };
    try { rec.start(); if (btn) { btn.textContent = '● Listening'; btn.classList.add('primary'); } }
    catch (e) { idle(); }
  };

  voiceLocalState().then(st => {
    if (st === 'available' || st === 'unknown') return run(true);
    if (st === 'downloadable' && !S.settings.voiceLocalDeclined) {
      return confirmDlg(
        'Download the on-device speech model? Recognition then runs entirely on the phone and works with no signal. It is a one-off download of a few tens of MB.',
        async () => {
          toast('Downloading the speech model…');
          const ok = await voiceInstallLocal();
          toast(ok ? 'On-device speech ready' : 'Download failed — using cloud recognition', ok ? 'green' : '');
          run(ok);
        },
        'Download',
        () => { S.settings.voiceLocalDeclined = true; save(); run(false); });
    }
    run(false);
  });
}

/* Local grammar first. Haiku is only reached when the grammar can't make a set
   out of the utterance at all — which is the point of having the grammar. */
async function resolveVoiceSet(text) {
  const local = parseSetSpeech(text, S.active);
  if (local) return confirmVoiceSet(local, 'local');

  if (!aiKey()) {
    return confirmVoiceSet(
      { exercise: null, exerciseHow: 'unknown', sure: false, kg: null, reps: null, rpe: null, rir: null, said: text },
      'failed');
  }
  toast('Asking Claude…');
  try {
    const r = await claudeParseSet(text);
    const p = {
      exercise: null, exerciseHow: null, sure: false, said: text,
      kg: r.kg != null ? +r.kg : null, reps: r.reps != null ? Math.round(r.reps) : null,
      rpe: r.rpe != null ? clamp(+r.rpe, 4, 10) : null,
    };
    p.rir = p.rpe != null ? 10 - p.rpe : null;
    if (r.exercise) {
      const m = voiceMatchExercise(r.exercise, S.active);
      if (m) { p.exercise = m.name; p.leaf = m.leaf; p.exerciseHow = m.how; p.sure = m.sure; }
      else { p.heard = r.exercise; p.exerciseHow = 'unknown'; }
    }
    confirmVoiceSet(p, 'ai');
  } catch (e) {
    confirmVoiceSet({ exercise: null, exerciseHow: 'unknown', sure: false, kg: null, reps: null, rpe: null, said: text }, 'failed');
  }
}

const SET_SYSTEM = `You turn a spoken gym sentence into one logged set.
Reply with JSON only: {"exercise":string|null,"kg":number|null,"reps":number|null,"rpe":number|null}
- Weight in kilograms. If the speaker clearly used pounds, convert (1 kg = 2.2046226218 lb).
- "at 2 RIR" means 2 reps in reserve, so rpe = 8. "at RPE 8" means rpe = 8.
- Lifting shorthand: "two twenty five" is 225, "one forty" is 140.
- exercise is the movement name only, no weight or reps. null if not stated.
- Use null for anything not stated. No prose, no code fences.`;

function claudeParseSet(text) { return claudeParse(text, SET_SYSTEM); }

/* Nothing is written until this card is accepted. It shows the transcript as
   well as the reading of it, because the two failure modes look very different:
   a misheard word is the recogniser, a wrong field is the grammar. */
function confirmVoiceSet(p, via) {
  const usable = p.kg > 0 && p.reps > 0;
  const dispW = p.kg ? nice(dw(p.kg)) : '';
  const viaChip = via === 'ai' ? '<span class="chip blue">CLAUDE</span>'
    : via === 'local' ? `<span class="chip">${_voiceMode === 'local' ? 'ON-DEVICE' : 'VOICE'}</span>` : '';

  modal({
    title: usable ? 'Log this set?' : "Didn't catch that",
    body: `
      <div class="sub" style="margin-bottom:10px">${viaChip} heard “${esc(p.said || '')}”</div>
      ${!usable ? `<div class="sub" style="color:var(--red);margin-bottom:10px">
        Couldn't read a weight and reps out of that. Try “bench two twenty five by eight at two RIR”,
        or fill it in below.</div>` : ''}
      <div class="field"><label>Exercise</label>
        <button class="btn wide" id="vsEx" style="justify-content:flex-start">${esc(p.exercise || (p.heard ? p.heard + ' — tap to choose' : 'Tap to choose'))}</button>
        ${p.exerciseHow === 'fuzzy' ? '<div class="sub" style="margin-top:4px;color:var(--gold)">Best guess — check it</div>' : ''}
        ${p.exerciseHow === 'unknown' ? '<div class="sub" style="margin-top:4px;color:var(--gold)">Not recognised — pick the exercise</div>' : ''}
      </div>
      <div class="row" style="gap:8px">
        <div class="grow"><label>Weight (${U()})</label>
          <input type="number" step="0.5" inputmode="decimal" id="vsW" value="${dispW}"></div>
        <div class="grow"><label>Reps</label>
          <input type="number" inputmode="numeric" id="vsR" value="${p.reps || ''}"></div>
        <div class="grow"><label>RIR</label>
          <input type="number" step="1" inputmode="numeric" id="vsRpe" value="${p.rpe == null ? '' : rpeToRir(p.rpe)}" placeholder="—"></div>
      </div>
      ${p.rir != null && p.rpe != null ? `<div class="sub" style="margin-top:6px">${p.rir} in reserve → RPE ${p.rpe}</div>` : ''}
    `,
    foot: `<button class="btn ghost" data-close>Cancel</button>
           <button class="btn primary" id="vsGo">Log set</button>`,
    onOpen: bg => {
      let leaf = p.leaf || null;
      $('#vsEx', bg).onclick = () => pickExercise(l => { leaf = l; $('#vsEx', bg).textContent = displayName(l); });
      $('#vsGo', bg).onclick = () => {
        const w = +$('#vsW', bg).value, r = +$('#vsR', bg).value;
        const rirRaw = $('#vsRpe', bg).value;
        if (!leaf) return toast('Pick the exercise first');
        if (!(r > 0)) return toast('Reps are needed');
        const kg = toKg(w), reps = Math.round(r), rpe = rirRaw === '' ? null : rirToRpe(+rirRaw);
        const commit = () => { closeModal(); applyVoiceSet(leaf, kg, reps, rpe); };
        const why = plausibility(leafKey(leaf), kg, reps, rpe);
        if (why.length) plausDlg(leafKey(leaf), { w: kg, r: reps, rpe }, why, commit); else commit();
      };
    },
  });
}

/* Appends to the exercise if it's already open in the session, otherwise adds
   it. Marked done on the way in — the set already happened. PR check mirrors
   the tick-box path so a voice PR announces itself the same way. */
function applyVoiceSet(leaf, kg, reps, rpe) {
  const a = S.active;
  if (!a) return toast('No active workout');
  if (!leaf) return toast('Pick the exercise first');
  const name = displayName(leaf);
  let ex = a.exercises.find(e => exKey(e) === leafKey(leaf));
  if (!ex) { ex = { leaf, legacyName: displayName(leaf), notes: '', mods: [], sets: [] }; a.exercises.push(ex); }

  const st = statsFor(leafKey(leaf));
  ex.sets.push({ w: kg, r: reps, rpe: rpe, done: true, setType: 'working' });
  save(); bust(); render();

  if (!st || beatsBest(st, kg, reps, rpe)) toast(st ? `★ PR — ${name} ${kg > 0 ? `${wt(kg)}×${reps}` : `${reps} reps`}` : `★ First ${name} logged`, 'gold');
  else toast(`${name} ${wt(kg)} × ${reps}${rpe ? ` @ ${rpe}` : ''}`, 'green');
}

/* ============================================================
   DATA IN AND OUT
   Named rather than inline in openSettings, because the 98 skin's File menu
   offers the same two things and there should be one implementation of each.
   ============================================================ */
function exportJSON() {
  S.settings.lastExportAt = Date.now();          // the backup nudge counts from here
  delete S.settings.backupSnoozeUntil;
  save();
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ironlog-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported', 'green');
  if (page === 'home') render();                  // the nudge goes away
}

function importJSONFile(f) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data.workouts) throw new Error('bad file');
      /* Older backups still carry the food log (food left in 0.25.0).
         Keep a food log already on this device; ignore the file's. */
      const keepFood = S.foods && S.foods.length ? { foods: S.foods, t: ['kcalTarget', 'proteinTarget', 'carbTarget', 'fatTarget', 'foodExportedAt'].map(k => [k, S.settings[k]]) } : null;
      // with none here, the file's is kept as it was — an export must come back whole (B7)
      if (keepFood) {
        delete data.foods;
        if (data.settings) ['kcalTarget', 'proteinTarget', 'carbTarget', 'fatTarget', 'foodExportedAt'].forEach(k => { delete data.settings[k]; });
      }
      S = Object.assign(structuredClone(DEFAULT_STATE), data);
      S.settings = Object.assign(structuredClone(DEFAULT_STATE.settings), data.settings || {});
      if (keepFood) { S.foods = keepFood.foods; keepFood.t.forEach(([k, v]) => { if (v != null) S.settings[k] = v; }); }
      save();
      /* the backup carries its own skin — follow it, or the page would be
         painted in one skin while the setting said the other */
      applySkin(S.settings.skin);
      closeAllModals(); render(); toast('Data imported', 'green');
    } catch (err) { toast('Could not read that file'); }
  };
  rd.readAsText(f);
}

/* ============================================================
   CSV EXPORT AND ROUND-TRIP IMPORT — roadmap B7
   One row per set, readable in a spreadsheet, and exact: importing it back
   gives the same sessions, key for key. Plain values sit in named columns;
   anything a column can't carry exactly (a summary, a cardio trace, a field
   added later) rides along in that level's *_extra JSON cell, on the first
   row of its session or exercise. A key that was null is listed in the
   extra's "$null"; an empty cell with no listing means the key wasn't there.
   Columns marked derived are for reading and are ignored on the way back in.
   ============================================================ */
const CSV_FORMAT = 'ironlog-csv-1';
const CSV_SESSION = [['session_id', 'id', 'str'], ['date', 'date', 'str'], ['session', 'name', 'str'], ['status', 'status', 'str'],
  ['source', 'source', 'str'], ['off_day', 'off', 'bool']];
const CSV_ENTRY = [['legacy_name', 'legacyName', 'str'], ['exercise_notes', 'notes', 'str'], ['isometric', 'iso', 'bool'],
  ['time_cap_s', 'cap', 'num'], ['stone_series', 'series', 'bool'], ['series_s', 'seriesSec', 'num']];
const CSV_LEAF = ['movement', 'equipment', 'execution', 'attachment'];
const CSV_SET = [['set_type', 'setType', 'str'], ['weight_kg', 'w', 'num'], ['reps', 'r', 'num'],
  ['rir', 'rpe', 'num', v => 10 - v, v => 10 - v], ['seconds', 'sec', 'num'], ['metres', 'm', 'num'],
  ['implements', 'n', 'num'], ['done', 'done', 'bool'], ['missed', 'miss', 'bool']];
const CSV_HEAD = ['format', ...CSV_SESSION.map(c => c[0]), 'session_extra',
  'exercise_no', 'exercise', ...CSV_LEAF, ...CSV_ENTRY.map(c => c[0]), 'modifiers', 'exercise_extra',
  'set_no', ...CSV_SET.map(c => c[0]), 'e1rm_kg', 'set_extra'];
const CSV_DERIVED = ['exercise', 'modifiers', 'set_no', 'e1rm_kg'];

/* Split an object into column cells and an extra for the rest. A value goes
   in its column only if reading the cell back gives exactly the same value. */
function csvSplit(obj, cols, skip = []) {
  const cells = {}, extra = {}, nulls = [];
  const typeOk = (v, ty) => ty === 'num' ? typeof v === 'number' && Number.isFinite(v) : ty === 'bool' ? typeof v === 'boolean' : typeof v === 'string';
  Object.keys(obj).forEach(k => {
    if (skip.includes(k)) return;
    const col = cols.find(c => c[1] === k), v = obj[k];
    if (v === undefined) return;
    if (col && v === null) { nulls.push(k); return; }
    if (col && typeOk(v, col[2])) {
      const [, , ty, enc = x => x, dec = x => x] = col;
      const cell = ty === 'bool' ? (v ? 'yes' : 'no') : String(enc(v));
      const back = ty === 'bool' ? cell === 'yes' : ty === 'num' ? dec(+cell) : cell;
      if (back === v && !(ty === 'str' && v === '')) { cells[col[0]] = cell; return; }
    }
    extra[k] = v;   // anything else, exactly
  });
  if (nulls.length) extra.$null = nulls;
  return { cells, extra: Object.keys(extra).length ? JSON.stringify(extra) : '' };
}
function csvJoin(cells, extraJson, cols) {
  const o = extraJson ? JSON.parse(extraJson) : {};
  const nulls = o.$null || []; delete o.$null;
  cols.forEach(([name, key, ty, , dec = x => x]) => {
    const c = cells[name];
    if (c === undefined || c === '') return;
    o[key] = ty === 'bool' ? c === 'yes' : ty === 'num' ? dec(+c) : c;
  });
  nulls.forEach(k => { o[k] = null; });
  return o;
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  const q = String.fromCharCode(34);   // a double quote (spelt out: the scope lint misreads one inside a regex)
  return s.includes(q) || /[,\r\n]/.test(s) || /^\s|\s$/.test(s) ? q + s.split(q).join(q + q) + q : s;
}

function workoutsToCSV(list) {
  const rows = [CSV_HEAD];
  list.forEach(wo => {
    const ses = csvSplit(wo, CSV_SESSION, ['exercises']);
    if (!('exercises' in wo)) {   // rare, but exact means exact
      const x = ses.extra ? JSON.parse(ses.extra) : {};
      x.$noExercises = true; ses.extra = JSON.stringify(x);
    }
    const exs = wo.exercises || [];
    const put = (first, ex, ei, exSplit, s, si, setSplit) => {
      const r = { format: CSV_FORMAT, ...ses.cells, session_extra: first ? ses.extra : '' };
      if (ex) {
        const leaf = ex.leaf && typeof ex.leaf === 'object' ? ex.leaf : null;
        Object.assign(r, exSplit.cells, {
          exercise_no: ei + 1, exercise: exFull(ex), modifiers: (ex.mods || []).map(modLabel).join('; '),
          exercise_extra: si <= 0 ? exSplit.extra : '',
        });
        if (leaf) CSV_LEAF.forEach(k => { r[k] = leaf[k] || ''; });
      }
      if (s) Object.assign(r, setSplit.cells, {
        set_no: setNumber(ex.sets, si), set_extra: setSplit.extra,
        e1rm_kg: isPRSet(s) && s.w > 0 && s.r > 0 && kindOf(ex) === 'reps' ? Math.round(e1rm(s.w, s.r, s.rpe) * 10) / 10 : '',
      });
      rows.push(CSV_HEAD.map(h => r[h] === undefined ? '' : r[h]));
    };
    if (!exs.length) return put(true);
    exs.forEach((ex, ei) => {
      // the leaf goes in its four columns when it is exactly those four strings
      const leafPlain = ex.leaf && typeof ex.leaf === 'object' && Object.keys(ex.leaf).every(k => CSV_LEAF.includes(k))
        && CSV_LEAF.every(k => typeof ex.leaf[k] === 'string' && ex.leaf[k] !== '');
      const exSplit = csvSplit(ex, CSV_ENTRY, ['sets', ...(leafPlain ? ['leaf'] : [])]);
      if (!leafPlain) {   // no leaf, or an odd one: keep it whole in the extra
        const x = exSplit.extra ? JSON.parse(exSplit.extra) : {};
        if ('leaf' in ex && !('leaf' in x) && !(x.$null || []).includes('leaf')) x.leaf = ex.leaf;
        exSplit.extra = Object.keys(x).length ? JSON.stringify(x) : '';
      }
      const sets = ex.sets || [];
      if (!sets.length) return put(ei === 0, ex, ei, exSplit, null, -1);
      sets.forEach((s, si) => put(ei === 0 && si === 0, { ...ex, leaf: leafPlain ? ex.leaf : null }, ei, exSplit, s, si, csvSplit(s, CSV_SET)));
    });
  });
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

/* The reverse. Rows are grouped by session id, then exercise number, in
   file order. Throws on a file that isn't Ironlog's own CSV. */
function csvToWorkouts(text) {
  const rows = parseCSV(text, true);
  if (!rows.length || rows[0].format !== CSV_FORMAT) throw new Error('not an Ironlog CSV');
  const byId = new Map();
  rows.forEach(r => {
    let wo = byId.get(r.session_id);
    if (!wo) { wo = { w: csvJoin(r, r.session_extra, CSV_SESSION), ex: new Map() }; byId.set(r.session_id, wo); }
    else if (r.session_extra) Object.assign(wo.w, csvJoin(r, r.session_extra, CSV_SESSION));
    if (r.exercise_no === '') return;
    let ex = wo.ex.get(r.exercise_no);
    if (!ex) {
      const e = csvJoin(r, r.exercise_extra, CSV_ENTRY);
      if (CSV_LEAF.every(k => r[k] !== '')) e.leaf = Object.fromEntries(CSV_LEAF.map(k => [k, r[k]]));
      ex = { e, sets: [] }; wo.ex.set(r.exercise_no, ex);
    }
    if (r.set_no !== '') ex.sets.push(csvJoin(r, r.set_extra, CSV_SET));
  });
  return [...byId.values()].map(({ w, ex }) => {
    if (w.$noExercises) delete w.$noExercises;
    else w.exercises = [...ex.values()].map(({ e, sets }) => ({ ...e, sets }));
    return w;
  });
}

function exportCSV() {
  const list = [...S.workouts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (!list.length) return toast('Nothing to export yet');
  const blob = new Blob([workoutsToCSV(list)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ironlog-sets-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  S.settings.lastExportAt = Date.now(); delete S.settings.backupSnoozeUntil; save();
  toast(`Exported ${list.length} session${list.length === 1 ? '' : 's'}`, 'green');
}
/* Sessions already on this device (same id) are left alone; the rest are added. */
function importIronlogCSV(text) {
  const list = csvToWorkouts(text);
  const have = new Set(S.workouts.map(w => w.id));
  const add = list.filter(w => !have.has(w.id));
  S.workouts.push(...add);
  save(); bust();
  return { added: add.length, skipped: list.length - add.length };
}

/* A hidden file input that isn't tied to the Settings modal, so the File menu
   can offer Import without opening Settings first. */
function pickImportFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json';
  inp.onchange = e => { const f = e.target.files[0]; if (f) importJSONFile(f); };
  inp.click();
}

/* ============================================================
   WINDOWS 98 SKIN

   The skin is paint: no view function knows it exists, and render() is not
   involved. What lives here is the chrome that has no counterpart in the
   default skin — a title bar, a menu bar and the LCD readout — which is
   mounted when the skin goes on and taken away again when it comes off.
   ============================================================ */
let skinTick = null;

function applySkin(skin) {
  const s = skin === 'win98' ? 'win98' : 'ironlog';
  document.documentElement.dataset.skin = s;
  try { localStorage.setItem('ironlog.skin', s); } catch (e) {}

  /* The manifest's theme_color is read at install time and cannot follow a
     runtime toggle, but this meta is what actually tints the Android status
     bar on an open page. */
  const tc = document.querySelector('meta[name=theme-color]');
  if (tc) tc.content = s === 'win98' ? '#000080' : '#0d0f14';

  if (s === 'win98') mountChrome(); else unmountChrome();
}

function mountChrome() {
  if (document.getElementById('w98-title')) { lcdTick(); return; }   // idempotent: boot calls applySkin twice

  const title = document.createElement('div');
  title.id = 'w98-title';
  title.innerHTML = `
    <span class="ic">▮</span>
    <span class="t">IRONLOG 98 — Strength Training Manager</span>
    <span class="wbtns">
      <button class="wbtn" id="w98Min" title="Collapse the window frame">_</button>
      <button class="wbtn" id="w98Max" title="Toggle full width">□</button>
      <button class="wbtn" id="w98Close" title="Close everything and go Home">✕</button>
    </span>`;

  const menu = document.createElement('div');
  menu.id = 'w98-menu';
  menu.innerHTML = W98_MENUS.map((m, i) => `
    <div class="m" data-mi="${i}">
      <button class="mlab"><u>${m.label[0]}</u>${esc(m.label.slice(1))}</button>
      <div class="mdrop">${m.items.map((it, j) =>
    it === '-' ? '<div class="sep"></div>' : `<button data-mi="${i}" data-ii="${j}">${esc(it[0])}</button>`).join('')}</div>
    </div>`).join('');

  const topbar = document.getElementById('topbar');
  document.body.insertBefore(title, topbar);
  document.body.insertBefore(menu, topbar);

  const lcd = document.createElement('div');
  lcd.id = 'w98-lcd';
  lcd.innerHTML = '<div class="clock" id="lcdClock"></div><div class="sets" id="lcdSets"></div>';
  topbar.insertBefore(lcd, topbar.querySelector('.tb-right'));

  wireChrome();
  lcdTick();
  if (!skinTick) skinTick = setInterval(lcdTick, 1000);
}

function unmountChrome() {
  if (skinTick) { clearInterval(skinTick); skinTick = null; }
  ['w98-title', 'w98-menu', 'w98-lcd'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
  delete document.documentElement.dataset.w98Min;
  delete document.documentElement.dataset.w98Max;
}

/* Every item points at something the app already does. The menu is a second
   door onto existing functions, not a second implementation of anything. */
const W98_MENUS = [
  { label: 'File', items: [
    ['New workout', () => { closeAllModals(); go('workout'); }],
    ['Export JSON…', () => exportJSON()],
    ['Import JSON…', () => pickImportFile()],
    '-',
    ['Clear data…', () => openClearData()],
  ] },
  { label: 'View', items: [
    ['Home', () => go('home')],
    ['Calendar', () => go('calendar')],
    ['Workout', () => go('workout')],
    ['Stats', () => go('analytics')],
    ['Events', () => go('meets')],
  ] },
  { label: 'Tools', items: [
    ['Settings…', () => openSettings()],
    ['Profile…', () => openProfile()],
    '-',
    ['Check for update', () => checkForUpdate(false)],
  ] },
  { label: 'Help', items: [
    ['Help & FAQ…', () => openHelp()],
    ["What's new…", () => openWhatsNew()],
    ['About Ironlog 98', () => aboutDlg()],
    '-',
    ['Back to the Ironlog skin', () => { S.settings.skin = 'ironlog'; save(); applySkin('ironlog'); }],
  ] },
];

function closeMenus() {
  document.querySelectorAll('#w98-menu .m.open').forEach(m => m.classList.remove('open'));
}

function wireChrome() {
  const root = document.documentElement;

  /* What these three can honestly do. A page cannot close a tab it did not
     open, and an installed PWA has no window to minimise, so rather than fake
     an OS they are wired to the nearest useful thing: get the frame out of the
     way, drop the reading-width cap, and clear the screen back to Home. */
  document.getElementById('w98Min').onclick = () => {
    if (root.dataset.w98Min) delete root.dataset.w98Min; else root.dataset.w98Min = '1';
  };
  document.getElementById('w98Max').onclick = () => {
    if (root.dataset.w98Max) delete root.dataset.w98Max; else root.dataset.w98Max = '1';
  };
  document.getElementById('w98Close').onclick = () => {
    closeAllModals(); closeMenus(); go('home'); toast('Nothing to close — this is the whole program');
  };

  document.querySelectorAll('#w98-menu .mlab').forEach(lab => lab.onclick = e => {
    e.stopPropagation();
    const m = lab.parentElement, was = m.classList.contains('open');
    closeMenus();
    if (!was) m.classList.add('open');
  });
  document.querySelectorAll('#w98-menu .mdrop button').forEach(b => b.onclick = e => {
    e.stopPropagation();
    closeMenus();
    W98_MENUS[+b.dataset.mi].items[+b.dataset.ii][1]();
  });
  document.addEventListener('click', closeMenus);
}

/* The readout. Same self-cancelling idiom as the workout timer: if the node has
   gone, so has the skin, and the interval goes with it. */
function lcdTick() {
  const c = document.getElementById('lcdClock');
  if (!c) { if (skinTick) { clearInterval(skinTick); skinTick = null; } return; }
  const d = new Date();
  const dow = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][d.getDay()];
  const p = n => String(n).padStart(2, '0');
  c.innerHTML = `<span class="dow">${dow}</span>${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

  const el = document.getElementById('lcdSets');
  if (!el) return;
  /* A readout is decoration. It runs once a second and it runs during boot, so
     it is never allowed to be the thing that takes the log down — if the totals
     cannot be computed, say so in the panel and let the rest of the app say why
     in the console. */
  let t = null;
  try { t = liveTotals(); } catch (err) { console.warn('lcd totals', err); el.className = 'sets'; el.textContent = '— — —'; return; }
  el.className = 'sets' + (t ? ' live' : '');
  el.textContent = t ? `${t.setsDone}/${t.setsTotal} SETS · ${wt(t.vol, 0)}` : 'NO SESSION';
}

function aboutDlg() {
  modal({
    title: 'About Ironlog 98',
    body: `<div style="text-align:center;padding:6px 0 4px">
        <div style="font-size:22px;font-weight:800;letter-spacing:.06em">IRONLOG<span style="color:#b00000"> 98</span></div>
        <div class="sub" style="margin-top:4px">Strength Training Manager</div>
        <div class="sub" style="margin-top:10px">Version ${esc(APP_VERSION)}</div>
      </div>
      <div class="hr"></div>
      <div class="sub">A skin, nothing more — every number, PR and session is the same
      underneath. Settings → Skin puts it back.</div>`,
    foot: `<button class="btn primary wide" data-close>OK</button>`,
  });
}

/* ============================================================
   BOOT
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.page));
$('#settingsBtn').onclick = openSettings;
$('#profileBtn').onclick = () => openProfile();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* Fields let go of focus when you're done with them (roadmap A5, Blast #49).
   On Android, dismissing the keyboard with Back or Done leaves the field
   focused, and tapping the background doesn't move focus either — so the
   next stray keystroke lands in the last weight or reps box. Two fixes:
   a tap on anything that isn't itself a form control blurs the field, and
   the keyboard closing (the visual viewport growing back) blurs it too. */
const isField = el => !!el && (el.matches('input:not([type=button]):not([type=submit]):not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select') || el.isContentEditable);
document.addEventListener('pointerdown', e => {
  const a = document.activeElement;
  if (!isField(a)) return;
  const t = e.target;
  if (t === a || isField(t) || (t.closest && t.closest('label'))) return;
  a.blur();
}, true);
if (window.visualViewport) {
  let vvh = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', () => {
    const h2 = window.visualViewport.height;
    // grew by a keyboard's worth: the keyboard went away
    if (h2 - vvh > 120 && isField(document.activeElement)) document.activeElement.blur();
    vvh = h2;
  });
}

/* First paint waits on the initial read. Without this the app would render an
   empty log for a frame and then flash the real one in over the top. */
async function boot() {
  /* The inline script in <head> has already put the skin on <html> from the
     localStorage mirror, so the veil can be painted in the right colours here
     and the stored setting only has to confirm it below. */
  const w98 = document.documentElement.dataset.skin === 'win98';
  const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;' +
    (w98 ? 'background:#000000;color:#00ff41;font:700 14px/1.4 "Cascadia Mono",Consolas,ui-monospace,monospace;letter-spacing:.08em'
         : 'background:#0d0f14;color:#8b93a7;font:500 15px/1.4 system-ui,-apple-system,sans-serif');
  veil.textContent = w98 ? 'LOADING YOUR LOG…' : 'Loading your log…';
  document.body.appendChild(veil);

  S = await load();

  /* The mirror got the page painted; the stored state is the truth. They only
     disagree after an import or a wipe, and this is where that is settled. */
  applySkin(S.settings.skin);

  /* Spec section 8: the dry run reports first, and migration never alters a
     stored number. A name the catalogue cannot resolve becomes its own custom
     movement rather than being guessed into an existing one — the report lists
     every one so they can be remapped by hand later. */
  if ((S.schemaVersion || 1) < 2) {
    const R = migrationDryRun(S);
    console.log(migrationDryRunText(R));
    const applied = migrateToV2(S);
    if (applied.orphans.length) console.warn('migration: unresolved names became custom movements:', applied.orphans);
    save(); await flush();
  }

  /* No auto-install. It used to drop a personal 77-week plan and two meets into
     any empty state — every new user, and this account after "Erase all data".
     Installing is now always an explicit choice in Settings. */

  if (S.active) page = 'workout';     // resume straight into a live session
  go(page);
  /* After first paint, never before it — an update prompt must not delay the
     app opening, and it must not decide for you. */
  setTimeout(() => checkForUpdate(true), 1200);
  /* What's new, after the update check so the two never open on top of each
     other. A fresh install is already marked as seen by load(). */
  if (!freshInstall) setTimeout(() => { whatsNewArmed = true; maybeWhatsNew(); }, 1800);
  if (welcomeDue()) setTimeout(() => { if (welcomeDue() && !document.querySelector('.modal')) openWelcome(); }, 400);
  veil.remove();
  requestPersistence().then(storageStatus);
}

boot();

/* ---------------- offline + updates ----------------
   The service worker caches the app so it opens with no signal at all. When a
   new version is deployed it installs in the background and swaps in on the
   next launch — never mid-session, which would lose the sets on screen. */
if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state !== 'installed' || !navigator.serviceWorker.controller) return;
          if (S && S.active) {
            toast('Update downloaded — it will apply next time you open the app');
            return;                                  // mid-workout: leave it waiting
          }
          toast('Update ready — restarting', 'green');
          setTimeout(() => reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' }), 1400);
        });
      });
      setInterval(() => reg.update(), 60 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
