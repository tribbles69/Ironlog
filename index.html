function liftName(k) {
  const i = ['squat', 'bench', 'deadlift'].indexOf(k);
  return (i >= 0 && S.settings.priority[i]) || k;
}

/* A tested single is better evidence than a number generated from a PDF months
   ago, so it wins — unless the meet is locked, in which case your hand-entered
   attempts stand. The planned figures are never overwritten, only outranked:
   unlock the meet and they come straight back.
   Third goes to whichever is higher. Testing above your goal third doesn't mean
   you should open at 90% of a target you've already beaten. */
function attemptsFor(m, lift) {
  const goal = (m.lifts && m.lifts[lift]) || 0;
  const a = (m.attempts && m.attempts[lift]) || null;
  const planned = a && (a.o || a.s)
    ? { o: a.o || 0, s: a.s || 0 }
    : goal
      ? (() => { const p = m.pct || { o: 90, s: 95 }; return { o: roundBar(goal * (p.o / 100)), s: roundBar(goal * (p.s / 100)) }; })()
      : { o: 0, s: 0 };

  const t = latestTest(liftName(lift));
  if (!t || m.attemptsLocked) {
    return { ...planned, third: goal, from: 'planned', tested: t || null, planned };
  }

  const third = Math.max(goal, t.kg);
  const o = roundBar(t.kg * (openerPct() / 100));
  // second sits proportionally between opener and third rather than at a fixed %
  const s = roundBar(o + (third - o) * 0.55);
  return { o, s, third, from: 'tested', tested: t, planned };
}
function pctOf(v, goal) { return v && goal ? Math.round((v / goal) * 100) + '%' : '—'; }

function shortLift(n) {
  const s = n.toLowerCase();
  if (s.includes('squat')) return 'Squat';
  if (s.includes('bench')) return 'Bench';
  if (s.includes('dead')) return 'Deadlift';
  return n;
}

function meetCard(m, ps) {
  const days = daysBetween(today(), m.date);
  const weeks = Math.floor(days / 7);
  const keys = ['squat', 'bench', 'deadlift'];
  const goalTotal = keys.reduce((a, k) => a + (m.lifts[k] || 0), 0);
  const curTotal = ps.total;
  const pct = goalTotal ? (curTotal / goalTotal) * 100 : 0;
  const projDots = dots(goalTotal, m.bwTarget || ps.bw, S.settings.sex);

  const rows = keys.map((k, i) => {
    const goal = m.lifts[k] || 0;
    const cur = ps.lifts[i] ? ps.lifts[i].kg : 0;
    const p = goal ? (cur / goal) * 100 : 0;
    const gap = goal - cur;
    const att = attemptsFor(m, k);
    const o = att.o, s2 = att.s, third = att.third || goal;
    return `<div style="margin-bottom:14px">
      <div class="row between" style="margin-bottom:5px">
        <div><b>${esc(shortLift(ps.lifts[i] ? ps.lifts[i].name : k))}</b>
          <span class="sub"> · now ${cur ? wt(cur) : '—'} → goal ${goal ? wt(goal) : '—'}</span></div>
        <div class="mono" style="font-weight:700;${p >= 100 ? 'color:var(--green)' : ''}">${Math.round(p)}%</div>
      </div>
      ${bar(p, ['', 'blue', 'gold'][i] || '')}
      <div class="sub" style="margin-top:4px">${gap > 0 ? `${wt(gap)} to go` : gap < 0 ? `${wt(-gap)} over goal` : 'on target'}${weeks > 0 && gap > 0 ? ` · ${wt(gap / Math.max(weeks, 1))}/week needed` : ''}</div>
      <div class="attempts">
        <div class="att o"><div class="k">Opener</div><div class="v">${o ? nice(dw(o, 1)) : '—'}</div><div class="p">${pctOf(o, third)}</div></div>
        <div class="att"><div class="k">Second</div><div class="v">${s2 ? nice(dw(s2, 1)) : '—'}</div><div class="p">${pctOf(s2, third)}</div></div>
        <div class="att t"><div class="k">Third</div><div class="v">${third ? nice(dw(third, 1)) : '—'}</div><div class="p">100%</div></div>
      </div>
      ${(() => {
          if (att.from === 'tested') {
            const pl = att.planned;
            const d = pl.o ? att.o - pl.o : 0;
            return `<div class="sub" style="margin-top:5px">
              From your ${wt(att.tested.kg)} test (${relDay(att.tested.date)}) at ${openerPct()}%${att.third > goal ? ` · third raised to your tested max` : ''}
              ${pl.o ? ` · plan said ${wt(pl.o)}<b style="color:${d > 0 ? 'var(--green)' : d < 0 ? 'var(--gold)' : 'var(--dim)'}">${d ? ` (${d > 0 ? '+' : ''}${wt(d)})` : ''}</b>` : ''}
            </div>`;
          }
          return `<div class="sub" style="margin-top:5px">Planned opener · no tested single for this lift yet</div>`;
        })()}
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="row between" style="margin-bottom:12px">
      <div class="grow">
        <div style="font-weight:750;font-size:16px">${esc(m.name)}</div>
        <div class="sub">${fmtDate(m.date, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' })}${m.loc ? ' · ' + esc(m.loc) : ''}${m.fed ? ' · ' + esc(m.fed) : ''}</div>
      </div>
      <button class="btn xs ghost" data-edit-meet="${m.id}">Edit</button>
    </div>

    <div class="row between" style="margin-bottom:12px">
      <div class="countdown"><span class="n">${days}</span><span class="sub">days out${weeks ? ` · ${weeks} week${weeks === 1 ? '' : 's'}` : ''}</span></div>
      ${m.wclass ? `<span class="chip">${esc(m.wclass)}${m.bwTarget ? ` · target ${wt(m.bwTarget)}` : ''}</span>` : ''}
    </div>

    <div class="stats grid3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Goal total</div><div class="v">${goalTotal ? w(goalTotal, 0) : '—'}</div>
        <div class="d">now ${wt(curTotal, 0)}</div></div>
      <div class="stat"><div class="k">To go</div><div class="v">${goalTotal ? w(Math.max(0, goalTotal - curTotal), 0) : '—'}</div>
        <div class="d">${weeks > 0 && goalTotal > curTotal ? `${wt((goalTotal - curTotal) / weeks, 1)}/wk` : 'on track'}</div></div>
      <div class="stat"><div class="k">Goal DOTS</div><div class="v" style="color:var(--purple)">${projDots ? Math.round(projDots) : '—'}</div>
        <div class="d">now ${ps.dots ? Math.round(ps.dots) : '—'}</div></div>
    </div>

    <div style="margin-bottom:12px">
      <div class="row between" style="margin-bottom:5px"><span class="eyebrow">Total progress</span>
        <span class="mono" style="font-weight:700">${Math.round(pct)}%</span></div>
      ${bar(pct)}
    </div>

    <div class="row between" style="margin:16px 0 9px">
      <span class="eyebrow">Attempt plan</span>
      <button class="btn xs ghost" data-lockmeet="${m.id}">${m.attemptsLocked ? '🔒 Pinned to plan' : '↻ Following tests'}</button>
    </div>
    ${rows}

    ${m.notes ? `<div class="sub" style="margin-top:4px">“${esc(m.notes)}”</div>` : ''}
    ${(() => {
      const field = fieldForMeet(m);
      if (!field) return '';
      const now = predictPlacing(field, curTotal);
      if (!now) return '';
      const goal = goalTotal ? predictPlacing(field, goalTotal) : null;

      // delta against the placing your previous test produced
      const dates = testLog().map(t => t.date);
      const prevTotal = dates[1] ? testedTotalAsOf(dates[1]) : null;
      const prev = prevTotal ? predictPlacing(field, prevTotal) : null;
      const moved = prev ? prev.place - now.place : 0;

      const myIdx = now.ladder.findIndex(r => r.me);
      const from = Math.max(3, myIdx - 3);
      const rows2 = [...now.ladder.slice(0, 3), ...(from > 3 ? [null] : []), ...now.ladder.slice(from, myIdx + 4)];

      return `
    <div class="hr"></div>
    <div class="row between" style="margin-bottom:10px">
      <div><div class="eyebrow">Predicted finish</div>
        <div class="mono" style="font-size:34px;font-weight:800;color:var(--gold);line-height:1.05;margin-top:1px">${ord(now.place)}</div>
        <div class="sub">of ${now.fieldSize} · ${wt(now.total)} on the platform</div></div>
      ${prev ? `<div class="right">
        <div class="eyebrow">Since last test</div>
        <div style="font-size:22px;font-weight:800;margin-top:3px;color:${moved > 0 ? 'var(--green)' : moved < 0 ? 'var(--red)' : 'var(--dim)'}">${moved > 0 ? `▲ ${moved}` : moved < 0 ? `▼ ${-moved}` : '—'}</div>
        <div class="sub">${moved === 0 ? 'same place' : `place${Math.abs(moved) === 1 ? '' : 's'} ${moved > 0 ? 'gained' : 'lost'}`}</div>
      </div>` : ''}
    </div>
    ${now.costNext !== null ? `
    <div style="border-left:3px solid var(--red);background:rgba(255,255,255,.03);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:10px">
      <div class="eyebrow">Cost of ${ord(now.place - 1)} place</div>
      <div class="row" style="gap:8px;align-items:baseline">
        <span style="font-size:25px;font-weight:800">+${wt(now.costNext)}</span>
        <span class="sub">to pass ${esc(now.nextName)}</span>
      </div>
    </div>` : ''}
    ${goal ? `<div class="sub" style="margin-bottom:10px">At your goal total of ${wt(goalTotal, 0)} — ${wt(goal.total)} platform — that's <b style="color:var(--gold)">${ord(goal.place)}</b>.</div>` : ''}
    <div class="card flush" style="background:transparent;margin-bottom:9px">
      ${rows2.map(r => r === null
          ? `<div style="padding:5px 13px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)">⋯</div>`
          : `<div class="row" style="gap:11px;padding:8px 13px;border-bottom:1px solid var(--line);border-left:3px solid ${r.me ? 'var(--gold)' : 'transparent'};${r.me ? 'background:rgba(255,197,66,.09)' : ''}">
          <div class="mono" style="width:26px;color:${r.me ? 'var(--gold)' : 'var(--dim)'}">${r.place}</div>
          <div class="grow" style="font-size:13.5px;${r.me ? 'font-weight:700' : ''};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
          <div class="mono" style="font-size:14px;${r.me ? 'color:var(--gold);font-weight:700' : ''}">${nice(dw(r.total, 1))}</div>
        </div>`).join('')}
    </div>
    <div class="sub">Modelled on the ${esc(field.label)} field — ${field.lifters.length} finishers, one year, so read it as a range rather than a promise. Around ${Math.round(field.bombRate * 100)}% of the class bombed out that year, which quietly works in your favour. Gym maxes are cut to ${platformPct()}% for a platform estimate (Settings). Results data from the OpenPowerlifting project.</div>`;
    })()}
  </div>`;
}

function openMeet(id) {
  const ps = priorityStats();
  const existing = S.meets.find(x => x.id === id);
  const m = existing || {
    id: uid(), name: '', date: '', fed: '', loc: '', wclass: '', bwTarget: 0, notes: '',
    lifts: {
      squat: roundBar(ps.lifts[0] ? ps.lifts[0].kg * 1.05 : 0),
      bench: roundBar(ps.lifts[1] ? ps.lifts[1].kg * 1.05 : 0),
      deadlift: roundBar(ps.lifts[2] ? ps.lifts[2].kg * 1.05 : 0),
    },
    pct: { o: 90, s: 95 },
  };
  const dflt = new Date(); dflt.setDate(dflt.getDate() + 84);

  modal({
    title: id ? 'Edit meet' : 'New meet',
    body: `

        <div class="field"><label>Weight class</label><input id="mWc" value="${esc(m.wclass)}" placeholder="e.g. 83kg"></div>
      </div>
      <div class="field"><label>Bodyweight target (${U()})</label>
        <input type="number" step="0.1" inputmode="decimal" id="mBw" value="${m.bwTarget ? dw(m.bwTarget) : ''}" placeholder="optional"></div>

      <div class="eyebrow" style="margin:16px 0 8px">Attempts (${U()})</div>
      ${['squat', 'bench', 'deadlift'].map((k, i) => {
      const a = attemptsFor(m, k);
      return `<div style="margin-bottom:10px">

          <div class="grid3">
            <input type="number" step="0.5" inputmode="decimal" data-att="${k}.o" placeholder="opener" value="${a.o ? dw(a.o) : ''}">
            <input type="number" step="0.5" inputmode="decimal" data-att="${k}.s" placeholder="second" value="${a.s ? dw(a.s) : ''}">
            <input type="number" step="0.5" inputmode="decimal" data-att="${k}.t" placeholder="third" value="${m.lifts[k] ? dw(m.lifts[k]) : ''}">
          </div></div>`;
    }).join('')}
      <div class="row" style="gap:8px;margin:-2px 0 14px">
        <button class="btn xs ghost" id="mAuto">Fill openers from thirds (90% / 95%)</button>
      </div>
      <div class="field"><label>Notes</label><textarea id="mNotes" rows="2" placeholder="Peaking plan, travel, cut…">${esc(m.notes || '')}</textarea></div>
    `,
    foot: `${id ? '<button class="btn danger" id="mDel">Delete</button>' : ''}<button class="btn primary" id="mSave">Save meet</button>`,
    onOpen: bg => {
      const del = $('#mDel', bg);
      if (del) del.onclick = () => confirmDlg('Delete this meet?', () => {
        S.meets = S.meets.filter(x => x.id !== id); save(); closeAllModals(); render();
      });
      const attVal = k => {
        const el = bg.querySelector(`[data-att="${k}"]`);
        return el && el.value !== '' ? toKg(+el.value) : 0;

/* ============================================================
   TRAINING PROGRAMS
   A program ships as window.IRONLOG_PROGRAM (see program.js) and installs
   its sessions as planned workouts. Ids are derived from the program id and
   date so re-installing can never duplicate, and removing is exact.
   ============================================================ */
function theProgram() { return window.IRONLOG_PROGRAM || null; }
function programInstalled(id) { return S.programs.includes(id); }
function progWorkoutId(P, i) { return `${P.id}#${i}`; }

function installProgram(P) {
  const existing = new Set(S.workouts.map(w => w.id));
  let added = 0;
  P.workouts.forEach((w, i) => {
    const id = progWorkoutId(P, i);
    if (existing.has(id)) return;              // already there (or already completed)
    S.workouts.push({
      id, date: w.date, name: w.name, status: 'planned', prog: P.id, block: w.block,
      exercises: w.exercises.map(e => ({
        name: e.name, notes: e.notes || '',
        sets: e.sets.map(s => ({ w: s.w, r: s.r, rpe: null, done: false, warm: false })),
      })),
    });
    added++;
  });

  (P.meets || []).forEach(m => {
    if (S.meets.some(x => x.name === m.name && x.date === m.date)) return;
    S.meets.push({ id: uid(), prog: P.id, ...m });
  });

  if (P.priority) S.settings.priority = [...P.priority];
  if (!S.programs.includes(P.id)) S.programs.push(P.id);
  save(); bust();
  return added;
}

function removeProgram(id) {
  // only planned sessions — anything already trained stays in your history
  const before = S.workouts.length;
  S.workouts = S.workouts.filter(w => !(w.prog === id && w.status === 'planned'));
  S.meets = S.meets.filter(m => m.prog !== id);
  S.programs = S.programs.filter(x => x !== id);
  save(); bust();
  return before - S.workouts.length;
}

function programStats(P) {
  const mine = S.workouts.filter(w => w.prog === P.id);
  return {
    planned: mine.filter(w => w.status === 'planned').length,
    done: mine.filter(w => w.status === 'completed').length,
    total: P.workouts.length,
    next: mine.filter(w => w.status === 'planned' && w.date >= today())
      .sort((a, b) => a.date < b.date ? -1 : 1)[0],
  };
}

/* ============================================================
   SETTINGS
   ============================================================ */
/* ---------------- backfill ----------------
   Flips planned sessions in a past window to completed at their prescribed
   loads. Those numbers are the plan's, not what actually came off the bar
   (and AMRAP sets are a guess by definition), so each session is flagged
   `backfilled`: the PR engine ignores flagged sets when deciding bests, the
   card shows a badge, and everything stays editable so real numbers from
   another app can replace them set by set. */
/* The window ends yesterday. Today's session is still ahead of you — sweeping it
   into a backfill would mark it done before you've trained it. */
function backfillWindow(days) {
  return {
    from: iso(new Date(Date.now() - days * 86400000)),
    to: iso(new Date(Date.now() - 86400000)),
  };
}

function backfillPlanned(days) {
  const { from, to } = backfillWindow(days);
  const hits = S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to);
  if (!hits.length) return 0;

  hits.forEach(w => {
    w.exercises.forEach(e => e.sets.forEach(s => { if (s.w > 0 && s.r > 0) s.done = true; }));
    w.exercises = w.exercises
      .map(e => ({ ...e, sets: e.sets.filter(s => s.done) }))
      .filter(e => e.sets.length);
    w.status = 'completed';
    w.backfilled = true;
    w.end = parseISO(w.date).getTime();
    w.summary = {
      mins: 0, prs: [],
      volume: w.exercises.reduce((t, e) =>
        t + e.sets.filter(s => !s.warm).reduce((x, s) => x + s.w * s.r, 0), 0),
    };
  });
  save(); bust();
  return hits.length;
}

function countPlanned(days) {
  const { from, to } = backfillWindow(days);
  return S.workouts.filter(w => w.status === 'planned' && w.date >= from && w.date <= to).length;
}

/* ============================================================
   FOOD  —  nutrition log
   Parsing runs through a serverless function so the API key
   never reaches the phone. No network = manual entry, which is
   the only mode that has to work in a basement gym.
   ============================================================ */
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
let foodDate = null;                 // null = today
const fDate = () => foodDate || today();

function foodsOn(date) { return S.foods.filter(f => f.date === date); }

function macroTotals(list) {
  return list.reduce((t, f) => ({
    kcal: t.kcal + (+f.kcal || 0), p: t.p + (+f.p || 0),
    c: t.c + (+f.c || 0), f: t.f + (+f.f || 0), fib: t.fib + (+f.fib || 0),
  }), { kcal: 0, p: 0, c: 0, f: 0, fib: 0 });
}

/* Keep the check-in in step: the daily kcal box on Home is the same
   number, so logging food fills it in rather than asking twice. */
function syncCheckinKcal(date) {
  const t = macroTotals(foodsOn(date));
  let ci = S.checkins.find(c => c.date === date);
  if (!ci) {
    if (!t.kcal) return;
    ci = { date, weight: null, sleepH: null, sleepQ: null, energy: null,
           soreness: null, stress: null, kcal: null, notes: '' };
    S.checkins.push(ci);
  }
  ci.kcal = t.kcal ? Math.round(t.kcal) : null;
}

function macroBar(label, val, target, unit) {
  const pct = target ? clamp(Math.round(val / target * 100), 0, 100) : 0;
  const over = target && val > target * 1.05;
  return `<div style="margin-bottom:9px">
    <div class="row between" style="font-size:12px;margin-bottom:3px">
      <span class="muted">${label}</span>
      <span class="mono">${Math.round(val)}${target ? ` / ${target}` : ''}${unit}</span>
    </div>
    <div style="height:6px;border-radius:99px;background:var(--line);overflow:hidden">
      <div style="height:100%;width:${target ? pct : 0}%;border-radius:99px;
        background:${over ? 'var(--gold)' : 'var(--accent)'}"></div>
    </div></div>`;
}

function viewFood() {
  const d = fDate();
  const list = foodsOn(d);
  const t = macroTotals(list);
  const st = S.settings;
  const isToday = d === today();

  // training that day, so food and work sit on one screen
  const wo = S.workouts.filter(w => w.date === d && w.status === 'completed');
  const trained = wo.length
    ? `${wo.length} session${wo.length === 1 ? '' : 's'} · ${wt(wo.reduce((a, w) => a + totalVolume(w), 0), 0)} volume`
    : 'No training logged';

  const byMeal = MEALS.map(m => {
    const items = list.filter(f => (f.meal || 'Snacks') === m);
    if (!items.length) return '';
    const mt = macroTotals(items);
    return `<div class="hr"></div>
      <div class="row between" style="margin-bottom:6px">
        <span style="font-weight:700">${m}</span>
        <span class="muted mono" style="font-size:12px">${Math.round(mt.kcal)} kcal</span>
      </div>
      ${items.map(f => `<div class="exline">
        <span class="grow">${esc(f.name)}${f.serving ? ` <span class="muted">· ${esc(f.serving)}</span>` : ''}
          ${f.src === 'ai' ? '<span class="chip">EST</span>' : ''}${f.src === 'offline' ? '<span class="chip">TABLE</span>' : ''}</span>
        <span class="muted mono" style="white-space:nowrap">${Math.round(f.kcal)} · ${Math.round(f.p)}p</span>
        <button class="btn ghost xs" data-del-food="${f.id}">×</button>
      </div>`).join('')}`;
  }).join('');

  return `
  <div class="card">
    <div class="row between">
      <div>
        <div style="font-weight:700">${isToday ? 'Today' : fmtDate(d)}</div>
        <div class="sub">${trained}</div>
      </div>
      <div class="row" style="gap:4px">
        <button class="btn ghost sm" data-food-day="-1">‹</button>
        ${isToday ? '' : '<button class="btn ghost sm" data-food-day="0">Today</button>'}
        <button class="btn ghost sm" data-food-day="1" ${isToday ? 'disabled' : ''}>›</button>
      </div>
    </div>
    <div class="hr"></div>
    ${macroBar('Calories', t.kcal, st.kcalTarget, ' kcal')}
    ${macroBar('Protein', t.p, st.proteinTarget, ' g')}
    ${macroBar('Carbs', t.c, st.carbTarget, ' g')}
    ${macroBar('Fat', t.f, st.fatTarget, ' g')}
    ${t.fib ? `<div class="sub" style="margin-top:2px">Fibre ${Math.round(t.fib)} g</div>` : ''}

  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Add food</div>
    <textarea id="foodInput" rows="2" placeholder="200g chicken breast, 150g rice, an apple"
      style="width:100%;resize:vertical"></textarea>
    <div class="row" style="gap:8px;margin-top:8px">

      <button class="btn grow" id="foodManual">Enter manually</button>
    </div>
    <div class="sub" style="margin-top:6px">Parsing estimates macros and picks the meal. Everything is editable after.</div>
    <div id="foodStatus"></div>
  </div>

  <div class="card">
    <div class="row between">
      <div style="font-weight:700">Log</div>
      <span class="muted mono" style="font-size:12px">${list.length} item${list.length === 1 ? '' : 's'}</span>
    </div>
    ${list.length ? byMeal : '<div class="sub" style="margin-top:6px">Nothing logged yet.</div>'}
  </div>

  ${foodHistoryCard()}`;
}

function foodHistoryCard() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const dd = iso(dt);
    days.push({ d: dd, t: macroTotals(foodsOn(dd)) });
  }
  const logged = days.filter(x => x.t.kcal > 0);
  if (!logged.length) return '';
  const avgK = Math.round(logged.reduce((a, x) => a + x.t.kcal, 0) / logged.length);
  const avgP = Math.round(logged.reduce((a, x) => a + x.t.p, 0) / logged.length);
  const max = Math.max(...days.map(x => x.t.kcal), 1);
  return `<div class="card">
    <div class="row between" style="margin-bottom:8px">
      <div style="font-weight:700">Last 7 days</div>
      <span class="muted mono" style="font-size:12px">${avgK} kcal · ${avgP}g protein avg</span>
    </div>
    <div class="row" style="align-items:flex-end;gap:5px;height:64px">
      ${days.map(x => `<div class="grow" style="text-align:center">
        <div style="height:${Math.round(x.t.kcal / max * 52)}px;border-radius:3px;
          background:${x.t.kcal ? 'var(--accent)' : 'var(--line)'};min-height:2px"></div>
        <div class="muted" style="font-size:9px;margin-top:3px">${fmtDate(x.d, { weekday: 'narrow' })}</div>
      </div>`).join('')}
    </div>
    <div class="sub" style="margin-top:6px">Averages skip days with nothing logged, so a missed day doesn't drag the number down.</div>
  </div>`;
}

const UNITS = { g: 1, gram: 1, grams: 1, gr: 1, kg: 1000, kilo: 1000, kilos: 1000,
                oz: 28.35, lb: 453.6, ml: 1, l: 1000, litre: 1000 };
const WORDNUM = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6,
                  half: 0.5, couple: 2, few: 3 };

function guessMeal() {
  const h = new Date().getHours();
  return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks';
}

/* Estimate one chunk of text, e.g. "300g chicken breast" or "two eggs". */
function estimateItem(chunk, defaultMeal) {
  const raw = chunk.trim().toLowerCase();
  if (!raw) return null;

  // longest keyword wins, so "chicken breast" beats "chicken"
  let hit = null, hitLen = 0;
  for (const row of LOCAL_FOODS) {
    for (const kw of row[1].split('|')) {
      if (raw.includes(kw) && kw.length > hitLen) { hit = row; hitLen = kw.length; }
    }
  }
  if (!hit) return null;

  const [name, , kcal, p, c, f, fib, each] = hit;

  // quantity: "300g", "1.5 kg", "2 eggs", "a banana"
  let grams = null;
  const m = raw.match(/(\d+(?:\.\d+)?)\s*(kgs?|kilos?|grams?|gr|g|oz|lbs?|lb|ml|l|litres?)\b/);
  if (m) {
    grams = parseFloat(m[1]) * (UNITS[m[2].replace(/s$/, '')] || UNITS[m[2]] || 1);
  } else {
    const cm = raw.match(/(\d+(?:\.\d+)?)\s/) ||
               raw.match(new RegExp('\\b(' + Object.keys(WORDNUM).join('|') + ')\\b'));
    const count = cm ? (parseFloat(cm[1]) || WORDNUM[cm[1]] || 1) : 1;
    grams = count * (each || 100);
  }

  const k = grams / 100;
  const r = n => Math.round(n * k * 10) / 10;
  return {
    name,
    serving: m ? `${Math.round(grams)} g` : (each ? `${Math.round(grams / each)} × ${name.toLowerCase()}` : `${Math.round(grams)} g`),
    meal: defaultMeal,
    kcal: Math.round(kcal * k), protein: r(p), carbs: r(c), fats: r(f), fiber: r(fib),
  };
}

/* Same contract as the serverless parser: text in, array out. */
function estimateOffline(text) {
  const meal = guessMeal();
  return text.split(/,|\band\b|\+|\n|;/g)
    .map(chunk => estimateItem(chunk, meal))
    .filter(Boolean);
}

/* ---------------- parsing ---------------- */
/* The parser can fail four ways and the fix differs each time, so say
   which one it was rather than making him read Netlify's logs. */
function parseError(e) {
  if (!navigator.onLine) return "You're offline, so parsing is unavailable.";
  if (e.empty) return "Nothing recognisable as food in that.";
  const b = e.body || '';
  if (e.status === 404) return 'The parser isn\'t deployed here — this looks like the static host, not the Netlify site.';
  if (b.includes('ANTHROPIC_API_KEY is not set')) return 'The site has no API key set. Add ANTHROPIC_API_KEY in Netlify, then redeploy.';
  if (b.includes('upstream 401') || b.includes('upstream 403')) return 'The API key was rejected — check it hasn\'t been revoked.';
  if (b.includes('upstream 400')) return 'The API rejected the request — usually no credit on the Anthropic account.';
  if (b.includes('upstream 429')) return 'Rate limited. Wait a moment and try again.';
  if (e.status >= 500) return 'The parser errored (' + (e.status || '?') + ').';
  return "The parser didn't answer.";
}

function addParsed(items, src) {
  const d = fDate();
  items.forEach(it => S.foods.push({
    id: uid(), date: d, meal: MEALS.includes(it.meal) ? it.meal : 'Snacks',
    name: it.name || 'Item', serving: it.serving || '',
    kcal: +it.kcal || 0, p: +it.protein || 0, c: +it.carbs || 0,
    f: +it.fats || 0, fib: +it.fiber || 0, src,
  }));
  syncCheckinKcal(d); save();
}

async function parseFood() {
  const box = $('#foodInput');
  const text = (box.value || '').trim();
  if (!text) { toast('Type what you ate first'); return; }
  const st = $('#foodStatus');
  const btn = $('#foodParse');
  btn.disabled = true;
  st.innerHTML = '<div class="sub" style="margin-top:8px">Parsing…</div>';

  try {
    const r = await fetch('/.netlify/functions/parse-food', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      const body = await r.text().catch(() => '');
      const err = new Error(body || ('HTTP ' + r.status));
      err.status = r.status; err.body = body;
      throw err;
    }
    const items = await r.json();
    if (!Array.isArray(items)) throw new Error('bad response');
    if (!items.length) { const e = new Error('empty'); e.empty = true; throw e; }

    addParsed(items, 'ai');
    box.value = '';
    toast(`Added ${items.length} item${items.length === 1 ? '' : 's'}`, 'good');
    render();
  } catch (e) {
    console.warn('parse failed', e);
    // The table is worse than the model but far better than nothing,
    // and it works with no key, no host and no signal.
    const guess = estimateOffline(text);
    if (guess.length && !e.empty) {
      addParsed(guess, 'offline');
      box.value = '';
      toast(`Added ${guess.length} item${guess.length === 1 ? '' : 's'} offline`, 'good');
      render();
      return;
    }
    btn.disabled = false;
    st.innerHTML = `<div class="sub" style="margin-top:8px;color:var(--red)">
      ${esc(parseError(e))} ${guess.length ? '' : "The offline table didn't recognise it either."}
      Log it by hand instead.</div>`;
  }
}

function shiftFoodDay(n) {
  if (n === 0) { foodDate = null; render(); return; }
  const dt = parseISO(fDate());
  dt.setDate(dt.getDate() + n);
  const next = iso(dt);
  if (next > today()) return;
  foodDate = next === today() ? null : next;
  render();
}

  }

  // timer ticking only while a workout is live and visible
  clearInterval(tick);
  if (page === 'workout' && S.active) {
    tick = setInterval(() => { const t = $('#timer'); if (t) t.textContent = elapsed(); else clearInterval(tick); }, 1000);
  }
}

function wireActive(v) {
  const a = S.active;
  const key = k => k.split('.').map(Number);

  $('#woName').onchange = e => { a.name = e.target.value.trim() || 'Workout'; save(); };

  // typing updates the model silently so focus is never stolen
  v.querySelectorAll('[data-f]').forEach(inp => {
    inp.oninput = () => {
      const [ei, si] = key(inp.dataset.k);
      const s = a.exercises[ei].sets[si];
      const val = inp.value === '' ? null : +inp.value;
      if (inp.dataset.f === 'w') s.w = val ? toKg(val) : 0;
      if (inp.dataset.f === 'r') s.r = val || 0;
      if (inp.dataset.f === 'rpe') s.rpe = val;
      save();
    };
    // move to the next field on Enter
    inp.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = [...v.querySelectorAll('[data-f]')];
        const nx = all[all.indexOf(inp) + 1];
        if (nx) nx.focus(); else inp.blur();
      }
    };
  });

  v.querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.done);
    const s = a.exercises[ei].sets[si];
    const ex = a.exercises[ei];
    if (!s.done) {
      if (!s.w || !s.r) return toast('Enter weight and reps first');
      // PR check against history captured before flipping the flag
      const st = statsFor(ex.name);
      const before = st ? st.best.e1 : 0;
      s.done = true;
      if (!s.warm && e1rm(s.w, s.r) > before) {
        toast(st ? `★ PR — ${ex.name} ${wt(s.w)}×${s.r}` : `★ First ${ex.name} logged`, 'gold');
      }
    } else s.done = false;
    save(); bust(); render();
  });

  v.querySelectorAll('[data-warm]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.warm);
    const s = a.exercises[ei].sets[si];
    s.warm = !s.warm;
    save(); bust(); render();
  });

  v.querySelectorAll('[data-addset]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.addset];
    const last = ex.sets[ex.sets.length - 1] || { w: 0, r: 0 };
    ex.sets.push({ w: last.w, r: last.r, rpe: null, done: false, warm: false });
    save(); render();
  });
  v.querySelectorAll('[data-rmset]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.rmset];
    if (ex.sets.length > 1) ex.sets.pop();
    save(); render();
  });

  v.querySelectorAll('[data-plates]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const [ei, si] = b.dataset.plates.split('.').map(Number);
    const st = a.exercises[ei].sets[si];
    if (st && st.w > 0) openPlates(st.w);
  });

  v.querySelectorAll('[data-ramp]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.ramp];
    // seed from the heaviest set planned today — usually the top set you're ramping to
    const top = ex.sets.filter(s => !s.warm && s.w > 0).reduce((m, s) => s.w > m ? s.w : m, 0);
    openRamp(ex.name, top || null);
  });

  v.querySelectorAll('[data-delset]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.delset);
    const ex = a.exercises[ei];
    if (ex.sets.length <= 1) return toast('Keep at least one set — remove the exercise instead');
    const st = ex.sets[si];
    const drop = () => { ex.sets.splice(si, 1); save(); bust(); render(); toast('Set deleted'); };
    // only stop to ask if there's something in there worth losing
    if (st.done || st.w > 0 || st.r > 0) confirmDlg(`Delete this set${st.w > 0 ? ` (${wt(st.w)} × ${st.r || 0})` : ''}?`, drop, 'Delete');
    else drop();
  });

  v.querySelectorAll('[data-ex-menu]').forEach(b => b.onclick = () => {
    const ei = +b.dataset.exMenu, ex = a.exercises[ei];
    modal({
      title: ex.name,
      body: `<div class="field"><label>Exercise notes</label>
          <textarea id="exNote" rows="3" placeholder="Cues, belt, tempo…">${esc(ex.notes || '')}</textarea></div>
        <button class="btn wide ghost" id="exUp" style="margin-bottom:8px">Move up</button>
        <button class="btn wide ghost" id="exDown">Move down</button>`,
      foot: `<button class="btn danger" id="exDel">Remove exercise</button><button class="btn primary" id="exOk">Save</button>`,
      onOpen: bg => {
        $('#exUp', bg).onclick = () => { if (ei > 0) { const [x] = a.exercises.splice(ei, 1); a.exercises.splice(ei - 1, 0, x); save(); closeModal(); render(); } };
        $('#exDown', bg).onclick = () => { if (ei < a.exercises.length - 1) { const [x] = a.exercises.splice(ei, 1); a.exercises.splice(ei + 1, 0, x); save(); closeModal(); render(); } };
        $('#exDel', bg).onclick = () => { a.exercises.splice(ei, 1); save(); closeModal(); render(); };
        $('#exOk', bg).onclick = () => { ex.notes = $('#exNote', bg).value.trim(); save(); closeModal(); render(); };
      },
    });
  });

  $('#addEx').onclick = () => pickExercise(name => {
    a.exercises.push({ name, notes: '', sets: [{ w: 0, r: 0, rpe: null, done: false, warm: false }] });
    save(); render();
    window.scrollTo(0, document.body.scrollHeight);
  });

  $('#finishBtn').onclick = finishWorkout;
  $('#discardBtn').onclick = () => confirmDlg('Discard this workout? Nothing will be saved.', () => {
    S.active = null; save(); render(); toast('Workout discarded');
  }, 'Discard');
}

/* ============================================================
   BOOT
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.page));
$('#settingsBtn').onclick = openSettings;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* First paint waits on the initial read. Without this the app would render an
   empty log for a frame and then flash the real one in over the top. */
async function boot() {
  const veil = document.createElement('div');
  veil.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;' +
    'background:#0d0f14;color:#8b93a7;font:500 15px/1.4 system-ui,-apple-system,sans-serif';
  veil.textContent = 'Loading your log…';
  document.body.appendChild(veil);

  S = await load();

  // a bundled program installs itself on a fresh app so the plan is just *there*
  const P = theProgram();
  if (P && !programInstalled(P.id)) {
    const fresh = !S.workouts.length && !S.checkins.length && !S.meets.length && !S.active;
    if (fresh) installProgram(P);     // existing data: leave it to Settings → Install
  }

  if (S.active) page = 'workout';     // resume straight into a live session
  go(page);
  veil.remove();
  requestPersistence();
}

boot();

/* ---------------- offline + updates ----------------
   The service worker caches the app so it opens with no signal at all. When a
   new version is deployed it installs in the background and swaps in on the
   next launch — never mid-session, which would lose the sets on screen. */
if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state !== 'installed' || !navigator.serviceWorker.controller) return;
          if (S && S.active) {
            toast('Update downloaded — it will apply next time you open the app');
            return;                                  // mid-workout: leave it waiting
          }
          toast('Update ready — restarting', 'green');
          setTimeout(() => reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' }), 1400);
        });
      });
      setInterval(() => reg.update(), 60 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
