      ${R.drift.length ? `<div class="eyebrow" style="margin-top:12px">Stored movement ≠ what the name resolves to now</div>
        ${R.drift.slice(0, 20).map(d => `<div class="exline"><span>${esc(d.name)} <span class="dimmer">${esc(d.date)}</span></span><span class="dimmer">${esc(d.now)} · now ${esc(d.resolves)}</span></div>`).join('')}` : ''}
      ${R.csv ? `<div class="eyebrow" style="margin-top:12px">Import CSV</div>
        ${R.csv.error ? `<div class="sub" style="color:var(--red)">${esc(R.csv.error)}</div>` : `
        <div class="sub">${R.csv.sessions} sessions · ${R.csv.sets} sets · ${R.csv.resolved.length} names resolve · <b style="color:${R.csv.unresolved.length ? 'var(--red)' : 'var(--green)'}">${R.csv.unresolved.length} don't</b></div>
        ${R.csv.unresolved.map(u => `<div class="exline"><span>${esc(u.raw)}</span><span class="dimmer">would become a custom movement</span></div>`).join('')}`}` : ''}
      <input type="file" id="ckCsv" accept=".csv,text/csv" style="display:none">`,
    foot: `<button class="btn sm ghost" id="ckCsvBtn">Check an import CSV</button><button class="btn sm ghost" id="ckCopy">Copy report</button><button class="btn primary" data-close>Close</button>`,
    onOpen: bg => {
      $('#ckCsvBtn', bg).onclick = () => $('#ckCsv', bg).click();
      $('#ckCsv', bg).onchange = ev => {

        rd.onerror = () => toast('Could not read that file');
        rd.readAsText(f);

        const t = exerciseCheckText(R);

      };

}

/* ============================================================
   AUTOREGULATION — roadmap item 4, r&d/specs/autoreg-spec.md
   The program says what to do; RIR decides the load. Each exercise has one
   working number, an e1RM derived from RIR-logged history, and the day's
   weights are read off it at the session's reps and target RIR. Derived at
   read time like PRs, so nothing to keep in sync.
   ============================================================ */
const AUTO = { window: 3, stallN: 5, stepCap: 0.075, defaultRir: 2 };
/* Blocks shaped on purpose keep the plan's weights. */
const FIXED_BLOCK = /deload|prep|peak|test|meet|taper|opener|recovery|light|wedding|holiday|last heavy|speed|technique|re-entry|transition/i;
function autoBlock(wo) {
  if (!wo) return false;
  // a meet run-in (C6) is the lifter's own intent and wins over a program's week name
  const a = wo.date ? activeBlock(wo.date) : null;
  if (a) return a.kind.auto && (!wo.prog || !!(wo.block && !FIXED_BLOCK.test(wo.block)));
  return !!(wo.prog && wo.block && !FIXED_BLOCK.test(wo.block));
}

/* Whole numbers only: "stop 1 shy", "RIR 2", "@2" in the program note, else 2. */
function targetRirFor(e, blockRir) {
  const n = String((e && e.notes) || '').toLowerCase();
  const m = n.match(/stop (\d) shy/) || n.match(/rir\s*(\d)/) || n.match(/@\s*(\d)\b/);

    if (!work.length) return;

    work.forEach(s => { s.planW = s.w; s.auto = true; });

/* ---------------- rest timer ----------------
   Starts itself when a set is ticked. Main lifts rest longer than accessories;
   an exercise can carry its own default (its ⋯ menu), and ±15 s during a
   session sticks for that exercise for the rest of the session.

   The state is an end timestamp on the live session, so it survives the phone
   locking, the app being backgrounded and even a reload: whatever the clock
   says on return is right. The loop only paints and fires the alerts — it is
   never the clock. */
const HEAVY_BARS = ['barbell', 'trap_bar', 'safety_squat_bar'];

  const m = movementById(e.leaf.movement);

    && ((m.primary || []).length >= 2 || ['legs', 'back', 'chest'].includes(m.category));
}

  const own = (S.settings.restBy || {})[exKey(e)];

let restIv = null;

  const a = S.active;
  const e = a && a.exercises[ei];
  if (!e || S.settings.restAuto === false) return;
  const len = restFor(e, s);
  a.rest = { endAt: Date.now() + len * 1000, len, ei, name: exFull(e) };
  Cue.unlock();               // the tick is the gesture; the end beep needs the context awake
  restLoop();
}

  const host = $('#restHost');
  if (host) host.innerHTML = '';
}

  clearInterval(restIv);
  restIv = setInterval(restTick, 250);

}

  const left = (r.endAt - Date.now()) / 1000;
  const warnAt = +S.settings.restWarn || 0;
  // a warning only makes sense on a rest meaningfully longer than it
  if (!r.warned && warnAt > 0 && r.len > warnAt + 5 && left <= warnAt && left > 0) {
    r.warned = true;

  }

    <div class="grow"><div class="eyebrow">Rest · ${esc(r.name)}</div><div class="rc" id="restClock"></div></div>
    <button class="btn xs ghost" data-rest="-15">−15</button>

      body: `Next set — ${r.name}`, tag: 'ironlog-rest', renotify: true, icon: 'icon-192.png',
      ...(S.settings.vibrate !== false ? { vibrate: [220, 120, 220] } : {}),
    })).catch(() => {});
  } catch (e) { /* notifications unavailable */ }

/* ============================================================
   CARDIO SESSION — HR-zone treadmill coaching
   Spec: r&d/specs/cardio-spec.md. The treadmill can't be driven, so the app
   reads heart rate and tells the lifter what speed to set; they confirm it,
   because the app only ever knows the speed they told it.

   entry holding one timed set, and a `cardio` object for the detail — so

   stepped up to it over warmMin minutes. */

  lo: null, hi: null, ceiling: null, interval: 30, voice: true };

  z3: { label: 'Zone 3 · aerobic', lo: 0.7, hi: 0.8 },
  z4: { label: 'Zone 4 · threshold', lo: 0.8, hi: 0.9 },

function estMaxHr() { const a = ageFrom(S.settings.dob); return a ? Math.round(208 - 0.7 * a) : null; }

  return { lo: f(z.lo), hi: f(z.hi) };

   cue with a param is also the change. */

  const r1 = x => Math.round(x * 10) / 10;
  const since = t => (t == null ? Infinity : st.el - t);
  // 1. the ceiling overrides everything: warm-up, settle, interval and the response wait
  if (st.hr5 != null && cfg.ceiling > 0 && st.hr5 > cfg.ceiling && since(st.lastCeil) >= CARDIO.ceilGap) {
    const target = r1(Math.max(CARDIO.speed[0], st.speed - 0.5));
    return { cue: { kind: 'ceiling', param: 'speed', target,
      text: target < st.speed ? `Heart rate high. Slow down to ${target.toFixed(1)}` : 'Heart rate high. Slow down or stop' } };
  }
  // 2. warm-up: step the speed up on schedule, and hand over early once HR reaches the zone
  const plan = warmPlan(cfg);
  if (plan && !st.warmDone) {
    if (cardioHasZone(cfg) && st.hr20 != null && st.hr20 >= cfg.lo) {
      return { warmDone: true, cue: { kind: 'info', text: 'Heart rate is in the zone. Warm-up done.' } };
    }
    const k = Math.min(plan.n, Math.floor(st.el / plan.every));
    if (k <= (st.warmStep || 0)) return null;
    const target = r1(Math.min(cfg.speed, cfg.warmSpeed + k * CARDIO.warmStep));
    const last = k >= plan.n;
    return { warmStep: k, warmDone: last, cue: { kind: 'warm', param: 'speed', target,
      text: `${last ? 'Warm-up done. ' : ''}Set speed to ${target.toFixed(1)}` } };

  if (since(st.lastChange) < CARDIO.respond) return null;          // 5. let HR answer the last change
  if (st.hr20 == null) return { cue: null };                       // 6. no fresh HR: silent
  // 7. aim for the middle of the zone, with a little slack either side of it
  const miss = st.hr20 - (cfg.lo + cfg.hi) / 2;
  if (Math.abs(miss) <= CARDIO.tol) return { cue: null };

  const step = param === 'speed'

    : clamp(Math.round(m * 0.2 * 2) / 2, 0.5, 2);

    const now = Date.now(), s = this.samples;
    if (!s.length || now - s[s.length - 1][0] > CARDIO.fresh * 1000) return null;
    const w = s.filter(x => x[0] >= now - sec * 1000);
    return w.length ? w.reduce((a, x) => a + x[1], 0) / w.length : null;
  },
  forget() {
    if (this.dev) {
      this.dev.removeEventListener('gattserverdisconnected', HR.lost);
      try { if (this.dev.gatt.connected) this.dev.gatt.disconnect(); } catch (e) { /* already gone */ }
    }
    this.dev = null; this.ch = null; this.state = 'none'; this.samples = []; this.tries = 0;
  },
};

/* ---- the live session ---- */
function cardioMoving(c, now) {
  return Math.max(0, (now - c.t0 - c.pausedMs - (c.pausedAt ? now - c.pausedAt : 0)) / 1000);
}
/* Advance distance and time-in-zone up to now. Called before any speed change
   so the old speed is charged for the time it was actually running. */
function cardioAccount(c) {
  const el = cardioMoving(c, Date.now());
  const dt = el - c.el;
  if (dt <= 0) return el;
  c.distKm += c.speed * dt / 3600;
  const hr20 = HR.avg(20);
  if (hr20 != null) {
    const d = Math.min(dt, 5);        // a long gap is not seconds of known HR
    c.hrSec += d;
    if (c.cfg.lo > 0 && hr20 >= c.cfg.lo && hr20 <= c.cfg.hi) c.inZoneSec += d;
  }
  c.el = el;
  return el;
}

function say(text) {
  const c = S.active && S.active.cardio;
  if (!(c && c.cfg.voice) || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();                // a cue never waits behind an old one
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    speechSynthesis.speak(u);
  } catch (e) { /* no voice: the beep and the banner still say it */ }
}
/* Say it, and take it as done: no confirm tap per cue. If it wasn't done,
   Undo on the last-cue line puts the number back. */
function cardioIssue(c, cue, el) {
  if (cue.kind === 'ceiling') { Cue.beep(1200, 110, 0); Cue.beep(1200, 110, 0.16); Cue.beep(1200, 110, 0.32); Cue.buzz([150, 80, 150, 80, 150]); }
  else if (cue.kind === 'up' || cue.kind === 'warm') { Cue.beep(700, 150, 0); Cue.beep(1000, 150, 0.2); Cue.buzz([120, 80, 120]); }
  else if (cue.kind === 'down') { Cue.beep(1000, 150, 0); Cue.beep(700, 150, 0.2); Cue.buzz([120, 80, 120]); }
  else { Cue.beep(1000, 200); Cue.buzz(120); }
  const last = { ...cue, at: Math.round(el) };
  if (cue.param) { last.from = c[cue.param]; cardioSet(cue.param, cue.target, true); }
  c.lastCue = last;
  setTimeout(() => say(cue.text), 450);
  save();
  paintCardio(true);
}
function cardioUndo() {
  const c = S.active && S.active.cardio, l = c && c.lastCue;
  if (!l || !l.param || l.undone) return;
  cardioSet(l.param, l.from, false);
  l.undone = true;
  paintCardio(true);
}

let cardioIv = null, cardioSavedAt = 0;
function cardioLoop() {
  clearInterval(cardioIv);
  cardioIv = setInterval(cardioTick, 1000);
  cardioTick();
}
function cardioTick() {
  const a = S.active, c = a && a.kind === 'cardio' && a.cardio;
  if (!c) { clearInterval(cardioIv); cardioIv = null; return; }
  const el = cardioAccount(c);
  const hr5 = HR.avg(5), hr20 = HR.avg(20);
  if (!c.pausedAt) {
    if (hr5 != null) {
      c.hrMax = Math.max(c.hrMax || 0, Math.round(hr5));
      if (el - c.lastSample >= CARDIO.sample) { c.hr.push([Math.round(el), Math.round(hr5)]); c.lastSample = el; }
    }
    const d = cardioDecide(c.cfg, { el, hr5, hr20, speed: c.speed, incline: c.incline,
      lastCheck: c.lastCheck, lastChange: c.lastChange, lastCeil: c.lastCeil,
      warmStep: c.warmStep, warmDone: c.warmDone });
    if (d) {
      if (d.cue && d.cue.kind === 'ceiling') c.lastCeil = el; else c.lastCheck = el;
      if (d.warmStep != null) c.warmStep = d.warmStep;
      if (d.warmDone) c.warmDone = true;
      if (d.cue) cardioIssue(c, d.cue, el);
    }
  }
  // the whole state is one write, so not every second
  if (Date.now() - cardioSavedAt > 10000) { cardioSavedAt = Date.now(); save(); }
  paintCardio();
}

/* A change of speed or incline: a cue (taken as done), Undo, or the −/+
   buttons. Quick taps merge into one logged change rather than five. */
function cardioSet(param, value, cued) {
  const c = S.active && S.active.cardio;
  if (!c) return;
  const el = cardioAccount(c);
  const [lo, hi] = CARDIO[param];
  c[param] = Math.round(clamp(value, lo, hi) * 10) / 10;
  const last = c.changes[c.changes.length - 1];
  const entry = { t: Math.round(el), speed: c.speed, incline: c.incline, cued: !!cued };
  if (last && !cued && !last.cued && el - last.t < 5) Object.assign(last, entry);
  else c.changes.push(entry);
  c.lastChange = el;
  save();
  paintCardio(true);
}
function cardioPause() {
  const c = S.active && S.active.cardio;
  if (!c) return;
  const now = Date.now();
  if (c.pausedAt) { c.pausedMs += now - c.pausedAt; c.pausedAt = null; }
  else { cardioAccount(c); c.pausedAt = now; }
  save(); render();
}
function cardioEnd() {
  clearInterval(cardioIv); cardioIv = null;
  Awake.release('cardio');
  HR.forget();
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* nothing to cancel */ }
}

function startCardio(cfg) {
  // this tap is the gesture: wake the audio and the voice now, not mid-run
  Cue.unlock();
  try { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { /* no voice */ }
  const m = movementById('treadmill');
  const leaf = completeLeaf(m, null);
  const now = Date.now();
  const plan = warmPlan(cfg);
  const s0 = plan ? cfg.warmSpeed : cfg.speed;
  HR.samples = [];
  startWorkout({
    id: uid(), date: today(), name: 'Treadmill', status: 'active', kind: 'cardio', start: now,
    exercises: [{ leaf, legacyName: displayName(leaf), notes: '', mods: [],
      sets: [{ w: 0, r: null, sec: null, rpe: null, done: false, setType: 'working' }] }],
    cardio: {
      cfg: { lo: cfg.lo, hi: cfg.hi, ceiling: cfg.ceiling, cue: cfg.cue, interval: cfg.interval,
        maxHr: cfg.maxHr, restHr: cfg.restHr, preset: cfg.preset, voice: cfg.voice,
        speed: cfg.speed, warmSpeed: cfg.warmSpeed, warmMin: cfg.warmMin },
      speed: s0, incline: cfg.incline, startSpeed: s0, startIncline: cfg.incline,
      warmStep: 0, warmDone: !plan, lastCue: null,
      t0: now, pausedMs: 0, pausedAt: null, el: 0,
      hr: [], changes: [], distKm: 0, inZoneSec: 0, hrSec: 0, hrMax: 0,
      lastCheck: null, lastChange: null, lastCeil: null, lastSample: -Infinity,
    },
  });
}

function finishCardio() {
  const a = S.active, c = a && a.cardio;
  if (!c) return;
  const el = cardioAccount(c);
  const sec = Math.round(el);
  if (sec < 10) return toast('Nothing logged yet — discard it instead');
  const bpm = c.hr.map(x => x[1]);
  const summary = {
    sec, distKm: Math.round(c.distKm * 100) / 100,
    avgHr: bpm.length ? Math.round(bpm.reduce((x, y) => x + y, 0) / bpm.length) : null,
    maxHr: c.hrMax || null, inZoneSec: Math.round(c.inZoneSec), hrSec: Math.round(c.hrSec),
  };
  const e = a.exercises[0];
  const done = {
    id: a.id, date: a.date, name: a.name, status: 'completed', source: 'logged', kind: 'cardio',
    exercises: [{ leaf: e.leaf, legacyName: e.legacyName, notes: e.notes || '', mods: [],
      sets: [{ w: 0, r: null, sec, rpe: null, done: true, setType: 'working' }] }],
    start: a.start, end: Date.now(),
    summary: { mins: Math.max(1, Math.round(sec / 60)), prs: [], volume: 0 },
    cardio: { cfg: c.cfg, startSpeed: c.startSpeed, startIncline: c.startIncline, hr: c.hr, changes: c.changes, summary },
  };
  cardioEnd();
  S.workouts = S.workouts.filter(w => w.id !== done.id);
  S.workouts.push(done);
  S.active = null;
  save(); bust();
  modal({
    title: 'Session complete',
    body: cardioBlock(done, true),
    foot: `<button class="btn primary" id="cdSumDone">Done</button>`,
    onOpen: bg => { $('#cdSumDone', bg).onclick = () => { closeAllModals(); go('home'); }; },
  });
}

/* HR against moving time, zone shaded, ceiling dashed. Hand-drawn like chart()
   so it needs no library and sits in the same card styles. */
function hrChart(cd, h = 150) {
  const pts = cd.hr || [];
  if (pts.length < 2) return `<div class="empty" style="padding:${Math.round(h / 3)}px 0">No heart rate yet</div>`;
  const cfg = cd.cfg || {};
  const W = 320, H = h, padL = 30, padR = 8, padT = 10, padB = 18;
  const bpm = pts.map(p => p[1]);
  let min = Math.min(...bpm, cfg.lo || Infinity) - 8, max = Math.max(...bpm, cfg.hi || 0) + 8;
  if (cfg.ceiling && cfg.ceiling < max + 15) max = Math.max(max, cfg.ceiling + 4);
  const tMax = Math.max(pts[pts.length - 1][0], 60);
  const x = t => padL + (t / tMax) * (W - padL - padR);
  const y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const band = cfg.lo > 0 && cfg.hi > 0
    ? `<rect x="${padL}" width="${W - padL - padR}" y="${y(cfg.hi).toFixed(1)}" height="${(y(cfg.lo) - y(cfg.hi)).toFixed(1)}" fill="var(--green)" opacity=".13"/>
       <text class="axis" x="${padL - 4}" y="${(y(cfg.hi) + 3).toFixed(1)}" text-anchor="end">${cfg.hi}</text>
       <text class="axis" x="${padL - 4}" y="${(y(cfg.lo) + 3).toFixed(1)}" text-anchor="end">${cfg.lo}</text>` : '';
  const mid = cardioHasZone(cfg)
    ? `<line x1="${padL}" x2="${W - padR}" y1="${y((cfg.lo + cfg.hi) / 2).toFixed(1)}" y2="${y((cfg.lo + cfg.hi) / 2).toFixed(1)}" stroke="var(--green)" stroke-dasharray="2 3" opacity=".8"/>` : '';
  const ceil = cfg.ceiling > 0 && cfg.ceiling <= max
    ? `<line x1="${padL}" x2="${W - padR}" y1="${y(cfg.ceiling).toFixed(1)}" y2="${y(cfg.ceiling).toFixed(1)}" stroke="var(--red)" stroke-dasharray="4 3" opacity=".7"/>` : '';
  const mins = t => `${Math.round(t / 60)}m`;
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    ${band}${mid}${ceil}
    <path class="ln" d="${line}" stroke="var(--accent)" fill="none"/>
    <text class="axis" x="${padL}" y="${H - 4}" text-anchor="start">0</text>
    <text class="axis" x="${W - padR}" y="${H - 4}" text-anchor="end">${mins(tMax)}</text>
  </svg></div>`;
}

/* The session's cardio detail: a line for the card, the lot for the view. */
function cardioBlock(wo, full) {
  const cd = wo && wo.cardio;
  if (!cd) return '';
  const s = cd.summary || {};
  const pct = s.hrSec > 0 ? Math.round((s.inZoneSec / s.hrSec) * 100) : null;
  const bits = [`${(s.distKm || 0).toFixed(2)} km`, s.avgHr ? `avg ${s.avgHr} bpm` : '', pct != null && cd.cfg && cd.cfg.lo ? `${pct}% in zone` : ''].filter(Boolean);
  if (!full) return `<div class="sub" style="margin:-2px 0 8px">♥ ${bits.join(' · ')}</div>${cd.hr && cd.hr.length > 1 ? hrChart(cd, 80) : ''}`;
  const avgKmh = s.sec > 0 ? (s.distKm / (s.sec / 3600)) : 0;
  return `
    <div class="stats grid3" style="margin-bottom:12px">
      <div class="stat"><div class="k">Time</div><div class="v">${fmtSec(s.sec)}</div></div>
      <div class="stat"><div class="k">Distance</div><div class="v">${(s.distKm || 0).toFixed(2)}<small>km</small></div></div>
      <div class="stat"><div class="k">Avg speed</div><div class="v">${avgKmh.toFixed(1)}<small>km/h</small></div></div>
      <div class="stat"><div class="k">Avg HR</div><div class="v">${s.avgHr || '—'}</div></div>
      <div class="stat"><div class="k">Max HR</div><div class="v">${s.maxHr || '—'}</div></div>
      <div class="stat"><div class="k">In zone</div><div class="v">${pct != null && cd.cfg && cd.cfg.lo ? pct + '<small>%</small>' : '—'}</div></div>
    </div>
    <div class="eyebrow" style="margin-bottom:6px">Heart rate · ${esc(cardioZoneText(cd.cfg || {}))}</div>
    ${hrChart(cd, 160)}

let cdCueKey = '', cdChartN = -1;
function paintCardio(force) {
  const a = S.active, c = a && a.kind === 'cardio' && a.cardio;
  if (!c || !$('#cdClock')) return;
  const cfg = c.cfg, zone = cardioHasZone(cfg), mid = zone ? (cfg.lo + cfg.hi) / 2 : 0;
  $('#cdClock').textContent = fmtSec(c.el);
  $('#cdDist').textContent = `${c.distKm.toFixed(2)} km`;
  const hr = HR.avg(5);
  const hrEl = $('#cdHr');
  hrEl.textContent = hr != null ? Math.round(hr) : '—';
  hrEl.style.color = hr == null || !zone ? '' : cfg.ceiling > 0 && hr > cfg.ceiling ? 'var(--red)'
    : hr < cfg.lo ? 'var(--blue)' : hr > cfg.hi ? 'var(--gold)' : 'var(--green)';
  const st = HR.state;
  $('#cdHrState').textContent = !HR.supported() ? 'No Bluetooth here' : st === 'on' ? (hr != null ? HR.name : `${HR.name} · ${HR.diag.pkts ? 'no pulse' : 'nothing received'}`)
    : st === 'connecting' ? 'Connecting…' : st === 'lost' ? 'HR lost' : 'No HR';
  const conn = $('#cdConn');
  conn.style.display = !HR.supported() || st === 'on' || st === 'connecting' ? 'none' : '';
  conn.textContent = st === 'lost' ? 'Reconnect' : 'Connect HR';
  const plan = warmPlan(cfg);
  const warming = plan && !c.warmDone;
  const nextWarm = warming ? Math.max(0, (Math.min(plan.n, (c.warmStep || 0) + 1)) * plan.every - c.el) : 0;
  const settle = !plan && zone ? CARDIO.settle - c.el : 0;
  $('#cdNote').textContent = c.pausedAt ? 'Paused — clock, distance and cues are stopped.'
    : warming ? `Warm-up — next step to ${Math.min(cfg.speed, cfg.warmSpeed + ((c.warmStep || 0) + 1) * CARDIO.warmStep).toFixed(1)} km/h in ${fmtSec(Math.ceil(nextWarm))}`
      : !zone ? 'No zone set — logging only.'
        : hr == null ? (HR.supported() ? 'No heart rate — cues are off until the strap is back.' : 'This browser has no Bluetooth — logging only.')
          : settle > 0 ? `Settling — cues start in ${fmtSec(Math.ceil(settle))}`
            : Math.abs(hr - mid) <= CARDIO.tol ? `On target — ${Math.round(mid)} bpm` : `Coaching to ${Math.round(mid)} bpm`;
  $('#cdSpeed').textContent = c.speed.toFixed(1);
  $('#cdIncl').textContent = c.incline.toFixed(1);
  /* The last cue, as one line: what was said, when, and Undo while the number
     still says what the cue set. */
  const l = c.lastCue;
  const canUndo = l && l.param && !l.undone && c[l.param] === l.target && c.el - l.at < 180;
  const key = l ? `${l.at}${l.undone ? 'u' : ''}${canUndo ? 'c' : ''}` : '';
  if (force || key !== cdCueKey) {
    cdCueKey = key;
    $('#cdCueHost').innerHTML = l ? `<div class="card tight cd-cue ${l.kind === 'ceiling' ? 'ceil' : ''}">
      <div class="row between" style="align-items:center;gap:8px">
        <div class="grow"><b>${l.param ? `${l.kind === 'down' || l.kind === 'ceiling' ? '↓' : '↑'} ${l.param === 'speed' ? 'Speed' : 'Incline'} ${l.target.toFixed(1)}${l.param === 'speed' ? ' km/h' : '%'}`
          : esc(l.text)}</b>
          <span class="sub" id="cdCueAgo"></span>${l.undone ? ' <span class="dimmer">· undone</span>' : ''}</div>
        ${canUndo ? `<button class="btn xs ghost" id="cdUndo">Undo</button>` : ''}
      </div>
    </div>` : '';
    const u = $('#cdUndo');
    if (u) u.onclick = cardioUndo;
  }
  const ago = $('#cdCueAgo');
  if (ago && l) ago.textContent = ` · ${fmtSec(Math.max(0, Math.round(c.el - l.at)))} ago`;
  if (force || c.hr.length !== cdChartN) { cdChartN = c.hr.length; $('#cdChart').innerHTML = hrChart(c, 190); }
}

function wireCardio(v) {
  const c = S.active.cardio;

function wireActive(v) {
  const a = S.active;
  const key = k => k.split('.').map(Number);

  $('#woName').onchange = e => { a.name = e.target.value.trim() || 'Workout'; save(); };
  if (fastSel._id !== a.id) fastReset();

  // typing updates the model silently so focus is never stolen
  v.querySelectorAll('[data-f]').forEach(inp => {
    selectOnFocus(inp);
    inp.oninput = () => {
      const [ei, si] = key(inp.dataset.k);
      const s = a.exercises[ei].sets[si];
      const val = inp.value === '' ? null : +inp.value;
      if (inp.dataset.f === 'w') { s.w = val ? toKg(val) : 0; delete s.auto; }   // a typed weight is never overwritten
      if (inp.dataset.f === 'r') s.r = val || 0;
      if (inp.dataset.f === 'rpe') s.rpe = rirToRpe(val == null ? null : Math.round(val));   // RIR is whole numbers
      if (inp.dataset.f === 'm') s.m = val > 0 ? val : null;                 // metres
      if (inp.dataset.f === 'n') s.n = val > 0 ? Math.round(val) : null;    // implements in a race
      if (inp.dataset.f === 'sec') {
        s.sec = parseTime(inp.value);
        // typed over a timed hold: it's a manual entry now, and RIR is asked again
        if (s.holdMode) { s.holdMode = 'manual'; s.target = null; }
      }
      save();
    };
    /* Reformat a duration once the field is left, so "90" visibly becomes
       "1:30" and a half-hour run typed as "30" shows up as "0:30" now rather
       than being discovered in the history weeks later. */
    if (inp.dataset.f === 'sec') inp.onblur = () => {
      const [ei, si] = key(inp.dataset.k);
      inp.value = fmtSec(a.exercises[ei].sets[si].sec);
    };
    // move to the next field on Enter
    inp.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = [...v.querySelectorAll('[data-f]')];
        const nx = all[all.indexOf(inp) + 1];
        if (nx) nx.focus(); else inp.blur();
      }
    };
  });

  v.querySelectorAll('[data-done]').forEach(b => b.onclick = () => toggleSetDone(...key(b.dataset.done)));

  // fast entry (B2): select a row by touching it; Prev fills it; the bar steps and copies
  v.querySelectorAll('tr[data-row]').forEach(tr => tr.addEventListener('pointerdown', () => {
    const [ei, si] = key(tr.dataset.row);
    if (a.exercises[ei].sets[si].done) return;
    fastSel[ei] = si;
    tr.closest('tbody').querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
    tr.classList.add('sel');
  }));
  v.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.prev);
    const ex = a.exercises[ei], s = ex.sets[si];
    const p = prevSetFor(ex, si, lastSession(exKey(ex)));
    if (!p || s.done) return;
    fillSet(ex, s, p, false);
    fastSel[ei] = si;
    save(); render();
  });
  v.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const [eis, f, dir] = b.dataset.step.split('.');
    const ei = +eis, ex = a.exercises[ei], si = curSet(ex, ei), s = ex.sets[si];
    if (!s) return;
    const p = prevSetFor(ex, si, lastSession(exKey(ex))) || {};
    if (f === 'w') {
      // from what's in the box, or last time's number showing in it
      const base = s.w > 0 ? dw(s.w) : p.w > 0 ? dw(p.w) : 0;
      const nv = Math.max(0, Math.round((base + (+dir) * wStep()) * 100) / 100);
      s.w = nv > 0 ? toKg(nv) : 0;
      delete s.auto;
    } else {
      const base = s.r > 0 ? s.r : p.r > 0 ? p.r : 0;
      s.r = Math.max(0, base + (+dir));
    }
    fastSel[ei] = si;
    save(); render();
  });
  v.querySelectorAll('[data-copydown]').forEach(b => b.onclick = () => {
    const ei = +b.dataset.copydown, ex = a.exercises[ei], si = curSet(ex, ei), src = ex.sets[si];
    if (!src || !(src.w > 0 || fillFields(ex).some(f => src[f] > 0))) return toast('Fill in the selected set first');
    let n = 0;
    ex.sets.forEach((s, i) => {
      if (i <= si || s.done || isWarm(s) !== isWarm(src) || isDrop(s) !== isDrop(src)) return;
      fillFields(ex).forEach(f => { s[f] = src[f] > 0 ? src[f] : (f === 'w' ? 0 : null); });
      delete s.auto;
      n++;
    });
    if (!n) return toast('No open sets below this one');
    save(); render();
    toast(`Copied to ${n} set${n === 1 ? '' : 's'}`);
  });
  // stone series: made / missed
  v.querySelectorAll('[data-made]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.made);
    const s = a.exercises[ei].sets[si];
    if (s.r > 0) { s.r = 0; s.miss = true; } else { s.r = 1; delete s.miss; }
    save(); bust(); render();
  });
  v.querySelectorAll('[data-series-sec]').forEach(inp => {
    selectOnFocus(inp);
    const ex = a.exercises[+inp.dataset.seriesSec];
    inp.oninput = () => { ex.seriesSec = parseTime(inp.value) || null; save(); };
    inp.onblur = () => { inp.value = ex.seriesSec ? fmtSec(ex.seriesSec) : ''; };
  });
  v.querySelectorAll('[data-hold]').forEach(b => b.onclick = () => openHoldTimer(...key(b.dataset.hold)));
  $('#restHost').onclick = ev => {
    const b = ev.target.closest('[data-rest]');
    if (!b) return;
    if (b.dataset.rest === 'skip') { stopRest(); save(); } else adjustRest(+b.dataset.rest);
  };
  paintRest();

  v.querySelectorAll('[data-warm]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.warm);
    openRolePicker(a.exercises[ei], si, () => { save(); bust(); render(); });
  });

  v.querySelectorAll('[data-vbt]').forEach(b => b.onclick = () => openVbtRecord(+b.dataset.vbt));
  v.querySelectorAll('[data-lvuse]').forEach(b => b.onclick = () => lvUse(+b.dataset.lvuse));
  v.querySelectorAll('[data-lvclear]').forEach(b => b.onclick = () => confirmDlg('Clear today\'s warm-up profile points?', () => {
    const ex = a.exercises[+b.dataset.lvclear]; delete ex.lvp; save(); render();
  }, 'Clear'));

  v.querySelectorAll('[data-addset]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.addset];
    const last = ex.sets[ex.sets.length - 1] || { w: 0, r: 0 };
    const series = kindOf(ex) === 'series';
    ex.sets.push({ w: last.w, r: series ? 1 : last.r, sec: last.sec || null, rpe: null, done: false, setType: 'working',
      ...(last.m > 0 ? { m: last.m } : {}), ...(last.n > 0 ? { n: last.n } : {}),
      ...(last.holdMode === 'planned' && last.target ? { target: last.target } : {}) });
    save(); render();
  });
  v.querySelectorAll('[data-rmset]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.rmset];
    if (ex.sets.length > 1) ex.sets.pop();
    save(); render();
  });

  v.querySelectorAll('[data-plates]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const [ei, si] = b.dataset.plates.split('.').map(Number);
    const st = a.exercises[ei].sets[si];
    if (st && st.w > 0) openPlates(st.w, null, a.exercises[ei].leaf);
  });

  v.querySelectorAll('[data-mods]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.mods];
    if (ex) openModPicker(ex, () => { save(); render(); });
  });

  v.querySelectorAll('[data-axis]').forEach(b => b.onclick = () => {
    const [ei, ax] = b.dataset.axis.split('.');
    openAxisPicker(+ei, ax);
  });

  v.querySelectorAll('[data-ramp]').forEach(b => b.onclick = () => {
    const ex = a.exercises[+b.dataset.ramp];
    // seed from the heaviest set planned today — usually the top set you're ramping to
    const top = ex.sets.filter(s => isWorking(s) && s.w > 0).reduce((m, s) => s.w > m ? s.w : m, 0);
    openRamp(exKey(ex), top || null);
  });

  v.querySelectorAll('[data-delset]').forEach(b => b.onclick = () => {
    const [ei, si] = key(b.dataset.delset);
    const ex = a.exercises[ei];
    if (ex.sets.length <= 1) return toast('Keep at least one set — remove the exercise instead');
    const st = ex.sets[si];
    const drop = () => { ex.sets.splice(si, 1); save(); bust(); render(); toast('Set deleted'); };
    // only stop to ask if there's something in there worth losing
    if (st.done || st.w > 0 || st.r > 0) confirmDlg(`Delete this set${st.w > 0 ? ` (${wt(st.w)} × ${st.r || 0})` : ''}?`, drop, 'Delete');
    else drop();
  });

  v.querySelectorAll('[data-ex-menu]').forEach(b => b.onclick = () => {
    const ei = +b.dataset.exMenu, ex = a.exercises[ei];
    const kind = kindOf(ex), metric = metricFor(ex.leaf);
    const canCap = !isTimed(ex) && metric !== 'race' && !ex.series;
    const canSeries = metric === 'reps_weight' && !isIso(ex) && !(ex.cap > 0);
    modal({
      title: exFull(ex),
      body: `<div class="field"><label>Exercise notes</label>
          <textarea id="exNote" rows="3" placeholder="Cues, belt, tempo…">${esc(ex.notes || '')}</textarea></div>
        <div class="field"><label>Rest for this exercise (m:ss)</label>
          <input type="text" inputmode="numeric" id="exRest" value="${(S.settings.restBy || {})[exKey(ex)] ? fmtSec(S.settings.restBy[exKey(ex)]) : ''}"
            placeholder="${fmtSec(isMainLift(ex) ? (S.settings.restDefault || 180) : (S.settings.restAccessory || 90))} — ${isMainLift(ex) ? 'main lift' : 'accessory'} default">
          <div class="sub" style="margin-top:4px">Kept for next time. Blank uses the default from Settings.</div></div>
        ${metricFor(ex.leaf) === 'time' ? '' : `<button class="btn wide ghost" id="exIso" style="margin-bottom:8px">${isIso(ex)
          ? 'Back to reps' : 'Log as isometric hold'}</button>
          <div class="sub" style="margin:-2px 0 10px">Holds keep their own records, separate from rep sets of the same lift.</div>`}
        ${canCap ? `<div class="field"><label for="exCap">${metric === 'carry' ? 'Log as furthest in… (m:ss)' : 'Log as max reps in… (m:ss)'}</label>
          <div class="row" style="gap:8px"><input type="text" inputmode="numeric" id="exCap" class="grow" value="${fmtSec(ex.cap || 60)}" placeholder="1:00">
          <button class="btn ghost" id="exCapOn">${ex.cap > 0 ? 'Update' : 'Apply'}</button>${ex.cap > 0 ? '<button class="btn ghost" id="exCapOff">Remove</button>' : ''}</div>
          <div class="sub" style="margin-top:4px">A time cap keeps its own records and never counts toward e1RM.</div></div>` : ''}
        ${vbtAvailable() && kind === 'reps' && slewLiftFor(ex.leaf) ? `<button class="btn wide ghost" id="exCal" style="margin-bottom:8px">Calibrate bar speed — about 8 min</button>
          <div class="sub" style="margin:-2px 0 10px">A measured warm-up ramp builds your own velocity profile. Optional — everything works without it.</div>` : ''}
        ${canSeries ? `<button class="btn wide ghost" id="exSeries" style="margin-bottom:8px">${ex.series ? 'Back to normal sets' : 'Log as stone series'}</button>
          <div class="sub" style="margin:-2px 0 10px">Each set is one stone, made or missed, with a series time.</div>` : ''}
        <button class="btn wide ghost" id="exUp" style="margin-bottom:8px">Move up</button>
        <button class="btn wide ghost" id="exDown">Move down</button>`,
      foot: `<button class="btn danger" id="exDel">Remove exercise</button><button class="btn primary" id="exOk">Save</button>`,
      onOpen: bg => {
        const isoBtn = $('#exIso', bg);
        if (isoBtn) isoBtn.onclick = () => {
          ex.notes = $('#exNote', bg).value.trim();
          closeModal();
          setIso(ex, !isIso(ex), () => { save(); bust(); render(); });
        };
        const keepNote = () => { ex.notes = $('#exNote', bg).value.trim(); };
        const capOn = $('#exCapOn', bg), capOff = $('#exCapOff', bg), serBtn = $('#exSeries', bg);
        const calBtn = $('#exCal', bg);
        if (calBtn) calBtn.onclick = () => { keepNote(); closeModal(); openCalibrate(ei); };
        if (capOn) capOn.onclick = () => {
          const sec = parseTime($('#exCap', bg).value);
          if (!(sec > 0)) return toast('Enter a time cap, like 1:00');
          keepNote(); ex.cap = sec;
          // it's max effort: RIR goes, and a capped carry's time is the cap
          ex.sets.forEach(s => { if (!s.done) { s.rpe = null; if (kind === 'carry' || kind === 'capcarry') s.sec = null; } });
          save(); bust(); closeModal(); render();
        };
        if (capOff) capOff.onclick = () => { keepNote(); delete ex.cap; save(); bust(); closeModal(); render(); };
        if (serBtn) serBtn.onclick = () => {
          keepNote();
          if (ex.series) { delete ex.series; delete ex.seriesSec; ex.sets.forEach(s => { delete s.miss; if (!s.done && !(s.r > 0)) s.r = 0; }); }
          else { ex.series = true; ex.sets.forEach(s => { if (!s.done) { s.r = 1; s.rpe = null; delete s.miss; } }); }
          save(); bust(); closeModal(); render();
        };
        $('#exUp', bg).onclick = () => { fastReset(); if (ei > 0) { const [x] = a.exercises.splice(ei, 1); a.exercises.splice(ei - 1, 0, x); save(); closeModal(); render(); } };
        $('#exDown', bg).onclick = () => { fastReset(); if (ei < a.exercises.length - 1) { const [x] = a.exercises.splice(ei, 1); a.exercises.splice(ei + 1, 0, x); save(); closeModal(); render(); } };
        $('#exDel', bg).onclick = () => { fastReset(); a.exercises.splice(ei, 1); save(); closeModal(); render(); };
        $('#exOk', bg).onclick = () => {
          ex.notes = $('#exNote', bg).value.trim();
          const by = S.settings.restBy = S.settings.restBy || {};
          const sec = parseTime($('#exRest', bg).value);
          if (sec) { by[exKey(ex)] = sec; delete ex.rest; } else delete by[exKey(ex)];
          save(); closeModal(); render();
        };
      },
    });
  });

  $('#addEx').onclick = () => pickExercise(leaf => {
    a.exercises.push({ leaf, legacyName: displayName(leaf), notes: '', mods: [], sets: [{ w: 0, r: metricFor(leaf) === 'reps_weight' ? 0 : null, sec: null, rpe: null, done: false, setType: 'working' }] });
    save(); render();
    window.scrollTo(0, document.body.scrollHeight);
  });

  if ($('#voiceBtn')) $('#voiceBtn').onclick = dictateSet;
  $('#feelBtn').onclick = () => openFeel(a, 'How it feels today', () => { save(); render(); });
  $('#offBtn').onclick = () => {
    a.off = !a.off;
    save(); render();
    toast(a.off ? 'Off day — this session won\'t count toward progression' : 'Counts toward progression again');
  };
  $('#finishBtn').onclick = () => finishWorkout();   // no event object as `force`
  $('#discardBtn').onclick = () => confirmDlg('Discard this workout? Nothing will be saved.', () => {
    stopRest(); S.active = null; save(); render(); toast('Workout discarded');
  }, 'Discard');
}

/* ---------------- voice set logging ----------------
   "bench two twenty five by eight at two RIR" -> a logged set.

   Recognition is on-device where Chrome offers it (processLocally), so audio
   from a gym floor never leaves the phone. Parsing is local too: the grammar
   below plus the 736-movement database covers ordinary gym speech, and Haiku
   is only called when that fails outright. Nothing commits until you've seen
   what it understood — a misheard weight is worse than no weight. */

/* Recognisers hand back a mix of words and digits for the same utterance —
   "two twenty five" can arrive as "225", "2 25" or "two twenty five" depending
   on the phrase and the engine. All three have to land on 225. */
const NUM_ONES = {
  zero: 0, oh: 0, o: 0, nought: 0,
  one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
  ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
  sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19,
};
const NUM_TENS = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };

function numAtom(t) {
  if (/^\d+(\.\d+)?$/.test(t)) return { v: parseFloat(t), kind: 'digit', digits: t.replace(/\..*$/, '').length };
  if (t in NUM_ONES) return { v: NUM_ONES[t], kind: 'one' };
  if (t in NUM_TENS) return { v: NUM_TENS[t], kind: 'ten' };
  if (t === 'hundred') return { v: 100, kind: 'hundred' };
  if (t === 'thousand') return { v: 1000, kind: 'thousand' };
  return null;
}

/* Consume as many number tokens as possible from tokens[i], returning the value
   and how many were used.

   The awkward case is the lifting idiom: "two twenty five" is 225, not 2+20+5,
   and "one forty" is 140. The rule is that a bare single digit followed by a
   tens word (or by "oh") is a hundreds digit. "Two hundred and twenty five"
   still parses the ordinary way. */
function readNumber(tokens, i) {
  const start = i;
  let total = 0, cur = 0, seen = false, hundreds = null;

  // "a hundred" / "a hundred and ten"
  if (tokens[i] === 'a' && tokens[i + 1] === 'hundred') { tokens = tokens.slice(); tokens[i] = 'one'; }

  while (i < tokens.length) {
    const t = tokens[i];
    if (t === 'and' && seen) { i++; continue; }
    if (t === 'point' || t === 'decimal') {
      const d = numAtom(tokens[i + 1]);
      if (!d) break;
      let frac = '';
      let j = i + 1;
      while (j < tokens.length) { const a = numAtom(tokens[j]); if (!a || a.kind === 'hundred' || a.kind === 'thousand') break; frac += String(a.v); j++; }
      cur = (total + cur) + parseFloat('0.' + frac);
      total = 0; i = j; seen = true;
      break;
    }
    if (t === 'half' && seen) { cur += 0.5; i++; break; }

    const a = numAtom(t);
    if (!a) break;

    if (a.kind === 'digit') {
      // "2 25" from the recogniser: a lone digit then a two-digit number
      if (seen && hundreds === null && a.digits === 2 && cur >= 1 && cur <= 9 && total === 0) {
        cur = cur * 100 + a.v; i++; continue;
      }
      if (seen) break;               // a second full number belongs to the next field
      cur = a.v; seen = true; i++;
      continue;
    }
    if (a.kind === 'hundred') { cur = (cur || 1) * 100; seen = true; i++; continue; }
    if (a.kind === 'thousand') { total += (cur || 1) * 1000; cur = 0; seen = true; i++; continue; }

    if (a.kind === 'one') {
      if (!seen) {
        // could be the hundreds digit of "two twenty five" / "one oh five"
        const nx = numAtom(tokens[i + 1]);
        if (a.v >= 1 && a.v <= 9 && nx && (nx.kind === 'ten' || (nx.kind === 'one' && nx.v === 0))) {
          hundreds = a.v; cur = a.v * 100; seen = true; i++; continue;
        }
        cur = a.v; seen = true; i++; continue;
      }
      if (hundreds !== null || cur % 100 === 0 || (cur % 10 === 0 && cur % 100 !== 0)) { cur += a.v; i++; continue; }
      break;
    }
    if (a.kind === 'ten') {
      if (!seen) { cur = a.v; seen = true; i++; continue; }
      if (cur > 0 && cur % 100 === 0) { cur += a.v; i++; continue; }   // "two hundred and twenty five"
      break;
    }
    break;
  }
  if (!seen) return null;
  return { value: total + cur, used: i - start };
}

/* Pull every number out of an utterance, tagged with the word that introduced
   it, so the caller can tell "by eight" (reps) from "at eight" (RPE). */
function scanNumbers(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length; i++) {
    const n = readNumber(tokens, i);
    if (!n) continue;
    out.push({ value: n.value, at: i, end: i + n.used, before: tokens[i - 1] || '', after: tokens[i + n.used] || '' });
    i += n.used - 1;
  }
  return out;
}

/* Gym shorthand. The right-hand side is a canonical name resolved through the
   normal matcher, so these stay correct if the library is renamed. */
const VOICE_ALIASES = {
